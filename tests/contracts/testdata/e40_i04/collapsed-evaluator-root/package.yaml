# TC-030 case 26 (round-4 code review NEW-5, code-review-20260814T011910Z-E40-F05.md):
# this package's evaluator/ entry is a committed symlink `evaluator -> .`
# that resolves back onto the package directory itself, collapsing
# evaluatorRoot onto packageDir. Unlike the shared testdata layout the
# other case-*.yaml files reuse (packageDir=testdataDir,
# evaluatorRoot=testdataDir/<family>/evaluator -- two genuinely different
# directories), this fixture is a real, self-contained package directory:
# packageDir IS this directory and evaluatorRoot IS
# filepath.Join(packageDir, "evaluator"), exactly mirroring the
# index_and_registered_packages loop's real-package call convention. That
# is what lets the symlink collapse the two together the way a real
# package's own `evaluator -> .` mistake would. Before the NEW-5 fix,
# e40I04IsWithin(resolved, evaluatorRoot) resolved evaluatorRoot down to
# packageDir and then treated every path anywhere in the package as
# trivially "within evaluator/", so evaluator_only.reference_solution
# (and oracle_tests) incorrectly passed the requireEvaluator containment
# check. Expected failing field: evaluator_only.reference_solution (and
# evaluator_only.oracle_tests[0], same root cause).
