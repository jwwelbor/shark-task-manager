# TC-030 case 14/17 (AC-005, REQ-F-010/015): final_predicate.kind is a
# real vocabulary kind (child_oracles_union, feature-only) but
# entity_family stays bug, so the kind is not permitted for the
# declared family. Expected failing field: final_predicate.kind.
schema_version: "1.0"
scenario_id: "test-case-14-predicate-kind-not-permitted-for-family"
scenario_version: 1
entity_family: bug
stage_matrix:
  prelude:
    D01: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
    D02: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
    D03: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
    D04: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
    D05: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
  lifecycle:
    mode: all_dispatched
    evidence_required: true
fixture:
  fixture_id: py
  submodule_path: bench/fixture-py
  base_sha: "0000000000000000000000000000000000000000"
adapter:
  name: python
  version: "1.0.0"
toolchain_identity:
  - key: python_version
    value: "3.12.0"
  - key: pytest_version
    value: "8.0.0"
input:
  agent_visible: valid/input/prompt.md
evaluator_only:
  reference_solution: valid/evaluator/reference.patch
  oracle_tests:
    - valid/evaluator/oracle_test.txt
  answer_keys: []
final_predicate:
  kind: child_oracles_union
  p2p_selection:
    include: ["taskmanager"]
    exclude_test_ids: []
  f2p_test_ids: ["tests.test_due_date::test_boundary"]
resource_policy:
  max_cost_usd: 5.0
  max_wall_clock_seconds: 600
  max_generated_tasks: 20
