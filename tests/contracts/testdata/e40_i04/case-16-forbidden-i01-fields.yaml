# TC-030 case 16/17 (AC-001, REQ-F-001, shared case): injects all four
# forbidden I-01 field names into an otherwise-valid package --
# fixture.toolchain.go_version, fixture.toolchain.golangci_lint_version
# (nested, both caught as one unknown "fixture.toolchain" key), plus
# top-level p2p_sets and reference_patch_path. None of these is part of
# the I-04 schema (ADR-F05-01), so strict unknown-field rejection must
# name them. Expected failing fields: fixture (unknown "toolchain"),
# p2p_sets, reference_patch_path.
schema_version: "1.0"
scenario_id: "test-case-16-forbidden-i01-fields"
scenario_version: 1
entity_family: bug
stage_matrix:
  prelude:
    D01: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
    D02: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
    D03: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
    D04: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
    D05: {applicable: false, reason: "bug scenarios skip the product-design prelude"}
  lifecycle:
    mode: all_dispatched
    evidence_required: true
fixture:
  fixture_id: py
  submodule_path: bench/fixture-py
  base_sha: "0000000000000000000000000000000000000000"
  toolchain:
    go_version: "go1.26.0"
    golangci_lint_version: "v2.9.0"
adapter:
  name: python
  version: "1.0.0"
toolchain_identity:
  - key: python_version
    value: "3.12.0"
  - key: pytest_version
    value: "8.0.0"
input:
  agent_visible: valid/input/prompt.md
evaluator_only:
  reference_solution: valid/evaluator/reference.patch
  oracle_tests:
    - valid/evaluator/oracle_test.txt
  answer_keys: []
final_predicate:
  kind: f2p_p2p
  p2p_selection:
    include: ["taskmanager"]
    exclude_test_ids: []
  f2p_test_ids: ["tests.test_due_date::test_boundary"]
resource_policy:
  max_cost_usd: 5.0
  max_wall_clock_seconds: 600
  max_generated_tasks: 20
p2p_sets:
  default:
    packages: ["./..."]
reference_patch_path: valid/evaluator/reference.patch
