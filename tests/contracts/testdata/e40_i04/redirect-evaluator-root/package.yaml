# TC-030 case 27 (round-4 code review NEW-6, code-review-20260814T011910Z-E40-F05.md):
# this package's evaluator/ entry is a committed symlink `evaluator ->
# private` pointing at a differently-named real sibling directory, and
# input.agent_visible declares "evaluator/secret" -- a path that, once the
# "evaluator" symlink component is resolved, canonicalizes to
# packageDir/private/secret. That real location is inside the same
# canonical subtree evaluatorRoot itself resolves to (both "evaluator" and
# "private" name the same real directory), so this is a genuine leak of a
# file meant to be evaluator-only into the agent-visible surface
# (REQ-F-009). The pre-NEW-6-fix literal any-"evaluator"-segment check
# (e40I04HasEvaluatorSegment) operated on the already-resolved path, where
# the "evaluator" segment no longer appears at all (it reads
# .../private/secret) -- so the old check silently passed this leak.
# evaluator_only.reference_solution and oracle_tests[0] also route through
# the "evaluator" symlink and are expected to resolve correctly (they are
# NOT part of this case's expected violation -- only the leak-surface
# check on input.agent_visible is). Expected failing field:
# input.agent_visible.
