# TC-030 case 1/17 (AC-005, REQ-F-015): entity_family is not one of the
# closed enum feature|bug|change_card|tech_debt. Expected failing field:
# entity_family.
schema_version: "1.0"
scenario_id: "test-case-01-unknown-entity-family"
scenario_version: 1
