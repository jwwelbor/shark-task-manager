# Second positive-control fixture for TC-030 (AC-005), covering the
# feature-family shape valid/package.yaml's bug-family baseline cannot:
# stage_matrix.prelude all `true`, final_predicate.kind: child_oracles_union,
# and a replay_reference field (REQ-F-009, feature-only). Rework case-24
# (a missing replay_reference file) derives from this baseline the same way
# every case-*.yaml in the parent directory derives from valid/package.yaml
# -- exactly one field broken, everything else identical.
schema_version: "1.0"
scenario_id: "test-valid-feature-baseline"
scenario_version: 1
entity_family: feature
stage_matrix:
  prelude:
    D01: {applicable: true}
    D02: {applicable: true}
    D03: {applicable: true}
    D04: {applicable: true}
    D05: {applicable: true}
  lifecycle:
    mode: all_dispatched
    evidence_required: true
fixture:
  fixture_id: py
  submodule_path: bench/fixture-py
  base_sha: "0000000000000000000000000000000000000000"
adapter:
  name: python
  version: "1.0.0"
toolchain_identity:
  - key: python_version
    value: "3.12.0"
  - key: pytest_version
    value: "8.0.0"
input:
  agent_visible: valid-feature/input/prompt.md
replay_reference: valid-feature/evaluator/replay-reference.json
evaluator_only:
  reference_solution: valid-feature/evaluator/reference.patch
  oracle_tests:
    - valid-feature/evaluator/oracle_test.txt
  answer_keys: []
final_predicate:
  kind: child_oracles_union
  p2p_selection:
    include: ["taskmanager"]
    exclude_test_ids: []
  integration_test_ids: ["tests.test_recurring::test_end_to_end"]
  child_oracles: ["tests.test_recurring::test_add_task_accepts_recurrence_rule"]
resource_policy:
  max_cost_usd: 5.0
  max_wall_clock_seconds: 600
  max_generated_tasks: 20
