    color: yellow
    progress_weight: 0.65
    is_planning: false
    responsibility: agent
    aggregates_from: tasks
    orchestrator_action:
      action: cascade
      instruction_template: feature/active.md
  completed:
    description: All tasks done, feature delivered
    phase: done
    color: green
    progress_weight: 1.0
    is_planning: false
    responsibility: none
    orchestrator_action:
      action: archive
      instruction_template: feature/completed.md
  cancelled:
    description: Feature abandoned or converted to task
    phase: done
    color: red
    progress_weight: 0
    is_planning: false
    responsibility: none
    exclude_from_progress: true
    orchestrator_action:
      action: archive
      instruction_template: feature/cancelled.md
  blocked:
    description: External blocker preventing progress
    phase: blocked
    color: red
    progress_weight: 0
    is_planning: false
    responsibility: human
    orchestrator_action:
      action: pause
      instruction_template: feature/blocked.md
  on_hold:
