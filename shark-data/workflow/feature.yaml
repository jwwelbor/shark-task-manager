status_metadata:
  draft:
    description: Feature created from epic decomposition
    phase: planning
    color: gray
    progress_weight: 0
    is_planning: true
    responsibility: none
    orchestrator_action:
      action: advance_status
      instruction_template: feature/draft.md
  ready_for_assessment:
    description: Ready for scope validation and complexity triage
    phase: triage
    color: orange
    progress_weight: 0.02
    is_planning: true
    responsibility: agent
    agent_types:
    - researcher
    orchestrator_action:
      action: spawn_agent
      agent_type: researcher
      provider: anthropic
      model: haiku
      skills:
      - assessment
      - research
      instruction_template: feature/ready_for_assessment.md
  in_assessment:
    description: Scope validation and complexity triage in progress
    phase: triage
    color: orange
    progress_weight: 0.05
    is_planning: true
    responsibility: agent
    orchestrator_action:
