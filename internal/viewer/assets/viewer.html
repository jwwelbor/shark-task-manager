<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shark Status Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js"></script>
  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES — Dark Slate Palette
       ============================================================ */
    :root {
      --bg:             #0d0f12;
      --bg-2:           #161920;
      --bg-3:           #1e222b;
      --bg-4:           #252a35;
      --fg:             #e8eaf0;
      --fg-muted:       #8a8f9e;
      --fg-dim:         #555c6e;
      --accent:         #4d77ff;
      --accent-hover:   #6690ff;
      --accent-dim:     #1e2d5a;
      --border:         #2a2f3d;
      --border-light:   #353b4d;
      --sidebar-width:  320px;
      --header-height:  44px;
      --radius-sm:      4px;
      --radius:         6px;
      --radius-lg:      8px;
      --shadow:         0 2px 8px rgba(0,0,0,0.4);
      --transition:     150ms ease;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
    }

    /* ============================================================
       TYPOGRAPHY
       ============================================================ */

    /* Monospace for entity keys */
    .key, .mono {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      color: var(--accent);
      font-size: 12px;
    }

    /* Uppercase small-caps for section headers */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    /* ============================================================
       3-PANEL APP LAYOUT
       ============================================================ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #header {
      height: var(--header-height);
      min-height: var(--header-height);
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    #body-row {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
    }

    #sidebar-resizer {
      width: 6px;
      flex-shrink: 0;
      cursor: col-resize;
      touch-action: none;
      background: transparent;
      border-right: 1px solid transparent;
      transition: background var(--transition), border-color var(--transition);
    }

    #sidebar-resizer:hover,
    body.is-resizing-sidebar #sidebar-resizer {
      background: rgba(77, 119, 255, 0.12);
      border-right-color: var(--accent-dim);
    }

    #content {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      background: var(--bg);
      padding: 20px 24px;
    }

    /* Hide header/sidebar on pick_folder state */
    .state-pick-folder #header,
    .state-pick-folder #body-row #sidebar,
    .state-pick-folder #body-row #sidebar-resizer {
      display: none;
    }

    .state-pick-folder #content {
      padding: 0;
    }

    /* ============================================================
       HEADER BAR
       ============================================================ */
    #header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    #header-dashboard-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background var(--transition);
    }

    #header-dashboard-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    #header-sprint-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg-muted);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background var(--transition), color var(--transition);
    }

    #header-sprint-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    #header-sprint-btn.is-active {
      background: var(--accent-dim);
      color: var(--fg);
    }

    .header-pill {
      font-size: 11px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 8px;
      color: var(--fg-muted);
      white-space: nowrap;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-muted);
      transition: background var(--transition), color var(--transition);
    }

    .header-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    .header-btn-accent {
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    .header-btn-accent:hover {
      background: var(--accent-dim);
      color: var(--fg);
    }

    .content-back-link {
      display: inline-block;
      margin: 8px 0 4px;
      font-size: 13px;
      color: var(--fg-muted);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .content-back-link:hover {
      color: var(--fg);
    }

    .sprint-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      align-items: start;
    }

    .sprint-main-column,
    .sprint-detail-column {
      min-width: 0;
    }

    .sprint-detail-column {
      position: sticky;
      top: 20px;
      align-self: start;
    }

    .sprint-mode-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 14px;
    }

    .sprint-mode-tab {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-muted);
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .sprint-mode-tab:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    .sprint-mode-tab.active {
      background: var(--accent-dim);
      color: var(--fg);
      border-color: var(--accent-dim);
    }

    .sprint-overview-grid {
      display: grid;
      gap: 12px;
    }

    .sprint-plan-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .sprint-plan-columns {
        grid-template-columns: 1fr;
      }
    }

    /* T-E27-F14-009: "Assigned This Sprint" column — subtle tint + accent border
       to visually distinguish it from "Candidate Backlog" at a glance. */
    .sprint-plan-col-assigned {
      background: rgba(77, 119, 255, 0.04);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius-lg);
      padding: 12px;
    }

    /* T-E27-F14-009: Plan column headers — slightly more prominent than the
       default ov-section-header (12px vs 10px, fg-muted vs fg-dim). */
    .sprint-plan-col-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin: 0 0 10px;
    }
    .sprint-plan-col-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* T-E27-F14-009: Candidate item row — 5-column grid:
       [checkbox] [badge] [key] [title fills remaining] [meta].
       Replaces the generic .sprint-item-row for Plan tab candidate rows. */
    .sprint-plan-item-row {
      display: grid;
      grid-template-columns: 16px auto auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }
    .sprint-plan-item-row:hover {
      background: var(--bg-3);
      border-color: var(--accent-dim);
    }
    .sprint-plan-item-row.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent-dim);
    }

    /* T-E27-F14-009: Assigned item row — 4-column grid (no checkbox):
       [badge] [key] [title fills remaining] [meta]. */
    .sprint-plan-assigned-row {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }
    .sprint-plan-assigned-row:hover {
      background: var(--bg-3);
      border-color: var(--accent-dim);
    }

    /* T-E27-F14-009: meta label — agent + size; fg-muted gives ~3.5:1 contrast
       against bg-2 (vs fg-dim which was ~2.2:1 and too low). */
    .sprint-item-meta {
      font-size: 11px;
      color: var(--fg-muted);
      white-space: nowrap;
    }

    .sprint-health-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .sprint-health-columns {
        grid-template-columns: 1fr;
      }
    }

    .capacity-indicator {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .capacity-indicator-ok   { background: rgba(56, 161, 105, 0.2); color: #68d391; }
    .capacity-indicator-high { background: rgba(236, 153, 75, 0.2); color: #f6ad55; }
    .capacity-indicator-over { background: rgba(229, 62, 62, 0.2); color: #fc8181; }

    .sprint-hero {
      display: grid;
      gap: 10px;
      padding: 16px;
      background: linear-gradient(180deg, rgba(53, 75, 120, 0.18), rgba(22, 25, 32, 0.95));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .sprint-hero-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg);
    }

    .sprint-hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--fg-muted);
      font-size: 12px;
    }

    .sprint-metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .sprint-metric-card {
      padding: 12px;
      border-radius: var(--radius);
      background: var(--bg-2);
      border: 1px solid var(--border);
    }

    .sprint-metric-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 6px;
    }

    .sprint-metric-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--fg);
    }

    .sprint-metric-note {
      font-size: 12px;
      color: var(--fg-muted);
      margin-top: 4px;
    }

    .sprint-item-list {
      display: grid;
      gap: 6px;
    }

    .sprint-item-row {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    .sprint-item-row:hover {
      background: var(--bg-3);
      border-color: var(--accent-dim);
    }

    .sprint-item-row.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent-dim);
    }

    .sprint-item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--fg);
    }

    .sprint-item-key {
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      color: var(--accent);
    }

    .sprint-bucket-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 10px;
      min-height: 28px;
    }
    .sprint-bucket-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .sprint-bucket-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .sprint-bucket-count {
      font-size: 10px;
      color: var(--fg-dim);
      font-variant-numeric: tabular-nums;
    }
    .sprint-bucket-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      opacity: 0.75;
      flex-shrink: 0;
    }

    .sprint-drawer-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-2);
      padding: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.16);
    }

    .sprint-drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 4px;
    }

    .sprint-drawer-subtitle {
      font-size: 12px;
      color: var(--fg-muted);
      margin-bottom: 12px;
    }

    .history-ts {
      font-size: 11px;
      color: var(--fg-dim);
      white-space: nowrap;
    }

    .sprint-drawer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 0;
    }

    /* ============================================================
       SIDEBAR TREE
       ============================================================ */
    .sidebar-filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 6px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-filter-main {
      min-width: 0;
      flex: 1;
    }
    .sidebar-filter-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--fg-dim);
      user-select: none;
    }
    .sidebar-filter-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .sidebar-filter-inline {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .sidebar-filter-inline input[type="checkbox"] {
      cursor: pointer;
    }
    .sidebar-section {
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section-header {
      background: var(--bg-2);
      padding: 10px 12px 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-dim);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .sidebar-section-title {
      min-width: 0;
      flex: 1;
    }
    .sidebar-collapse-btn {
      width: 16px;
      height: 16px;
      padding: 0;
      font-size: 14px;
      line-height: 14px;
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--bg-2);
      color: var(--fg-dim);
      flex-shrink: 0;
    }
    .sidebar-collapse-btn:hover {
      background: var(--bg-3, var(--border));
      color: var(--fg);
    }
    .sidebar-section-body {
      padding-bottom: 2px;
    }
    .sidebar-section.is-collapsed .sidebar-section-body {
      display: none;
    }

    .tree-node {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 0;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: background var(--transition);
      user-select: none;
      position: relative;
    }

    .tree-node:hover {
      background: var(--bg-3);
    }

    /* Selected state: dark tint + accent left border + primary text */
    .tree-node.selected {
      background: rgba(0, 0, 0, 0.35);
      border-left: 3px solid var(--accent);
    }

    .tree-node.selected .tree-node-title {
      color: var(--fg);
    }

    /* Adjust padding when border adds 3px to left */
    .tree-node.selected {
      padding-left: 0;
    }

    /* Tree indentation levels */
    .tree-node-epic    { padding-left: 16px; font-weight: 600; }
    .tree-node-feature { padding-left: 40px; }
    .tree-node-task    { padding-left: 56px; }
    .tree-node-flat    { padding-left: 18px; }

    /* Doc nodes: italic + muted */
    .tree-node-doc-epic    { padding-left: 16px; font-style: italic; }
    .tree-node-doc-feature { padding-left: 40px; font-style: italic; }

    .tree-node-doc-epic .tree-node-title,
    .tree-node-doc-feature .tree-node-title {
      color: var(--fg-dim);
      font-style: italic;
    }

    /* Cancelled/inactive entities: dimmed text to de-emphasize without relying on color */
    .entity-cancelled .tree-node-key,
    .entity-cancelled .tree-node-title {
      opacity: 0.4;
      text-decoration: line-through;
    }
    .entity-cancelled:not(.selected) {
      opacity: 0.55;
    }
    tr.entity-cancelled td {
      opacity: 0.4;
      text-decoration: line-through;
    }

    /* Completed entities: dimmed text only — no line-through (reserved for cancelled).
       Provides a non-color affordance for colorblind users (WCAG 2.1 SC 1.4.1). */
    .entity-completed .tree-node-key,
    .entity-completed .tree-node-title {
      opacity: 0.55;
    }
    tr.entity-completed td {
      opacity: 0.55;
    }

    /* Compensate selected border for indented nodes */
    .tree-node.selected.tree-node-epic    { padding-left: 13px; }
    .tree-node.selected.tree-node-feature { padding-left: 37px; }
    .tree-node.selected.tree-node-task    { padding-left: 53px; }
    .tree-node.selected.tree-node-flat    { padding-left: 15px; }
    .tree-node.selected.tree-node-doc-epic    { padding-left: 13px; }
    .tree-node.selected.tree-node-doc-feature { padding-left: 37px; }

    .tree-arrow {
      width: 14px;
      min-width: 14px;
      font-size: 9px;
      color: var(--fg-dim);
      text-align: center;
      transition: transform var(--transition);
      flex-shrink: 0;
    }

    .tree-arrow-spacer {
      width: 14px;
      min-width: 14px;
      flex-shrink: 0;
    }

    /* Status dot */
    .status-dot {
      width: 9px;
      height: 9px;
      min-width: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .tree-node-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
    }

    .tree-node-title {
      color: var(--fg-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      flex: 1;
    }

    .tree-node-label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    /* ============================================================
       STATUS BADGES
       ============================================================ */
    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 10px;
      color: #fff;
      white-space: nowrap;
      line-height: 1.6;
      /* background set via JS using getStatusColor() */
    }

    .status-badge-sm {
      font-size: 9px;
      padding: 1px 5px;
    }

    /* E27-F11: size badge — shown in sidebar tree nodes and detail panel */
    .size-badge {
      display: inline-block;
      padding: 1px 6px;
      margin-left: 6px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.4;
      color: #cbd5e1;
      background: #334155;
      border-radius: 8px;
      vertical-align: middle;
    }
    .props-row-size .props-cell-value { font-weight: 500; }

    /* ============================================================
       PICK FOLDER SCREEN
       ============================================================ */
    #pick-folder-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
      gap: 0;
    }

    .state-pick-folder #pick-folder-screen {
      display: flex;
    }

    .pick-folder-icon {
      opacity: 0.18;
      margin-bottom: 28px;
    }

    .pick-folder-icon svg {
      width: 96px;
      height: 96px;
    }

    .pick-folder-heading {
      font-size: 28px;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .pick-folder-instruction {
      font-size: 14px;
      color: var(--fg-muted);
      margin-bottom: 28px;
      max-width: 340px;
      line-height: 1.6;
    }

    .pick-folder-btn {
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      box-shadow: 0 2px 12px rgba(77, 119, 255, 0.4);
    }

    .pick-folder-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(77, 119, 255, 0.5);
    }

    .pick-folder-btn:active {
      transform: translateY(0);
    }

    .pick-folder-note {
      font-size: 11px;
      color: var(--fg-dim);
      margin-top: 16px;
      max-width: 300px;
    }

    /* ============================================================
       DASHBOARD
       ============================================================ */
    .dashboard-section {
      margin-bottom: 32px;
    }

    .dashboard-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Status Breakdown cards */
    .breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .breakdown-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }

    .breakdown-card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 6px;
    }

    .breakdown-card-total {
      font-size: 28px;
      font-weight: 700;
      color: var(--fg);
      line-height: 1.1;
      margin-bottom: 12px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .breakdown-card-active {
      font-size: 12px;
      font-weight: 500;
      color: var(--fg-muted);
    }

    .breakdown-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    /* Feature Progress */
    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
    }

    .progress-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
      min-width: 90px;
      cursor: pointer;
    }

    .progress-key:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .progress-title {
      color: var(--fg-muted);
      font-size: 12px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-bar-wrap {
      width: 120px;
      height: 6px;
      background: var(--bg-4);
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-pct {
      font-size: 11px;
      color: var(--fg-muted);
      min-width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Activity / Transitions table */
    .activity-table {
      border-collapse: collapse;
    }

    .activity-table tr {
      border-bottom: 1px solid var(--border);
    }

    .activity-table tr:hover {
      background: var(--bg-2);
    }

    .activity-table td {
      padding: 7px 8px;
      vertical-align: middle;
      font-size: 12px;
    }

    .activity-date {
      color: var(--fg-dim);
      white-space: nowrap;
      font-size: 11px;
    }

    .activity-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .activity-key:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .activity-arrow {
      color: var(--fg-dim);
      padding: 0 2px;
    }

    .activity-table td.activity-badge-cell {
      padding: 7px 3px;
    }

    .activity-duration {
      color: var(--fg-dim);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .activity-note {
      color: var(--fg-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .open-btn {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), color var(--transition);
    }

    .open-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    /* Stale entities table */
    .stale-table {
      width: 100%;
      border-collapse: collapse;
    }

    .stale-table tr {
      border-bottom: 1px solid var(--border);
    }

    .stale-table tr:hover {
      background: var(--bg-2);
    }

    .stale-table td {
      padding: 7px 8px;
      vertical-align: middle;
      font-size: 12px;
    }

    .stale-age {
      color: var(--fg-dim);
      font-size: 11px;
      white-space: nowrap;
    }

    /* ============================================================
       ENTITY CHARTS (pie/donut charts)
       ============================================================ */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .chart-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 12px;
    }

    .chart-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    .chart-legend {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
    }

    .chart-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--fg-muted);
      line-height: 1.4;
    }

    .chart-legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chart-legend-count {
      margin-left: auto;
      color: var(--fg);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ============================================================
       ENTITY VIEW
       ============================================================ */
    .entity-view-header {
      margin-bottom: 18px;
    }

    .entity-view-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 4px;
    }

    .entity-view-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 13px;
    }

    .entity-view-key-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Copy-key button: unobtrusive — no border/background in rest state */
    .copy-key-btn {
      font-size: 11px;
      padding: 1px 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-dim);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      flex-shrink: 0;
    }

    .copy-key-btn:hover {
      background: var(--bg-3);
      border-color: var(--border);
      color: var(--fg);
    }

    .toggle-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      font-size: 12px;
      padding: 5px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--fg-muted);
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .toggle-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    .toggle-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Spec pane inline edit header (E27-F09) */
    .spec-pane-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 28px;
      margin-bottom: 8px;
    }

    .inline-edit-btn {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--fg-muted);
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .inline-edit-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    /* Breadcrumb (REQ-F-003, E27-F09-005) */
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-dim); margin: 2px 0 10px; }
    .breadcrumb-seg { padding: 2px 4px; border-radius: 3px; cursor: pointer; font-family: var(--font-mono, monospace); }
    .breadcrumb-seg:hover { background: var(--bg-3); color: var(--fg); }
    .breadcrumb-seg.current { color: var(--fg); cursor: default; }
    .breadcrumb-sep { color: var(--fg-dim); user-select: none; }

    /* Properties-panel status accent (REQ-F-012) */
    .props-grid[data-status-accent] { padding-left: calc(var(--pad, 10px) + 3px); }

    /* Overview pane (E27-F09) */
    .overview-pane {
      padding: 4px 0;
    }

    /* Overview sections (REQ-F-004, REQ-F-005, REQ-F-008) */
    .ov-section { margin: 18px 0; }
    .ov-section-header { display: flex; align-items: center; gap: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin: 0 0 10px; }
    .ov-section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Rollup pills (REQ-F-004, REQ-F-005) */
    .rollup-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .rollup-pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 12px; padding: 2px 8px; font-size: 11px; }

    /* Segmented progress bar (REQ-F-005) */
    .seg-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--bg-3); }
    .seg-bar-segment { height: 100%; }
    .seg-bar-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .seg-bar-label { font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }

    /* Work breakdown (REQ-F-006) */
    .wb-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
    .wb-label { width: 80px; color: var(--fg-dim); }
    .wb-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
    .wb-bar-fill { height: 100%; background: var(--accent, #4a9eff); }
    .wb-count { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

    /* Action items (REQ-F-007) */
    .action-item-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 0 4px 4px 0; margin-bottom: 4px; }

    /* Child entity tables (REQ-F-008) */
    .ov-table { width: 100%; border-collapse: collapse; }
    .ov-table thead th { position: sticky; top: 0; background: var(--bg-2); text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .ov-table tbody td { padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .ov-table tbody tr:hover { background: var(--bg-3); }
    .ov-table .clickable { cursor: pointer; color: var(--accent); font-family: var(--font-mono, monospace); }
    .ov-table-scroll { max-height: 420px; overflow-y: auto; }

    /* Dependencies (REQ-F-009) */
    .dep-group { margin-bottom: 12px; padding-left: 8px; }
    .dep-group-accent { border-left: 2px solid #c0392b; }
    .dep-label { font-size: 11px; font-weight: 600; color: var(--fg-dim); margin-bottom: 4px; }
    .dep-empty { font-size: 12px; color: var(--fg-dim); font-style: italic; }

    /* Notes (REQ-F-010) */
    .note-row { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 12px; }
    .note-ts { font-family: var(--font-mono, monospace); color: var(--fg-dim); white-space: nowrap; }
    .note-type-pill { font-size: 10px; padding: 1px 6px; border-radius: 8px; color: #fff; }
    .note-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .notes-show-more { margin-top: 6px; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 0; }

    /* Related docs (REQ-F-011) */
    .reldoc-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
    .reldoc-path { flex: 1; font-family: var(--font-mono, monospace); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reldoc-open { font-size: 11px; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg-2); cursor: pointer; }

    /* Properties panel */
    .props-grid {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 6px 12px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .props-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-top: 1px;
    }

    .props-value {
      font-size: 12px;
      color: var(--fg-muted);
      word-break: break-all;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .copy-btn {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-dim);
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition);
    }

    .copy-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    /* Markdown content */
    .markdown-body {
      font-size: 13px;
      line-height: 1.7;
      color: var(--fg-muted);
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      color: var(--fg);
      margin-top: 24px;
      margin-bottom: 10px;
      font-weight: 600;
      line-height: 1.3;
    }

    .markdown-body h1 { font-size: 20px; }
    .markdown-body h2 { font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .markdown-body h3 { font-size: 14px; }

    .markdown-body p {
      margin-bottom: 12px;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    .markdown-body li {
      margin-bottom: 4px;
    }

    .markdown-body code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      background: var(--bg-4);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--accent);
    }

    .markdown-body pre {
      background: var(--bg-4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      overflow-x: auto;
      margin-bottom: 14px;
    }

    /* E27-F12: Mermaid diagram rendering (REQ-F-010, D9) */
    .mermaid-render-container {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
    }

    .mermaid-viewer {
      display: flex;
      flex-direction: column;
      height: 420px;
      min-height: 240px;
      max-height: 80vh;
      overflow: hidden;
      resize: vertical;
    }

    .mermaid-toolbar {
      align-items: center;
      background: var(--bg-3);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 4px;
      justify-content: flex-end;
      min-height: 34px;
      padding: 4px 6px;
    }

    .mermaid-toolbar-btn {
      align-items: center;
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--fg-muted);
      cursor: pointer;
      display: inline-flex;
      font-size: 14px;
      height: 26px;
      justify-content: center;
      line-height: 1;
      min-width: 28px;
      padding: 0 8px;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .mermaid-toolbar-btn:hover:not(:disabled) {
      background: var(--bg-4);
      border-color: var(--accent);
      color: var(--fg);
    }

    .mermaid-toolbar-btn:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .mermaid-viewport {
      cursor: grab;
      flex: 1;
      min-height: 180px;
      overflow: hidden;
      padding: 12px;
      touch-action: none;
      width: 100%;
    }

    .mermaid-viewport:active {
      cursor: grabbing;
    }

    .mermaid-viewer.is-collapsed {
      height: auto;
      min-height: 0;
      resize: none;
    }

    .mermaid-viewer.is-collapsed .mermaid-viewport {
      display: none;
    }

    .mermaid-render-container svg {
      display: block;
      height: 100%;
      max-width: none;
      width: 100%;
    }

    .mermaid-overlay {
      align-items: stretch;
      background: rgba(0,0,0,0.72);
      display: flex;
      inset: 0;
      padding: 28px;
      position: fixed;
      z-index: 320;
    }

    .mermaid-overlay-shell {
      background: var(--bg-2);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .mermaid-overlay-header {
      align-items: center;
      background: var(--bg-3);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      min-height: 40px;
      padding: 6px 8px;
    }

    .mermaid-overlay-close {
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--fg-muted);
      cursor: pointer;
      font-size: 12px;
      height: 28px;
      padding: 0 10px;
    }

    .mermaid-overlay-close:hover {
      background: var(--bg-4);
      border-color: var(--accent);
      color: var(--fg);
    }

    .mermaid-overlay-body {
      display: flex;
      flex: 1;
      min-height: 0;
      padding: 0;
    }

    .mermaid-overlay .mermaid-viewer {
      border: 0;
      border-radius: 0;
      flex: 1;
      height: auto;
      margin: 0;
      max-height: none;
      min-height: 0;
      resize: none;
    }

    .mermaid-error-banner {
      background: rgba(220, 60, 60, 0.08);
      border: 1px solid rgba(220, 60, 60, 0.4);
      border-radius: var(--radius-sm);
      color: #ff8b8b;
      font-size: 12px;
      padding: 6px 10px;
      margin-bottom: 6px;
    }

    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--fg-muted);
      font-size: 12px;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
    }

    .markdown-body table th {
      background: var(--bg-3);
      color: var(--fg);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 7px 10px;
      text-align: left;
      border: 1px solid var(--border);
    }

    .markdown-body table td {
      padding: 7px 10px;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      font-size: 12px;
    }

    .markdown-body table tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent-dim);
      padding-left: 14px;
      color: var(--fg-dim);
      margin: 0 0 12px;
    }

    .markdown-body a {
      color: var(--accent);
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 18px 0;
    }

    .frontmatter-block {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      margin-bottom: 16px;
    }
    .frontmatter-block td {
      padding: 3px 10px 3px 0;
      vertical-align: top;
      border: none;
    }
    .frontmatter-block td:first-child {
      width: 140px;
    }

    .content-placeholder {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 24px;
      text-align: center;
      color: var(--fg-dim);
      font-size: 13px;
    }

    /* ============================================================
       HISTORY DRAWER (implemented in Task 6/7)
       ============================================================ */
    .history-drawer {
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 12px;
    }

    .history-table {
      border-collapse: collapse;
    }

    .history-table tr {
      border-bottom: 1px solid var(--border);
    }

    .history-table tr:hover {
      background: var(--bg-2);
    }

    .history-table td {
      padding: 8px 10px;
      vertical-align: middle;
      font-size: 12px;
    }

    .history-table td.history-badge-cell {
      padding: 8px 3px;
    }

    .history-table td.history-arrow-cell {
      padding: 8px 2px;
      color: var(--fg-dim);
    }

    .history-date {
      color: var(--fg-dim);
      font-size: 11px;
      white-space: nowrap;
    }

    .history-duration {
      color: var(--fg-dim);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ============================================================
       TOAST / NOTIFICATION
       ============================================================ */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
    }

    .toast {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 12px;
      color: var(--fg);
      box-shadow: var(--shadow);
      pointer-events: auto;
      max-width: 320px;
      animation: toast-in 0.15s ease;
    }

    .toast-error {
      border-color: #7a2020;
      background: #1e0d0d;
      color: #f87171;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       SCROLLBAR STYLING
       ============================================================ */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--fg-dim);
    }

    /* ============================================================
       UTILITY CLASSES
       ============================================================ */
    .hidden { display: none !important; }
    .text-muted { color: var(--fg-muted); }
    .text-dim   { color: var(--fg-dim); }
    .text-accent { color: var(--accent); }
    .flex-center { display: flex; align-items: center; gap: 6px; }

    /* ============================================================
       ERROR BANNER (Task 2 — API error feedback)
       ============================================================ */
    .error-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #1e0d0d;
      border: 1px solid #7a2020;
      border-radius: var(--radius);
      color: #f87171;
      font-size: 13px;
      padding: 10px 14px;
      margin: 12px 0 4px;
    }

    .error-banner-msg {
      flex: 1;
    }

    .error-banner-dismiss {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .error-banner-dismiss:hover {
      opacity: 1;
    }

    /* ============================================================
       EDIT MODE TOOLBAR (T-E27-F07-004)
       ============================================================ */
    .edit-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .edit-save-btn {
      background: var(--accent, #39d353);
      color: #000;
      border-color: var(--accent, #39d353);
      font-weight: 600;
    }

    .edit-save-btn:hover:not(:disabled) {
      opacity: 0.85;
    }

    .edit-save-btn:disabled,
    .edit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ============================================================
       LOADING INDICATOR (Task 2 — initial data load)
       ============================================================ */
    .loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 60px 24px;
      color: var(--fg-dim);
      font-size: 13px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--fg-dim);
    }

    /* Folder files pane */
    .folder-files-pane {
      padding: 12px 16px;
    }
    .folder-files-header {
      font-size: 11px;
      color: var(--fg-dim);
      font-family: 'SF Mono', monospace;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .folder-files-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .folder-file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      transition: background var(--transition);
    }
    .folder-file-item:hover {
      background: var(--bg-3);
    }
    .folder-file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .folder-file-size {
      font-size: 11px;
      color: var(--fg-dim);
      font-family: 'SF Mono', monospace;
      white-space: nowrap;
    }
    .folder-file-dir {
      color: var(--fg-muted);
    }
    .tree-node-folder-icon {
      margin-right: 4px;
    }

    /* Orchestrator action collapsible disclosure */
    .orch-action {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      background: var(--bg-2);
    }
    .orch-action > summary {
      cursor: pointer;
      color: var(--fg-dim);
      font-size: 12px;
      user-select: none;
      padding: 2px 0;
    }
    .orch-action[open] > summary { color: var(--fg); }
    .orch-action .props-grid   { margin-top: 8px; }
    .orch-instruction          { font-family: var(--font-mono,monospace); font-size: 12px; background: var(--bg-3); padding: 8px; border-radius: var(--radius); }

    /* Mutation controls for the viewer entity pane */
    .mutation-panel {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      background: var(--bg-2);
    }
    .mutation-panel > summary {
      cursor: pointer;
      color: var(--fg-dim);
      font-size: 12px;
      user-select: none;
      padding: 2px 0;
    }
    .mutation-panel[open] > summary { color: var(--fg); }
    .mutation-panel-body {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }
    .mutation-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      padding: 10px;
    }
    .mutation-section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 8px;
    }
    .mutation-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .mutation-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .mutation-field-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .mutation-input,
    .mutation-select,
    .mutation-textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-2);
      color: var(--fg);
      padding: 8px 10px;
      font: inherit;
    }
    .mutation-textarea {
      min-height: 88px;
      resize: vertical;
    }
    .mutation-size-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .mutation-size-row .mutation-field {
      flex: 1 1 160px;
    }
    .mutation-check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--fg-muted);
      user-select: none;
    }
    .mutation-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .mutation-transition-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .mutation-transition-buttons .open-btn {
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-muted);
    }
    .mutation-transition-buttons .open-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    /* ============================================================
       TAG CHIPS (E28-F06 REQ-F-016, AC-T1)
       Uses existing theming tokens — no hardcoded colors.
       ============================================================ */
    .tag-chip {
      display: inline-block;
      padding: 2px 8px;
      margin-right: 4px;
      background: var(--accent-dim);
      color: var(--fg);
      border-radius: var(--radius-sm);
      font-size: 0.85em;
      font-weight: 500;
    }

    .entity-tags-row {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    /* ============================================================
       TAG FILTER CONTROL (E28-F06 REQ-F-017)
       Sidebar multi-select chip list.
       ============================================================ */
    .tag-filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .tag-filter-chips .chip {
      cursor: pointer;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: var(--bg-3);
      color: var(--fg-muted);
      user-select: none;
      font-size: 12px;
      border: 1px solid var(--border);
      transition: background var(--transition), color var(--transition);
    }

    .tag-filter-chips .chip:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    .tag-filter-chips .chip.selected {
      background: var(--accent);
      color: var(--fg);
      border-color: var(--accent);
    }

    .tag-filter-chips .chip-empty {
      color: var(--fg-dim);
      font-style: italic;
      font-size: 11px;
      padding: 3px 0;
      cursor: default;
    }

    .tag-filter-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--fg-dim);
      padding: 8px 12px 4px;
    }

  </style>
</head>

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
'use strict';

// ============================================================
// SECTION: Status Color Mapping + Utilities
// ============================================================

/**
 * Full status → hex color mapping table.
 * Covers basic statuses + all shark long-form workflow statuses.
 * Unknown statuses fall back to #666666 via getStatusColor().
 */
const STATUS_COLORS = {
  // --- Basic statuses ---
  draft:       '#8c8c8c',  // gray
  todo:        '#4d4dbb',  // blue
  in_progress: '#e7b30e',  // yellow
  open:        '#e7b30e',  // yellow (same as in_progress)
  done:        '#4d4269',  // dark green/purple
  blocked:     '#8c5700',  // dark orange
  cancelled:   '#4b4b36',  // dark gray
  triaged:     '#e7b500',  // yellow
  verified:    '#4d4269',  // dark green (same as done)
  closed:      '#4b4b26',  // dark gray
  wont_fix:    '#4b4b26',  // dark gray
  identified:  '#8c8c8c',  // gray (same as draft)
  confirmed:   '#4d4dbb',  // blue (same as todo)
  proposed:    '#4d4dbb',  // blue
  evaluating:  '#e7b500',  // yellow
  accepted:    '#4d4269',  // dark green
  promoted:    '#8c4dbb',  // purple
  rejected:    '#8c4d6c',  // dark pink
  reopened:    '#e7b500',  // yellow
  approved:    '#4d4269',  // dark green

  // --- Shark long-form workflow statuses ---
  // ready_for_* → blue range (waiting/queued)
  ready_for_development:    '#4d4dbb',
  ready_for_review:         '#4d4dbb',
  ready_for_qa:             '#4d4dbb',
  ready_for_approval:       '#4d4dbb',
  ready_for_research:       '#4d4dbb',
  ready_for_decomposition:  '#4d4dbb',
  ready_for_refinement:     '#4d4dbb',
  ready_for_test_planning:  '#4d4dbb',
  ready_for_task_generation:'#4d4dbb',
  ready_for_task_review:    '#4d4dbb',

  // in_* → yellow range (active work)
  in_development:    '#e7b30e',
  in_review:         '#e7b30e',
  in_qa:             '#e7b30e',
  in_research:       '#e7b30e',
  in_decomposition:  '#e7b30e',
  in_refinement:     '#e7b30e',
  in_test_planning:  '#e7b30e',
  in_task_generation:'#e7b30e',
  in_task_review:    '#e7b30e',

  // in_approval → purple (awaiting human decision)
  in_approval: '#8c4dbb',

  // Additional shark statuses
  on_hold:   '#8c5700',  // dark orange (same as blocked)
  active:    '#e7b30e',  // yellow (same as in_progress)
  completed: '#4d4269',  // dark green (same as done)
};

/**
 * Returns the hex color for a status string.
 * Falls back to #666666 for unknown statuses.
 * @param {string} status
 * @returns {string} hex color
 */
function getStatusColor(status) {
  return STATUS_COLORS[status] || '#666666';
}

/**
 * Returns '#000' or '#fff' for maximum contrast against the given hex background color.
 * Uses relative luminance per WCAG 2.1.
 * @param {string} hex - background color, e.g. '#e7b30e'
 * @returns {string} '#000' (dark text) or '#fff' (light text)
 */
function getContrastColor(hex) {
  // Strip leading '#'
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2), 16) / 255;
  const g = parseInt(h.substring(2,4), 16) / 255;
  const b = parseInt(h.substring(4,6), 16) / 255;
  // sRGB linearization
  const toLinear = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const L = 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
  return L > 0.179 ? '#000' : '#fff';
}

/**
 * Maps CSS named colors (as returned by the workflow service color metadata)
 * to their hex equivalents that fit the dark dashboard palette.
 * Only named strings need mapping; '#rrggbb' values pass through unchanged.
 */
const NAMED_TO_HEX = {
  yellow:  '#e7b30e',
  amber:   '#e7b500',
  blue:    '#4d4dbb',
  green:   '#22a362',
  lime:    '#65a30d',
  red:     '#c0392b',
  orange:  '#8c5700',
  purple:  '#8c4dbb',
  magenta: '#c0287a',
  pink:    '#8c4d6c',
  gray:    '#6b7280',
  grey:    '#6b7280',
  white:   '#d0d0d0',
  black:   '#444444',
  cyan:    '#0891b2',
  teal:    '#0f766e',
};

/**
 * Normalizes a color value to a hex string.
 * Named color strings (e.g. 'yellow') are mapped to their hex equivalents.
 * Hex strings (e.g. '#e7b30e') pass through unchanged.
 * @param {string} color
 * @returns {string} hex color string starting with '#'
 */
function normalizeToHex(color) {
  if (!color) return '#666666';
  const c = color.trim();
  if (c.startsWith('#')) return c;
  return NAMED_TO_HEX[c.toLowerCase()] || '#666666';
}

/**
 * Returns true if the status is a terminal/completed state
 * (excluded from stale entity detection).
 * @param {string} status
 * @returns {boolean}
 */
const TERMINAL_STATUSES = new Set([
  'done', 'cancelled', 'closed', 'wont_fix',
  'verified', 'rejected', 'promoted', 'approved', 'completed',
]);

function isTerminalStatus(status) {
  return TERMINAL_STATUSES.has(status);
}

const CANCELLED_STATUSES = new Set([
  'cancelled', 'closed', 'wont_fix', 'rejected',
]);

function isCancelledStatus(status) {
  return CANCELLED_STATUSES.has((status || '').toLowerCase());
}

// Per-entity-type map of statuses that should be hidden when "Show all items" is OFF.
// Falls back to TERMINAL_STATUSES ∪ CANCELLED_STATUSES for unknown entity types.
// See REQ-F-005 (T-E27-F10-005).
const HIDDEN_TERMINAL_BY_TYPE = {
  epic:        new Set(['completed', 'cancelled', 'closed', 'wont_fix', 'rejected']),
  feature:     new Set(['completed', 'cancelled', 'closed', 'wont_fix', 'rejected']),
  task:        new Set(['completed', 'done', 'cancelled', 'closed', 'wont_fix', 'rejected']),
  question:    new Set(['resolved', 'withdrawn', 'superseded', 'archived']),
  bug:         new Set(['completed', 'done', 'verified', 'closed', 'wont_fix', 'rejected']),
  change_card: new Set(['completed', 'done', 'approved', 'rejected', 'closed']),
  tech_debt:   new Set(['completed', 'done', 'resolved', 'cancelled', 'closed', 'wont_fix', 'rejected', 'archived']),
  idea:        new Set(['converted', 'archived']),
};

/**
 * Returns true if the given status should be hidden from the tree when the
 * "Show all items" checkbox is OFF, for the given entity type.
 * Falls back to the union of TERMINAL_STATUSES and CANCELLED_STATUSES if
 * entityType is unknown — defensive default that hides terminal items rather than leaking them.
 *
 * @param {string} status      e.g. 'completed', 'converted', 'cancelled'
 * @param {string} entityType  one of 'epic'|'feature'|'task'|'bug'|'change_card'|'tech_debt'|'idea'
 * @returns {boolean}
 */
function isHiddenTerminalStatus(status, entityType) {
  const s = (status || '').toLowerCase();
  const set = HIDDEN_TERMINAL_BY_TYPE[entityType];
  if (set) return set.has(s);
  return TERMINAL_STATUSES.has(s) || CANCELLED_STATUSES.has(s);
}

/** Prefix for synthetic folder keys used when a clicked directory has no associated entity. */
const FOLDER_KEY_PREFIX = 'folder:';

/**
 * Formats an ISO date string (YYYY-MM-DD or ISO 8601 with time) as a short
 * human-readable date, e.g. "May 8" or "May 8, 2025" if cross-year.
 * Parses the date part directly from the ISO string (no Date object) to avoid
 * local-timezone day-shift on midnight-UTC timestamps.
 * @param {string} isoString
 * @returns {string} e.g. "May 8" or "May 8, 2025" or "—" when absent
 */
function formatDateOnly(isoString) {
  if (!isoString) return '—';
  // Handle sql.NullTime object { Time: "...", Valid: bool }
  if (typeof isoString === 'object' && isoString !== null) {
    if (!isoString.Valid) return '—';
    isoString = isoString.Time;
  }
  if (!isoString) return '—';
  try {
    // Parse date part directly from ISO string to avoid timezone day-shift.
    // e.g. "2026-05-08T00:00:00Z" → "2026-05-08"
    const datePart = String(isoString).split('T')[0];
    const [yearStr, monStr, dayStr] = datePart.split('-');
    const year = parseInt(yearStr, 10);
    const mon  = parseInt(monStr, 10) - 1; // 0-based
    const day  = parseInt(dayStr, 10);
    if (isNaN(year) || isNaN(mon) || isNaN(day) || year < 2) return '—';
    const months = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];
    const monLabel = months[mon];
    const nowYear = new Date().getFullYear();
    if (year !== nowYear) {
      return `${monLabel} ${day}, ${year}`;
    }
    return `${monLabel} ${day}`;
  } catch {
    return '—';
  }
}

/**
 * Formats an ISO timestamp to a short human-readable date.
 * e.g. "Apr 9" or "Apr 9, 2024" if year differs from current.
 * @param {string} isoString
 * @returns {string}
 */
function formatDate(isoString) {
  if (!isoString) return '';
  // sql.NullTime serializes as {Time: "...", Valid: bool}
  if (typeof isoString === 'object' && isoString !== null) {
    if (!isoString.Valid) return '';
    isoString = isoString.Time;
  }
  if (!isoString) return '';
  try {
    const d = new Date(isoString);
    if (isNaN(d.getTime()) || d.getFullYear() < 2) return '';
    const now = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];
    const mon = months[d.getMonth()];
    const day = d.getDate();
    const hh  = String(d.getHours()).padStart(2, '0');
    const mm  = String(d.getMinutes()).padStart(2, '0');
    const ss  = String(d.getSeconds()).padStart(2, '0');
    const time = `${hh}:${mm}:${ss}`;
    if (d.getFullYear() !== now.getFullYear()) {
      return `${mon} ${day}, ${d.getFullYear()} ${time}`;
    }
    return `${mon} ${day} ${time}`;
  } catch {
    return '';
  }
}

/**
 * Formats an ISO timestamp to a short human-readable date+time.
 * e.g. "Apr 9 14:32" or "Apr 9, 2024 14:32" if year differs.
 * @param {string} isoString
 * @returns {string}
 */
function formatDateTime(isoString) {
  if (!isoString) return '';
  // sql.NullTime serializes as {Time: "...", Valid: bool}
  if (typeof isoString === 'object' && isoString !== null) {
    if (!isoString.Valid) return '';
    isoString = isoString.Time;
  }
  if (!isoString) return '';
  try {
    const d = new Date(isoString);
    if (isNaN(d.getTime()) || d.getFullYear() < 2) return '';
    const now = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];
    const mon = months[d.getMonth()];
    const day = d.getDate();
    const hh  = String(d.getHours()).padStart(2, '0');
    const mm  = String(d.getMinutes()).padStart(2, '0');
    const ss  = String(d.getSeconds()).padStart(2, '0');
    const time = `${hh}:${mm}:${ss}`;
    if (d.getFullYear() !== now.getFullYear()) {
      return `${mon} ${day}, ${d.getFullYear()} ${time}`;
    }
    return `${mon} ${day} ${time}`;
  } catch {
    return isoString;
  }
}

/**
 * Formats a duration in milliseconds as hh:mm:ss.
 * @param {number} ms
 * @returns {string}
 */
function formatDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/**
 * Returns the number of whole days since an ISO timestamp.
 * @param {string} isoString
 * @returns {number}
 */
function daysSince(isoString) {
  if (!isoString) return 0;
  try {
    const d = new Date(isoString);
    const now = new Date();
    const ms = now.getTime() - d.getTime();
    return Math.floor(ms / (1000 * 60 * 60 * 24));
  } catch {
    return 0;
  }
}

/**
 * Fetches the full entity hierarchy tree.
 * Critical endpoint — failure should prevent dashboard transition.
 * @param {string[]} [tags] - Optional tag filter (AND semantics, E28-F06 REQ-F-010)
 * @returns {Promise<Object>} parsed JSON hierarchy response
 * @throws {Error} on HTTP error or network failure
 */
async function apiGetHierarchy(tags, includeTerminal) {
  const url = new URL('/api/v1/viewer/hierarchy', window.location.origin);
  if (tags && tags.length > 0) {
    for (const t of tags) url.searchParams.append('tag', t);
  }
  if (includeTerminal) url.searchParams.set('include_terminal', 'true');
  const resp = await fetch(url.pathname + url.search);
  if (!resp.ok) throw new Error(`hierarchy fetch failed: HTTP ${resp.status}`);
  const hierarchy = await resp.json();
  // B017 / E27-F02 REQ-F-002: the hierarchy payload no longer carries task
  // rows — only task_count and blocked_count per feature. Hydrate `feature.tasks`
  // via parallel calls to /api/v1/viewer/features/{key}/tasks so the existing
  // dashboard/charts/search code that reads feature.tasks continues to work.
  // The task fetches run in parallel; the hierarchy itself returns quickly so
  // the sidebar can be drawn (with counts) while task data streams in.
  await hydrateHierarchyTasks(hierarchy, tags);
  return hierarchy;
}

/**
 * Populates `feature.tasks` on the in-memory hierarchy by issuing parallel
 * `/features/{key}/tasks` calls for every feature in the tree. Errors per
 * feature are swallowed (the corresponding feature gets an empty tasks array)
 * so a partial failure does not block the dashboard.
 *
 * This is a compatibility shim for B017: the backend (correctly) no longer
 * embeds tasks in the hierarchy payload, but the dashboard code was written
 * against the old (broken) shape. Migrating all ~15 read sites to per-feature
 * lazy fetches is a larger refactor tracked separately; this helper keeps the
 * UI functional in the meantime while satisfying the API spec.
 *
 * @param {object} hierarchy - response from /api/v1/viewer/hierarchy
 * @param {string[]} [tags] - optional active tag filter to pass through
 */
async function hydrateHierarchyTasks(hierarchy, tags) {
  if (!hierarchy || !Array.isArray(hierarchy.epics)) return;
  const fetches = [];
  for (const epic of hierarchy.epics) {
    const features = Array.isArray(epic.features) ? epic.features : [];
    for (const feature of features) {
      // Initialise to empty so downstream readers never see undefined.
      feature.tasks = [];
      if (!feature.key) continue;
      fetches.push(
        apiGetFeatureTasks(feature.key, tags).then(tasks => {
          if (Array.isArray(tasks)) {
            feature.tasks = tasks;
          }
        }).catch(() => {
          // best-effort: leave feature.tasks as [] on failure
        })
      );
    }
  }
  if (fetches.length > 0) {
    await Promise.all(fetches);
  }
}

/**
 * Fetches the registered tag vocabulary.
 * Non-blocking — empty result on failure; filter control shows empty state.
 * @returns {Promise<string[]>} sorted array of tag name strings

  } catch {
    return [];
  }
}

/**
 * Displays a dismissible error banner at the top of the content area.
 * Also logs the message to the console for debugging.
 * @param {string} message - Human-readable error description
 */
function showError(message) {
  console.error('[viewer] Error:', message);
  // Remove any existing error banner
  const existing = document.getElementById('error-banner');
  if (existing) existing.remove();

  const banner = document.createElement('div');
  banner.id = 'error-banner';
  banner.className = 'error-banner';
  banner.innerHTML = `
    <span class="error-banner-msg">${escapeHtml(message)}</span>
    <button class="error-banner-dismiss" aria-label="Dismiss">✕</button>
  `;
  banner.querySelector('.error-banner-dismiss').addEventListener('click', () => banner.remove());

  // Insert at the top of #content (before any other children)
  const content = document.getElementById('content');
  content.insertBefore(banner, content.firstChild);
}

/**
 * Shows a loading overlay/spinner in the content area.
 * Clears content and inserts a centered loading indicator.
 */
function showLoading() {
  const content = document.getElementById('content');
  // Remove pick-folder-screen temporarily hidden by CSS; we inject a loader
  let loader = document.getElementById('loading-indicator');
  if (!loader) {
    loader = document.createElement('div');
    loader.id = 'loading-indicator';
    loader.className = 'loading-indicator';
    loader.innerHTML = '<div class="loading-spinner"></div><div class="loading-text">Loading project data…</div>';
    content.appendChild(loader);
  }
  loader.style.display = 'flex';
}

/**
 * Hides the loading overlay previously shown by showLoading().
 */
function hideLoading() {
  const loader = document.getElementById('loading-indicator');
  if (loader) loader.remove();
}

/**
 * Escapes HTML special characters to prevent XSS in dynamic content.
 * @param {string} str
 * @returns {string}
 */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Loads the tag vocabulary from GET /api/v1/viewer/tags.
 * Caches in module-scoped `vocabulary` array.
 * Called once from loadProjectData() on viewer boot (REQ-F-017, AC-T2).
 * Non-blocking — failure leaves vocabulary empty; filter control renders
 * the empty state.
 */
async function loadVocabulary() {
  vocabulary = await apiGetTags();
}

/**
 * Renders tag chips for a given entity's tags array.
 * Returns an HTML string with .tag-chip elements, or null when tags is empty.
 * Callers must check for null before appending (AC-T2: do not append null).
 * @param {Object} entity - entity object with an optional `tags` array
 * @returns {string|null} HTML string or null when no tags
 */
function renderTagChipsHtml(entity) {
  const tags = Array.isArray(entity && entity.tags) ? entity.tags : [];
  if (tags.length === 0) return null;
  const chips = tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('');
  return `<div class="entity-tags-row">${chips}</div>`;
}

/**
 * Applies the tag filter: re-fetches the hierarchy with the current
 * activeTagFilter selection and updates treeData/hierarchyData.
 * Called when the user clicks a chip in the filter control.
 * Rebuilds the sidebar and (if on dashboard) re-renders the main pane.
 *
 * REQ-F-017 / AC-12: the filter must apply to BOTH the hierarchy AND the
 * `features/{key}/tasks` list view. When the user is currently viewing a
 * feature's Overview (whose Tasks table reads from the in-memory hierarchy
 * `feature.tasks` array), we additionally refetch the feature-tasks endpoint
 * with the same `?tag=` params and replace the feature's tasks array so the
 * UAT-T-E28-F06-007 regression — chip toggle not refetching feature tasks —
 * cannot recur.
 *
 * @param {string[]} selectedTags - tags to filter by (AC-T3: repeated ?tag= params)
 */
async function applyTagFilter(selectedTags) {
  const tagsArg = selectedTags.length > 0 ? selectedTags : undefined;
  let hierarchy;
  try {
    hierarchy = await apiGetHierarchy(tagsArg, showCompleted);
  } catch (err) {
    showToast('Failed to apply tag filter', 'error');
    return;
  }
  hierarchyData = hierarchy;
  treeData = Array.isArray(hierarchy?.epics) ? hierarchy.epics : [];

  // REQ-F-017 / AC-12: also refetch the feature-tasks list when a feature is
  // currently in view, so the `features/{key}/tasks` endpoint is exercised
  // with the active tag filter (AC-T3: repeated ?tag= params).
  if (appState === 'entity_view' && selectedKey) {
    const entity = findEntityByKey(selectedKey);
    if (entity && entity.type === 'feature') {
      const tasks = await apiGetFeatureTasks(selectedKey, tagsArg);
      if (Array.isArray(tasks)) {
        // Patch the in-memory feature's tasks so renderTasksTableSection picks
        // up the filtered list. Walk treeData to find the matching feature.
        for (const epic of treeData) {
          const features = Array.isArray(epic.features) ? epic.features : [];
          for (const feature of features) {
            if (feature.key === selectedKey) {
              feature.tasks = tasks;
              break;
            }
          }
        }
      }
    }
  }

  render();
}

/**
 * Renders the tag filter control into the sidebar.
 * Populates chips from the cached `vocabulary` array.
 * Selected chips are toggled in `activeTagFilter` and trigger a hierarchy
 * re-fetch via applyTagFilter() (REQ-F-017, AC-12).
 * No "add tag" control is rendered — read-only per AC-T5/AC-13/REQ-F-018.
 * @returns {string} HTML string for the tag filter section
 */
function buildTagFilterControlHtml() {
  if (vocabulary.length === 0) {
    return `<div class="tag-filter-chips"><span class="chip-empty">No tags registered yet</span></div>`;
  }
  const chips = vocabulary.map(name => {
    const sel = activeTagFilter.has(name) ? ' selected' : '';
    return `<span class="chip${sel}" data-tag-filter-chip="${escapeHtml(name)}">${escapeHtml(name)}</span>`;
  }).join('');
  return `<div class="tag-filter-chips">${chips}</div>`;
}
