<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shark Status Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES — Dark Slate Palette
       ============================================================ */
    :root {
      --bg:             #0d0f12;
      --bg-2:           #161920;
      --bg-3:           #1e222b;
      --bg-4:           #252a35;
      --fg:             #e8eaf0;
      --fg-muted:       #8a8f9e;
      --fg-dim:         #555c6e;
      --accent:         #4d77ff;
      --accent-hover:   #6690ff;
      --accent-dim:     #1e2d5a;
      --border:         #2a2f3d;
      --border-light:   #353b4d;
      --sidebar-width:  320px;
      --header-height:  44px;
      --radius-sm:      4px;
      --radius:         6px;
      --radius-lg:      8px;
      --shadow:         0 2px 8px rgba(0,0,0,0.4);
      --transition:     150ms ease;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
    }

    /* ============================================================
       TYPOGRAPHY
       ============================================================ */

    /* Monospace for entity keys */
    .key, .mono {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      color: var(--accent);
      font-size: 12px;
    }

    /* Uppercase small-caps for section headers */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    /* ============================================================
       3-PANEL APP LAYOUT
       ============================================================ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #header {
      height: var(--header-height);
      min-height: var(--header-height);
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    #body-row {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
    }

    #content {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
      padding: 20px 24px;
    }

    /* Hide header/sidebar on pick_folder state */
    .state-pick-folder #header,
    .state-pick-folder #body-row #sidebar {
      display: none;
    }

    .state-pick-folder #content {
      padding: 0;
    }

    /* ============================================================
       HEADER BAR
       ============================================================ */
    #header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    #header-dashboard-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background var(--transition);
    }

    #header-dashboard-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    .header-pill {
      font-size: 11px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 8px;
      color: var(--fg-muted);
      white-space: nowrap;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-muted);
      transition: background var(--transition), color var(--transition);
    }

    .header-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    .header-btn-accent {
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    .header-btn-accent:hover {
      background: var(--accent-dim);
      color: var(--fg);
    }

    .content-back-link {
      display: inline-block;
      margin: 8px 0 4px;
      font-size: 13px;
      color: var(--fg-muted);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .content-back-link:hover {
      color: var(--fg);
    }

    /* ============================================================
       SIDEBAR TREE
       ============================================================ */
    .sidebar-filter-bar {
      padding: 8px 12px 6px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-filter-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--fg-dim);
      cursor: pointer;
      user-select: none;
    }
    .sidebar-filter-label input[type="checkbox"] {
      cursor: pointer;
    }
    .sidebar-section-header {
      position: sticky;
      top: 0;
      background: var(--bg-2);
      padding: 10px 12px 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-dim);
      border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    .tree-node {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 0;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: background var(--transition);
      user-select: none;
      position: relative;
    }

    .tree-node:hover {
      background: var(--bg-3);
    }

    /* Selected state: dark tint + accent left border + primary text */
    .tree-node.selected {
      background: rgba(0, 0, 0, 0.35);
      border-left: 3px solid var(--accent);
    }

    .tree-node.selected .tree-node-title {
      color: var(--fg);
    }

    /* Adjust padding when border adds 3px to left */
    .tree-node.selected {
      padding-left: 0;
    }

    /* Tree indentation levels */
    .tree-node-epic    { padding-left: 16px; font-weight: 600; }
    .tree-node-feature { padding-left: 40px; }
    .tree-node-task    { padding-left: 56px; }
    .tree-node-flat    { padding-left: 18px; }

    /* Doc nodes: italic + muted */
    .tree-node-doc-epic    { padding-left: 16px; font-style: italic; }
    .tree-node-doc-feature { padding-left: 40px; font-style: italic; }

    .tree-node-doc-epic .tree-node-title,
    .tree-node-doc-feature .tree-node-title {
      color: var(--fg-dim);
      font-style: italic;
    }

    /* Cancelled/inactive entities: dimmed text to de-emphasize without relying on color */
    .entity-cancelled .tree-node-key,
    .entity-cancelled .tree-node-title {
      opacity: 0.4;
      text-decoration: line-through;
    }
    .entity-cancelled:not(.selected) {
      opacity: 0.55;
    }
    tr.entity-cancelled td {
      opacity: 0.4;
      text-decoration: line-through;
    }

    /* Compensate selected border for indented nodes */
    .tree-node.selected.tree-node-epic    { padding-left: 13px; }
    .tree-node.selected.tree-node-feature { padding-left: 37px; }
    .tree-node.selected.tree-node-task    { padding-left: 53px; }
    .tree-node.selected.tree-node-flat    { padding-left: 15px; }
    .tree-node.selected.tree-node-doc-epic    { padding-left: 13px; }
    .tree-node.selected.tree-node-doc-feature { padding-left: 37px; }

    .tree-arrow {
      width: 14px;
      min-width: 14px;
      font-size: 9px;
      color: var(--fg-dim);
      text-align: center;
      transition: transform var(--transition);
      flex-shrink: 0;
    }

    .tree-arrow-spacer {
      width: 14px;
      min-width: 14px;
      flex-shrink: 0;
    }

    /* Status dot */
    .status-dot {
      width: 9px;
      height: 9px;
      min-width: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .tree-node-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
    }

    .tree-node-title {
      color: var(--fg-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      flex: 1;
    }

    /* ============================================================
       STATUS BADGES
       ============================================================ */
    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 10px;
      color: #fff;
      white-space: nowrap;
      line-height: 1.6;
      /* background set via JS using getStatusColor() */
    }

    .status-badge-sm {
      font-size: 9px;
      padding: 1px 5px;
    }

    /* ============================================================
       PICK FOLDER SCREEN
       ============================================================ */
    #pick-folder-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
      gap: 0;
    }

    .state-pick-folder #pick-folder-screen {
      display: flex;
    }

    .pick-folder-icon {
      opacity: 0.18;
      margin-bottom: 28px;
    }

    .pick-folder-icon svg {
      width: 96px;
      height: 96px;
    }

    .pick-folder-heading {
      font-size: 28px;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .pick-folder-instruction {
      font-size: 14px;
      color: var(--fg-muted);
      margin-bottom: 28px;
      max-width: 340px;
      line-height: 1.6;
    }

    .pick-folder-btn {
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      box-shadow: 0 2px 12px rgba(77, 119, 255, 0.4);
    }

    .pick-folder-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(77, 119, 255, 0.5);
    }

    .pick-folder-btn:active {
      transform: translateY(0);
    }

    .pick-folder-note {
      font-size: 11px;
      color: var(--fg-dim);
      margin-top: 16px;
      max-width: 300px;
    }

    /* ============================================================
       DASHBOARD
       ============================================================ */
    .dashboard-section {
      margin-bottom: 32px;
    }

    .dashboard-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Status Breakdown cards */
    .breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .breakdown-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }

    .breakdown-card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 6px;
    }

    .breakdown-card-total {
      font-size: 28px;
      font-weight: 700;
      color: var(--fg);
      line-height: 1.1;
      margin-bottom: 12px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .breakdown-card-active {
      font-size: 12px;
      font-weight: 500;
      color: var(--fg-muted);
    }

    .breakdown-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    /* Feature Progress */
    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
    }

    .progress-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
      min-width: 90px;
      cursor: pointer;
    }

    .progress-key:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .progress-title {
      color: var(--fg-muted);
      font-size: 12px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-bar-wrap {
      width: 120px;
      height: 6px;
      background: var(--bg-4);
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-pct {
      font-size: 11px;
      color: var(--fg-muted);
      min-width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Activity / Transitions table */
    .activity-table {
      border-collapse: collapse;
    }

    .activity-table tr {
      border-bottom: 1px solid var(--border);
    }

    .activity-table tr:hover {
      background: var(--bg-2);
    }

    .activity-table td {
      padding: 7px 8px;
      vertical-align: middle;
      font-size: 12px;
    }

    .activity-date {
      color: var(--fg-dim);
      white-space: nowrap;
      font-size: 11px;
    }

    .activity-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .activity-key:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .activity-arrow {
      color: var(--fg-dim);
      padding: 0 2px;
    }

    .activity-table td.activity-badge-cell {
      padding: 7px 3px;
    }

    .activity-duration {
      color: var(--fg-dim);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .activity-note {
      color: var(--fg-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .open-btn {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), color var(--transition);
    }

    .open-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    /* Stale entities table */
    .stale-table {
      width: 100%;
      border-collapse: collapse;
    }

    .stale-table tr {
      border-bottom: 1px solid var(--border);
    }

    .stale-table tr:hover {
      background: var(--bg-2);
    }

    .stale-table td {
      padding: 7px 8px;
      vertical-align: middle;
      font-size: 12px;
    }

    .stale-age {
      color: var(--fg-dim);
      font-size: 11px;
      white-space: nowrap;
    }

    /* ============================================================
       ENTITY CHARTS (pie/donut charts)
       ============================================================ */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .chart-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 12px;
    }

    .chart-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    .chart-legend {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
    }

    .chart-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--fg-muted);
      line-height: 1.4;
    }

    .chart-legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chart-legend-count {
      margin-left: auto;
      color: var(--fg);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ============================================================
       ENTITY VIEW
       ============================================================ */
    .entity-view-header {
      margin-bottom: 18px;
    }

    .entity-view-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 4px;
    }

    .entity-view-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 13px;
    }

    .entity-view-key-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Copy-key button: unobtrusive — no border/background in rest state */
    .copy-key-btn {
      font-size: 11px;
      padding: 1px 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-dim);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      flex-shrink: 0;
    }

    .copy-key-btn:hover {
      background: var(--bg-3);
      border-color: var(--border);
      color: var(--fg);
    }

    .toggle-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      font-size: 12px;
      padding: 5px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--fg-muted);
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .toggle-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    .toggle-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Spec pane inline edit header (E27-F09) */
    .spec-pane-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 28px;
      margin-bottom: 8px;
    }

    .inline-edit-btn {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--fg-muted);
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .inline-edit-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    /* Breadcrumb (REQ-F-003, E27-F09-005) */
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-dim); margin: 2px 0 10px; }
    .breadcrumb-seg { padding: 2px 4px; border-radius: 3px; cursor: pointer; font-family: var(--font-mono, monospace); }
    .breadcrumb-seg:hover { background: var(--bg-3); color: var(--fg); }
    .breadcrumb-seg.current { color: var(--fg); cursor: default; }
    .breadcrumb-sep { color: var(--fg-dim); user-select: none; }

    /* Properties-panel status accent (REQ-F-012) */
    .props-grid[data-status-accent] { padding-left: calc(var(--pad, 10px) + 3px); }

    /* Overview pane (E27-F09) */
    .overview-pane {
      padding: 4px 0;
    }

    /* Overview sections (REQ-F-004, REQ-F-005, REQ-F-008) */
    .ov-section { margin: 18px 0; }
    .ov-section-header { display: flex; align-items: center; gap: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin: 0 0 10px; }
    .ov-section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Rollup pills (REQ-F-004, REQ-F-005) */
    .rollup-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .rollup-pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 12px; padding: 2px 8px; font-size: 11px; }

    /* Segmented progress bar (REQ-F-005) */
    .seg-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--bg-3); }
    .seg-bar-segment { height: 100%; }
    .seg-bar-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .seg-bar-label { font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }

    /* Work breakdown (REQ-F-006) */
    .wb-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
    .wb-label { width: 80px; color: var(--fg-dim); }
    .wb-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
    .wb-bar-fill { height: 100%; background: var(--accent, #4a9eff); }
    .wb-count { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

    /* Action items (REQ-F-007) */

<script>
'use strict';

// ============================================================
// SECTION: Status Color Mapping + Utilities
// ============================================================

/**
 * Full status → hex color mapping table.
 * Covers basic statuses + all shark long-form workflow statuses.
 * Unknown statuses fall back to #666666 via getStatusColor().
 */
const STATUS_COLORS = {
  // --- Basic statuses ---
  draft:       '#8c8c8c',  // gray
  todo:        '#4d4dbb',  // blue
  in_progress: '#e7b30e',  // yellow
  open:        '#e7b30e',  // yellow (same as in_progress)
  done:        '#4d4269',  // dark green/purple
  blocked:     '#8c5700',  // dark orange
  cancelled:   '#4b4b36',  // dark gray
  triaged:     '#e7b500',  // yellow
  verified:    '#4d4269',  // dark green (same as done)
  closed:      '#4b4b26',  // dark gray
  wont_fix:    '#4b4b26',  // dark gray
  identified:  '#8c8c8c',  // gray (same as draft)
  confirmed:   '#4d4dbb',  // blue (same as todo)
  proposed:    '#4d4dbb',  // blue
  evaluating:  '#e7b500',  // yellow
  accepted:    '#4d4269',  // dark green
  promoted:    '#8c4dbb',  // purple
  rejected:    '#8c4d6c',  // dark pink
  reopened:    '#e7b500',  // yellow
  approved:    '#4d4269',  // dark green

  // --- Shark long-form workflow statuses ---
  // ready_for_* → blue range (waiting/queued)
  ready_for_development:    '#4d4dbb',
  ready_for_review:         '#4d4dbb',
  ready_for_qa:             '#4d4dbb',
  ready_for_approval:       '#4d4dbb',
  ready_for_research:       '#4d4dbb',
  ready_for_decomposition:  '#4d4dbb',
  ready_for_refinement:     '#4d4dbb',
  ready_for_test_planning:  '#4d4dbb',
  ready_for_task_generation:'#4d4dbb',
  ready_for_task_review:    '#4d4dbb',

  // in_* → yellow range (active work)
  in_development:    '#e7b30e',
  in_review:         '#e7b30e',
  in_qa:             '#e7b30e',
  in_research:       '#e7b30e',
  in_decomposition:  '#e7b30e',
  in_refinement:     '#e7b30e',
  in_test_planning:  '#e7b30e',
  in_task_generation:'#e7b30e',
  in_task_review:    '#e7b30e',

  // in_approval → purple (awaiting human decision)
  in_approval: '#8c4dbb',

  // Additional shark statuses
  on_hold:   '#8c5700',  // dark orange (same as blocked)
  active:    '#e7b30e',  // yellow (same as in_progress)
  completed: '#4d4269',  // dark green (same as done)
};

/**
 * Returns the hex color for a status string.
 * Falls back to #666666 for unknown statuses.
 * @param {string} status
 * @returns {string} hex color
 */
function getStatusColor(status) {
  return STATUS_COLORS[status] || '#666666';
}

/**
 * Returns '#000' or '#fff' for maximum contrast against the given hex background color.
 * Uses relative luminance per WCAG 2.1.
 * @param {string} hex - background color, e.g. '#e7b30e'
 * @returns {string} '#000' (dark text) or '#fff' (light text)
 */
function getContrastColor(hex) {
  // Strip leading '#'
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2), 16) / 255;
  const g = parseInt(h.substring(2,4), 16) / 255;
  const b = parseInt(h.substring(4,6), 16) / 255;
  // sRGB linearization
  const toLinear = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const L = 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
  return L > 0.179 ? '#000' : '#fff';
}

/**
 * Maps CSS named colors (as returned by the workflow service color metadata)
 * to their hex equivalents that fit the dark dashboard palette.
 * Only named strings need mapping; '#rrggbb' values pass through unchanged.
 */
const NAMED_TO_HEX = {
  yellow:  '#e7b30e',
  amber:   '#e7b500',
  blue:    '#4d4dbb',
  green:   '#22a362',
  lime:    '#65a30d',
  red:     '#c0392b',
  orange:  '#8c5700',
  purple:  '#8c4dbb',
  magenta: '#c0287a',
  pink:    '#8c4d6c',
  gray:    '#6b7280',
  grey:    '#6b7280',
  white:   '#d0d0d0',
  black:   '#444444',
  cyan:    '#0891b2',
  teal:    '#0f766e',
};

/**
 * Normalizes a color value to a hex string.
 * Named color strings (e.g. 'yellow') are mapped to their hex equivalents.
 * Hex strings (e.g. '#e7b30e') pass through unchanged.
 * @param {string} color
 * @returns {string} hex color string starting with '#'
 */
function normalizeToHex(color) {
  if (!color) return '#666666';
  const c = color.trim();
  if (c.startsWith('#')) return c;
  return NAMED_TO_HEX[c.toLowerCase()] || '#666666';
}

/**
 * Returns true if the status is a terminal/completed state
 * (excluded from stale entity detection).
 * @param {string} status
 * @returns {boolean}
 */
const TERMINAL_STATUSES = new Set([
  'done', 'cancelled', 'closed', 'wont_fix',
  'verified', 'rejected', 'promoted', 'approved', 'completed',
]);

function isTerminalStatus(status) {
  return TERMINAL_STATUSES.has(status);
}

const CANCELLED_STATUSES = new Set([
  'cancelled', 'closed', 'wont_fix', 'rejected',
]);

function isCancelledStatus(status) {
  return CANCELLED_STATUSES.has((status || '').toLowerCase());
}

/** Prefix for synthetic folder keys used when a clicked directory has no associated entity. */
const FOLDER_KEY_PREFIX = 'folder:';

/**
 * Formats an ISO timestamp to a short human-readable date.
 * e.g. "Apr 9" or "Apr 9, 2024" if year differs from current.
 * @param {string} isoString
 * @returns {string}
 */
function formatDate(isoString) {
  if (!isoString) return '';
  // sql.NullTime serializes as {Time: "...", Valid: bool}
  if (typeof isoString === 'object' && isoString !== null) {
    if (!isoString.Valid) return '';
    isoString = isoString.Time;
  }
  if (!isoString) return '';
  try {
    const d = new Date(isoString);
    if (isNaN(d.getTime()) || d.getFullYear() < 2) return '';
    const now = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];
    const mon = months[d.getMonth()];
    const day = d.getDate();
    const hh  = String(d.getHours()).padStart(2, '0');
    const mm  = String(d.getMinutes()).padStart(2, '0');
    const ss  = String(d.getSeconds()).padStart(2, '0');
    const time = `${hh}:${mm}:${ss}`;
    if (d.getFullYear() !== now.getFullYear()) {
      return `${mon} ${day}, ${d.getFullYear()} ${time}`;
    }
    return `${mon} ${day} ${time}`;
  } catch {
    return '';
  }
}

/**
 * Formats an ISO timestamp to a short human-readable date+time.
 * e.g. "Apr 9 14:32" or "Apr 9, 2024 14:32" if year differs.
 * @param {string} isoString
 * @returns {string}
 */
function formatDateTime(isoString) {
  if (!isoString) return '';
  // sql.NullTime serializes as {Time: "...", Valid: bool}
  if (typeof isoString === 'object' && isoString !== null) {
    if (!isoString.Valid) return '';
    isoString = isoString.Time;
  }
  if (!isoString) return '';
  try {
    const d = new Date(isoString);
    if (isNaN(d.getTime()) || d.getFullYear() < 2) return '';
    const now = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];
    const mon = months[d.getMonth()];
    const day = d.getDate();
    const hh  = String(d.getHours()).padStart(2, '0');
    const mm  = String(d.getMinutes()).padStart(2, '0');
    const ss  = String(d.getSeconds()).padStart(2, '0');
    const time = `${hh}:${mm}:${ss}`;
    if (d.getFullYear() !== now.getFullYear()) {
      return `${mon} ${day}, ${d.getFullYear()} ${time}`;
    }
    return `${mon} ${day} ${time}`;
  } catch {
    return isoString;
  }
}

/**
 * Formats a duration in milliseconds as hh:mm:ss.
 * @param {number} ms
 * @returns {string}
 */
function formatDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/**
 * Returns the number of whole days since an ISO timestamp.
 * @param {string} isoString
 * @returns {number}
 */
function daysSince(isoString) {
  if (!isoString) return 0;
  try {
    const d = new Date(isoString);
    const now = new Date();
    const ms = now.getTime() - d.getTime();
    return Math.floor(ms / (1000 * 60 * 60 * 24));
  } catch {
    return 0;
  }
}

/**
 * Creates a status badge element.
 * @param {string} status
 * @param {boolean} [small=false]
 * @returns {HTMLElement}
 */
function makeStatusBadge(status, small = false) {
  const el = document.createElement('span');
  el.className = 'status-badge' + (small ? ' status-badge-sm' : '');
  el.style.background = getStatusColor(status);
  el.textContent = status.replace(/_/g, ' ');
  return el;
}

/**
 * Creates a status dot element.
 * @param {string} status
 * @returns {HTMLElement}
 */
function makeStatusDot(status) {
  const el = document.createElement('span');
  el.className = 'status-dot';
  el.style.background = getStatusColor(status);
  el.title = status;
  return el;
}

/**
 * Fetches workflow metadata from the server.
 * Non-blocking on failure — STATUS_COLORS acts as fallback.
 * @returns {Promise<Object|null>} parsed JSON or null on error
 */
async function apiGetWorkflowMeta() {
  try {
    const resp = await fetch('/api/v1/viewer/workflow-meta');
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches the full entity hierarchy tree.
 * Critical endpoint — failure should prevent dashboard transition.
 * @returns {Promise<Array>} parsed JSON array
 * @throws {Error} on HTTP error or network failure
 */
async function apiGetHierarchy() {
  const resp = await fetch('/api/v1/viewer/hierarchy');
  if (!resp.ok) throw new Error(`hierarchy fetch failed: HTTP ${resp.status}`);
  return await resp.json();
}

/**
 * Fetches project-wide entity summary (counts by type and status).
 * @returns {Promise<Object|null>} parsed JSON or null on error
 */
async function apiGetSummary() {
  try {
    const resp = await fetch('/api/v1/viewer/summary');
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches the most recent activity/transitions.
 * @param {number} [limit=25]
 * @returns {Promise<Array|null>} parsed JSON array or null on error
 */
async function apiGetRecentActivity(limit = 25) {
  try {
    const resp = await fetch(`/api/v1/viewer/recent-activity?limit=${limit}`);
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches the markdown file content for an entity.
 * @param {string} key - entity key (e.g. "E07-F01-001")
 * @returns {Promise<Object|null>} parsed JSON or null on error
 */
async function apiGetFile(key) {
  try {
    // For file paths (containing "/"), encode each segment separately to preserve path structure.
    // For entity keys (e.g. "E07-F01-001"), encodeURIComponent is safe.
    const encoded = key.includes('/')
      ? key.split('/').map(encodeURIComponent).join('/')
      : encodeURIComponent(key);
    const resp = await fetch(`/api/v1/viewer/file/${encoded}`);
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches the status-change history for an entity.
 * @param {string} key - entity key
 * @returns {Promise<Array|null>} parsed JSON array or null on error
 */
async function apiGetHistory(key) {
  try {
    const resp = await fetch(`/api/v1/viewer/history/${encodeURIComponent(key)}`);
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches all tasks for a feature.
 * @param {string} key - feature key (e.g. "E07-F01")

 */
async function apiGetFeatureTasks(key) {

    if (!resp.ok) return null;

/**
 * Displays a dismissible error banner at the top of the content area.
 * Also logs the message to the console for debugging.
 * @param {string} message - Human-readable error description
 */
function showError(message) {
  console.error('[viewer] Error:', message);
  // Remove any existing error banner
  const existing = document.getElementById('error-banner');
  if (existing) existing.remove();

  const banner = document.createElement('div');
  banner.id = 'error-banner';
  banner.className = 'error-banner';
  banner.innerHTML = `
    <span class="error-banner-msg">${escapeHtml(message)}</span>
    <button class="error-banner-dismiss" aria-label="Dismiss">✕</button>
  `;
  banner.querySelector('.error-banner-dismiss').addEventListener('click', () => banner.remove());

  // Insert at the top of #content (before any other children)
  const content = document.getElementById('content');
  content.insertBefore(banner, content.firstChild);
}

/**
 * Shows a loading overlay/spinner in the content area.
 * Clears content and inserts a centered loading indicator.
 */
function showLoading() {
  const content = document.getElementById('content');
  // Remove pick-folder-screen temporarily hidden by CSS; we inject a loader
  let loader = document.getElementById('loading-indicator');
  if (!loader) {
    loader = document.createElement('div');
    loader.id = 'loading-indicator';
    loader.className = 'loading-indicator';
    loader.innerHTML = '<div class="loading-spinner"></div><div class="loading-text">Loading project data…</div>';
    content.appendChild(loader);
  }
  loader.style.display = 'flex';
}

/**
 * Hides the loading overlay previously shown by showLoading().
 */
function hideLoading() {
  const loader = document.getElementById('loading-indicator');
  if (loader) loader.remove();
}

/**
 * Escapes HTML special characters to prevent XSS in dynamic content.
 * @param {string} str
 * @returns {string}
 */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// SECTION: Initial Data Load Sequence
// ============================================================

/**
 * Performs the full initial data load sequence when "Pick Folder" is clicked.
 *
 * Load order:
 * 1. Show loading state
 * 2. Fetch workflow-meta (non-blocking — uses STATUS_COLORS as fallback)
 * 3. Fetch hierarchy (blocking — failure stays on Pick Folder + shows error)
 * 4. Seed expandedEpics with all epic keys from hierarchy
 * 5. Fetch summary + recent-activity in parallel
 * 6. Transition to dashboard state
 *
 * Partial failure (summary/activity): proceeds to dashboard; affected
 * sections show inline "Failed to load" markers via null cache values.
 */
async function loadProjectData() {
  showLoading();

  // Step 2: workflow-meta (non-blocking)
  try {
    const meta = await apiGetWorkflowMeta();
    if (meta && meta.statuses) {
      workflowMeta = meta;
      // Supplement STATUS_COLORS: add statuses from meta not already known
      for (const [status, info] of Object.entries(meta.statuses)) {
        if (!(status in STATUS_COLORS)) {
          STATUS_COLORS[status] = (info && info.color) ? info.color : '#666666';
        }
      }
    }
  } catch {
    // workflow-meta failure is non-fatal; STATUS_COLORS is the fallback
  }

  // Step 3: hierarchy (blocking — critical)
  let hierarchy;
  try {
    hierarchy = await apiGetHierarchy();
  } catch (err) {
    hideLoading();
    showError('Failed to load project hierarchy. Please check the server and try again.');
    // Remain on Pick Folder screen — do NOT transition
    return;
  }

  // Step 4: set treeData + hierarchyData; on initial load start fully collapsed
  hierarchyData = hierarchy;
  treeData = Array.isArray(hierarchy?.epics) ? hierarchy.epics : [];
  projectName = hierarchy?.project_name || '';
  updateHeaderProjectName();
  folderFilesCache.clear();
  if (appState === 'pick_folder') {
    // First load: start fully collapsed — epics expand on first user interaction
    expandedEpics = new Set();
    expandedFeatures = new Set();
  }
  // Refresh: preserve existing expansion state (don't auto-expand new epics)

  // Step 5: summary + recent-activity in parallel (non-blocking)
  const [summary, activity] = await Promise.all([
    apiGetSummary(),
    apiGetRecentActivity(25),
  ]);

  // Step 6: update caches (null = failed to load; renders handle gracefully)
  summaryData    = summary;   // null if failed
  recentActivity = Array.isArray(activity?.records) ? activity.records : [];

  hideLoading();

  // Transition to dashboard (default state before URL-param restore)
  appState = 'dashboard';
  history.replaceState({ appState, selectedKey: null, entityViewTab: 'overview' }, '');
  render();

  // Restore entity + tab from URL query params on initial load so bookmarks
  // and page refreshes return to the correct view (T-E27-F09-012).
  const urlParams = new URLSearchParams(location.search);
  const urlEntity = urlParams.get('entity');
  const urlTab    = urlParams.get('tab');
  if (urlEntity) {
    // Navigate to the entity; then set the requested tab if valid.
    navigateToEntity(urlEntity);
    if (urlTab && TAB_DISPLAY_NAMES.hasOwnProperty(urlTab)) {
      entityViewTab = urlTab;
    }
    // Replace (not push) so the initial URL doesn't create a spurious history entry.
    const url = new URL(window.location.href);
    url.searchParams.set('entity', urlEntity);
    url.searchParams.set('tab', entityViewTab || 'overview');
    history.replaceState({ appState, selectedKey, entityViewTab }, '', url);
    render();
  }
}

function updateHeaderProjectName() {
  const btn = document.getElementById('header-dashboard-btn');
  if (!btn) return;
  if (projectName) {
    btn.textContent = projectName;
  } else {
    btn.textContent = 'Dashboard';
  }
}

let appState       = 'pick_folder';  // 'pick_folder' | 'dashboard' | 'entity_view' | 'doc_view'
let selectedKey    = null;           // currently selected entity/doc key
let treeData       = [];             // cached hierarchy epics array (hierarchy.epics)
let hierarchyData  = null;           // full cached /hierarchy response (includes bugs, change_cards, ideas)
let summaryData    = null;           // cached /summary response
let recentActivity = [];             // cached /recent-activity response
let workflowMeta   = null;           // cached /workflow-meta response
let showCompleted    = false;         // sidebar filter: show completed entities
let showAllFiles     = false;         // sidebar filter: show untracked folder files
let projectName      = '';            // project folder name for header
let expandedEpics    = new Set();    // epic keys currently expanded in sidebar
let expandedFeatures = new Set();    // feature keys currently expanded in sidebar

// ============================================================
// SECTION: State Machine — render() Dispatcher
// ============================================================

/**
 * Main render dispatcher. Reads appState and calls the
 * appropriate render function. Also updates body class
 * for CSS-driven show/hide of header/sidebar.
 */
function render() {
  const body = document.body;
  // Remove all state classes
  body.className = body.className.replace(/\bstate-\S+/g, '').trim();
  // Add current state class
  body.classList.add('state-' + appState);

  switch (appState) {
    case 'pick_folder':
      renderPickFolder();
      break;
    case 'dashboard':
      renderSidebar();
      renderDashboard();
      break;
    case 'entity_view':
      renderSidebar();
      renderEntityView();
      break;
    case 'doc_view':
      renderSidebar();
      renderDocView();
      break;
    default:
      renderPickFolder();
  }
}

/**
 * Saves the current navigation state to browser history so the back button works.
 * Call after every intentional navigation (entity select, doc open, dashboard).
 * Encodes entity key and tab into the URL as query params so bookmarks and
 * page refreshes restore the correct view (T-E27-F09-012).
 */
function pushNavState() {
  const state = { appState, selectedKey, entityViewTab };
  const url = new URL(window.location.href);
  if (appState === 'entity_view' && selectedKey) {
    url.searchParams.set('entity', selectedKey);
    url.searchParams.set('tab', entityViewTab || 'overview');
  } else {
    url.searchParams.delete('entity');
    url.searchParams.delete('tab');
  }
  history.pushState(state, '', url);
}

/**
 * Updates the current history entry in-place (no new back-button entry).
 * Use for tab switches within an entity view — the URL stays bookmarkable
 * but the back button is not polluted with per-tab clicks.
 */
function replaceNavState() {
  const state = { appState, selectedKey, entityViewTab };
  const url = new URL(window.location.href);
  if (appState === 'entity_view' && selectedKey) {
    url.searchParams.set('entity', selectedKey);
    url.searchParams.set('tab', entityViewTab || 'overview');
  } else {
    url.searchParams.delete('entity');
    url.searchParams.delete('tab');
  }
  history.replaceState(state, '', url);
}

/**
 * Restores app state from a history entry (called on popstate).
 */
function restoreNavState(state) {
  if (!state) return;
  appState      = state.appState      || 'dashboard';
  selectedKey   = state.selectedKey   || null;
  entityViewTab = state.entityViewTab || 'overview';
  render();
}
