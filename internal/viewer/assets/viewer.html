  const drawerPanel = document.getElementById('sprint-detail-panel');
  if (!mainPanel || !drawerPanel) return;

  const overviewPayload = sprintOverviewData || null;
  const planPayload = sprintPlanData || null;
  const reportPayload = sprintReportData || null;
  const activePayload = sprintViewTab === 'plan' ? planPayload : sprintViewTab === 'report' ? reportPayload : overviewPayload;
  if (sprintViewTab === 'overview') {
    if (overviewPayload) {
      mainPanel.innerHTML = renderSprintOverview(overviewPayload);
    } else {
      mainPanel.innerHTML = `<div class="content-placeholder">${sprintOverviewError ? escapeHtml(sprintOverviewError) : 'Loading sprint overview…'}</div>`;
    }
  } else if (sprintViewTab === 'plan') {
    if (planPayload) {
      mainPanel.innerHTML = renderSprintPlan(planPayload, sprintPlanFilters, overviewPayload);
    } else {
      mainPanel.innerHTML = `<div class="content-placeholder">${sprintPlanError ? escapeHtml(sprintPlanError) : 'Loading sprint plan…'}</div>`;
    }
  } else {
    if (reportPayload) {
      mainPanel.innerHTML = renderSprintReport(reportPayload);
    } else {
      mainPanel.innerHTML = `<div class="content-placeholder">${sprintReportError ? escapeHtml(sprintReportError) : 'Loading sprint report…'}</div>`;
    }
  }

  drawerPanel.innerHTML = renderSprintDetailDrawer(sprintSelectedKey, activePayload || overviewPayload);

  mainPanel.querySelectorAll('[data-sprint-item-key]').forEach(el => {
    const key = el.getAttribute('data-sprint-item-key');
    el.addEventListener('click', () => selectSprintItem(key));
    el.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        selectSprintItem(key);
      }
    });
  });

  if (sprintViewTab === 'plan') {
    const statusFilter = document.getElementById('sprint-plan-status-filter');
    const agentFilter = document.getElementById('sprint-plan-agent-filter');
    const assignmentFilter = document.getElementById('sprint-plan-assignment-filter');
    const clearFiltersBtn = document.getElementById('sprint-plan-clear-filters');
    if (statusFilter) {
      statusFilter.addEventListener('change', () => applySprintPlanFilters({
        status: statusFilter.value,
        agent: agentFilter ? agentFilter.value : sprintPlanFilters.agent,
        assignment: assignmentFilter ? assignmentFilter.value : sprintPlanFilters.assignment,
      }));
    }
    if (agentFilter) {
      agentFilter.addEventListener('change', () => applySprintPlanFilters({
        status: statusFilter ? statusFilter.value : sprintPlanFilters.status,
        agent: agentFilter.value,
        assignment: assignmentFilter ? assignmentFilter.value : sprintPlanFilters.assignment,
      }));
    }
    if (assignmentFilter) {
      assignmentFilter.addEventListener('change', () => applySprintPlanFilters({
        status: statusFilter ? statusFilter.value : sprintPlanFilters.status,
        agent: agentFilter ? agentFilter.value : sprintPlanFilters.agent,
        assignment: assignmentFilter.value,
      }));
    }
    if (clearFiltersBtn) {
      clearFiltersBtn.addEventListener('click', () => applySprintPlanFilters({ status: '', agent: '', assignment: '' }));
    }

    mainPanel.querySelectorAll('[data-sprint-plan-select-key]').forEach(input => {
      input.addEventListener('change', () => toggleSprintPlanSelection(input.getAttribute('data-sprint-plan-select-key')));
    });

    mainPanel.querySelectorAll('[data-sprint-plan-key]').forEach(row => {
      row.addEventListener('click', () => {
        const key = row.getAttribute('data-sprint-plan-key');
        if (key) selectSprintItem(key);
      });
    });

    const stageBtn = document.getElementById('sprint-plan-stage-btn');
    const removeBtn = document.getElementById('sprint-plan-remove-btn');
    const readyBtn = document.getElementById('sprint-plan-ready-btn');
    const explicitAction = (label) => showToast(`${label} is explicit in Sprint Plan but not wired to a mutation path yet.`);
    if (stageBtn) stageBtn.addEventListener('click', () => explicitAction('Stage selected'));
    if (removeBtn) removeBtn.addEventListener('click', () => explicitAction('Remove selected'));
    if (readyBtn) readyBtn.addEventListener('click', () => explicitAction('Mark ready'));
  }

  const specModalClose = document.getElementById('spec-modal-close');
  if (specModalClose) specModalClose.addEventListener('click', closeSpecModal);
  const specModal = document.getElementById('spec-modal');
  if (specModal) specModal.addEventListener('click', e => { if (e.target === specModal) closeSpecModal(); });

  const specBtn = document.getElementById('sprint-spec-btn');
  if (specBtn && sprintSelectedKey) {
    specBtn.addEventListener('click', () => openSpecModal(sprintSelectedKey));
  }

  const openEntityBtn = document.getElementById('sprint-open-entity-btn');
  if (openEntityBtn && sprintSelectedKey) {
    openEntityBtn.addEventListener('click', () => {
      cameFromSprint = true;
      navigateToEntity(sprintSelectedKey, true);
    });
  }

  if (sprintSelectedKey) {
    loadSprintDetailDrawer(sprintSelectedKey);
  }
}

function renderSprintMode() {
  const content = document.getElementById('content');
  if (!content) return;

  const currentMainPlaceholder = sprintViewTab === 'plan'
    ? (sprintPlanLoading && !sprintPlanData ? 'Loading sprint plan…' : sprintPlanError || '')
    : sprintViewTab === 'report'
      ? (sprintReportLoading && !sprintReportData ? 'Loading sprint report…' : sprintReportError || '')
      : (sprintOverviewLoading && !sprintOverviewData ? 'Loading sprint overview…' : sprintOverviewError || '');

  content.innerHTML = `
    <div class="sprint-mode-shell">
      ${renderSprintModeControls()}
      <div class="sprint-shell">
        <div class="sprint-main-column">
          <div id="sprint-main-panel">
            ${currentMainPlaceholder ? `<div class="content-placeholder">${escapeHtml(currentMainPlaceholder)}</div>` : ''}
          </div>
        </div>
        <div class="sprint-detail-column">
          <div id="sprint-detail-panel">
            ${renderSprintDetailDrawer(sprintSelectedKey, sprintViewTab === 'plan' ? sprintPlanData || sprintOverviewData : sprintViewTab === 'report' ? sprintReportData || sprintOverviewData : sprintOverviewData)}
          </div>
        </div>
      </div>
    </div>`;

  const overviewTabBtn = document.getElementById('sprint-tab-overview');
  const planTabBtn = document.getElementById('sprint-tab-plan');
  const reportTabBtn = document.getElementById('sprint-tab-report');
  if (overviewTabBtn) overviewTabBtn.addEventListener('click', () => {
    if (sprintViewTab !== 'overview') {
      sprintViewTab = 'overview';
      pushNavState();
      renderSprintMode();
    }
  });
  if (planTabBtn) planTabBtn.addEventListener('click', () => {
    if (sprintViewTab !== 'plan') {
      sprintViewTab = 'plan';
      pushNavState();
      renderSprintMode();
    }
  });
  if (reportTabBtn) reportTabBtn.addEventListener('click', () => {
    if (sprintViewTab !== 'report') {
      sprintViewTab = 'report';
      pushNavState();
      renderSprintMode();
    }
  });

  renderSprintModePanels();

  if (sprintViewTab === 'overview') {
    if (!sprintOverviewLoaded && !sprintOverviewLoading) {
      ensureSprintOverviewLoaded();
    }
  } else if (sprintViewTab === 'plan') {
    if (!sprintPlanLoaded && !sprintPlanLoading) {
      ensureSprintPlanLoaded();
    }
  } else if (sprintViewTab === 'report') {
    if (!sprintReportLoaded && !sprintReportLoading) {
      ensureSprintReportLoaded();
    }
  }
}

function selectSprintItem(key) {
  if (!key) return;
  sprintSelectedKey = key;
  selectedKey = key;
  cameFromSprint = false;
  if (appState !== 'sprint') {
    appState = 'sprint';
  }
  replaceNavState();
  renderSprintModePanels();
}

/**
 * Renders the Entity View (State 3).
 * Shows entity properties panel, Info/Transitions toggle, and content pane.
 */
function renderEntityView() {
  const content = document.getElementById('content');

  const entity = findEntityByKey(selectedKey);
  const isEpic = entity?.type === 'epic';
  const isSimpleEntity = entity && (entity.type === 'bug' || entity.type === 'change_card' || entity.type === 'tech_debt' || entity.type === 'idea' || entity.type === 'question');

  // Guard: if history state restored 'dashboard' for a non-epic, coerce to 'overview' (AC-001.5)
  if (entityViewTab === 'dashboard' && !isEpic) {
    entityViewTab = 'overview';
  }
  // Guard: bug/change-card/tech-debt/idea do not support 'overview' pane — coerce to 'info'
  if (entityViewTab === 'overview' && isSimpleEntity) {
    entityViewTab = 'info';
  }

  // Build header and toggle bar
  const title = entity ? escapeHtml(entity.title || entity.key || selectedKey) : escapeHtml(selectedKey || '');
  const keyLabel = escapeHtml(selectedKey || '');

  const overviewActive = entityViewTab === 'overview'    ? ' active' : '';
  const dashActive     = entityViewTab === 'dashboard'   ? ' active' : '';
  const infoActive     = entityViewTab === 'info'        ? ' active' : '';
  const transActive    = entityViewTab === 'transitions' ? ' active' : '';
  const filesActive    = entityViewTab === 'files'       ? ' active' : '';

  // Overview button: shown for epic/feature/task, not for bug/change-card/tech-debt/idea (AC-001.2, AC-001.3)
  const overviewBtnHtml = !isSimpleEntity
    ? `<button class="toggle-btn${overviewActive}" id="ev-tab-overview">Overview</button>`
    : '';

  // Dashboard button is only rendered for epics (AC-001.2, AC-001.3)
  const dashBtnHtml = isEpic
    ? `<button class="toggle-btn${dashActive}" id="ev-tab-dashboard">Dashboard</button>`
    : '';

  const entityDir = entity ? (entity.file_path || entity.linked_content_path || '') : '';
  const filesDirPath = entityDir ? parentDir(entityDir) : '';
  const filesBtnHtml = filesDirPath ? `<button class="toggle-btn${filesActive}" id="ev-tab-files">Files</button>` : '';

  // Tag chips: render only when entity has tags (AC-11, REQ-F-016, AC-T2)
  const tagChipsHtml = entity ? (renderTagChipsHtml(entity) || '') : '';

  // Edit button is now inside the Spec pane (renderMarkdownPane), NOT in the toggle bar (AC-002.1)
  const html = `
    ${entity ? renderBreadcrumb(entity) : ''}
    <div class="entity-view-header">
      <div class="entity-view-title">${title}</div>
      <div class="entity-view-key-row">
        <div class="entity-view-key">${keyLabel}</div>
        ${entity ? `<button class="copy-btn copy-key-btn" data-copy-value="${escapeHtml(entity.key || keyLabel)}" title="Copy key">⎘</button>` : ''}
      </div>
      ${cameFromSprint ? `<button class="content-back-link" id="ev-back-to-sprint">Back to Sprint</button>` : ''}
      ${tagChipsHtml}
    </div>
    ${entity ? renderPropertiesPanel(entity) : ''}
    ${entity ? renderMutationControls(entity) : ''}
    <div class="toggle-bar">
      ${overviewBtnHtml}
      <button class="toggle-btn${infoActive}"  id="ev-tab-info">Spec</button>
      <button class="toggle-btn${transActive}" id="ev-tab-transitions">History</button>
      ${dashBtnHtml}
      ${filesBtnHtml}
    </div>
    <div id="ev-content-pane"></div>
  `;

  content.innerHTML = html;

  wireMutationControls(entity);

  // Wire breadcrumb segment clicks → navigateToEntity
  content.querySelectorAll('.breadcrumb-seg[data-navigate-key]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.getAttribute('data-navigate-key');
      if (k) navigateToEntity(k);
    });
  });

  // Wire Overview tab button (epic/feature/task only)
  const overviewTabBtn = document.getElementById('ev-tab-overview');
  if (overviewTabBtn) {
    overviewTabBtn.addEventListener('click', () => {
      if (entityViewTab !== 'overview') { entityViewTab = 'overview'; pushNavState(); renderEntityView(); }
    });
  }

  // Wire Dashboard tab button (epics only)
  const dashTabBtn = document.getElementById('ev-tab-dashboard');
  if (dashTabBtn) {
    dashTabBtn.addEventListener('click', () => {
      if (entityViewTab !== 'dashboard') { entityViewTab = 'dashboard'; pushNavState(); renderEntityView(); }
    });
  }

  // Wire toggle buttons
  document.getElementById('ev-tab-info').addEventListener('click', () => {
    if (entityViewTab !== 'info') { entityViewTab = 'info'; pushNavState(); renderEntityView(); }
  });
  document.getElementById('ev-tab-transitions').addEventListener('click', () => {
    if (entityViewTab !== 'transitions') { entityViewTab = 'transitions'; pushNavState(); renderEntityView(); }
  });
  const filesTabBtn = document.getElementById('ev-tab-files');
  if (filesTabBtn) {
    filesTabBtn.addEventListener('click', () => {
      if (entityViewTab !== 'files') { entityViewTab = 'files'; pushNavState(); renderEntityView(); }
    });
  }
  const backToSprintBtn = document.getElementById('ev-back-to-sprint');
  if (backToSprintBtn) {
    backToSprintBtn.addEventListener('click', () => {
      cameFromSprint = false;
      switchTopLevelMode('sprint', { pushState: false });
    });
  }

  const paneEl = document.getElementById('ev-content-pane');

  if (entityViewTab === 'overview') {
    // Overview pane — dispatcher for epic/feature/task (AC-T3)
    renderOverviewPane(entity, paneEl);
  } else if (entityViewTab === 'dashboard' && isEpic) {
    renderEpicDashboardPane(entity.key, paneEl);
  } else if (entityViewTab === 'info') {
    // Async: fetch and render markdown content (Edit toggle now rendered inside pane — AC-002.2)
    renderMarkdownPane(selectedKey, paneEl);
  } else if (entityViewTab === 'files') {
    renderFolderFilesPane(filesDirPath, paneEl);
  } else {
    // Transitions view
    paneEl.innerHTML = `<div class="history-drawer"><div class="content-placeholder">Loading transition history\u2026</div></div>`;
    apiGetHistory(selectedKey).then(historyResp => {
      // API returns {entity_type, entity_key, records: [...]}
      const history = historyResp?.records;
      if (!Array.isArray(history) || history.length === 0) {
        paneEl.innerHTML = `<div class="history-drawer"><div class="content-placeholder">No transition history found.</div></div>`;
        return;
      }
      // Sort reverse-chronological (most recent first)
      // History records use 'changed_at' (EntityHistory model field)
      const sorted = [...history].sort((a, b) => {
        const ta = a.changed_at || a.created_at || a.timestamp || '';
        const tb = b.changed_at || b.created_at || b.timestamp || '';
        return tb.localeCompare(ta);
      });
      let rows = '';
      for (let i = 0; i < sorted.length; i++) {
        const entry = sorted[i];
        const date     = escapeHtml(formatDateTime(entry.changed_at || entry.created_at || entry.timestamp || ''));
        const from     = entry.from_status || entry.from || '';
        const to       = entry.to_status   || entry.to   || '';
        const note     = escapeHtml(entry.note || entry.reason || '');
        const fromC = getStatusColor(from);
        const fromBadge = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(fromC)};color:${getContrastColor(fromC)}">${escapeHtml(from.replace(/_/g,' '))}</span>`;
        const toC   = getStatusColor(to);
        const toBadge   = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(toC)};color:${getContrastColor(toC)}">${escapeHtml(to.replace(/_/g,' '))}</span>`;
        // Duration: time the entity spent in from_status before this transition.
        // sorted is newest-first, so sorted[i+1] is the prior transition.
        // For the oldest entry, fall back to entity.created_at.
        let duration = '—';
        const tThis = new Date(entry.changed_at || entry.created_at || entry.timestamp || '');
        const prevTs = i + 1 < sorted.length
          ? (sorted[i + 1].changed_at || sorted[i + 1].created_at || sorted[i + 1].timestamp || '')
          : (entity?.created_at || '');
        if (prevTs) {
          const tPrev = new Date(prevTs);
          if (!isNaN(tThis) && !isNaN(tPrev) && tThis >= tPrev) {
            duration = formatDuration(tThis - tPrev);
          }
        }
        const durationCell = duration === '—' ? '—' : `for ${duration}`;
        rows += `<tr>
          <td class="history-date">${date}</td>
          <td class="history-badge-cell">${fromBadge}</td>
          <td class="history-duration">${durationCell}</td>
          <td class="history-arrow-cell">\u2192</td>
          <td class="history-badge-cell">${toBadge}</td>
          <td class="activity-note">${note}</td>
        </tr>`;
      }
      paneEl.innerHTML = `
        <div class="history-drawer">
          <table class="history-table">
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    });
  }
}

/**
 * Renders the Doc View (State 4).
 * Plain markdown rendering — no properties panel, no Info/Transitions toggle.
 * Reuses renderMarkdownPane() for content rendering.
 */
function renderDocView() {
  const content = document.getElementById('content');

  const docKey = selectedKey || '';

  if (docKey.startsWith(FOLDER_KEY_PREFIX)) {
    const dirPath = docKey.slice(FOLDER_KEY_PREFIX.length);
    content.innerHTML = `
      <button class="content-back-link" id="doc-back-btn">← Back</button>
      <div class="entity-view-header">
        <div class="entity-view-title ev-title">${escapeHtml(dirPath || 'Folder')}</div>
      </div>
      <div id="doc-content-pane" class="ev-content-pane" style="margin-top:8px"></div>`;
    document.getElementById('doc-back-btn').addEventListener('click', () => history.back());
    renderFolderFilesPane(dirPath, document.getElementById('doc-content-pane'));
    return;
  }

  // Find doc metadata from treeData (docs are nested under epics/features)
  let docMeta = null;
  let parentKey = '';
  if (Array.isArray(treeData)) {
    outer:
    for (const epic of treeData) {
      const epicDocs = Array.isArray(epic.docs) ? epic.docs : [];
      for (const doc of epicDocs) {
        const k = doc.key || doc.path || doc.title || '';
        if (k === docKey) { docMeta = doc; parentKey = epic.key || ''; break outer; }
      }
      const features = Array.isArray(epic.features) ? epic.features : [];
      for (const feature of features) {
        const fDocs = Array.isArray(feature.docs) ? feature.docs : [];
        for (const doc of fDocs) {
          const k = doc.key || doc.path || doc.title || '';
          if (k === docKey) { docMeta = doc; parentKey = feature.key || epic.key || ''; break outer; }
        }
      }
    }
  }

  // Title: use docMeta title if available; otherwise just the filename (basename of path)
  const rawPath = docMeta ? (docMeta.path || docKey) : docKey;
  const baseName = rawPath.split('/').pop() || rawPath;
  const docTitle = docMeta ? escapeHtml(docMeta.title || baseName) : escapeHtml(baseName);

  // Path subtitle — always the full relative path with a copy button
  const pathCopyBtn = `<button class="copy-btn" data-copy-value="${escapeHtml(rawPath)}" title="Copy path">⎘</button>`;
  const pathSubtitle = `<span style="word-break:break-all;color:var(--fg-dim);font-size:12px;font-family:'SF Mono',monospace">${escapeHtml(rawPath)}</span>${pathCopyBtn}`;

  // Parent row — only shown when there's a real parent key
  const parentRowHtml = parentKey
    ? `<div class="props-grid" style="margin-bottom:0"><span class="props-label">Parent</span><span class="props-value"><span class="mono">${escapeHtml(parentKey)}</span></span></div>`
    : '';

  content.innerHTML = `
    <button class="content-back-link" id="doc-back-btn">← Back</button>
    <div class="entity-view-header" style="display:flex;align-items:flex-start;justify-content:space-between">
      <div>
        <div class="entity-view-title ev-title">${docTitle}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:2px">${pathSubtitle}</div>
      </div>
      <button class="toggle-btn ev-edit-btn" id="ev-edit-btn" disabled title="Edit file" style="margin-left:12px;flex-shrink:0;align-self:center">✎ Edit</button>
    </div>
    ${parentRowHtml}
    <div id="doc-content-pane" class="ev-content-pane" style="margin-top:${parentKey ? '16px' : '8px'}"></div>`;
  document.getElementById('doc-back-btn').addEventListener('click', () => history.back());

  // Async render markdown content
  const pane = document.getElementById('doc-content-pane');

  // Wire edit button after DOM is ready
  const docEditBtn = document.getElementById('ev-edit-btn');
  if (docEditBtn) {
    docEditBtn.addEventListener('click', () => {
      enterEditMode(pane.querySelector('#spec-body') || pane);
    });
  }

  renderMarkdownPane(docKey, pane).then((response) => {
    if (!docEditBtn) return;
    const canEditDocFile = !!(response && response.exists && response.path);
    docEditBtn.disabled = !canEditDocFile;
    docEditBtn.title = canEditDocFile ? 'Edit file' : 'This file cannot be edited';
  });
}

/**
 * Scrolls the sidebar to make the node with the given key visible.
 * Called programmatically when selectedKey is set externally.
 * @param {string} key - entity key matching a data-key attribute in the sidebar
 */
function scrollSidebarToKey(key) {
  if (!key) return;
  const node = document.querySelector(`#sidebar-content [data-key="${CSS.escape(key)}"]`);
  if (node) {
    node.scrollIntoView({ block: 'nearest' });
  }
}

/**
 * Builds an HTML string for a status dot circle.
 * @param {string} status
 * @returns {string} HTML string
 */
function buildStatusDotHtml(status) {
  const color = getStatusColor(status || 'todo');
  return `<span class="status-dot" style="background:${escapeHtml(color)}" title="${escapeHtml(status || '')}"></span>`;
}

/**
 * Builds an HTML string for an arrow button (expandable) or a spacer (non-expandable).
 * @param {boolean} expandable
 * @param {boolean} expanded
 * @param {string} key - used as data attribute for event delegation
 * @returns {string} HTML string
 */
function buildArrowHtml(expandable, expanded, key) {
  if (!expandable) {
    return `<span class="tree-arrow-spacer"></span>`;
  }
  const symbol = expanded ? '▼' : '▶';
  return `<span class="tree-arrow" data-arrow-key="${escapeHtml(key)}">${symbol}</span>`;
}

function clampSidebarWidth(width) {
  const numeric = parseInt(width, 10);
  if (!Number.isFinite(numeric)) return SIDEBAR_WIDTH_DEFAULT;
  return Math.min(SIDEBAR_WIDTH_MAX, Math.max(SIDEBAR_WIDTH_MIN, Math.round(numeric)));
}

function getStoredSidebarWidth() {
  try {
    const raw = localStorage.getItem(SIDEBAR_WIDTH_STORAGE_KEY);
    if (!raw) return SIDEBAR_WIDTH_DEFAULT;
    return clampSidebarWidth(raw);
  } catch (e) {
    return SIDEBAR_WIDTH_DEFAULT;
  }
}

function applySidebarWidth(width, persist) {
  const nextWidth = clampSidebarWidth(width);
  document.documentElement.style.setProperty('--sidebar-width', `${nextWidth}px`);
  const resizer = document.getElementById('sidebar-resizer');
  if (resizer) {
    resizer.setAttribute('aria-valuemin', String(SIDEBAR_WIDTH_MIN));
    resizer.setAttribute('aria-valuemax', String(SIDEBAR_WIDTH_MAX));
    resizer.setAttribute('aria-valuenow', String(nextWidth));
  }
  if (persist) {
    try {
      localStorage.setItem(SIDEBAR_WIDTH_STORAGE_KEY, String(nextWidth));
    } catch (e) {}
  }
  return nextWidth;
}

function toggleTreeNodeExpansion(nodeEl, key) {
  if (!nodeEl || !key) return false;
  if (nodeEl.classList.contains('tree-node-epic')) {
    if (expandedEpics.has(key)) {
      expandedEpics.delete(key);
    } else {
      expandedEpics.add(key);
    }
    return true;
  }
  if (nodeEl.classList.contains('tree-node-feature')) {
    if (expandedFeatures.has(key)) {
      expandedFeatures.delete(key);
    } else {
      expandedFeatures.add(key);
    }
    return true;
  }
  return false;
}

function initSidebarResizer() {
  const resizer = document.getElementById('sidebar-resizer');
  if (!resizer) return;

  applySidebarWidth(getStoredSidebarWidth(), false);

  resizer.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX;
    const startWidth = clampSidebarWidth(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'));
    document.body.classList.add('is-resizing-sidebar');

    if (typeof resizer.setPointerCapture === 'function') {
      try { resizer.setPointerCapture(e.pointerId); } catch (err) {}
    }

    const handlePointerMove = moveEvent => {
      const delta = moveEvent.clientX - startX;
      applySidebarWidth(startWidth + delta, false);
    };

    const finishResize = finishEvent => {
      document.body.classList.remove('is-resizing-sidebar');
      applySidebarWidth(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'), 10), true);
      if (typeof resizer.releasePointerCapture === 'function') {
        try { resizer.releasePointerCapture(finishEvent.pointerId); } catch (err) {}
      }
      resizer.removeEventListener('pointermove', handlePointerMove);
      resizer.removeEventListener('pointerup', finishResize);
      resizer.removeEventListener('pointercancel', finishResize);
    };

    resizer.addEventListener('pointermove', handlePointerMove);
    resizer.addEventListener('pointerup', finishResize);
    resizer.addEventListener('pointercancel', finishResize);
  });
}

/**
 * Builds an HTML string for a single tree node row.
 * @param {Object} opts
 * @param {string} opts.key
 * @param {string} opts.title
 * @param {string} opts.status
 * @param {string} opts.nodeClass - CSS class for indentation level (e.g. 'tree-node-epic')
 * @param {boolean} opts.expandable
 * @param {boolean} opts.expanded
 * @param {boolean} opts.bold - if true wraps key in <strong>
 * @returns {string} HTML string
 */
function buildNodeHtml({ key, title, status, nodeClass, expandable, expanded, bold, size }) {
  const isSelected = key === selectedKey;
  const selectedClass = isSelected ? ' selected' : '';
  // Cancelled takes priority over completed (AC-001.4): check isCancelledStatus first.
  const statusClass = isCancelledStatus(status) ? ' entity-cancelled'
    : (status || '') === 'completed' ? ' entity-completed'
    : '';
  const arrowHtml = buildArrowHtml(expandable, expanded, key);
  const dotHtml = buildStatusDotHtml(status);
  const keyLabel = bold
    ? `<strong class="tree-node-key">${escapeHtml(key)}</strong>`
    : `<span class="tree-node-key">${escapeHtml(key)}</span>`;
  const titleHtml = `<span class="tree-node-title">${escapeHtml(title || '')}</span>`;
  const sizeHtml = buildSizeBadgeHtml(size); // E27-F11: size badge (empty string when absent)
  return `<div class="tree-node ${escapeHtml(nodeClass)}${selectedClass}${statusClass}" data-key="${escapeHtml(key)}" data-select-key="${escapeHtml(key)}">${arrowHtml}${dotHtml}<span class="tree-node-label">${keyLabel}${titleHtml}${sizeHtml}</span></div>`;
}

/**
 * Builds an HTML string for a task node.
 * @param {Object} task - task object from hierarchy
 * @returns {string} HTML string
 */
function buildTaskNodeHtml(task) {
  return buildNodeHtml({
    key: task.key || '',
    title: task.title || '',
    status: task.status || 'todo',
    nodeClass: 'tree-node-task',
    expandable: false,
    expanded: false,
    bold: false,
    size: task.size,  // E27-F11: pass size for badge
  });
}

/**
 * Builds an HTML string for a doc node.
 * @param {Object} doc - doc object (has .title and optionally .key or .path)
 * @param {'epic'|'feature'} level
 * @returns {string} HTML string
 */
function buildDocNodeHtml(doc, level) {
  const key = doc.key || doc.path || doc.title || '';
  // Show only the filename portion of path-like keys (e.g. "docs/plan/E27/foo.md" → "foo.md")
  const displayKey = key.includes('/') ? key.split('/').pop() : key;
  const nodeClass = level === 'epic' ? 'tree-node-doc-epic' : 'tree-node-doc-feature';
  return `<div class="tree-node ${nodeClass}" data-key="${escapeHtml(key)}" data-select-key="${escapeHtml(key)}"><span class="tree-arrow-spacer"></span>${buildStatusDotHtml(doc.status || '')}<span class="tree-node-label"><span class="tree-node-key">${escapeHtml(displayKey)}</span><span class="tree-node-title">${escapeHtml(doc.title || '')}</span></span></div>`;
}

/**
 * Builds an HTML string for a feature node and its children (tasks + docs) when expanded.
 * @param {Object} feature - feature object from hierarchy
 * @param {string} epicKey
 * @returns {string} HTML string
 */
function buildFeatureNodeHtml(feature, epicKey) {
  const featureKey = feature.key || '';
  const isExpanded = expandedFeatures.has(featureKey);
  let html = buildNodeHtml({
    key: featureKey,
    title: feature.title || '',
    status: feature.status || 'todo',
    nodeClass: 'tree-node-feature',
    expandable: true,
    expanded: isExpanded,
    bold: false,
    size: feature.size,  // E27-F11: pass size for badge
  });

  if (isExpanded) {
    // Render tasks
    const tasks = Array.isArray(feature.tasks) ? feature.tasks : [];
    for (const task of tasks) {
      if (!showCompleted && isHiddenTerminalStatus(task.status, 'task')) continue;
      html += buildTaskNodeHtml(task);
    }
    // Render feature-level docs
    const docs = Array.isArray(feature.docs) ? feature.docs : [];
    for (const doc of docs) {
      html += buildDocNodeHtml(doc, 'feature');
    }
    // Render folder files link when showAllFiles is enabled
    if (showAllFiles && feature.file_path) {
      const featureDir = parentDir(feature.file_path);
      const folderKey = FOLDER_KEY_PREFIX + featureDir;
      html += `<div class="tree-node tree-node-flat tree-node-folder" data-select-key="${escapeHtml(folderKey)}" data-folder-path="${escapeHtml(featureDir)}"><span class="tree-arrow-spacer"></span><span class="tree-node-folder-icon">📂</span><span class="tree-node-title" style="color:var(--fg-dim);font-style:italic">Folder files</span></div>`;
    }
  }

  return html;
}

/**
 * Builds an HTML string for an epic node and its children (features + docs).
 * Features start collapsed; epics start expanded.
 * @param {Object} epic - epic object from treeData hierarchy
 * @returns {string} HTML string
 */
function buildEpicNodeHtml(epic) {
  const epicKey = epic.key || '';
  const isExpanded = expandedEpics.has(epicKey);
  let html = buildNodeHtml({
    key: epicKey,
    title: epic.title || '',
    status: epic.status || 'todo',
    nodeClass: 'tree-node-epic',
    expandable: true,
    expanded: isExpanded,
    bold: true,
    size: epic.size,  // E27-F11: pass size for badge
  });

  if (isExpanded) {
    // Render features
    const features = Array.isArray(epic.features) ? epic.features : [];
    for (const feature of features) {
      if (!showCompleted && isHiddenTerminalStatus(feature.status, 'feature')) continue;
      html += buildFeatureNodeHtml(feature, epicKey);
    }
    // Render epic-level docs
    const docs = Array.isArray(epic.docs) ? epic.docs : [];
    for (const doc of docs) {
      html += buildDocNodeHtml(doc, 'epic');
    }
    // Render folder files link when showAllFiles is enabled
    if (showAllFiles && epic.file_path) {
      const epicDir = parentDir(epic.file_path);
      const folderKey = FOLDER_KEY_PREFIX + epicDir;
      html += `<div class="tree-node tree-node-flat tree-node-folder" data-select-key="${escapeHtml(folderKey)}" data-folder-path="${escapeHtml(epicDir)}"><span class="tree-arrow-spacer"></span><span class="tree-node-folder-icon">📂</span><span class="tree-node-title" style="color:var(--fg-dim);font-style:italic">Folder files</span></div>`;
    }
  }

  return html;
}

/**
 * Builds the inner HTML for a flat sidebar section.
 * Only called when items is a non-empty array.
 * @param {Array} items - array of items with .key/.title/.status
 * @param {string} entityType
 * @returns {string} HTML string
 */
function buildFlatSectionBodyHtml(items, entityType) {
  if (!Array.isArray(items) || items.length === 0) return '';
  const filtered = showCompleted ? items : items.filter(i => !isHiddenTerminalStatus(i.status, entityType));
  if (filtered.length === 0) return '';
  let html = '';
  for (const item of filtered) {
    const key = item.key || String(item.id || '');
    const isSelected = key === selectedKey;
    const selectedClass = isSelected ? ' selected' : '';
    // Cancelled takes priority over completed (AC-001.4): check isCancelledStatus first.
    const statusClass = isCancelledStatus(item.status) ? ' entity-cancelled'
      : (item.status || '') === 'completed' ? ' entity-completed'
      : '';
    html += `<div class="tree-node tree-node-flat${selectedClass}${statusClass}" data-key="${escapeHtml(key)}" data-select-key="${escapeHtml(key)}"><span class="tree-arrow-spacer"></span>${buildStatusDotHtml(item.status || '')}<span class="tree-node-label"><span class="tree-node-key">${escapeHtml(key)}</span><span class="tree-node-title">${escapeHtml(item.title || '')}</span>${buildSizeBadgeHtml(item.size)}</span></div>`; // E27-F11: size badge
  }
  return html;
}

function buildFlatSectionHtml(title, items, entityType) {
  return buildFlatSectionBodyHtml(items, entityType);
}

function buildDocsBrowserBodyHtml() {
  const folderKey = FOLDER_KEY_PREFIX + 'docs';
  return `<div class="tree-node tree-node-flat tree-node-folder" data-select-key="${escapeHtml(folderKey)}" data-folder-path="docs"><span class="tree-arrow-spacer"></span><span class="tree-node-folder-icon">📂</span><span class="tree-node-title" style="color:var(--fg-dim);font-style:italic">Browse docs/</span></div>`;
}

function renderSidebarSection(sectionId, title, bodyHtml, options = {}) {
  if (!bodyHtml && !options.keepEmpty) return '';
  const expanded = isSidebarSectionExpanded(sectionId);
  const label = escapeHtml(title);
  const buttonTitle = expanded ? `Collapse ${title}` : `Expand ${title}`;
  const buttonLabel = expanded ? '−' : '+';
  const bodyClass = options.bodyClass ? ` ${options.bodyClass}` : '';
  return `
    <div class="sidebar-section${expanded ? '' : ' is-collapsed'}" data-sidebar-section="${escapeHtml(sectionId)}">
      <div class="sidebar-section-header">
        <span class="sidebar-section-title">${label}</span>
        <button class="sidebar-collapse-btn" type="button" data-sidebar-section-toggle="${escapeHtml(sectionId)}" aria-expanded="${expanded ? 'true' : 'false'}" title="${escapeHtml(buttonTitle)}">${buttonLabel}</button>
      </div>
      <div class="sidebar-section-body${bodyClass}">${bodyHtml}</div>
    </div>`;
}

/**
 * Renders the sidebar tree navigator. Populates #sidebar-content
 * and wires up expand/collapse and click-to-select via event delegation.
 *
 * Structure:
 * - Tags section
 * - Docs browser entry
 * - Epics section (Epic nodes → Feature nodes → Task nodes)
 * - Epic-level and feature-level doc nodes (italic, muted)
 * - Flat sections (Bugs, Change Cards, Tech Debt, Ideas) — only if items exist
 */
function renderSidebar() {
  const sidebarContent = document.getElementById('sidebar-content');
  if (!sidebarContent) return;

  let html = '';
  const allSectionsExpanded = areAllSidebarSectionsExpanded();
  const toggleAllTitle = allSectionsExpanded ? 'Collapse all sections' : 'Expand all sections';
  const toggleAllLabel = allSectionsExpanded ? '−' : '+';

  // ── Filter bar ──
  html += `<div class="sidebar-filter-bar">
    <div class="sidebar-filter-main">
      <span class="sidebar-filter-label">show all
        <label class="sidebar-filter-inline"><input type="checkbox" id="show-completed-checkbox"${showCompleted ? ' checked' : ''}> items</label>
        <label class="sidebar-filter-inline"><input type="checkbox" id="show-all-files-checkbox"${showAllFiles ? ' checked' : ''}> files</label>
      </span>
    </div>
    <div class="sidebar-filter-actions">
      <button class="sidebar-collapse-btn" id="collapse-all-btn" type="button" title="Collapse all epics and features" aria-label="Collapse all epics and features">↑</button>
      <button class="sidebar-collapse-btn sidebar-filter-toggle-all" id="sidebar-toggle-all-btn" type="button" aria-label="${escapeHtml(toggleAllTitle)}" title="${escapeHtml(toggleAllTitle)}">${escapeHtml(toggleAllLabel)}</button>
    </div>
  </div>`;

  // ── Sprint section (Sprint mode only) ──
  if (appState === 'sprint') {
    html += renderSprintTree(sprintOverviewData || sprintPlanData || sprintReportData || null);
  }

  // ── Tags section ──
  html += renderSidebarSection('tags', 'Tags', buildTagFilterControlHtml(), { keepEmpty: true });

  // ── Epics section ──
  let epicBodyHtml = '';
  for (const epic of treeData) {
    if (!showCompleted && isHiddenTerminalStatus(epic.status, 'epic')) continue;
    epicBodyHtml += buildEpicNodeHtml(epic);
  }
  html += renderSidebarSection('epics', 'Epics', epicBodyHtml, { keepEmpty: true });

  // ── Flat sections — only render when data is present ──
  const bugs = Array.isArray(hierarchyData?.bugs) ? hierarchyData.bugs : [];
  html += renderSidebarSection('bugs', 'Bugs', buildFlatSectionBodyHtml(bugs, 'bug'));

  const changeCards = Array.isArray(hierarchyData?.change_cards) ? hierarchyData.change_cards : [];
  html += renderSidebarSection('change_cards', 'Change Cards', buildFlatSectionBodyHtml(changeCards, 'change_card'));

  const techDebts = Array.isArray(hierarchyData?.tech_debts) ? hierarchyData.tech_debts : [];
  html += renderSidebarSection('tech_debt', 'Tech Debt', buildFlatSectionBodyHtml(techDebts, 'tech_debt'));

  const ideas = Array.isArray(hierarchyData?.ideas) ? hierarchyData.ideas : [];
  html += renderSidebarSection('ideas', 'Ideas', buildFlatSectionHtml('Ideas', ideas, 'idea'));

  const questions = Array.isArray(hierarchyData?.questions) ? hierarchyData.questions : [];
  html += renderSidebarSection('questions', 'Questions', buildFlatSectionBodyHtml(questions, 'question'));

  // ── Docs browser ──
  html += renderSidebarSection('docs', 'Docs', buildDocsBrowserBodyHtml(), { keepEmpty: true });

  sidebarContent.innerHTML = html;

  // Wire show-completed checkbox
  const showCompletedCb = document.getElementById('show-completed-checkbox');
  if (showCompletedCb) {
    showCompletedCb.onchange = async function() {
      showCompleted = this.checked;
      try { localStorage.setItem('shark.viewer.showAllItems', String(this.checked)); } catch (e) {}
      // Refetch hierarchy so terminal-status bugs/change cards/tech debt are
      // included/excluded server-side (mirrors `bug list --all`).
      // Tree entities (epics/features/tasks) continue to be filtered
      // client-side via isHiddenTerminalStatus + showCompleted.
      const tagsArg = activeTagFilter.size > 0 ? Array.from(activeTagFilter) : undefined;
      try {
        const hierarchy = await apiGetHierarchy(tagsArg, showCompleted);
        hierarchyData = hierarchy;
        treeData = Array.isArray(hierarchy?.epics) ? hierarchy.epics : [];
      } catch (err) {
        showToast('Failed to refresh hierarchy', 'error');
      }
      renderSidebar();
      // If the dashboard is in view, re-render it too so flat sections refresh.
      if (typeof render === 'function') render();
    };
  }
  const showAllFilesCb = document.getElementById('show-all-files-checkbox');
  if (showAllFilesCb) {
    showAllFilesCb.onchange = function() {
      showAllFiles = this.checked;
      if (showAllFiles) {
        // Auto-expand all epics so Folder files links become visible
        for (const epic of treeData) {
          expandedEpics.add(epic.key || '');
        }
      }
      renderSidebar();
    };
  }

  const sidebarToggleAllBtn = document.getElementById('sidebar-toggle-all-btn');
  if (sidebarToggleAllBtn) {
    sidebarToggleAllBtn.onclick = function() {
      const expandAll = !areAllSidebarSectionsExpanded();
      setAllSidebarSectionsExpanded(expandAll);
      renderSidebar();
    };
  }

  const collapseAllBtn = document.getElementById('collapse-all-btn');
  if (collapseAllBtn) {
    collapseAllBtn.onclick = function() {
      expandedEpics.clear();
      expandedFeatures.clear();
      renderSidebar();
    };
  }

  sidebarContent.querySelectorAll('[data-sidebar-section-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sectionId = btn.getAttribute('data-sidebar-section-toggle');
      if (!sectionId) return;
      toggleSidebarSection(sectionId);
      renderSidebar();
    });
  });

  // ── Wire tag filter chip clicks (E28-F06 REQ-F-017, AC-12, AC-T3) ──
  // No mutation controls — chip list is read-only selection only (AC-T5, REQ-F-018).
  sidebarContent.querySelectorAll('[data-tag-filter-chip]').forEach(chip => {
    chip.addEventListener('click', () => {
      const name = chip.getAttribute('data-tag-filter-chip');
      if (!name) return;
      if (activeTagFilter.has(name)) {
        activeTagFilter.delete(name);
      } else {
        activeTagFilter.add(name);
      }
      // Re-fetch hierarchy with the updated filter (AC-T3: ?tag=a&tag=b repeated params)
      applyTagFilter(Array.from(activeTagFilter));
    });
  });

  // Wire event delegation once per render
  // Remove previous listeners by replacing the element's handler.
  // We use a single delegated click listener on sidebar-content.
  sidebarContent.onclick = function(e) {
    // Copy buttons are handled by the global delegation handler — skip here
    if (e.target.closest('.copy-btn')) return;

    const sprintToggle = e.target.closest('[data-sprint-toggle-scope]');
    if (sprintToggle) {
      const scope = sprintToggle.getAttribute('data-sprint-toggle-scope');
      toggleSprintTreeNode(scope);
      return;
    }

    const sprintItem = e.target.closest('[data-sprint-item-key]');
    if (sprintItem) {
      const key = sprintItem.getAttribute('data-sprint-item-key');
      if (key) selectSprintItem(key);
      return;
    }

    const arrowEl = e.target.closest('[data-arrow-key]');
    if (arrowEl) {
      // Expand/collapse — do NOT select
      const key = arrowEl.getAttribute('data-arrow-key');
      const parentNode = arrowEl.closest('.tree-node');
      if (toggleTreeNodeExpansion(parentNode, key)) renderSidebar();
      return;
    }

    // Selection is handled by the nodeEl click handler below

    // Node body click — select entity or doc
    const nodeEl = e.target.closest('[data-select-key]');
    if (nodeEl) {
      const key = nodeEl.getAttribute('data-select-key');
      if (key) {
        if (key.startsWith(FOLDER_KEY_PREFIX)) {
          const folderPath = nodeEl.getAttribute('data-folder-path') || key.slice(FOLDER_KEY_PREFIX.length);
          openFolderView(folderPath);
          return;
        }
        selectedKey = key;
        // Doc nodes (italic in sidebar) go to doc_view; all others go to entity_view
        if (nodeEl.classList.contains('tree-node-doc-epic') || nodeEl.classList.contains('tree-node-doc-feature')) {
          appState = 'doc_view';
        } else {
          const clickedEntity = findEntityByKey(key);
          entityViewTab = 'overview';
          appState = 'entity_view';
          cameFromSprint = false;
        }
        pushNavState();
        render();
      }
    }
  };
}

document.addEventListener('DOMContentLoaded', () => {
  initSidebarResizer();

  // Auto-load project data immediately — shark web is always pre-connected to
  // a single project, so no folder selection is needed.
  loadProjectData();

  // Pick Folder button (main screen) — triggers full data load
  document.getElementById('pick-folder-btn').addEventListener('click', () => {
    loadProjectData();
  });

  // Browser popstate — restore state when back/forward is pressed
  window.addEventListener('popstate', (e) => {
    restoreNavState(e.state);
  });

  // Header: Dashboard title → return to dashboard
  document.getElementById('header-dashboard-btn').addEventListener('click', () => {
    if (appState === 'entity_view' || appState === 'doc_view' || appState === 'sprint') {
      cameFromSprint = false;
      switchTopLevelMode('dashboard', { pushState: false });
    }
  });

  // Header: Sprint mode entry → switch to sprint overview shell
  document.getElementById('header-sprint-btn').addEventListener('click', () => {
    switchTopLevelMode('sprint');
  });

  // Header: Refresh button → reload all cached data
  document.getElementById('header-refresh-btn').addEventListener('click', () => {
    loadProjectData();
  });

  // Header: Pick Folder button → return to pick_folder
  document.getElementById('header-pick-folder-btn').addEventListener('click', () => {
    appState = 'pick_folder';
    render();
  });

  // Global copy button delegation — handles .copy-btn elements anywhere in the document
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const value = btn.dataset.copyValue || '';
    if (navigator.clipboard) {
      navigator.clipboard.writeText(value)
        .then(() => showToast('Copied!'))
        .catch(() => showToast('Copy failed', 'error'));
    } else {
      showToast('Clipboard unavailable', 'error');
    }
  });

  // Keyboard: Escape → cancel edit first, then close open drawer, then go back in history
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (editMode) {
        cancelEdit();
        return;
      }
      if (appState === 'entity_view' && entityViewTab === 'transitions') {
        // Transitions drawer open — close it first
        entityViewTab = 'info';
        renderEntityView();
      } else if (appState === 'entity_view' || appState === 'doc_view') {
        history.back();
      }
    }
  });

  // Keyboard: Enter / Space → activate any [data-navigate-key][role="button"] element.
  // Added once globally for breadcrumb segments, child-table KEY cells, and any other
  // keyboard-focusable navigation targets. REQ-NF-002, AC-NF-002.1, E27-F09-005.
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-navigate-key][role="button"]')) {
      e.preventDefault();
      const k = e.target.getAttribute('data-navigate-key');
      if (k) navigateToEntity(k);
    }
  });
});

/** Cache: dirPath → FolderFilesResponse, cleared on project reload. */
const folderFilesCache = new Map();

/**
 * Fetches and renders the folder files listing in the given pane element.
 * Uses an in-memory cache keyed by dirPath to avoid re-fetching on every tab switch.
 */
async function renderFolderFilesPane(dirPath, paneEl) {
  if (!dirPath) {
    paneEl.innerHTML = `<div class="content-placeholder">No folder path available.</div>`;
    return;
  }

  let result = folderFilesCache.get(dirPath);
  if (!result) {
    paneEl.innerHTML = `<div class="content-placeholder">Loading folder files\u2026</div>`;
    try {
      result = await apiGetFolderFiles(dirPath);
      if (result) folderFilesCache.set(dirPath, result);
    } catch (err) {
      paneEl.innerHTML = `<div class="content-placeholder">Failed to load folder files.</div>`;
      return;
    }
  }

  if (!result || !result.entries || result.entries.length === 0) {
    paneEl.innerHTML = `<div class="content-placeholder">No files found in <code>${escapeHtml(dirPath)}</code>.</div>`;
    return;
  }

  let html = `<div class="folder-files-pane"><div class="folder-files-header">${escapeHtml(result.dir_path || dirPath)}</div><div class="folder-files-list">`;
  // Add ../ entry when not at the project root
  if (dirPath !== '.' && dirPath !== '') {
    html += `<div class="folder-file-item folder-file-dir" data-folder-path="${escapeHtml(parentDir(dirPath))}">📁 <span class="folder-file-name">../</span></div>`;
  }
  for (const entry of result.entries) {
    const icon = entry.is_dir ? '📁' : fileIcon(entry.name);
    const sizeStr = (!entry.is_dir && entry.size > 0) ? formatFileSize(entry.size) : '';
    const sizeHtml = sizeStr ? `<span class="folder-file-size">${escapeHtml(sizeStr)}</span>` : '';
    if (entry.is_dir) {
      html += `<div class="folder-file-item folder-file-dir" data-folder-path="${escapeHtml(entry.path)}">${icon} <span class="folder-file-name">${escapeHtml(entry.name)}</span>${sizeHtml}</div>`;
    } else {
      html += `<div class="folder-file-item" data-file-path="${escapeHtml(entry.path)}">${icon} <span class="folder-file-name">${escapeHtml(entry.name)}</span>${sizeHtml}</div>`;
    }
  }
  html += `</div></div>`;
  paneEl.innerHTML = html;

  // Single delegated click handler for the whole list
  paneEl.querySelector('.folder-files-list').addEventListener('click', (e) => {
    const item = e.target.closest('.folder-file-item');
    if (!item) return;
    const filePath = item.getAttribute('data-file-path');
    if (filePath) {
      selectedKey = filePath;
      appState = 'doc_view';
      pushNavState();
      render();
      return;
    }
    const folderPath = item.getAttribute('data-folder-path');
    if (folderPath) {
      pushNavState();
      renderFolderFilesPane(folderPath, paneEl);
    }
  });
}

/**
 * Opens a folder view for the given dirPath by navigating to the nearest
 * entity and opening the Files tab, or rendering directly if no entity found.
 */
function openFolderView(dirPath) {
  // Try to find an entity whose file_path is in this dir
  for (const epic of treeData) {
    const epicDir = epic.file_path ? parentDir(epic.file_path) : '';
    if (epicDir === dirPath) {
      selectedKey = epic.key;
      entityViewTab = 'files';
      appState = 'entity_view';
      pushNavState();
      render();
      return;
    }
    for (const feature of (epic.features || [])) {
      const fDir = feature.file_path ? parentDir(feature.file_path) : '';
      if (fDir === dirPath) {
        selectedKey = feature.key;
        entityViewTab = 'files';
        appState = 'entity_view';
        pushNavState();
        render();
        return;
      }
    }
  }
  // No entity found — open doc view with a synthetic folder key
  selectedKey = FOLDER_KEY_PREFIX + dirPath;
  appState = 'doc_view';
  pushNavState();
  render();
}

/** Returns the parent directory of a relative file path (strips the last segment). */
function parentDir(filePath) {
  const lastSlash = filePath.lastIndexOf('/');
  return lastSlash === -1 ? '.' : filePath.substring(0, lastSlash);
}

/**
 * Returns a file icon character based on the file extension.
 */
function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  switch(ext) {
    case 'md': case 'markdown': return '📝';
    case 'go': return '🔵';
    case 'js': case 'ts': return '📜';
    case 'json': return '📋';
    case 'yaml': case 'yml': return '⚙️';
    case 'sh': case 'bash': return '💻';
    case 'png': case 'jpg': case 'gif': case 'svg': return '🖼️';
    case 'pdf': return '📄';
    default: return '📃';
  }
}

/**
 * Formats a file size in bytes as a human-readable string.
 */
function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

/**
 * Fetches the folder file listing from the API.
 */
async function apiGetFolderFiles(dirPath) {
  const resp = await fetch('/api/v1/viewer/folder-files/' + encodeURIComponent(dirPath).replace(/%2F/g, '/'));
  if (!resp.ok) throw new Error('folder files fetch failed: ' + resp.status);
  return resp.json();
}
