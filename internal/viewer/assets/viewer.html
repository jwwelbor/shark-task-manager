// --- Session caches for notes and related-docs (REQ-NF-003, AC-010.1, AC-011.4) ---
const notesCache      = new Map(); // key → Promise<NotesResponse>
const relatedDocsCache = new Map(); // key → Promise<RelatedDocsResponse>

async function fetchNotes(key) {
  if (!notesCache.has(key)) {
    notesCache.set(key,
      fetch(`/api/v1/viewer/notes/${encodeURIComponent(key)}`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
    );
  }
  return notesCache.get(key);
}

async function fetchRelatedDocs(key) {
  if (!relatedDocsCache.has(key)) {
    relatedDocsCache.set(key,
      fetch(`/api/v1/viewer/related-docs/${encodeURIComponent(key)}`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
    );
  }
  return relatedDocsCache.get(key);
}

// --- Shared computation helpers (spec §2.3.6) ---

/**
 * Counts items by their .status field. Returns {status: count} map.
 * AC-004.3, AC-005.3 — derived from treeData, no network call.
 */
function countByStatus(items) {
  const out = {};
  for (const it of items) {
    const s = it.status || 'unknown';
    out[s] = (out[s] || 0) + 1;
  }
  return out;
}

/**
 * Collects all tasks from an epic's feature list.
 * Used for epic-level task rollup (REQ-F-005).
 */
function collectEpicTasks(epic) {
  const tasks = [];
  for (const f of (epic.features || [])) {
    for (const t of (f.tasks || [])) tasks.push(t);
  }
  return tasks;
}

/**
 * Looks up status metadata from the cached workflowMeta.
 * Returns {} if metadata is unavailable (safe degradation).
 */
function statusMeta(status) {
  const levelMeta = (workflowMeta && workflowMeta.levels && workflowMeta.levels.task) || {};
  return (levelMeta.statuses || []).find(s => s.name === status) || {};
}

/**
 * Computes weighted progress percentage from a status→count map.
 * AC-005.3: label = Σ(progress_weight × count) / total_tasks.
 */
function weightedProgress(countsByStatus, total) {
  if (!total) return 0;
  let acc = 0;
  for (const [s, n] of Object.entries(countsByStatus)) {
    const w = statusMeta(s).progress_weight || 0;
    acc += w * n;
  }
  return Math.round(acc / total);
}

/**
 * Counts tasks by responsibility (agent/human/qa_team) from workflowMeta.
 * AC-006.1 — uses responsibility field, not hardcoded status names.
 */
function workBreakdown(tasks) {
  const buckets = { agent: 0, human: 0, qa_team: 0 };
  for (const t of tasks) {
    const r = statusMeta(t.status).responsibility || 'none';
    if (buckets[r] != null) buckets[r]++;
  }
  return buckets;
}

/**
 * Returns tasks whose status has blocks_feature === true.
 * AC-007.1 — filter uses blocks_feature flag, NOT hardcoded status names.
 */
function actionItems(tasks) {
  return tasks
    .filter(t => statusMeta(t.status).blocks_feature === true)
    .sort((a, b) => {
      const pa = statusMeta(a.status).phase || '';
      const pb = statusMeta(b.status).phase || '';
      if (pa !== pb) return pa.localeCompare(pb);
      const oa = a.execution_order || 0;
      const ob = b.execution_order || 0;
      if (oa !== ob) return oa - ob;
      return (a.key || '').localeCompare(b.key || '');
    });
}

/**
 * Returns a sorted list of statuses ordered by workflow phase then alphabetically.
 * AC-004.5 — uses workflowMeta phase ordering with alphabetical fallback.
 */
function sortedStatuses(statusKeys) {
  const phaseOrder = ['planning', 'development', 'review', 'qa', 'approval', 'done', 'any'];
  return [...statusKeys].sort((a, b) => {
    const pa = statusMeta(a).phase || '';
    const pb = statusMeta(b).phase || '';
    const ia = phaseOrder.indexOf(pa);
    const ib = phaseOrder.indexOf(pb);
    const pia = ia === -1 ? 999 : ia;
    const pib = ib === -1 ? 999 : ib;
    if (pia !== pib) return pia - pib;
    return a.localeCompare(b);
  });
}

/**
 * Wraps content in an .ov-section block with a labelled header.
 * Section header pattern from feature.md.
 */
function sectionShell(label, bodyHtml) {
  return `<div class="ov-section">
    <div class="ov-section-header">${escapeHtml(label)}</div>
    ${bodyHtml}
  </div>`;
}

/**
 * Renders a status badge suitable for overview sections.
 */
function ovStatusBadge(status) {
  const c = getStatusColor(status);
  return `<span class="status-badge status-badge-sm" style="background:${escapeHtml(c)};color:${getContrastColor(c)}">${escapeHtml(status.replace(/_/g,' '))}</span>`;
}

// --- Notes placeholder and async loader (REQ-F-010) ---

/**
 * Returns placeholder HTML for the notes section. loadNotesInto() fills it.
 */
function notesPlaceholder(key) {
  return `<div class="ov-section" data-notes-for="${escapeHtml(key)}">
    <div class="ov-section-header">Notes</div>
    <div class="skeleton" style="height:20px;border-radius:4px;margin:4px 0"></div>
  </div>`;
}

/**
 * Asynchronously fetches notes for key and renders them into el.
 * AC-010.1: caches per session; AC-010.7: skeleton shown until loaded.
 */
async function loadNotesInto(el, key) {
  if (!el) return;
  try {
    const resp = await fetchNotes(key);
    const notes = resp?.notes || [];
    if (notes.length === 0) {
      // AC-010.6: omit section when no notes
      el.style.display = 'none';
      return;
    }
    const maxDefault = 5;
    const renderRows = (list) => list.map(n => {
      const noteTypeColors = {
        decision: '#8e44ad', blocker: '#c0392b', comment: 'var(--fg-dim)',
        solution: '#27ae60', implementation: '#2980b9', question: '#17a2b8',
        rejection: '#e83e8c', reference: 'var(--fg-dim)', future: 'var(--fg-dim)',
        requirement: 'var(--fg-dim)', testing: 'var(--fg-dim)'
      };
      const tc = noteTypeColors[n.note_type] || 'var(--fg-dim)';
      const ts = n.created_at ? formatDate(n.created_at) : '';
      return `<div class="note-row">
        <span class="note-ts">${escapeHtml(ts)}</span>
        <span class="note-type-pill" style="background:${tc};color:#fff">${escapeHtml(n.note_type || '')}</span>
        <span class="note-text" title="${escapeHtml(n.content || '')}">${escapeHtml(n.content || '')}</span>
      </div>`;
    }).join('');

    const shown = notes.slice(0, maxDefault);
    const remaining = notes.slice(maxDefault);
    let bodyHtml = renderRows(shown);
    if (remaining.length > 0) {
      bodyHtml += `<button class="notes-show-more" data-notes-key="${escapeHtml(key)}" data-notes-remaining='${JSON.stringify(remaining)}'>Show ${remaining.length} more</button>`;
    }
    el.innerHTML = `<div class="ov-section-header">Notes</div>${bodyHtml}`;

    // Wire "Show N more" button (AC-010.5)
    const btn = el.querySelector('.notes-show-more');
    if (btn) {
      btn.addEventListener('click', () => {
        const rest = JSON.parse(btn.dataset.notesRemaining || '[]');
        btn.insertAdjacentHTML('beforebegin', renderRows(rest));
        btn.replaceWith((() => { const b = document.createElement('button'); b.className='notes-show-more'; b.textContent='Show less'; b.addEventListener('click',()=>{ loadNotesInto(el, key); }); return b; })());
      });
    }
  } catch (_) {
    // AC-010.6: on error, omit (no broken message for notes)
    el.style.display = 'none';
  }
}

// --- Related docs placeholder and async loader (REQ-F-011) ---

/**
 * Returns placeholder HTML for the related-docs section.
 */
function relatedDocsPlaceholder(key) {
  return `<div class="ov-section" data-docs-for="${escapeHtml(key)}">
    <div class="ov-section-header">Related Docs</div>
    <div class="skeleton" style="height:20px;border-radius:4px;margin:4px 0"></div>
  </div>`;
}

/**
 * Asynchronously fetches related docs for key and renders them into el.
 * AC-011.3: omit section if empty; AC-011.5: show dim error on failure.
 */
async function loadRelatedDocsInto(el, key) {
  if (!el) return;
  try {
    const resp = await fetchRelatedDocs(key);
    const docs = resp?.docs || [];
    if (docs.length === 0) {
      // AC-011.3: omit section when empty
      el.style.display = 'none';
      return;
    }
    const rows = docs.map(d => `<div class="reldoc-row">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0"><rect x="1" y="0.5" width="8" height="11" rx="1" stroke="var(--fg-dim)" stroke-width="1" fill="none"/><line x1="3" y1="3.5" x2="7" y2="3.5" stroke="var(--fg-dim)"/><line x1="3" y1="5.5" x2="7" y2="5.5" stroke="var(--fg-dim)"/><line x1="3" y1="7.5" x2="5" y2="7.5" stroke="var(--fg-dim)"/></svg>
      <span class="reldoc-path" title="${escapeHtml(d.file_path || '')}">${escapeHtml(d.file_path || '')}</span>
      <button class="reldoc-open" data-doc-path="${escapeHtml(d.file_path || '')}">open</button>
    </div>`).join('');
    el.innerHTML = `<div class="ov-section-header">Related Docs</div>${rows}`;

    // Wire open buttons
    el.querySelectorAll('.reldoc-open').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = btn.dataset.docPath;
        if (p && typeof openDocumentByPath === 'function') openDocumentByPath(p);
      });
    });
  } catch (_) {
    // AC-011.5: show dim error message on failure
    el.innerHTML = `<div class="ov-section-header">Related Docs</div><span style="color:var(--fg-dim);font-size:12px">Failed to load docs</span>`;
  }
}

/**
 * Opens a document by its file path in the doc_view, exactly as if the user
 * clicked the doc node in the sidebar tree.
 * @param {string} path - relative file path (e.g. "docs/plan/E07/design.md")
 */
function openDocumentByPath(path) {
  if (!path) return;
  selectedKey = path;
  appState = 'doc_view';
  pushNavState();
  render();
}

// --- Task Overview section renderers (REQ-F-009) ---

/**
 * Renders a single dependency row entry.
 * Resolved entities get a clickable span with data-navigate-key, tabindex, and role.
 * Unresolved keys get plain mono text with a dim "(unresolved)" suffix.
 * AC-T3: unresolved keys render as plain mono text with no click handler.
 * AC-T4: resolved clickable entries have tabindex="0" and role="button".
 * @param {{key: string, entity: Object|null}} item
 * @returns {string} HTML string
 */
function renderDepRow(item) {
  const k = escapeHtml(item.key);
  if (item.entity) {
    return `<div style="margin:3px 0;font-size:13px">` +
      `<span role="button" tabindex="0" data-navigate-key="${k}" ` +
      `style="font-family:var(--font-mono,monospace);color:var(--accent);cursor:pointer;font-size:12px">${k}</span>` +
      `</div>`;
  }
  return `<div style="margin:3px 0;font-size:13px">` +
    `<span style="font-family:var(--font-mono,monospace);font-size:12px">${k}</span>` +
    `<span style="font-size:11px;color:var(--fg-dim)"> (unresolved)</span>` +
    `</div>`;
}

/**
 * Renders the Dependencies section for the Task Overview pane.
 * Shows three groups: Depends On, Blocked By, Blocks.
 * Blocked By carries a red left-border accent even when empty (AC-T2).
 * Uses findEntityByKey to resolve keys — no network call (AC-T1).
 * REQ-F-009, AC-009.1–AC-009.5.
 * @param {Object} task - task entity object from treeData
 * @returns {string} HTML string for the section
 */
function renderDependencyBlockSection(task) {
  const resolve = keys => (Array.isArray(keys) ? keys : []).map(k => ({ key: k, entity: findEntityByKey(k) }));
  const groups = [
    { label: 'Depends On', items: resolve(task.depends_on_keys) },
    { label: 'Blocked By', items: resolve(task.blocked_by_keys), accent: true },
    { label: 'Blocks',     items: resolve(task.blocks_keys) },
  ];
  const groupHtml = g => `
    <div class="dep-group${g.accent ? ' dep-group-accent' : ''}">
      <div class="dep-label">${escapeHtml(g.label)}</div>
      ${g.items.length
        ? g.items.map(renderDepRow).join('')
        : `<div class="dep-empty">(none)</div>`}
    </div>`;
  return sectionShell('Dependencies', groups.map(groupHtml).join(''));
}

// --- Epic Overview section renderers (REQ-F-004, REQ-F-005, REQ-F-008) ---

/**
 * Renders the Feature Status Rollup section for epic Overview.
 * REQ-F-004: horizontal row of colored pills, one per distinct feature status.
 * AC-004.1: renders only on epic Overview.
 * AC-004.4: zero-count statuses are omitted.
 * AC-004.5: pill order follows workflow phase ordering.
 */
function renderFeatureRollupSection(epic) {
  const features = epic.features || [];
  const counts = countByStatus(features);
  const occupied = Object.keys(counts).filter(s => counts[s] > 0);
  if (occupied.length === 0) {
    return sectionShell('Features in Status', '<span style="color:var(--fg-dim);font-size:12px">No features</span>');
  }
  const ordered = sortedStatuses(occupied);
  const pills = ordered.map(s => {
    const c = getStatusColor(s);
    const n = counts[s];
    return `<span class="rollup-pill" style="background:${escapeHtml(c)};color:${getContrastColor(c)}" title="${escapeHtml(s)}">
      ● ${escapeHtml(s.replace(/_/g,' '))} ${n}
    </span>`;
  }).join('');
  return sectionShell('Features in Status', `<div class="rollup-row">${pills}</div>`);
}

/**
 * Renders the Task Status Rollup section with segmented progress bar.
 * REQ-F-005: row of colored pills + 100%-wide 8px bar + weighted-progress percentage.
 * AC-005.2: empty entity shows dim "No tasks" placeholder.
 * AC-005.3: label uses weightedProgress helper.
 */
function renderTaskRollupSection(tasks) {
  const counts = countByStatus(tasks);
  const total = tasks.length;

  if (total === 0) {
    return sectionShell('Tasks in Status', '<span style="color:var(--fg-dim);font-size:12px">No tasks</span>');
  }

  const occupied = Object.keys(counts).filter(s => counts[s] > 0);
  const ordered = sortedStatuses(occupied);
  const pct = weightedProgress(counts, total);

  // Rollup pills
  const pills = ordered.map(s => {
    const c = getStatusColor(s);
    const n = counts[s];
    return `<span class="rollup-pill" style="background:${escapeHtml(c)};color:${getContrastColor(c)}" title="${escapeHtml(s)}">
      ● ${escapeHtml(s.replace(/_/g,' '))} ${n}
    </span>`;
  }).join('');

  // Segmented progress bar
  const segments = ordered.map(s => {
    const c = getStatusColor(s);
    const w = ((counts[s] / total) * 100).toFixed(2);
    return `<div class="seg-bar-segment" style="width:${w}%;background:${escapeHtml(c)}" title="${escapeHtml(s)}: ${counts[s]}"></div>`;
  }).join('');

  const bodyHtml = `
    <div class="rollup-row">${pills}</div>
    <div class="seg-bar-row">
      <div class="seg-bar" style="flex:1">${segments}</div>
      <span class="seg-bar-label">${pct}%</span>
    </div>`;

  return sectionShell('Tasks in Status', bodyHtml);
}

/**
 * Renders the Features table for epic Overview.
 * REQ-F-008: KEY · TITLE · STATUS BADGE · PROGRESS BAR columns.
 * AC-008.1: KEY cells carry data-navigate-key and .clickable class.
 * AC-008.2: TITLE cells truncated via CSS; full title in title attribute.
 * AC-008.4: body scrolls inside max-height: 420px when >10 rows; header sticky.
 */
function renderFeaturesTableSection(epic) {
  const features = epic.features || [];
  if (features.length === 0) {
    return sectionShell('Features', '<span style="color:var(--fg-dim);font-size:12px">No features</span>');
  }

  const rows = features.map(f => {
    const key = escapeHtml(f.key || '');
    const title = escapeHtml(f.title || f.key || '');
    const pct = typeof f.progress_pct === 'number' ? f.progress_pct : 0;
    const badge = ovStatusBadge(f.status || 'unknown');
    const barColor = 'var(--accent)';
    const rowClass = isCancelledStatus(f.status) ? ' class="entity-cancelled"' : '';
    return `<tr${rowClass}>
      <td><span class="clickable" role="button" tabindex="0" data-navigate-key="${key}">${key}</span></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${title}">${title}</td>
      <td>${badge}</td>
      <td style="min-width:80px">
        <div style="height:6px;border-radius:3px;background:var(--bg-3);overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px"></div>
        </div>
      </td>
    </tr>`;
  }).join('');

  const scrollClass = features.length > 10 ? ' ov-table-scroll' : '';
  const tableHtml = `
    <div class="${scrollClass.trim() || ''}">
      <table class="ov-table">
        <thead><tr>
          <th>KEY</th><th>TITLE</th><th>STATUS</th><th>PROGRESS</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  return sectionShell('Features', tableHtml);
}

// --- Feature Overview section renderers (REQ-F-006, REQ-F-007, REQ-F-008) ---

/**
 * Renders the Work Breakdown section for feature Overview.
 * REQ-F-006: three labelled rows — Agent / Human / QA Team — each with a mini bar.
 * AC-006.1: counts derived from responsibility field of each task's status in workflowMeta.
 * AC-006.2: bar width = count / max(1, total_for_all_three_rows) * 100%.
 * AC-006.3: hidden when all three counts are zero.
 * AC-006.4: only rendered for feature Overview.
 * @param {Array} tasks - array of task objects from treeData (feature.tasks)
 * @returns {string} HTML string or null when all counts are zero
 */
function renderWorkBreakdownSection(tasks) {
  const bd = workBreakdown(tasks);
  const maxCount = Math.max(1, bd.agent + bd.human + bd.qa_team);
  // AC-006.3: return null (omit) when all three counts are zero
  if (bd.agent === 0 && bd.human === 0 && bd.qa_team === 0) return null;

  const rows = [
    { label: 'Agent',   count: bd.agent },
    { label: 'Human',   count: bd.human },
    { label: 'QA Team', count: bd.qa_team },
  ].map(r => {
    const pct = (r.count / maxCount * 100).toFixed(2);
    return `<div class="wb-row">
      <span class="wb-label">${escapeHtml(r.label)}</span>
      <div class="wb-bar"><div class="wb-bar-fill" style="width:${pct}%"></div></div>
      <span class="wb-count">${r.count}</span>
    </div>`;
  }).join('');

  return sectionShell('Work Breakdown', rows);
}

/**
 * Renders the Action Items section for feature Overview.
 * REQ-F-007: list of tasks in statuses whose blocks_feature === true.
 * AC-007.1: filter uses blocks_feature flag — never hardcoded status names.
 * AC-007.2: each row shows a status badge, clickable key (data-navigate-key), and truncated title.
 * AC-007.3: rows ordered by status phase, then execution_order, then key.
 * AC-007.4: section omitted when no tasks match blocks_feature.
 * @param {Array} tasks - array of task objects
 * @returns {string} HTML string or null when no blocking tasks
 */
function renderActionItemsSection(tasks) {
  const items = actionItems(tasks);
  // AC-007.4: omit section entirely when no blocking tasks
  if (items.length === 0) return null;

  const rows = items.map(t => {
    const key = escapeHtml(t.key || '');
    const title = escapeHtml(t.title || t.key || '');
    const badge = ovStatusBadge(t.status || 'unknown');
    return `<div class="action-item-row">
      ${badge}
      <span class="clickable" role="button" tabindex="0" data-navigate-key="${key}"
        style="font-family:var(--font-mono,monospace);font-size:12px">${key}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px"
        title="${title}">${title}</span>
    </div>`;
  }).join('');

  return sectionShell('Action Items', rows);
}

/**
 * Renders the Tasks table for feature Overview.
 * REQ-F-008 (feature): KEY · TITLE · STATUS BADGE · ORDER columns.
 * AC-008.1: KEY cells carry data-navigate-key and .clickable class.
 * AC-008.2: TITLE cells truncated via CSS; full title in title attribute.
 * AC-008.3: uses ov-table CSS; rows have bottom-border dividers; hover bg-3.
 * AC-008.4: body scrolls inside max-height: 420px when >10 rows; header sticky.
 * AC-T4: ORDER column reflects execution_order from treeData.
 * @param {object} feature - feature entity object from treeData
 * @returns {string} HTML string
 */
function renderTasksTableSection(feature) {
  const tasks = feature.tasks || [];
  if (tasks.length === 0) {
    return sectionShell('Tasks', '<span style="color:var(--fg-dim);font-size:12px">No tasks</span>');
  }

  const rows = tasks.map(t => {
    const key = escapeHtml(t.key || '');
    const title = escapeHtml(t.title || t.key || '');
    const badge = ovStatusBadge(t.status || 'unknown');
    const order = t.execution_order != null ? t.execution_order : '';
    const rowClass = isCancelledStatus(t.status) ? ' class="entity-cancelled"' : '';
    return `<tr${rowClass}>
      <td><span class="clickable" role="button" tabindex="0" data-navigate-key="${key}">${key}</span></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${title}">${title}</td>
      <td>${badge}</td>
      <td style="text-align:right;color:var(--fg-dim);font-size:12px">${escapeHtml(String(order))}</td>
    </tr>`;
  }).join('');

  const scrollClass = tasks.length > 10 ? 'ov-table-scroll' : '';
  const tableHtml = `
    <div class="${scrollClass}">
      <table class="ov-table">
        <thead><tr>
          <th>KEY</th><th>TITLE</th><th>STATUS</th><th style="text-align:right">ORDER</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  return sectionShell('Tasks', tableHtml);
}

/**
 * Dispatches to entity-type-specific overview renderers.
 * Overview is the default tab for epic/feature/task (AC-001.1).
 * Bug/change-card/idea entities are coerced to 'info' before reaching here.
 *
 * @param {object} entity - the entity object from treeData
 * @param {HTMLElement} paneEl - the content pane element to populate
 */
function renderOverviewPane(entity, paneEl) {
  if (!paneEl) return;
  if (!entity) {
    paneEl.innerHTML = `<div class="content-placeholder">Entity not found.</div>`;
    return;
  }

  const sections = [];
  switch (entity.type) {
    case 'epic':
      sections.push(notesPlaceholder(entity.key));
      sections.push(renderFeatureRollupSection(entity));
      sections.push(renderTaskRollupSection(collectEpicTasks(entity)));
      sections.push(renderFeaturesTableSection(entity));
      sections.push(relatedDocsPlaceholder(entity.key));
      break;
    case 'feature':
      sections.push(notesPlaceholder(entity.key));
      sections.push(renderTaskRollupSection(entity.tasks || []));
      sections.push(renderWorkBreakdownSection(entity.tasks || []));
      sections.push(renderActionItemsSection(entity.tasks || []));
      sections.push(renderTasksTableSection(entity));
      sections.push(relatedDocsPlaceholder(entity.key));
      break;
    case 'task':
      sections.push(notesPlaceholder(entity.key));
      sections.push(renderDependencyBlockSection(entity));
      sections.push(relatedDocsPlaceholder(entity.key));
      break;
    default:
      paneEl.innerHTML = `<div class="content-placeholder">Overview not available for this entity type.</div>`;
      return;
  }

  paneEl.innerHTML = `<div class="overview-pane overview-${escapeHtml(entity.type)}">${sections.filter(Boolean).join('')}</div>`;

  // Wire click delegation for [data-navigate-key] elements (feature rows, task rows, dep links)
  paneEl.querySelectorAll('[data-navigate-key]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.getAttribute('data-navigate-key');
      if (k) navigateToEntity(k);
    });
  });

  // Fire async notes + docs fetches into their placeholder divs (AC-010.7, AC-011.4)
  loadNotesInto(paneEl.querySelector(`[data-notes-for="${entity.key}"]`), entity.key);
  loadRelatedDocsInto(paneEl.querySelector(`[data-docs-for="${entity.key}"]`), entity.key);
}

/**
 * Renders the Entity View (State 3).
 * Shows entity properties panel, Info/Transitions toggle, and content pane.
 */
function renderEntityView() {
  const content = document.getElementById('content');

  const entity = findEntityByKey(selectedKey);
  const isEpic = entity?.type === 'epic';
  const isSimpleEntity = entity && (entity.type === 'bug' || entity.type === 'change_card' || entity.type === 'idea');

  // Guard: if history state restored 'dashboard' for a non-epic, coerce to 'overview' (AC-001.5)
  if (entityViewTab === 'dashboard' && !isEpic) {
    entityViewTab = 'overview';
  }
  // Guard: bug/change-card/idea do not support 'overview' pane — coerce to 'info'
  if (entityViewTab === 'overview' && isSimpleEntity) {
    entityViewTab = 'info';
  }

  // Build header and toggle bar
  const title = entity ? escapeHtml(entity.title || entity.key || selectedKey) : escapeHtml(selectedKey || '');
  const keyLabel = escapeHtml(selectedKey || '');

  const overviewActive = entityViewTab === 'overview'    ? ' active' : '';
  const dashActive     = entityViewTab === 'dashboard'   ? ' active' : '';
  const infoActive     = entityViewTab === 'info'        ? ' active' : '';
  const transActive    = entityViewTab === 'transitions' ? ' active' : '';
  const filesActive    = entityViewTab === 'files'       ? ' active' : '';

  // Overview button: shown for epic/feature/task, not for bug/change-card/idea (AC-001.2, AC-001.3)
  const overviewBtnHtml = !isSimpleEntity
    ? `<button class="toggle-btn${overviewActive}" id="ev-tab-overview">Overview</button>`
    : '';

  // Dashboard button is only rendered for epics (AC-001.2, AC-001.3)
  const dashBtnHtml = isEpic
    ? `<button class="toggle-btn${dashActive}" id="ev-tab-dashboard">Dashboard</button>`
    : '';

  const entityDir = entity ? (entity.file_path || entity.linked_content_path || '') : '';
  const filesDirPath = entityDir ? parentDir(entityDir) : '';
  const filesBtnHtml = filesDirPath ? `<button class="toggle-btn${filesActive}" id="ev-tab-files">Files</button>` : '';

  // Edit button is now inside the Spec pane (renderMarkdownPane), NOT in the toggle bar (AC-002.1)
  const html = `
    ${entity ? renderBreadcrumb(entity) : ''}
    <div class="entity-view-header">
      <div class="entity-view-title">${title}</div>
      <div class="entity-view-key-row">
        <div class="entity-view-key">${keyLabel}</div>
        ${entity ? `<button class="copy-btn copy-key-btn" data-copy-value="${escapeHtml(entity.key || keyLabel)}" title="Copy key">⎘</button>` : ''}
      </div>
    </div>
    ${entity ? renderPropertiesPanel(entity) : ''}
    <div class="toggle-bar">
      ${overviewBtnHtml}
      <button class="toggle-btn${infoActive}"  id="ev-tab-info">Spec</button>
      <button class="toggle-btn${transActive}" id="ev-tab-transitions">History</button>
      ${dashBtnHtml}
      ${filesBtnHtml}
    </div>
    <div id="ev-content-pane"></div>
  `;

  content.innerHTML = html;

  // Wire breadcrumb segment clicks → navigateToEntity
  content.querySelectorAll('.breadcrumb-seg[data-navigate-key]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.getAttribute('data-navigate-key');
      if (k) navigateToEntity(k);
    });
  });

  // Wire Overview tab button (epic/feature/task only)
  const overviewTabBtn = document.getElementById('ev-tab-overview');
  if (overviewTabBtn) {
    overviewTabBtn.addEventListener('click', () => {
      if (entityViewTab !== 'overview') { entityViewTab = 'overview'; pushNavState(); renderEntityView(); }
    });
  }

  // Wire Dashboard tab button (epics only)
  const dashTabBtn = document.getElementById('ev-tab-dashboard');
  if (dashTabBtn) {
    dashTabBtn.addEventListener('click', () => {
      if (entityViewTab !== 'dashboard') { entityViewTab = 'dashboard'; pushNavState(); renderEntityView(); }
    });
  }

  // Wire toggle buttons
  document.getElementById('ev-tab-info').addEventListener('click', () => {
    if (entityViewTab !== 'info') { entityViewTab = 'info'; pushNavState(); renderEntityView(); }
  });
  document.getElementById('ev-tab-transitions').addEventListener('click', () => {
    if (entityViewTab !== 'transitions') { entityViewTab = 'transitions'; pushNavState(); renderEntityView(); }
  });
  const filesTabBtn = document.getElementById('ev-tab-files');
  if (filesTabBtn) {
    filesTabBtn.addEventListener('click', () => {
      if (entityViewTab !== 'files') { entityViewTab = 'files'; pushNavState(); renderEntityView(); }
    });
  }

  const paneEl = document.getElementById('ev-content-pane');

  if (entityViewTab === 'overview') {
    // Overview pane — dispatcher for epic/feature/task (AC-T3)
    renderOverviewPane(entity, paneEl);
  } else if (entityViewTab === 'dashboard' && isEpic) {
    renderEpicDashboardPane(entity.key, paneEl);
  } else if (entityViewTab === 'info') {
    // Async: fetch and render markdown content (Edit toggle now rendered inside pane — AC-002.2)
    renderMarkdownPane(selectedKey, paneEl);
  } else if (entityViewTab === 'files') {
    renderFolderFilesPane(filesDirPath, paneEl);
  } else {
    // Transitions view
    paneEl.innerHTML = `<div class="history-drawer"><div class="content-placeholder">Loading transition history\u2026</div></div>`;
    apiGetHistory(selectedKey).then(historyResp => {
      // API returns {entity_type, entity_key, records: [...]}
      const history = historyResp?.records;
      if (!Array.isArray(history) || history.length === 0) {
        paneEl.innerHTML = `<div class="history-drawer"><div class="content-placeholder">No transition history found.</div></div>`;
        return;
      }
      // Sort reverse-chronological (most recent first)
      // History records use 'changed_at' (EntityHistory model field)
      const sorted = [...history].sort((a, b) => {
        const ta = a.changed_at || a.created_at || a.timestamp || '';
        const tb = b.changed_at || b.created_at || b.timestamp || '';
        return tb.localeCompare(ta);
      });
      let rows = '';
      for (let i = 0; i < sorted.length; i++) {
        const entry = sorted[i];
        const date     = escapeHtml(formatDateTime(entry.changed_at || entry.created_at || entry.timestamp || ''));
        const from     = entry.from_status || entry.from || '';
        const to       = entry.to_status   || entry.to   || '';
        const note     = escapeHtml(entry.note || entry.reason || '');
        const fromC = getStatusColor(from);
        const fromBadge = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(fromC)};color:${getContrastColor(fromC)}">${escapeHtml(from.replace(/_/g,' '))}</span>`;
        const toC   = getStatusColor(to);
        const toBadge   = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(toC)};color:${getContrastColor(toC)}">${escapeHtml(to.replace(/_/g,' '))}</span>`;
        // Duration: time the entity spent in from_status before this transition.
        // sorted is newest-first, so sorted[i+1] is the prior transition.
        // For the oldest entry, fall back to entity.created_at.
        let duration = '—';
        const tThis = new Date(entry.changed_at || entry.created_at || entry.timestamp || '');
        const prevTs = i + 1 < sorted.length
          ? (sorted[i + 1].changed_at || sorted[i + 1].created_at || sorted[i + 1].timestamp || '')
          : (entity?.created_at || '');
        if (prevTs) {
          const tPrev = new Date(prevTs);
          if (!isNaN(tThis) && !isNaN(tPrev) && tThis >= tPrev) {
            duration = formatDuration(tThis - tPrev);
          }
        }
        const durationCell = duration === '—' ? '—' : `for ${duration}`;
        rows += `<tr>
          <td class="history-date">${date}</td>
          <td class="history-badge-cell">${fromBadge}</td>
          <td class="history-duration">${durationCell}</td>
          <td class="history-arrow-cell">\u2192</td>
          <td class="history-badge-cell">${toBadge}</td>
          <td class="activity-note">${note}</td>
        </tr>`;
      }
      paneEl.innerHTML = `
        <div class="history-drawer">
          <table class="history-table">
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    });
  }
}

/**
 * Renders the Doc View (State 4).
 * Plain markdown rendering — no properties panel, no Info/Transitions toggle.
 * Reuses renderMarkdownPane() for content rendering.
 */
function renderDocView() {
  const content = document.getElementById('content');

  const docKey = selectedKey || '';

  if (docKey.startsWith(FOLDER_KEY_PREFIX)) {
    const dirPath = docKey.slice(FOLDER_KEY_PREFIX.length);
    content.innerHTML = `
      <button class="content-back-link" id="doc-back-btn">← Back</button>
      <div class="entity-view-header">
        <div class="entity-view-title ev-title">${escapeHtml(dirPath || 'Folder')}</div>
      </div>
      <div id="doc-content-pane" class="ev-content-pane" style="margin-top:8px"></div>`;
    document.getElementById('doc-back-btn').addEventListener('click', () => history.back());
    renderFolderFilesPane(dirPath, document.getElementById('doc-content-pane'));
    return;
  }

  // Find doc metadata from treeData (docs are nested under epics/features)
  let docMeta = null;
  let parentKey = '';
  if (Array.isArray(treeData)) {
    outer:
    for (const epic of treeData) {
      const epicDocs = Array.isArray(epic.docs) ? epic.docs : [];
      for (const doc of epicDocs) {
        const k = doc.key || doc.path || doc.title || '';
        if (k === docKey) { docMeta = doc; parentKey = epic.key || ''; break outer; }
      }
      const features = Array.isArray(epic.features) ? epic.features : [];
      for (const feature of features) {
        const fDocs = Array.isArray(feature.docs) ? feature.docs : [];
        for (const doc of fDocs) {
          const k = doc.key || doc.path || doc.title || '';
          if (k === docKey) { docMeta = doc; parentKey = feature.key || epic.key || ''; break outer; }
        }
      }
    }
  }

  // Title: use docMeta title if available; otherwise just the filename (basename of path)
  const rawPath = docMeta ? (docMeta.path || docKey) : docKey;
  const baseName = rawPath.split('/').pop() || rawPath;
  const docTitle = docMeta ? escapeHtml(docMeta.title || baseName) : escapeHtml(baseName);

  // Path subtitle — always the full relative path with a copy button
  const pathCopyBtn = `<button class="copy-btn" data-copy-value="${escapeHtml(rawPath)}" title="Copy path">⎘</button>`;
  const pathSubtitle = `<span style="word-break:break-all;color:var(--fg-dim);font-size:12px;font-family:'SF Mono',monospace">${escapeHtml(rawPath)}</span>${pathCopyBtn}`;

  // Parent row — only shown when there's a real parent key
  const parentRowHtml = parentKey
    ? `<div class="props-grid" style="margin-bottom:0"><span class="props-label">Parent</span><span class="props-value"><span class="mono">${escapeHtml(parentKey)}</span></span></div>`
    : '';

  content.innerHTML = `
    <button class="content-back-link" id="doc-back-btn">← Back</button>
    <div class="entity-view-header" style="display:flex;align-items:flex-start;justify-content:space-between">
      <div>
        <div class="entity-view-title ev-title">${docTitle}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:2px">${pathSubtitle}</div>
      </div>
      <button class="toggle-btn ev-edit-btn" id="ev-edit-btn" disabled title="Edit file" style="margin-left:12px;flex-shrink:0;align-self:center">✎ Edit</button>
    </div>
    ${parentRowHtml}
    <div id="doc-content-pane" class="ev-content-pane" style="margin-top:${parentKey ? '16px' : '8px'}"></div>`;
  document.getElementById('doc-back-btn').addEventListener('click', () => history.back());

  // Async render markdown content
  const pane = document.getElementById('doc-content-pane');

  // Wire edit button after DOM is ready
  const docEditBtn = document.getElementById('ev-edit-btn');
  if (docEditBtn) {
    docEditBtn.addEventListener('click', () => {
      enterEditMode(pane);
    });
  }

  renderMarkdownPane(docKey, pane);
}

/**
 * Scrolls the sidebar to make the node with the given key visible.
 * Called programmatically when selectedKey is set externally.
 * @param {string} key - entity key matching a data-key attribute in the sidebar
 */
function scrollSidebarToKey(key) {
  if (!key) return;
  const node = document.querySelector(`#sidebar-content [data-key="${CSS.escape(key)}"]`);
  if (node) {
    node.scrollIntoView({ block: 'nearest' });
  }
}

/**
 * Builds an HTML string for a status dot circle.
 * @param {string} status
 * @returns {string} HTML string
 */
function buildStatusDotHtml(status) {
  const color = getStatusColor(status || 'todo');
  return `<span class="status-dot" style="background:${escapeHtml(color)}" title="${escapeHtml(status || '')}"></span>`;
}

/**
 * Builds an HTML string for an arrow button (expandable) or a spacer (non-expandable).
 * @param {boolean} expandable
 * @param {boolean} expanded
 * @param {string} key - used as data attribute for event delegation
 * @returns {string} HTML string
 */
function buildArrowHtml(expandable, expanded, key) {
  if (!expandable) {
    return `<span class="tree-arrow-spacer"></span>`;
  }
  const symbol = expanded ? '▼' : '▶';
  return `<span class="tree-arrow" data-arrow-key="${escapeHtml(key)}">${symbol}</span>`;
}

/**
 * Builds an HTML string for a single tree node row.
 * @param {Object} opts
 * @param {string} opts.key
 * @param {string} opts.title
 * @param {string} opts.status
 * @param {string} opts.nodeClass - CSS class for indentation level (e.g. 'tree-node-epic')
 * @param {boolean} opts.expandable
 * @param {boolean} opts.expanded
 * @param {boolean} opts.bold - if true wraps key in <strong>
 * @returns {string} HTML string
 */
function buildNodeHtml({ key, title, status, nodeClass, expandable, expanded, bold }) {
  const isSelected = key === selectedKey;
  const selectedClass = isSelected ? ' selected' : '';
  const cancelledClass = isCancelledStatus(status) ? ' entity-cancelled' : '';
  const arrowHtml = buildArrowHtml(expandable, expanded, key);
  const dotHtml = buildStatusDotHtml(status);
  const keyLabel = bold
    ? `<strong class="tree-node-key">${escapeHtml(key)}</strong>`
    : `<span class="tree-node-key">${escapeHtml(key)}</span>`;
  const titleHtml = `<span class="tree-node-title">${escapeHtml(title || '')}</span>`;
  return `<div class="tree-node ${escapeHtml(nodeClass)}${selectedClass}${cancelledClass}" data-key="${escapeHtml(key)}" data-select-key="${escapeHtml(key)}">${arrowHtml}${dotHtml}${keyLabel}${titleHtml}</div>`;
}

/**
 * Builds an HTML string for a task node.
 * @param {Object} task - task object from hierarchy
 * @returns {string} HTML string
 */
function buildTaskNodeHtml(task) {
  return buildNodeHtml({
    key: task.key || '',
    title: task.title || '',
    status: task.status || 'todo',
    nodeClass: 'tree-node-task',
    expandable: false,
    expanded: false,
    bold: false,
  });
}

/**
 * Builds an HTML string for a doc node.
 * @param {Object} doc - doc object (has .title and optionally .key or .path)
 * @param {'epic'|'feature'} level
 * @returns {string} HTML string
 */
function buildDocNodeHtml(doc, level) {
  const key = doc.key || doc.path || doc.title || '';
  // Show only the filename portion of path-like keys (e.g. "docs/plan/E27/foo.md" → "foo.md")
  const displayKey = key.includes('/') ? key.split('/').pop() : key;
  const nodeClass = level === 'epic' ? 'tree-node-doc-epic' : 'tree-node-doc-feature';
  return `<div class="tree-node ${nodeClass}" data-key="${escapeHtml(key)}" data-select-key="${escapeHtml(key)}"><span class="tree-arrow-spacer"></span>${buildStatusDotHtml(doc.status || '')}<span class="tree-node-key">${escapeHtml(displayKey)}</span><span class="tree-node-title">${escapeHtml(doc.title || '')}</span></div>`;
}

/**
 * Builds an HTML string for a feature node and its children (tasks + docs) when expanded.
 * @param {Object} feature - feature object from hierarchy
 * @param {string} epicKey
 * @returns {string} HTML string
 */
function buildFeatureNodeHtml(feature, epicKey) {
  const featureKey = feature.key || '';
  const isExpanded = expandedFeatures.has(featureKey);
  let html = buildNodeHtml({
    key: featureKey,
    title: feature.title || '',
    status: feature.status || 'todo',
    nodeClass: 'tree-node-feature',
    expandable: true,
    expanded: isExpanded,
    bold: false,
  });

  if (isExpanded) {
    // Render tasks
    const tasks = Array.isArray(feature.tasks) ? feature.tasks : [];
    for (const task of tasks) {
      if (!showCompleted && task.status === 'completed') continue;
      html += buildTaskNodeHtml(task);
    }
    // Render feature-level docs
    const docs = Array.isArray(feature.docs) ? feature.docs : [];
    for (const doc of docs) {
      html += buildDocNodeHtml(doc, 'feature');
    }
    // Render folder files link when showAllFiles is enabled
    if (showAllFiles && feature.file_path) {
      const featureDir = parentDir(feature.file_path);
      const folderKey = FOLDER_KEY_PREFIX + featureDir;
      html += `<div class="tree-node tree-node-flat tree-node-folder" data-select-key="${escapeHtml(folderKey)}" data-folder-path="${escapeHtml(featureDir)}"><span class="tree-arrow-spacer"></span><span class="tree-node-folder-icon">📂</span><span class="tree-node-title" style="color:var(--fg-dim);font-style:italic">Folder files</span></div>`;
    }
  }

  return html;
}

/**
 * Builds an HTML string for an epic node and its children (features + docs).
 * Features start collapsed; epics start expanded.
 * @param {Object} epic - epic object from treeData hierarchy
 * @returns {string} HTML string
 */
function buildEpicNodeHtml(epic) {
  const epicKey = epic.key || '';
  const isExpanded = expandedEpics.has(epicKey);
  let html = buildNodeHtml({
    key: epicKey,
    title: epic.title || '',
    status: epic.status || 'todo',
    nodeClass: 'tree-node-epic',
    expandable: true,
    expanded: isExpanded,
    bold: true,
  });

  if (isExpanded) {
    // Render features
    const features = Array.isArray(epic.features) ? epic.features : [];
    for (const feature of features) {
      if (!showCompleted && feature.status === 'completed') continue;
      html += buildFeatureNodeHtml(feature, epicKey);
    }
    // Render epic-level docs
    const docs = Array.isArray(epic.docs) ? epic.docs : [];
    for (const doc of docs) {
      html += buildDocNodeHtml(doc, 'epic');
    }
    // Render folder files link when showAllFiles is enabled
    if (showAllFiles && epic.file_path) {
      const epicDir = parentDir(epic.file_path);
      const folderKey = FOLDER_KEY_PREFIX + epicDir;
      html += `<div class="tree-node tree-node-flat tree-node-folder" data-select-key="${escapeHtml(folderKey)}" data-folder-path="${escapeHtml(epicDir)}"><span class="tree-arrow-spacer"></span><span class="tree-node-folder-icon">📂</span><span class="tree-node-title" style="color:var(--fg-dim);font-style:italic">Folder files</span></div>`;
    }
  }

  return html;
}

/**
 * Builds an HTML string for a flat section (Ideas, Change Cards, Tags, Tech Debt).
 * Only called when items is a non-empty array.
 * @param {string} title - section title (shown as uppercase label)
 * @param {Array} items - array of items with .key/.title/.status
 * @returns {string} HTML string
 */
function buildFlatSectionHtml(title, items) {
  if (!Array.isArray(items) || items.length === 0) return '';
  const filtered = showCompleted ? items : items.filter(i => i.status !== 'completed');
  if (filtered.length === 0) return '';
  let html = `<div class="sidebar-section-header">${escapeHtml(title)}</div>`;
  for (const item of filtered) {
    const key = item.key || String(item.id || '');
    const isSelected = key === selectedKey;
    const selectedClass = isSelected ? ' selected' : '';
    const cancelledClass = isCancelledStatus(item.status) ? ' entity-cancelled' : '';
    html += `<div class="tree-node tree-node-flat${selectedClass}${cancelledClass}" data-key="${escapeHtml(key)}" data-select-key="${escapeHtml(key)}"><span class="tree-arrow-spacer"></span>${buildStatusDotHtml(item.status || '')}<span class="tree-node-key">${escapeHtml(key)}</span><span class="tree-node-title">${escapeHtml(item.title || '')}</span></div>`;
  }
  return html;
}

/**
 * Renders the sidebar tree navigator. Populates #sidebar-content
 * and wires up expand/collapse and click-to-select via event delegation.
 *
 * Structure:
 * - "HIERARCHY" section header
 * - Epic nodes (start expanded) → Feature nodes (start collapsed) → Task nodes
 * - Epic-level and feature-level doc nodes (italic, muted)
 * - Flat sections (Ideas, Change Cards, Tags, Tech Debt) — only if items exist
 */
function renderSidebar() {
  const sidebarContent = document.getElementById('sidebar-content');
  if (!sidebarContent) return;

  let html = '';

  // ── Filter bar ──
  html += `<div class="sidebar-filter-bar">
    <label class="sidebar-filter-label">
      <input type="checkbox" id="show-completed-checkbox"${showCompleted ? ' checked' : ''}>
      Show completed
    </label>
    <label class="sidebar-filter-label">
      <input type="checkbox" id="show-all-files-checkbox"${showAllFiles ? ' checked' : ''}>
      Show all files
    </label>
  </div>`;

  // ── Hierarchy section ──
  html += `<div class="sidebar-section-header">Hierarchy</div>`;
  for (const epic of treeData) {
    if (!showCompleted && epic.status === 'completed') continue;
    html += buildEpicNodeHtml(epic);
  }

  // ── Flat sections — only render when data is present ──
  if (treeData.length === 0 && !summaryData) {
    // No data loaded yet — render nothing extra
  }

  // Bugs (from hierarchy flat section)
  const bugs = Array.isArray(hierarchyData?.bugs) ? hierarchyData.bugs : [];
  html += buildFlatSectionHtml('Bugs', bugs);

  // Change Cards (from hierarchy flat section)
  const changeCards = Array.isArray(hierarchyData?.change_cards) ? hierarchyData.change_cards : [];
  html += buildFlatSectionHtml('Change Cards', changeCards);

  // Ideas (from hierarchy flat section)
  const ideas = Array.isArray(hierarchyData?.ideas) ? hierarchyData.ideas : [];
  html += buildFlatSectionHtml('Ideas', ideas);

  sidebarContent.innerHTML = html;

  // Wire show-completed checkbox
  const showCompletedCb = document.getElementById('show-completed-checkbox');
  if (showCompletedCb) {
    showCompletedCb.onchange = function() {
      showCompleted = this.checked;
      renderSidebar();
    };
  }
  const showAllFilesCb = document.getElementById('show-all-files-checkbox');
  if (showAllFilesCb) {
    showAllFilesCb.onchange = function() {
      showAllFiles = this.checked;
      if (showAllFiles) {
        // Auto-expand all epics so Folder files links become visible
        for (const epic of treeData) {
          expandedEpics.add(epic.key || '');
        }
      }
      renderSidebar();
    };
  }

  // Wire event delegation once per render
  // Remove previous listeners by replacing the element's handler.
  // We use a single delegated click listener on sidebar-content.
  sidebarContent.onclick = function(e) {
    // Copy buttons are handled by the global delegation handler — skip here
    if (e.target.closest('.copy-btn')) return;

    const arrowEl = e.target.closest('[data-arrow-key]');
    if (arrowEl) {
      // Expand/collapse — do NOT select
      const key = arrowEl.getAttribute('data-arrow-key');
      // Determine entity level from nearby node class
      const parentNode = arrowEl.closest('.tree-node');
      if (parentNode && parentNode.classList.contains('tree-node-epic')) {
        if (expandedEpics.has(key)) {
          expandedEpics.delete(key);
        } else {
          expandedEpics.add(key);
        }
      } else {
        // Feature
        if (expandedFeatures.has(key)) {
          expandedFeatures.delete(key);
        } else {
          expandedFeatures.add(key);
        }
      }
      renderSidebar();
      return;
    }

    // Node body click — select entity or doc
    const nodeEl = e.target.closest('[data-select-key]');
    if (nodeEl) {
      const key = nodeEl.getAttribute('data-select-key');
      if (key) {
        if (key.startsWith(FOLDER_KEY_PREFIX)) {
          const folderPath = nodeEl.getAttribute('data-folder-path') || key.slice(FOLDER_KEY_PREFIX.length);
          openFolderView(folderPath);
          return;
        }
        selectedKey = key;
        // Doc nodes (italic in sidebar) go to doc_view; all others go to entity_view
        if (nodeEl.classList.contains('tree-node-doc-epic') || nodeEl.classList.contains('tree-node-doc-feature')) {
          appState = 'doc_view';
        } else {
          const clickedEntity = findEntityByKey(key);
          entityViewTab = 'overview';
          appState = 'entity_view';
        }
        pushNavState();
        render();
      }
    }
  };
}

document.addEventListener('DOMContentLoaded', () => {
  // Auto-load project data immediately — shark web is always pre-connected to
  // a single project, so no folder selection is needed.
  loadProjectData();

  // Pick Folder button (main screen) — triggers full data load
  document.getElementById('pick-folder-btn').addEventListener('click', () => {
    loadProjectData();
  });

  // Browser popstate — restore state when back/forward is pressed
  window.addEventListener('popstate', (e) => {
    restoreNavState(e.state);
  });

  // Header: Dashboard title → return to dashboard
  document.getElementById('header-dashboard-btn').addEventListener('click', () => {
    if (appState === 'entity_view' || appState === 'doc_view') {
      selectedKey = null;
      appState = 'dashboard';
      history.replaceState({ appState, selectedKey: null, entityViewTab: 'overview' }, '');
      render();
    }
  });

  // Header: Refresh button → reload all cached data
  document.getElementById('header-refresh-btn').addEventListener('click', () => {
    loadProjectData();
  });

  // Header: Pick Folder button → return to pick_folder
  document.getElementById('header-pick-folder-btn').addEventListener('click', () => {
    appState = 'pick_folder';
    render();
  });

  // Global copy button delegation — handles .copy-btn elements anywhere in the document
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const value = btn.dataset.copyValue || '';
    if (navigator.clipboard) {
      navigator.clipboard.writeText(value)
        .then(() => showToast('Copied!'))
        .catch(() => showToast('Copy failed', 'error'));
    } else {
      showToast('Clipboard unavailable', 'error');
    }
  });

  // Keyboard: Escape → cancel edit first, then close open drawer, then go back in history
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (editMode) {
        cancelEdit();
        return;
      }
      if (appState === 'entity_view' && entityViewTab === 'transitions') {
        // Transitions drawer open — close it first
        entityViewTab = 'info';
        renderEntityView();
      } else if (appState === 'entity_view' || appState === 'doc_view') {
        history.back();
      }
    }
  });

  // Keyboard: Enter / Space → activate any [data-navigate-key][role="button"] element.
  // Added once globally for breadcrumb segments, child-table KEY cells, and any other
  // keyboard-focusable navigation targets. REQ-NF-002, AC-NF-002.1, E27-F09-005.
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-navigate-key][role="button"]')) {
      e.preventDefault();
      const k = e.target.getAttribute('data-navigate-key');
      if (k) navigateToEntity(k);
    }
  });
});

/** Cache: dirPath → FolderFilesResponse, cleared on project reload. */
const folderFilesCache = new Map();

/**
 * Fetches and renders the folder files listing in the given pane element.
 * Uses an in-memory cache keyed by dirPath to avoid re-fetching on every tab switch.
 */
async function renderFolderFilesPane(dirPath, paneEl) {
  if (!dirPath) {
    paneEl.innerHTML = `<div class="content-placeholder">No folder path available.</div>`;
    return;
  }

  let result = folderFilesCache.get(dirPath);
  if (!result) {
    paneEl.innerHTML = `<div class="content-placeholder">Loading folder files\u2026</div>`;
    try {
      result = await apiGetFolderFiles(dirPath);
      if (result) folderFilesCache.set(dirPath, result);
    } catch (err) {
      paneEl.innerHTML = `<div class="content-placeholder">Failed to load folder files.</div>`;
      return;
    }
  }

  if (!result || !result.entries || result.entries.length === 0) {
    paneEl.innerHTML = `<div class="content-placeholder">No files found in <code>${escapeHtml(dirPath)}</code>.</div>`;
    return;
  }

  let html = `<div class="folder-files-pane"><div class="folder-files-header">${escapeHtml(result.dir_path || dirPath)}</div><div class="folder-files-list">`;
  // Add ../ entry when not at the project root
  if (dirPath !== '.' && dirPath !== '') {
    html += `<div class="folder-file-item folder-file-dir" data-folder-path="${escapeHtml(parentDir(dirPath))}">📁 <span class="folder-file-name">../</span></div>`;
  }
  for (const entry of result.entries) {
    const icon = entry.is_dir ? '📁' : fileIcon(entry.name);
    const sizeStr = (!entry.is_dir && entry.size > 0) ? formatFileSize(entry.size) : '';
    const sizeHtml = sizeStr ? `<span class="folder-file-size">${escapeHtml(sizeStr)}</span>` : '';
    if (entry.is_dir) {
      html += `<div class="folder-file-item folder-file-dir" data-folder-path="${escapeHtml(entry.path)}">${icon} <span class="folder-file-name">${escapeHtml(entry.name)}</span>${sizeHtml}</div>`;
    } else {
      html += `<div class="folder-file-item" data-file-path="${escapeHtml(entry.path)}">${icon} <span class="folder-file-name">${escapeHtml(entry.name)}</span>${sizeHtml}</div>`;
    }
  }
  html += `</div></div>`;
  paneEl.innerHTML = html;

  // Single delegated click handler for the whole list
  paneEl.querySelector('.folder-files-list').addEventListener('click', (e) => {
    const item = e.target.closest('.folder-file-item');
    if (!item) return;
    const filePath = item.getAttribute('data-file-path');
    if (filePath) {
      selectedKey = filePath;
      appState = 'doc_view';
      pushNavState();
      render();
      return;
    }
    const folderPath = item.getAttribute('data-folder-path');
    if (folderPath) {
      pushNavState();
      renderFolderFilesPane(folderPath, paneEl);
    }
  });
}

/**
 * Opens a folder view for the given dirPath by navigating to the nearest
 * entity and opening the Files tab, or rendering directly if no entity found.
 */
function openFolderView(dirPath) {
  // Try to find an entity whose file_path is in this dir
  for (const epic of treeData) {
    const epicDir = epic.file_path ? parentDir(epic.file_path) : '';
    if (epicDir === dirPath) {
      selectedKey = epic.key;
      entityViewTab = 'files';
      appState = 'entity_view';
      pushNavState();
      render();
      return;
    }
    for (const feature of (epic.features || [])) {
      const fDir = feature.file_path ? parentDir(feature.file_path) : '';
      if (fDir === dirPath) {
        selectedKey = feature.key;
        entityViewTab = 'files';
        appState = 'entity_view';
        pushNavState();
        render();
        return;
      }
    }
  }
  // No entity found — open doc view with a synthetic folder key
  selectedKey = FOLDER_KEY_PREFIX + dirPath;
  appState = 'doc_view';
  pushNavState();
  render();
}

/** Returns the parent directory of a relative file path (strips the last segment). */
function parentDir(filePath) {
  const lastSlash = filePath.lastIndexOf('/');
  return lastSlash === -1 ? '.' : filePath.substring(0, lastSlash);
}

/**
 * Returns a file icon character based on the file extension.
 */
function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  switch(ext) {
    case 'md': case 'markdown': return '📝';
    case 'go': return '🔵';
    case 'js': case 'ts': return '📜';
    case 'json': return '📋';
    case 'yaml': case 'yml': return '⚙️';
    case 'sh': case 'bash': return '💻';
    case 'png': case 'jpg': case 'gif': case 'svg': return '🖼️';
    case 'pdf': return '📄';
    default: return '📃';
  }
}

/**
 * Formats a file size in bytes as a human-readable string.
 */
function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

/**
 * Fetches the folder file listing from the API.
 */
async function apiGetFolderFiles(dirPath) {
  const resp = await fetch('/api/v1/viewer/folder-files/' + encodeURIComponent(dirPath).replace(/%2F/g, '/'));
  if (!resp.ok) throw new Error('folder files fetch failed: ' + resp.status);
  return resp.json();
}
