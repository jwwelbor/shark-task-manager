// ============================================================

/**
 * Performs the full initial data load sequence when "Pick Folder" is clicked.
 *
 * Load order:
 * 1. Show loading state
 * 2. Fetch workflow-meta (non-blocking — uses STATUS_COLORS as fallback)
 * 2b. Fetch tag vocabulary (non-blocking — E28-F06 REQ-F-017, AC-12)
 * 3. Fetch hierarchy (blocking — failure stays on Pick Folder + shows error)
 * 4. Seed expandedEpics with all epic keys from hierarchy
 * 5. Fetch summary + recent-activity in parallel
 * 6. Transition to dashboard state
 *
 * Partial failure (summary/activity): proceeds to dashboard; affected
 * sections show inline "Failed to load" markers via null cache values.
 */
async function loadProjectData() {
  showLoading();

  // Step 2: workflow-meta (non-blocking)
  try {
    const meta = await apiGetWorkflowMeta();
    if (meta && meta.statuses) {
      workflowMeta = meta;
      // Supplement STATUS_COLORS: add statuses from meta not already known
      for (const [status, info] of Object.entries(meta.statuses)) {
        if (!(status in STATUS_COLORS)) {
          STATUS_COLORS[status] = (info && info.color) ? info.color : '#666666';
        }
      }
    }
  } catch {
    // workflow-meta failure is non-fatal; STATUS_COLORS is the fallback
  }

  // Step 2b: tag vocabulary (non-blocking — E28-F06; empty vocabulary is fine)
  await loadVocabulary();

  // Step 3: hierarchy (blocking — critical)
  let hierarchy;
  try {
    hierarchy = await apiGetHierarchy(undefined, showCompleted);
  } catch (err) {
    hideLoading();
    showError('Failed to load project hierarchy. Please check the server and try again.');
    // Remain on Pick Folder screen — do NOT transition
    return;
  }

  // Step 4: set treeData + hierarchyData; on initial load start fully collapsed
  hierarchyData = hierarchy;
  treeData = Array.isArray(hierarchy?.epics) ? hierarchy.epics : [];
  projectName = hierarchy?.project_name || '';
  updateHeaderProjectName();
  sprintOverviewData = null;
  sprintOverviewLoading = false;
  sprintOverviewLoaded = false;
  sprintOverviewError = null;
  sprintPlanData = null;
  sprintPlanLoading = false;
  sprintPlanLoaded = false;
  sprintPlanError = null;
  sprintReportData = null;
  sprintReportLoading = false;
  sprintReportLoaded = false;
  sprintReportError = null;
  sprintTreeExpandedScopes = new Set(['active']);
  sprintPlanFilters = { status: '', agent: '', assignment: '' };
  sprintPlanSelection = new Set();
  sprintSelectedKey = null;
  cameFromSprint = false;
  folderFilesCache.clear();
  if (appState === 'pick_folder') {
    // First load: start fully collapsed — epics expand on first user interaction
    expandedEpics = new Set();
    expandedFeatures = new Set();
  }
  // Refresh: preserve existing expansion state (don't auto-expand new epics)

  // Step 5: summary + recent-activity in parallel (non-blocking)
  const [summary, activity] = await Promise.all([
    apiGetSummary(),
    apiGetRecentActivity(25),
  ]);

  // Step 6: update caches (null = failed to load; renders handle gracefully)
  summaryData    = summary;   // null if failed
  recentActivity = Array.isArray(activity?.records) ? activity.records : [];

  hideLoading();

  // Transition to dashboard (default state before URL-param restore)
  appState = 'dashboard';
  history.replaceState({ appState, selectedKey: null, entityViewTab: 'overview', sprintViewTab, sprintSelectedKey: null, cameFromSprint: false }, '');
  render();

  // Restore entity + tab from URL query params on initial load so bookmarks
  // and page refreshes return to the correct view (T-E27-F09-012).
  const urlParams = new URLSearchParams(location.search);
  const urlEntity = urlParams.get('entity');
  const urlTab    = urlParams.get('tab');
  if (urlEntity) {
    // Navigate to the entity; then set the requested tab if valid.
    navigateToEntity(urlEntity);
    if (urlTab && TAB_DISPLAY_NAMES.hasOwnProperty(urlTab)) {
      entityViewTab = urlTab;
    }
    // Replace (not push) so the initial URL doesn't create a spurious history entry.
    const url = new URL(window.location.href);
    url.searchParams.set('entity', urlEntity);
    url.searchParams.set('tab', entityViewTab || 'overview');
    history.replaceState({ appState, selectedKey, entityViewTab, sprintViewTab, sprintSelectedKey, cameFromSprint }, '', url);
    render();
  }
}

function loadSidebarSectionState() {
  try {
    const raw = localStorage.getItem(SIDEBAR_SECTION_STORAGE_KEY);

    const parsed = JSON.parse(raw);
    return Object.assign({}, SIDEBAR_SECTION_DEFAULTS, parsed && typeof parsed === 'object' ? parsed : {});
  } catch (e) {
    return Object.assign({}, SIDEBAR_SECTION_DEFAULTS);
  }

function persistSidebarSectionState() {
  try {
    localStorage.setItem(SIDEBAR_SECTION_STORAGE_KEY, JSON.stringify(sidebarSectionState));
  } catch (e) {}
}

function isSidebarSectionExpanded(sectionId) {
  if (!sectionId) return true;

  if (!sectionId) return;
  sidebarSectionState[sectionId] = !!expanded;

  if (!sectionId) return;

function areAllSidebarSectionsExpanded() {
  return Object.keys(SIDEBAR_SECTION_DEFAULTS).every(sectionId => isSidebarSectionExpanded(sectionId));
}

  for (const sectionId of Object.keys(SIDEBAR_SECTION_DEFAULTS)) {

/**
 * Main render dispatcher. Reads appState and calls the
 * appropriate render function. Also updates body class
 * for CSS-driven show/hide of header/sidebar.
 */
function render() {
  const body = document.body;
  // Remove all state classes
  body.className = body.className.replace(/\bstate-\S+/g, '').trim();
  // Add current state class
  body.classList.add('state-' + appState);
  updateHeaderModeButtons();

  switch (appState) {
    case 'pick_folder':
      renderPickFolder();
      break;
    case 'dashboard':
      renderSidebar();
      renderDashboard();
      break;
    case 'sprint':
      renderSidebar();
      renderSprintMode();
      break;
    case 'entity_view':
      renderSidebar();
      renderEntityView();
      break;
    case 'doc_view':
      renderSidebar();
      renderDocView();
      break;
    default:
      renderPickFolder();
  }
}

/**
 * Saves the current navigation state to browser history so the back button works.
 * Call after every intentional navigation (entity select, doc open, dashboard).
 * Encodes entity key and tab into the URL as query params so bookmarks and
 * page refreshes restore the correct view (T-E27-F09-012).
 */
function pushNavState() {
  const state = { appState, selectedKey, entityViewTab, sprintViewTab, sprintSelectedKey, cameFromSprint };
  const url = new URL(window.location.href);
  if (appState === 'entity_view' && selectedKey) {
    url.searchParams.set('entity', selectedKey);
    url.searchParams.set('tab', entityViewTab || 'overview');
  } else {
    url.searchParams.delete('entity');
    url.searchParams.delete('tab');
  }
  history.pushState(state, '', url);
}

/**
 * Updates the current history entry in-place (no new back-button entry).
 * Use for tab switches within an entity view — the URL stays bookmarkable
 * but the back button is not polluted with per-tab clicks.
 */
function replaceNavState() {
  const state = { appState, selectedKey, entityViewTab, sprintViewTab, sprintSelectedKey, cameFromSprint };
  const url = new URL(window.location.href);
  if (appState === 'entity_view' && selectedKey) {
    url.searchParams.set('entity', selectedKey);
    url.searchParams.set('tab', entityViewTab || 'overview');
  } else {
    url.searchParams.delete('entity');
    url.searchParams.delete('tab');
  }
  history.replaceState(state, '', url);
}

/**
 * Restores app state from a history entry (called on popstate).
 */
function restoreNavState(state) {
  if (!state) return;
  appState      = state.appState      || 'dashboard';
  selectedKey   = state.selectedKey   || null;
  entityViewTab = state.entityViewTab || 'overview';
  sprintViewTab = isValidSprintViewTab(state.sprintViewTab) ? state.sprintViewTab : 'overview';
  sprintSelectedKey = state.sprintSelectedKey || null;
  cameFromSprint = !!state.cameFromSprint;
  render();
}

function switchTopLevelMode(mode, options) {
  const opts = options || {};
  if (mode === 'sprint') {
    sprintViewTab = isValidSprintViewTab(sprintViewTab) ? sprintViewTab : 'overview';
    appState = 'sprint';
    cameFromSprint = false;
    if (!opts.keepSelection) {
      selectedKey = sprintSelectedKey || null;
    }
    if (opts.pushState === false) {
      replaceNavState();
    } else {
      pushNavState();
    }
    render();
    return;
  }

  if (mode === 'dashboard') {
    appState = 'dashboard';
    selectedKey = null;
    sprintSelectedKey = sprintSelectedKey || null;
    cameFromSprint = false;
    if (opts.pushState === false) {
      replaceNavState();
    } else {
      pushNavState();
    }
    render();
    return;
  }
}

/**
 * Navigates to an entity by key: expands ancestor nodes in the sidebar tree,
 * sets selectedKey, switches to entity_view, renders, and scrolls into view.
 * No-op if key is not found in treeData (logs warning).
 * @param {string} key - entity key (e.g. "E07", "E07-F01", "E07-F01-001")
 */
function navigateToEntity(key, fromSprint) {
  if (!key) return;
  cameFromSprint = !!fromSprint;

  // Determine entity type and expand ancestors
  // Epic: E## — just expand the epic itself
  // Feature: E##-F## or F## — expand parent epic + the feature
  // Task: E##-F##-### or T-E##-F##-### — expand parent epic + parent feature
  // Bug: B### — flat list, no expansion needed
  if (Array.isArray(treeData)) {
    let found = false;
    for (const epic of treeData) {
      if (epic.key === key) {
        // It's an epic — expand it
        expandedEpics.add(epic.key);
        found = true;
        break;
      }
      const features = Array.isArray(epic.features) ? epic.features : [];
      for (const feature of features) {
        if (feature.key === key) {
          // It's a feature — expand parent epic + the feature
          expandedEpics.add(epic.key);
          expandedFeatures.add(feature.key);
          found = true;
          break;
        }
        const tasks = Array.isArray(feature.tasks) ? feature.tasks : [];
        for (const task of tasks) {
          if (task.key === key) {
            // It's a task — expand parent epic + parent feature
            expandedEpics.add(epic.key);
            expandedFeatures.add(feature.key);
            found = true;
            break;
          }
        }
        if (found) break;
      }
      if (found) break;
    }
    if (!found) {
      console.warn('[navigateToEntity] key not found in treeData:', key);
    }
  }

  selectedKey = key;
  // Default to Overview tab for all entity types (E27-F09; replaces E27-F08 epic→dashboard branching)
  entityViewTab = 'overview';
  appState = 'entity_view';
  pushNavState();
  render();
  scrollSidebarToKey(key);
}

/**
 * Renders the Status Breakdown section.
 * Grid of cards — one per entity type that has items.
 * Data source: summaryData.{epics,features,tasks,bugs,tech_debts}.status_counts (project-wide),
 * or treeData filtered to epicKey (epic-scoped).
 * @param {string} [epicKey] - Optional. When provided, filters to that epic's entities.
 * @returns {string} HTML string
 */
function renderStatusBreakdown(epicKey) {
  // Epic-scoped path: derive counts from treeData filtered by epicKey
  if (epicKey) {
    const epic = (treeData || []).find(e => e.key === epicKey);
    if (!epic) return `<div class="content-placeholder">Epic not found</div>`;

    const featureCounts = {};
    const taskCounts    = {};
    const epicCounts    = {};
    epicCounts[epic.status || 'unknown'] = (epicCounts[epic.status || 'unknown'] || 0) + 1;

    for (const f of (epic.features || [])) {
      const s = f.status || 'unknown';
      featureCounts[s] = (featureCounts[s] || 0) + 1;
      for (const t of (f.tasks || [])) {
        const ts = t.status || 'unknown';
        taskCounts[ts] = (taskCounts[ts] || 0) + 1;
      }
    }

    const toByStatus = obj => Object.entries(obj).map(([status, count]) => ({
      status, count, color: getStatusColor(status),
    }));

    const epicTypes = [
      ['EPICS',    toByStatus(epicCounts)],
      ['FEATURES', toByStatus(featureCounts)],
      ['TASKS',    toByStatus(taskCounts)],
    ];

    let cards = '';
    for (const [label, byStatus] of epicTypes) {
      if (!Array.isArray(byStatus) || byStatus.length === 0) continue;
      const total = byStatus.reduce((sum, s) => sum + (s.count || 0), 0);
      if (total === 0) continue;

      const active = byStatus
        .filter(s => !isTerminalStatus(s.status || ''))
        .reduce((sum, s) => sum + (s.count || 0), 0);
      const activeHtml = (active < total)
        ? `<span class="breakdown-card-active">${active} active</span>`
        : '';

      let badges = '';
      for (const s of byStatus) {
        if (!s.count) continue;
        const color = normalizeToHex(s.color || getStatusColor(s.status));
        const lbl = escapeHtml((s.status || '').replace(/_/g, ' ')) + ' ' + s.count;
        badges += `<span class="status-badge status-badge-sm" style="background:${escapeHtml(color)};color:${getContrastColor(color)}">${lbl}</span>`;
      }

      cards += `
        <div class="breakdown-card">
          <div class="breakdown-card-label">${escapeHtml(label)}</div>
          <div class="breakdown-card-total">${total}${activeHtml}</div>
          <div class="breakdown-badges">${badges}</div>
        </div>`;
    }

    if (!cards) return `<div class="content-placeholder">No entity data available</div>`;
    return `<div class="breakdown-grid">${cards}</div>`;
  }

  // Project-wide path (unchanged)
  if (!summaryData) {
    return `<div class="content-placeholder">Failed to load status data</div>`;
  }

  // Entity types to display: [label, byStatus array]
  // API returns by_status as [{status, count, color, phase, progress_weight}, ...]
  const entityTypes = [
    ['EPICS',        summaryData?.epics?.by_status],
    ['FEATURES',     summaryData?.features?.by_status],
    ['TASKS',        summaryData?.tasks?.by_status],
    ['BUGS',         summaryData?.bugs?.by_status],
    ['TECH DEBT',    summaryData?.tech_debts?.by_status],
    ['IDEAS',        summaryData?.ideas?.by_status],
    ['CHANGE CARDS', summaryData?.change_cards?.by_status],
  ];

  let cards = '';
  for (const [label, byStatus] of entityTypes) {
    if (!Array.isArray(byStatus) || byStatus.length === 0) continue;

    const total = byStatus.reduce((sum, s) => sum + (s.count || 0), 0);
    if (total === 0) continue;

    // Active = non-terminal statuses (exclude completed, cancelled, done, etc.)
    const active = byStatus
      .filter(s => !isTerminalStatus(s.status || '') && (s.phase || '') !== 'done')
      .reduce((sum, s) => sum + (s.count || 0), 0);
    const activeHtml = (active < total)
      ? `<span class="breakdown-card-active">${active} active</span>`
      : '';

    let badges = '';
    for (const s of byStatus) {
      if (!s.count) continue;
      const color = normalizeToHex(s.color || getStatusColor(s.status));
      const label2 = escapeHtml((s.status || '').replace(/_/g, ' ')) + ' ' + s.count;
      badges += `<span class="status-badge status-badge-sm" style="background:${escapeHtml(color)};color:${getContrastColor(color)}">${label2}</span>`;
    }

    cards += `
      <div class="breakdown-card">
        <div class="breakdown-card-label">${escapeHtml(label)}</div>
        <div class="breakdown-card-total">${total}${activeHtml}</div>
        <div class="breakdown-badges">${badges}</div>
      </div>`;
  }

  if (!cards) {
    return `<div class="content-placeholder">No entity data available</div>`;
  }

  return `<div class="breakdown-grid">${cards}</div>`;
}

/**
 * Renders the Feature Progress section.
 * List of features with horizontal progress bars derived from treeData task counts.
 * @param {string} [epicKey] - Optional. When provided, filters to that epic's features only.
 * @returns {string} HTML string
 */
function renderFeatureProgress(epicKey) {
  const epics = epicKey
    ? (treeData || []).filter(e => e.key === epicKey)
    : (treeData || []);

  if (epics.length === 0) {
    return `<div class="content-placeholder">No features found</div>`;
  }

  let rows = '';
  for (const epic of epics) {
    const features = Array.isArray(epic.features) ? epic.features : [];
    for (const feature of features) {
      const featureKey = feature.key || '';
      const tasks = Array.isArray(feature.tasks) ? feature.tasks : [];
      const total = tasks.length;
      const completed = tasks.filter(t => t.status === 'completed' || t.status === 'done').length;
      const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
      const pctStr = pct + '%';

      rows += `
        <div class="progress-row">
          <span class="progress-key" data-navigate-key="${escapeHtml(featureKey)}">${escapeHtml(featureKey)}</span>
          <span class="progress-title">${escapeHtml(feature.title || '')}</span>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" style="width:${pct}%;background:var(--accent)"></div>
          </div>
          <span class="progress-pct">${pctStr}</span>
        </div>`;
    }
  }

  if (!rows) {
    return `<div class="content-placeholder">No features found</div>`;
  }

  return `<div class="progress-list">${rows}</div>`;
}

/**
 * Renders the Active Transitions section.
 * Shows the last 25 transitions from recentActivity, newest first.
 * Each row: date, key (clickable), from-badge → to-badge, note, optional Open button.
 * @param {string} [epicKey] - Optional. When provided, filters to transitions for entities in that epic.
 * @returns {string} HTML string
 */
function renderActiveTransitions(epicKey) {
  if (!recentActivity || recentActivity.length === 0) {
    return `<div class="content-placeholder">No recent transitions</div>`;
  }

  let filteredActivity = recentActivity;
  if (epicKey) {
    // Build membership set from treeData: epic key + its features + its tasks
    const epic = (treeData || []).find(e => e.key === epicKey);
    const keys = new Set();
    if (epic) {
      keys.add(epic.key);
      for (const f of (epic.features || [])) {
        keys.add(f.key);
        for (const t of (f.tasks || [])) keys.add(t.key);
      }
    }
    filteredActivity = recentActivity.filter(r => keys.has(r.key));
  }

  if (filteredActivity.length === 0) {
    return `<div class="content-placeholder">No recent transitions</div>`;
  }

  // recentActivity is already sorted newest-first by the API; take up to 25
  const rows = filteredActivity.slice(0, 25);

  let html = '<table class="activity-table"><tbody>';
  for (let i = 0; i < rows.length; i++) {
    const rec         = rows[i];
    const key         = rec.key        || '';
    const fromStatus  = rec.from_status || '';
    const toStatus    = rec.to_status   || '';
    const note        = rec.note        || '';
    const changedAt   = rec.changed_at  || '';

    const dateStr     = escapeHtml(formatDateTime(changedAt));
    const keyHtml     = `<span class="activity-key" data-navigate-key="${escapeHtml(key)}">${escapeHtml(key)}</span>`;

    const fromColor   = getStatusColor(fromStatus);
    const fromLabel   = escapeHtml(fromStatus.replace(/_/g, ' '));
    const fromBadge   = fromStatus
      ? `<span class="status-badge status-badge-sm" style="background:${escapeHtml(fromColor)};color:${getContrastColor(fromColor)}">${fromLabel}</span>`
      : '';

    const toColor     = getStatusColor(toStatus);
    const toLabel     = escapeHtml(toStatus.replace(/_/g, ' '));
    const toBadge     = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(toColor)};color:${getContrastColor(toColor)}">${toLabel}</span>`;

    // Duration: find the previous transition for this same entity key.
    // If none exists in the activity log, fall back to the entity's created_at.
    let duration = '—';
    const tCurr = new Date(changedAt);
    let prevActivityTs = '';
    for (let j = i + 1; j < filteredActivity.length; j++) {
      if (filteredActivity[j].key === key) {
        prevActivityTs = filteredActivity[j].changed_at || '';
        break;
      }
    }
    const prevTs = prevActivityTs || (findEntityByKey(key)?.created_at || '');
    if (prevTs) {
      const tPrev = new Date(prevTs);
      if (!isNaN(tCurr) && !isNaN(tPrev) && tCurr >= tPrev) {
        duration = formatDuration(tCurr - tPrev);
      }
    }
    const durationCell = duration === '—' ? '—' : `for ${duration}`;

    const noteTd = note
      ? `<td class="activity-note" title="${escapeHtml(note)}">${escapeHtml(note)}</td>`
      : '<td></td>';

    html += `
      <tr>
        <td class="activity-date">${dateStr}</td>
        <td>${keyHtml}</td>
        <td class="activity-badge-cell">${fromBadge}</td>
        <td class="activity-duration">${durationCell}</td>
        <td class="activity-arrow">\u2192</td>
        <td class="activity-badge-cell">${toBadge}</td>
        ${noteTd}
      </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

/**
 * Renders the Stale Entities section.
 * Client-side filter: entities not in a terminal status whose updated_at is > 7 days ago.
 * Sorted by staleness descending (oldest first = most days since update at top).
 * @param {string} [epicKey] - Optional. When provided, filters to entities in that epic only.
 * @returns {string} HTML string
 */
function renderStaleEntities(epicKey) {
  /** @type {Array<{key:string, status:string, title:string, updated_at:string, days:number}>} */
  const stale = [];

  // Walk treeData: epics → features. Guard with ?. on updated_at per spec.
  const epics = epicKey
    ? (treeData || []).filter(e => e.key === epicKey)
    : (treeData || []);
  for (const epic of epics) {
    if (epic?.updated_at && !isTerminalStatus(epic.status || '')) {
      const days = daysSince(epic.updated_at);
      if (days > 7) {
        stale.push({
          key:        epic.key || '',
          status:     epic.status || '',
          title:      epic.title || '',
          updated_at: epic.updated_at,
          days,
        });
      }
    }

    const features = Array.isArray(epic?.features) ? epic.features : [];
    for (const feature of features) {
      if (feature?.updated_at && !isTerminalStatus(feature.status || '')) {
        const days = daysSince(feature.updated_at);
        if (days > 7) {
          stale.push({
            key:        feature.key || '',
            status:     feature.status || '',
            title:      feature.title || '',
            updated_at: feature.updated_at,
            days,
          });
        }
      }

      const tasks = Array.isArray(feature?.tasks) ? feature.tasks : [];
      for (const task of tasks) {
        if (task?.updated_at && !isTerminalStatus(task.status || '')) {
          const days = daysSince(task.updated_at);
          if (days > 7) {
            stale.push({
              key:        task.key || '',
              status:     task.status || '',
              title:      task.title || '',
              updated_at: task.updated_at,
              days,
            });
          }
        }
      }
    }
  }

  if (!epicKey) {
    const techDebts = Array.isArray(hierarchyData?.tech_debts) ? hierarchyData.tech_debts : [];
    for (const td of techDebts) {
      if (td?.updated_at && !isTerminalStatus(td.status || '')) {
        const days = daysSince(td.updated_at);
        if (days > 7) {
          stale.push({
            key:        td.key || '',
            status:     td.status || '',
            title:      td.title || '',
            updated_at: td.updated_at,
            days,
          });
        }
      }
    }
  }

  if (stale.length === 0) {
    return `<div class="content-placeholder">No stale entities found</div>`;
  }

  // Sort descending by days (oldest first = highest daysSince at top)
  stale.sort((a, b) => b.days - a.days);

  let html = '<table class="activity-table"><tbody>';
  for (const item of stale) {
    const color    = getStatusColor(item.status);
    const label    = escapeHtml(item.status.replace(/_/g, ' '));
    const badge    = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(color)};color:${getContrastColor(color)}">${label}</span>`;
    const keyHtml  = `<span class="activity-key" data-navigate-key="${escapeHtml(item.key)}">${escapeHtml(item.key)}</span>`;
    const daysText = escapeHtml(item.days + ' days ago');

    html += `
      <tr>
        <td>${keyHtml}</td>
        <td>${badge}</td>
        <td class="activity-note">${escapeHtml(item.title)}</td>
        <td class="activity-date">${daysText}</td>
      </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

/**
 * Builds an SVG donut chart from a by_status array.
 * Uses the stroke-dasharray + rotation technique: each segment is a full circle
 * with only a portion of the circumference visible, rotated to its starting angle.
 * @param {Array<{status:string, count:number, color:string}>} byStatus
 * @param {number} size - SVG size in px (default 100)
 * @returns {string} SVG HTML string, or '' if no data
 */
function buildDonutChart(byStatus, size = 100) {
  if (!Array.isArray(byStatus)) return '';
  const total = byStatus.reduce((sum, s) => sum + (s.count || 0), 0);
  if (total === 0) return '';

  const strokeW = Math.max(12, Math.round(size * 0.14));
  const r = (size - strokeW - 2) / 2;
  const cx = size / 2;
  const cy = size / 2;
  const C = 2 * Math.PI * r;

  // Background track
  let svg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-3)" stroke-width="${strokeW}"/>`;

  let cumDeg = 0;
  for (const s of byStatus) {
    if (!s.count) continue;
    const pct = s.count / total;
    const dash = pct * C;
    const gap = C - dash;
    const hex = normalizeToHex(s.color || getStatusColor(s.status || ''));
    // Rotate so each segment starts right after the previous one.
    // stroke-dashoffset C/4 positions the first dash at 12 o'clock.
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${escapeHtml(hex)}" stroke-width="${strokeW}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(C / 4).toFixed(2)}" transform="rotate(${cumDeg} ${cx} ${cy})" stroke-linecap="butt"/>`;
    cumDeg += pct * 360;
  }

  // Center total label
  const fontSize = Math.max(10, Math.round(size * 0.18));
  svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="var(--fg)" font-size="${fontSize}px" font-weight="700" font-family="system-ui,sans-serif">${total}</text>`;

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${svg}</svg>`;
}

/**
 * Renders the Entity Charts section.
 * One donut chart per entity type (epics, features, tasks, bugs, tech debt, ideas, change cards)
 * plus an overall "All Entities" chart showing type distribution.
 * @param {string} [epicKey] - Optional. When provided, builds charts from treeData for that epic.
 * @returns {string} HTML string, or '' if no data
 */
function renderEntityCharts(epicKey) {
  // Epic-scoped path: derive counts from treeData
  if (epicKey) {
    const epic = (treeData || []).find(e => e.key === epicKey);
    if (!epic) return '';

    const featureCounts = {};
    const taskCounts    = {};
    const epicCounts    = {};
    epicCounts[epic.status || 'unknown'] = (epicCounts[epic.status || 'unknown'] || 0) + 1;

    for (const f of (epic.features || [])) {
      const s = f.status || 'unknown';
      featureCounts[s] = (featureCounts[s] || 0) + 1;
      for (const t of (f.tasks || [])) {
        const ts = t.status || 'unknown';
        taskCounts[ts] = (taskCounts[ts] || 0) + 1;
      }
    }

    const toByStatus = obj => Object.entries(obj).map(([status, count]) => ({
      status, count, color: getStatusColor(status),
    }));

    const epicTypeConfigs = [
      { label: 'Epics',    byStatus: toByStatus(epicCounts),    overallColor: '#4d4dbb' },
      { label: 'Features', byStatus: toByStatus(featureCounts), overallColor: '#22a362' },
      { label: 'Tasks',    byStatus: toByStatus(taskCounts),    overallColor: '#e7b30e' },
    ];

    // Build "Active Entities" slice for epic scope
    const overallByStatus = [];
    for (const tc of epicTypeConfigs) {
      const active = tc.byStatus
        .filter(s => !isTerminalStatus(s.status || ''))
        .reduce((sum, s) => sum + (s.count || 0), 0);
      if (active > 0) {
        overallByStatus.push({ status: tc.label, count: active, color: tc.overallColor });
      }
    }

    let cells = '';

    if (overallByStatus.length > 0) {
      const chartSvg = buildDonutChart(overallByStatus, 100);
      if (chartSvg) {
        let legend = '';
        for (const s of overallByStatus) {
          const hex = normalizeToHex(s.color);
          legend += `<div class="chart-legend-item">
            <span class="chart-legend-dot" style="background:${escapeHtml(hex)}"></span>
            <span>${escapeHtml(s.status)}</span>
            <span class="chart-legend-count">${s.count}</span>
          </div>`;
        }
        cells += `<div class="chart-cell">
          <div class="chart-title">Active Entities</div>
          ${chartSvg}
          <div class="chart-legend">${legend}</div>
        </div>`;
      }
    }

    for (const tc of epicTypeConfigs) {
      if (!tc.byStatus || tc.byStatus.length === 0) continue;
      const chartSvg = buildDonutChart(tc.byStatus, 100);
      if (!chartSvg) continue;
      let legend = '';
      for (const s of tc.byStatus) {
        if (!s.count) continue;
        const hex = normalizeToHex(s.color || getStatusColor(s.status || ''));
        legend += `<div class="chart-legend-item">
          <span class="chart-legend-dot" style="background:${escapeHtml(hex)}"></span>
          <span>${escapeHtml((s.status || '').replace(/_/g, ' '))}</span>
          <span class="chart-legend-count">${s.count}</span>
        </div>`;
      }
      cells += `<div class="chart-cell">
        <div class="chart-title">${escapeHtml(tc.label)}</div>
        ${chartSvg}
        <div class="chart-legend">${legend}</div>
      </div>`;
    }

    if (!cells) return '';
    return `<div class="charts-grid">${cells}</div>`;
  }

  // Project-wide path (unchanged)
  if (!summaryData) return '';

  const typeConfigs = [
    { label: 'Epics',        data: summaryData.epics,        overallColor: '#4d4dbb' },
    { label: 'Features',     data: summaryData.features,     overallColor: '#22a362' },
    { label: 'Tasks',        data: summaryData.tasks,        overallColor: '#e7b30e' },
    { label: 'Bugs',         data: summaryData.bugs,         overallColor: '#c0392b' },
    { label: 'Tech Debt',    data: summaryData.tech_debts,   overallColor: '#f97316' },
    { label: 'Ideas',        data: summaryData.ideas,        overallColor: '#60a5fa' },
    { label: 'Change Cards', data: summaryData.change_cards, overallColor: '#8c4dbb' },
  ];

  // Helper: compute active (non-terminal) count for an entity type's by_status array.
  function activeCount(byStatus) {
    if (!Array.isArray(byStatus)) return 0;
    return byStatus
      .filter(s => !isTerminalStatus(s.status || '') && (s.phase || '') !== 'done')
      .reduce((sum, s) => sum + (s.count || 0), 0);
  }

  // Build "All Entities" slice list: one slice per type (active counts only)
  const overallByStatus = [];
  for (const tc of typeConfigs) {
    if (!tc.data) continue;
    const active = activeCount(tc.data.by_status);
    if (active > 0) {
      overallByStatus.push({ status: tc.label, count: active, color: tc.overallColor });
    }
  }

  let cells = '';

  // Overall chart (active counts)
  if (overallByStatus.length > 0) {
    const chartSvg = buildDonutChart(overallByStatus, 100);
    if (chartSvg) {
      let legend = '';
      for (const s of overallByStatus) {
        const hex = normalizeToHex(s.color);
        legend += `<div class="chart-legend-item">
          <span class="chart-legend-dot" style="background:${escapeHtml(hex)}"></span>
          <span>${escapeHtml(s.status)}</span>
          <span class="chart-legend-count">${s.count}</span>
        </div>`;
      }
      cells += `<div class="chart-cell">
        <div class="chart-title">Active Entities</div>
        ${chartSvg}
        <div class="chart-legend">${legend}</div>
      </div>`;
    }
  }

  // Per-type charts
  for (const tc of typeConfigs) {
    if (!tc.data || !Array.isArray(tc.data.by_status) || tc.data.total === 0) continue;
    const chartSvg = buildDonutChart(tc.data.by_status, 100);
    if (!chartSvg) continue;
    let legend = '';
    for (const s of tc.data.by_status) {
      if (!s.count) continue;
      const hex = normalizeToHex(s.color || getStatusColor(s.status || ''));
      legend += `<div class="chart-legend-item">
        <span class="chart-legend-dot" style="background:${escapeHtml(hex)}"></span>
        <span>${escapeHtml((s.status || '').replace(/_/g, ' '))}</span>
        <span class="chart-legend-count">${s.count}</span>
      </div>`;
    }
    cells += `<div class="chart-cell">
      <div class="chart-title">${escapeHtml(tc.label)}</div>
      ${chartSvg}
      <div class="chart-legend">${legend}</div>
    </div>`;
  }

  if (!cells) return '';
  return `<div class="charts-grid">${cells}</div>`;
}

/**
 * Renders the Dashboard view (State 2).
 * Orchestrates 4 sections:
 *   1. Status Breakdown (Task 4)
 *   2. Feature Progress (Task 4)
 *   3. Active Transitions (Task 5)
 *   4. Stale Entities (Task 5)
 */
function renderDashboard() {
  const content = document.getElementById('content');

  const chartsHtml = renderEntityCharts();

  const html = `
    ${chartsHtml ? `<div class="dashboard-section">
      <div class="dashboard-section-title">Entity Charts</div>
      ${chartsHtml}
    </div>` : ''}
    <div class="dashboard-section">
      <div class="dashboard-section-title">Status Overview</div>
      ${renderStatusBreakdown()}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Feature Progress</div>
      ${renderFeatureProgress()}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Recent Activity</div>
      ${renderActiveTransitions()}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Stale Entities</div>
      ${renderStaleEntities()}
    </div>
  `;

  content.innerHTML = html;

  // Wire click handlers for feature keys → navigateToEntity
  content.querySelectorAll('[data-navigate-key]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-navigate-key');
      if (key) navigateToEntity(key);
    });
  });
}

/**
 * Renders the epic-scoped dashboard inside an entity-view pane.
 * Mirrors renderDashboard() but passes epicKey to each section for client-side filtering.
 * No new fetch() calls — uses existing treeData and recentActivity.
 * @param {string} epicKey
 * @param {HTMLElement} paneEl
 */
function renderEpicDashboardPane(epicKey, paneEl) {
  const chartsHtml = renderEntityCharts(epicKey);
  paneEl.innerHTML = `
    ${chartsHtml ? `<div class="dashboard-section">
      <div class="dashboard-section-title">Entity Charts</div>
      ${chartsHtml}
    </div>` : ''}
    <div class="dashboard-section">
      <div class="dashboard-section-title">Status Overview</div>
      ${renderStatusBreakdown(epicKey)}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Feature Progress</div>
      ${renderFeatureProgress(epicKey)}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Recent Activity</div>
      ${renderActiveTransitions(epicKey)}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Stale Entities</div>

  // Reuse existing delegation for [data-navigate-key]
  paneEl.querySelectorAll('[data-navigate-key]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.getAttribute('data-navigate-key');
      if (k) navigateToEntity(k);

}

/**
 * entityViewTab controls which pane is shown in entity view.
 * Values: 'overview' | 'info' | 'transitions' | 'files' | 'dashboard'
 * Default is 'overview' (set by navigateToEntity).
 */
let entityViewTab = 'overview';

// ============================================================
// Edit mode state variables (T-E27-F07-004)
// ============================================================
/** Whether the content pane is in edit mode. */
let editMode = false;
/** Raw markdown before edit — used by Cancel to restore the previous view. */
let editOriginalContent = '';
/** Relative path from FileResponse — sent to PUT /api/v1/edit/file. */
let editFilePath = '';
/** The pane element that owns the current edit UI. */
let editPaneEl = null;

/**
 * Finds an entity in treeData by key.
 * Walks epics → features → tasks recursively.
 * @param {string} key - entity key to find
 * @returns {Object|null} entity object or null if not found
 */
function findEntityByKey(key) {
  if (!key || !Array.isArray(treeData)) return null;

  for (const epic of treeData) {
    if (epic.key === key) return Object.assign({ type: 'epic' }, epic);

    const features = Array.isArray(epic.features) ? epic.features : [];
    for (const feature of features) {
      if (feature.key === key) return Object.assign({ type: 'feature', parent: epic.key }, feature);

      const tasks = Array.isArray(feature.tasks) ? feature.tasks : [];
      for (const task of tasks) {
        if (task.key === key) return Object.assign({ type: 'task', parent: feature.key }, task);
      }
    }
  }

  // Also search flat sections (bugs, change_cards, tech_debts, ideas) from hierarchy
  if (hierarchyData) {
    const flatLists = [
      ['bug',         hierarchyData.bugs],
      ['change_card', hierarchyData.change_cards],
      ['tech_debt',   hierarchyData.tech_debts],
      ['idea',        hierarchyData.ideas],
      ['question',    hierarchyData.questions],
    ];
    for (const [type, items] of flatLists) {
      if (!Array.isArray(items)) continue;
      for (const item of items) {
        const k = item.key || String(item.id || '');
        if (k === key) return Object.assign({ type }, item);
      }
    }
  }

  return null;
}

/**
 * Maps internal tab IDs to human-readable display names for the breadcrumb.
 * Used by renderBreadcrumb to append the active tab as the last segment.
 * T-E27-F09-012.
 */
const TAB_DISPLAY_NAMES = {
  overview:    'Overview',
  dashboard:   'Dashboard',
  info:        'Spec',
  transitions: 'History',
  files:       'Files',
};

/**
 * Renders the breadcrumb navigation bar for an entity.
 * Builds the parent chain from hierarchyData without a network call.
 * Returns an HTML string to insert between the entity title and the properties panel.
 * REQ-F-003, AC-003.1–AC-003.4, E27-F09-005.
 * Appends the active tab name as the final plain-text segment (T-E27-F09-012).
 * @param {Object} entity - entity object with type, key, and parent fields
 * @returns {string} HTML string for the breadcrumb
 */
function renderBreadcrumb(entity) {
  if (!entity) return '';
  const chain = []; // [{key}]
  switch (entity.type) {
    case 'task': {
      // entity.parent = feature key (set by findEntityByKey)
      // Derive epic key by looking up the parent feature in treeData
      const featureKey = entity.parent;
      let epicKey = null;
      if (featureKey && Array.isArray(treeData)) {
        for (const epic of treeData) {
          const features = Array.isArray(epic.features) ? epic.features : [];
          if (features.some(f => f.key === featureKey)) { epicKey = epic.key; break; }
        }
      }
      if (epicKey) chain.push({ key: epicKey });
      if (featureKey) chain.push({ key: featureKey });
      chain.push({ key: entity.key });
      break;
    }
    case 'feature': {
      // entity.parent = epic key (set by findEntityByKey)
      if (entity.parent) chain.push({ key: entity.parent });
      chain.push({ key: entity.key });
      break;
    }
    case 'epic':
      chain.push({ key: entity.key });
      break;
    default:
      return ''; // bug / change-card / tech-debt / idea — no breadcrumb
  }
  // Filter out segments with undefined/empty keys (guard for missing parent data)
  const validChain = chain.filter(seg => seg.key);
  if (validChain.length === 0) return '';

  // Mark the last entity segment as current — but only if no tab segment follows.
  // We always append a tab segment when an entity is selected.
  const tabName = TAB_DISPLAY_NAMES[entityViewTab] || entityViewTab;
  // All entity segments are navigable (not current) because the tab segment is the real current.
  const segHtml = validChain.map(seg =>
    `<span class="breadcrumb-seg" role="button" tabindex="0" data-navigate-key="${escapeHtml(seg.key)}">${escapeHtml(seg.key)}</span>`
  ).join('<span class="breadcrumb-sep">›</span>');

  // Tab segment: plain text, not a link (isCurrent: true styling)
  const tabSegHtml = `<span class="breadcrumb-sep">›</span><span class="breadcrumb-seg current">${escapeHtml(tabName)}</span>`;

  return `<div class="breadcrumb">${segHtml}${tabSegHtml}</div>`;
}

/**
 * Renders the entity metadata properties panel.
 * 2-column CSS grid: label | value.
 * Omits fields that are null/undefined.
 * @param {Object} entity - entity object from treeData / flat list
 * @returns {string} HTML string
 */
/**
 * Pushes a label+value row into the rows array.
 * Omits the row if valueHtml is null, undefined, or empty string (AC-003.7).
 * @param {string[]} rows
 * @param {string} label
 * @param {string|null|undefined} valueHtml
 */
function pushRow(rows, label, valueHtml) {
  if (valueHtml === null || valueHtml === undefined || valueHtml === '') return;
  rows.push(`<div class="props-label">${escapeHtml(label)}</div><div class="props-value">${valueHtml}</div>`);
}

/**
 * Returns a monospace-styled HTML span for a value, or null if falsy.
 * @param {string|null|undefined} v
 * @returns {string|null}
 */
function monoCell(v) {
  return v ? `<span class="mono">${escapeHtml(v)}</span>` : null;
}

/**
 * Returns a status badge HTML string, or null if status is falsy.
 * @param {string|null|undefined} s
 * @returns {string|null}
 */
function statusBadgeCell(s) {
  if (!s) return null;
  const c = getStatusColor(s);
  return `<span class="status-badge" style="background:${escapeHtml(c)};color:${getContrastColor(c)}">${escapeHtml(s.replace(/_/g,' '))}</span>`;
}

// ----- E27-F11: size badge helpers -----

/** Canonical t-shirt size labels. Mirrors internal/models/size.go:25. */
const SIZE_LABELS = { 1: 'XS', 2: 'S', 3: 'M', 5: 'L', 8: 'XL', 13: 'XXL' };

/**
 * Returns the t-shirt label for a canonical size integer, or the raw integer
 * as a string for non-canonical values (REQ-F-007 defensive fallback).
 * Returns '' for null/undefined.
 * @param {number|null|undefined} n
 * @returns {string}
 */
function formatSizeLabel(n) {
  if (n == null) return '';
  return SIZE_LABELS[n] || String(n);
}

/**
 * Builds a small size badge HTML span, or '' when size is absent (AC-T1).
 * All values are run through escapeHtml for XSS safety (AC-T4).
 * @param {number|null|undefined} size
 * @returns {string}
 */
function buildSizeBadgeHtml(size) {
  if (size == null) return '';
  const label = formatSizeLabel(size);
  return `<span class="size-badge" title="size ${escapeHtml(String(size))}">${escapeHtml(label)}</span>`;
}

/**
 * Appends epic-specific fields to the rows array. (AC-003.1)
 * @param {string[]} rows
 * @param {Object} e - epic entity
 */
function appendEpicFields(rows, e) {
  if (e.priority != null)       pushRow(rows, 'Priority',       String(e.priority));
  if (e.business_value != null) pushRow(rows, 'Business Value', String(e.business_value));
  if (e.progress_pct != null)   pushRow(rows, 'Progress',       e.progress_pct + '%');
  if (e.phase)                  pushRow(rows, 'Phase',          escapeHtml(e.phase));
  if (e.approval_backlog_count) pushRow(rows, 'Approval Backlog', String(e.approval_backlog_count));
  if (e.feature_status_rollup && typeof e.feature_status_rollup === 'object') {
    const chips = Object.entries(e.feature_status_rollup).map(([s, n]) => {
      const c = getStatusColor(s);
      return `<span class="status-badge status-badge-sm" style="background:${escapeHtml(c)};color:${getContrastColor(c)}">${escapeHtml(s.replace(/_/g,' '))} ${n}</span>`;
    }).join(' ');
    pushRow(rows, 'Feature Rollup', chips || null);
  }
  if (e.size != null) pushRow(rows, 'Size', escapeHtml(formatSizeLabel(e.size)) + ' (' + escapeHtml(String(e.size)) + ')');
}

/**
 * Appends feature-specific fields to the rows array. (AC-003.2)
 * @param {string[]} rows
 * @param {Object} e - feature entity
 */
function appendFeatureFields(rows, e) {
  if (e.progress_pct != null)   pushRow(rows, 'Progress',           e.progress_pct + '%');
  if (e.execution_order != null) pushRow(rows, 'Execution Order',   String(e.execution_order));
  if (e.phase)                  pushRow(rows, 'Phase',              escapeHtml(e.phase));
  if (e.phase_description)      pushRow(rows, 'Phase Description',  escapeHtml(e.phase_description));
  if (e.display_mode)           pushRow(rows, 'Display Mode',       escapeHtml(e.display_mode));
  if (e.workflow_position && typeof e.workflow_position === 'object') {
    const wp = e.workflow_position;
    if (wp.current_index != null && wp.statuses && wp.statuses.length) {
      pushRow(rows, 'Workflow Position', `${escapeHtml(String(wp.current_index + 1))}/${escapeHtml(String(wp.statuses.length))}`);
    }
  }
  if (e.size != null) pushRow(rows, 'Size', escapeHtml(formatSizeLabel(e.size)) + ' (' + escapeHtml(String(e.size)) + ')');
}

/**
 * Appends task-specific fields to the rows array. (AC-003.3)
 * @param {string[]} rows
 * @param {Object} e - task entity
 */
function appendTaskFields(rows, e) {
  const agentVal = e.agent_type || e.agent;
  if (agentVal)                     pushRow(rows, 'Agent',              escapeHtml(agentVal));
  if (e.priority != null)           pushRow(rows, 'Priority',           String(e.priority));
  if (e.execution_order != null)    pushRow(rows, 'Execution Order',    String(e.execution_order));
  if (e.completed_at)               pushRow(rows, 'Completed',          escapeHtml(formatDate(e.completed_at)));
  if (e.rejection_count != null)    pushRow(rows, 'Rejection Count',    String(e.rejection_count));
  if (e.verification_status)        pushRow(rows, 'Verification',       escapeHtml(e.verification_status));
  if (e.tests_passed != null)       pushRow(rows, 'Tests Passed',       String(e.tests_passed));
  if (Array.isArray(e.dependencies) && e.dependencies.length) {
    const depHtml = e.dependencies.map(d => `<span class="mono">${escapeHtml(d)}</span>`).join(', ');
    pushRow(rows, 'Dependencies', depHtml);
  } else if (e.dependencies && typeof e.dependencies === 'string' && e.dependencies) {
    pushRow(rows, 'Dependencies', `<span class="mono">${escapeHtml(e.dependencies)}</span>`);
  }
  if (Array.isArray(e.blocked_by) && e.blocked_by.length) {
    pushRow(rows, 'Blocked By', e.blocked_by.map(d => `<span class="mono">${escapeHtml(d)}</span>`).join(', '));
  }
  if (Array.isArray(e.blocks) && e.blocks.length) {
    pushRow(rows, 'Blocks', e.blocks.map(d => `<span class="mono">${escapeHtml(d)}</span>`).join(', '));
  }
  if (e.size != null) pushRow(rows, 'Size', escapeHtml(formatSizeLabel(e.size)) + ' (' + escapeHtml(String(e.size)) + ')');
}

/**
 * Renders the orchestrator action collapsible <details> block (AC-003.6).
 * The block defaults to closed (no open attribute).
 * Returns '' if oa is absent or not an object.
 * @param {Object|null|undefined} oa - orchestrator_action object
 * @returns {string} HTML string
 */
function renderOrchestratorDetails(oa) {
  if (!oa || typeof oa !== 'object') return '';
  const innerRows = [];
  if (oa.action)     innerRows.push(`<div class="props-label">${escapeHtml('Action')}</div><div class="props-value">${escapeHtml(oa.action)}</div>`);
  if (oa.agent_type) innerRows.push(`<div class="props-label">${escapeHtml('Agent')}</div><div class="props-value">${escapeHtml(oa.agent_type)}</div>`);
  if (oa.model)      innerRows.push(`<div class="props-label">${escapeHtml('Model')}</div><div class="props-value">${escapeHtml(oa.model)}</div>`);
  if (Array.isArray(oa.skills) && oa.skills.length)
    innerRows.push(`<div class="props-label">${escapeHtml('Skills')}</div><div class="props-value">${oa.skills.map(escapeHtml).join(', ')}</div>`);
  const instr = oa.instruction
    ? `<pre class="orch-instruction" style="white-space:pre-wrap;margin:8px 0 0">${escapeHtml(oa.instruction)}</pre>`
    : '';
  return `
    <details class="orch-action">
      <summary>Orchestrator Action</summary>
      <div class="props-grid" style="margin-top:8px">${innerRows.join('')}</div>
      ${instr}
    </details>`;
}

/**
 * Renders the properties panel for an entity using a dispatch-by-type pattern.
 * Omits fields that are null/undefined/empty (AC-003.7).
 * @param {Object} entity - entity object from treeData / flat list
 * @returns {string} HTML string
 */
function renderPropertiesPanel(entity, extraRows = []) {
  if (!entity) return '';

  // Helper: copy-to-clipboard button (uses data attribute + global delegation handler)
  function copyBtn(value) {
    return `<button class="copy-btn" data-copy-value="${escapeHtml(value)}" title="Copy to clipboard">⎘</button>`;
  }

  const rows = [];

  // Shared base fields
  // Note: Key row removed — key is shown as the blue link above the title (T-E27-F09-011)
  // Note: Parent row removed — parent is shown in the breadcrumb (T-E27-F09-011)
  pushRow(rows, 'Status', statusBadgeCell(entity.status));
  pushRow(rows, 'Type',   entity.type ? escapeHtml(entity.type) : null);

  // Type-specific fields
  switch (entity.type) {
    case 'epic':        appendEpicFields(rows, entity);        break;
    case 'feature':     appendFeatureFields(rows, entity);     break;
    case 'task':        appendTaskFields(rows, entity);        break;
    case 'bug':         appendBugFields(rows, entity);         break;
    case 'change_card': appendChangeCardFields(rows, entity);  break;
    case 'tech_debt':   appendTechDebtFields(rows, entity);    break;
    case 'idea':        appendIdeaFields(rows, entity);        break; // E27-F11 D5
  }

  // Shared trailing timestamps and paths
  if (entity.created_at) pushRow(rows, 'Created', escapeHtml(formatDate(entity.created_at)));
  if (entity.updated_at) pushRow(rows, 'Updated', escapeHtml(formatDate(entity.updated_at)));
  if (entity.file_path)  pushRow(rows, 'File Path',
    `<span style="word-break:break-all">${escapeHtml(entity.file_path)}</span>${copyBtn(entity.file_path)}`);
  if (entity.linked_content_path) pushRow(rows, 'Content Path',
    `<span style="word-break:break-all">${escapeHtml(entity.linked_content_path)}</span>${copyBtn(entity.linked_content_path)}`);

  // Trailing orchestrator-action disclosure (collapsible, outside the grid)
  const orchHtml = renderOrchestratorDetails(entity.orchestrator_action);

  // Status left-border accent (REQ-F-012, AC-012.1–AC-012.3)
  const statusColor = entity.status ? getStatusColor(entity.status) : '';
  const accentStyle = statusColor
    ? ` style="border-left:3px solid ${escapeHtml(statusColor)}" data-status-accent="${escapeHtml(entity.status)}"`
    : '';

  const allRows = rows.concat(extraRows);
  const grid = allRows.length
    ? `<div class="props-grid"${accentStyle}>${allRows.join('')}</div>`
    : '';
  return grid + orchHtml;
}

function mutationRouteSegment(entityType) {
  switch (entityType) {
    case 'epic':
      return 'epics';
    case 'feature':
      return 'features';
    case 'task':
      return 'tasks';
    default:
      return '';
  }
}

function mutationLevelMeta(entityType) {
  return workflowMeta && workflowMeta.levels ? workflowMeta.levels[entityType] || null : null;
}

function mutationTargetsForEntity(entity) {
  const meta = mutationLevelMeta(entity?.type || '');
  if (!meta || !Array.isArray(meta.transitions)) return [];
  const currentStatus = entity?.status || '';
  const seen = new Set();
  const targets = [];
  for (const transition of meta.transitions) {
    if (transition.from !== currentStatus || !transition.to || seen.has(transition.to)) continue;
    seen.add(transition.to);
    targets.push(transition.to);
  }
  return targets;
}

function mutationField(label, controlHtml) {
  return `
    <label class="mutation-field">
      <span class="mutation-field-label">${escapeHtml(label)}</span>
      ${controlHtml}
    </label>`;
}

function mutationTextInput(name, value, attrs = '') {
  return `<input class="mutation-input" name="${escapeHtml(name)}" value="${escapeHtml(value == null ? '' : String(value))}" ${attrs}>`;
}

function mutationNumberInput(name, value, attrs = '') {
  return `<input class="mutation-input" type="number" name="${escapeHtml(name)}" value="${escapeHtml(value == null || value === '' ? '' : String(value))}" ${attrs}>`;
}

function mutationTextArea(name, value, attrs = '') {
  return `<textarea class="mutation-textarea" name="${escapeHtml(name)}" ${attrs}>${escapeHtml(value == null ? '' : String(value))}</textarea>`;
}

function mutationSelect(name, value, options) {
  const opts = (Array.isArray(options) ? options : []).map(opt => {
    const optionValue = typeof opt === 'object' ? opt.value : opt;
    const optionLabel = typeof opt === 'object' ? (opt.label ?? opt.value) : opt;
    const selected = String(optionValue) === String(value) ? ' selected' : '';
    return `<option value="${escapeHtml(String(optionValue))}"${selected}>${escapeHtml(String(optionLabel))}</option>`;
  }).join('');
  return `<select class="mutation-select" name="${escapeHtml(name)}">${opts}</select>`;
}

function noteTypeOptions(value) {
  return mutationSelect('note_type', value || 'comment', [
    { value: 'comment', label: 'Comment' },
    { value: 'decision', label: 'Decision' },
    { value: 'blocker', label: 'Blocker' },
    { value: 'solution', label: 'Solution' },
    { value: 'reference', label: 'Reference' },
    { value: 'implementation', label: 'Implementation' },
    { value: 'testing', label: 'Testing' },
    { value: 'future', label: 'Future' },
    { value: 'question', label: 'Question' },
    { value: 'rejection', label: 'Rejection' },
    { value: 'requirement', label: 'Requirement' },
  ]);
}

function relationshipTypeOptions(entityType, value) {
  const options = [
    { value: 'depends_on', label: 'Depends On' },
    { value: 'blocks', label: 'Blocks' },
    { value: 'related_to', label: 'Related To' },
    { value: 'follows', label: 'Follows' },
    { value: 'spawned_from', label: 'Spawned From' },
    { value: 'duplicates', label: 'Duplicates' },
    { value: 'references', label: 'References' },
    { value: 'linked_to', label: 'Linked To' },
  ];
  // question_blocks is intentionally source-aware. The server enforces the
  // remaining directed target rule, so an invalid pasted target is rejected.
  if (entityType === 'question') {
    options.push({ value: 'question_blocks', label: 'Question Blocks' });
  }
  return mutationSelect('relationship_type', value || 'related_to', options);
}

function renderMutationPatchFields(entity) {
  const rows = [
    mutationField('Title', mutationTextInput('title', entity.title || '', 'required')),
    mutationField('Description', mutationTextArea('description', entity.description || '', 'rows="4" placeholder="Optional"')),
  ];

  switch (entity.type) {
    case 'epic':
      rows.push(mutationField('Priority', mutationSelect('priority', entity.priority || '', [
        { value: 'high', label: 'High' },
        { value: 'medium', label: 'Medium' },
        { value: 'low', label: 'Low' },
      ])));
      rows.push(mutationField('Business Value', mutationSelect('business_value', entity.business_value || '', [
        { value: '', label: 'No change' },
        { value: 'high', label: 'High' },
        { value: 'medium', label: 'Medium' },
        { value: 'low', label: 'Low' },
      ])));
      break;
    case 'feature':
      rows.push(mutationField('Execution Order', mutationNumberInput('execution_order', entity.execution_order ?? '', 'min="1" step="1" placeholder="Optional"')));
      break;
    case 'task':
      rows.push(mutationField('Priority', mutationNumberInput('priority', entity.priority ?? '', 'min="1" max="10" step="1" required')));
      rows.push(mutationField('Agent Type', mutationTextInput('agent_type', entity.agent_type || '', 'placeholder="Optional"')));
      rows.push(mutationField('Execution Order', mutationNumberInput('execution_order', entity.execution_order ?? '', 'min="1" step="1" placeholder="Optional"')));
      break;
  }

  rows.push(mutationSizeControls(entity));
  return rows.join('');
}

function renderMutationTransitionControls(entity) {
  const targets = mutationTargetsForEntity(entity);
  const buttons = targets.length
    ? targets.map(target => `<button type="button" class="open-btn" data-target-status="${escapeHtml(target)}">${escapeHtml(target.replace(/_/g, ' '))}</button>`).join('')
    : '<div class="content-placeholder">No valid transitions available for the current status.</div>';

  return `
    <div class="mutation-transition-buttons">${buttons}</div>
    <div class="mutation-form-grid">
      ${mutationField('Reason', mutationTextArea('reason', '', 'rows="3" placeholder="Optional"'))}
      ${mutationField('Agent', mutationTextInput('agent', 'viewer', 'placeholder="viewer"'))}

        <span class="mutation-field-label">Force</span>
        <span class="mutation-check"><input type="checkbox" name="force">Bypass workflow validation</span>

}

async function refreshEntityDataAfterMutation() {
  const tagsArg = activeTagFilter.size > 0 ? Array.from(activeTagFilter) : undefined;
  try {
    if (selectedKey) {
      notesCache.delete(selectedKey);
    }
    const hierarchy = await apiGetHierarchy(tagsArg, showCompleted);
    hierarchyData = hierarchy;
    treeData = Array.isArray(hierarchy?.epics) ? hierarchy.epics : [];
  } catch (err) {
    showToast('Mutation saved, but the viewer could not refresh.', 'error');
    return;
  }

  renderSidebar();
  if (appState === 'entity_view') {
    renderEntityView();
  }
}

async function patchViewerEntity(entity, form) {
  const route = mutationRouteSegment(entity.type);
  if (!route) {
    throw new Error('unsupported entity type');
  }

  const payload = {};
  const title = form.elements.title?.value?.trim() || '';
  if (!title) {
    throw new Error('Title is required');
  }
  payload.title = title;

  const description = form.elements.description?.value ?? '';
  payload.description = description;

  switch (entity.type) {
    case 'epic': {
      const priority = form.elements.priority?.value || '';
      if (!priority) throw new Error('Priority is required');
      payload.priority = priority;
      const businessValue = form.elements.business_value?.value || '';
      if (businessValue) payload.business_value = businessValue;
      break;
    }
    case 'feature': {
      const executionOrder = form.elements.execution_order?.value?.trim() || '';
      if (executionOrder) {
        const parsed = Number(executionOrder);
        if (!Number.isInteger(parsed)) throw new Error('Execution order must be a whole number');
        payload.execution_order = parsed;
      }
      break;
    }
    case 'task': {
      const priority = form.elements.priority?.value?.trim() || '';
      if (!priority) throw new Error('Priority is required');
      const parsedPriority = Number(priority);
      if (!Number.isInteger(parsedPriority)) throw new Error('Priority must be a whole number');
      payload.priority = parsedPriority;

      const agentType = form.elements.agent_type?.value?.trim() || '';
      if (agentType) payload.agent_type = agentType;

      const executionOrder = form.elements.execution_order?.value?.trim() || '';
      if (executionOrder) {
        const parsed = Number(executionOrder);
        if (!Number.isInteger(parsed)) throw new Error('Execution order must be a whole number');
        payload.execution_order = parsed;
      }
      break;
    }
  }

  const clearSize = !!form.elements.clear_size?.checked;
  if (clearSize) {
    payload.clear_size = true;
  } else {
    const sizeValue = form.elements.size?.value?.trim() || '';
    if (sizeValue) {
      const parsedSize = Number(sizeValue);
      if (!Number.isInteger(parsedSize)) throw new Error('Size must be a whole number');
      payload.size = parsedSize;
    }
  }

  const updated = await apiPatchViewerEntity(entity.type, entity.key, payload);
  showToast(`${updated.key || entity.key} updated`);
  await refreshEntityDataAfterMutation();
}

async function transitionViewerEntity(entity, form, targetStatus) {
  const route = mutationRouteSegment(entity.type);
  if (!route) {
    throw new Error('unsupported entity type');
  }
  if (!targetStatus) {
    throw new Error('target status is required');
  }

  const payload = { target_status: targetStatus };
  const reason = form.querySelector('[name="reason"]')?.value?.trim() || '';
  const agent = form.querySelector('[name="agent"]')?.value?.trim() || 'viewer';
  const force = !!form.querySelector('[name="force"]')?.checked;
  if (reason) payload.reason = reason;
  if (agent) payload.agent = agent;
  if (force) payload.force = true;

  const result = await apiTransitionViewerEntity(entity.type, entity.key, payload);
  showToast(`${result.entity_key || entity.key} transitioned to ${result.to_status || targetStatus}`);
  await refreshEntityDataAfterMutation();
}

async function createViewerNote(entity, form) {
  const noteType = form.elements.note_type?.value?.trim() || '';
  const content = form.elements.content?.value?.trim() || '';
  const createdBy = form.elements.created_by?.value?.trim() || '';
  if (!noteType) {
    throw new Error('note type is required');
  }
  if (!content) {
    throw new Error('note content is required');
  }

  const payload = { note_type: noteType, content };
  if (createdBy) {
    payload.created_by = createdBy;
  }

  const note = await apiCreateViewerNote(entity.type, entity.key, payload);
  notesCache.delete(entity.key);
  showToast(`${note.note_type || noteType} added`);
  await refreshEntityDataAfterMutation();
}

async function createViewerRelationship(entity, form) {
  const relationshipType = form.elements.relationship_type?.value?.trim() || '';
  const toKey = form.elements.to_key?.value?.trim() || '';
  if (!relationshipType) {
    throw new Error('relationship type is required');
  }
  if (!toKey) {
    throw new Error('target key is required');
  }

  const relationship = await apiCreateViewerRelationship(entity.type, entity.key, {
    relationship_type: relationshipType,
    to_key: toKey,
  });
  showToast(`${relationship.relationship_type || relationshipType} added`);
  await refreshEntityDataAfterMutation();
}

async function deleteViewerRelationship(entity, form) {
  const relationshipType = form.elements.relationship_type?.value?.trim() || '';
  const toKey = form.elements.to_key?.value?.trim() || '';
  if (!relationshipType) {
    throw new Error('relationship type is required');
  }
  if (!toKey) {
    throw new Error('target key is required');
  }

  await apiDeleteViewerRelationship(entity.type, entity.key, relationshipType, toKey);
  showToast(`${relationshipType} removed`);
  await refreshEntityDataAfterMutation();
}

function wireMutationControls(entity) {
  if (!entity || !['epic', 'feature', 'task', 'question'].includes(entity.type)) return;

  const panel = document.getElementById('entity-mutation-panel');
  if (!panel) return;

  const patchForm = panel.querySelector('#entity-mutation-patch-form');
  if (patchForm) {
    const clearSize = patchForm.querySelector('[name="clear_size"]');
    const sizeInput = patchForm.querySelector('[name="size"]');
    const syncSizeDisabledState = () => {
      if (sizeInput) sizeInput.disabled = !!clearSize?.checked;
    };
    if (clearSize && sizeInput) {
      clearSize.addEventListener('change', syncSizeDisabledState);
      syncSizeDisabledState();
    }
    patchForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await patchViewerEntity(entity, patchForm);
      } catch (err) {
        showToast(err?.message || 'Failed to update entity', 'error');
      }
    });
  }

  const noteForm = panel.querySelector('#entity-note-form');
  if (noteForm) {
    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await createViewerNote(entity, noteForm);
      } catch (err) {
        showToast(err?.message || 'Failed to add note', 'error');
      }
    });
  }

  const relationshipCreateForm = panel.querySelector('#entity-relationship-create-form');
  if (relationshipCreateForm) {
    relationshipCreateForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await createViewerRelationship(entity, relationshipCreateForm);
      } catch (err) {
        showToast(err?.message || 'Failed to add relationship', 'error');
      }
    });
  }

  const relationshipDeleteForm = panel.querySelector('#entity-relationship-delete-form');
  if (relationshipDeleteForm) {
    relationshipDeleteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await deleteViewerRelationship(entity, relationshipDeleteForm);
      } catch (err) {
        showToast(err?.message || 'Failed to remove relationship', 'error');
      }
    });
  }

  panel.querySelectorAll('[data-target-status]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const targetStatus = btn.getAttribute('data-target-status') || '';
      const transitionForm = panel.querySelector('#entity-mutation-transition-form');
      if (!transitionForm) return;
      try {
        await transitionViewerEntity(entity, transitionForm, targetStatus);
      } catch (err) {
        showToast(err?.message || 'Failed to transition entity', 'error');
      }
    });
  });
}

/**
 * Shows a brief toast notification.
 * @param {string} message
 * @param {'info'|'error'} [type='info']
 */
function showToast(message, type) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast' + (type === 'error' ? ' toast-error' : '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

async function openSpecModal(key) {
  const modal = document.getElementById('spec-modal');
  const body  = document.getElementById('spec-modal-body');
  if (!modal || !body) return;
  body.innerHTML = '<div class="content-placeholder">Loading spec…</div>';
  modal.style.display = 'block';
  const resp = await apiGetFile(key);
  if (!resp || !resp.exists) {
    body.innerHTML = '<div class="content-placeholder">No spec file found for this entity.</div>';

  renderMarkdownFromString(resp.content || '', body);
