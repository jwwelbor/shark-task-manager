<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shark Status Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES — Dark Slate Palette
       ============================================================ */
    :root {
      --bg:             #0d0f12;
      --bg-2:           #161920;
      --bg-3:           #1e222b;
      --bg-4:           #252a35;
      --fg:             #e8eaf0;
      --fg-muted:       #8a8f9e;
      --fg-dim:         #555c6e;
      --accent:         #4d77ff;
      --accent-hover:   #6690ff;
      --accent-dim:     #1e2d5a;
      --border:         #2a2f3d;
      --border-light:   #353b4d;
      --sidebar-width:  320px;
      --header-height:  44px;
      --radius-sm:      4px;
      --radius:         6px;
      --radius-lg:      8px;
      --shadow:         0 2px 8px rgba(0,0,0,0.4);
      --transition:     150ms ease;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
    }

    /* ============================================================
       TYPOGRAPHY
       ============================================================ */

    /* Monospace for entity keys */
    .key, .mono {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      color: var(--accent);
      font-size: 12px;
    }

    /* Uppercase small-caps for section headers */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    /* ============================================================
       3-PANEL APP LAYOUT
       ============================================================ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #header {
      height: var(--header-height);
      min-height: var(--header-height);
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    #body-row {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
    }

    #content {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
      padding: 20px 24px;
    }

    /* Hide header/sidebar on pick_folder state */
    .state-pick-folder #header,
    .state-pick-folder #body-row #sidebar {
      display: none;
    }

    .state-pick-folder #content {
      padding: 0;
    }

    /* ============================================================
       HEADER BAR
       ============================================================ */
    #header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    #header-dashboard-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background var(--transition);
    }

    #header-dashboard-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    .header-pill {
      font-size: 11px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 8px;
      color: var(--fg-muted);
      white-space: nowrap;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-muted);
      transition: background var(--transition), color var(--transition);
    }

    .header-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    .header-btn-accent {
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    .header-btn-accent:hover {
      background: var(--accent-dim);
      color: var(--fg);
    }

    /* ============================================================
       SIDEBAR TREE
       ============================================================ */
    .sidebar-filter-bar {
      padding: 8px 12px 6px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-filter-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--fg-dim);
      cursor: pointer;
      user-select: none;
    }
    .sidebar-filter-label input[type="checkbox"] {
      cursor: pointer;
    }
    .sidebar-section-header {
      position: sticky;
      top: 0;
      background: var(--bg-2);
      padding: 10px 12px 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-dim);
      border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    .tree-node {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 0;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: background var(--transition);
      user-select: none;
      position: relative;
    }

    .tree-node:hover {
      background: var(--bg-3);
    }

    /* Selected state: dark tint + accent left border + primary text */
    .tree-node.selected {
      background: rgba(0, 0, 0, 0.35);
      border-left: 3px solid var(--accent);
    }

    .tree-node.selected .tree-node-title {
      color: var(--fg);
    }

    /* Adjust padding when border adds 3px to left */
    .tree-node.selected {
      padding-left: 0;
    }

    /* Tree indentation levels */
    .tree-node-epic    { padding-left: 16px; font-weight: 600; }
    .tree-node-feature { padding-left: 40px; }
    .tree-node-task    { padding-left: 56px; }
    .tree-node-flat    { padding-left: 18px; }

    /* Doc nodes: italic + muted */
    .tree-node-doc-epic    { padding-left: 16px; font-style: italic; }
    .tree-node-doc-feature { padding-left: 40px; font-style: italic; }

    .tree-node-doc-epic .tree-node-title,
    .tree-node-doc-feature .tree-node-title {
      color: var(--fg-dim);
      font-style: italic;
    }

    /* Compensate selected border for indented nodes */
    .tree-node.selected.tree-node-epic    { padding-left: 13px; }
    .tree-node.selected.tree-node-feature { padding-left: 37px; }
    .tree-node.selected.tree-node-task    { padding-left: 53px; }
    .tree-node.selected.tree-node-flat    { padding-left: 15px; }
    .tree-node.selected.tree-node-doc-epic    { padding-left: 13px; }
    .tree-node.selected.tree-node-doc-feature { padding-left: 37px; }

    .tree-arrow {
      width: 14px;
      min-width: 14px;
      font-size: 9px;
      color: var(--fg-dim);
      text-align: center;
      transition: transform var(--transition);
      flex-shrink: 0;
    }

    .tree-arrow-spacer {
      width: 14px;
      min-width: 14px;
      flex-shrink: 0;
    }

    /* Status dot */
    .status-dot {
      width: 9px;
      height: 9px;
      min-width: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .tree-node-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
    }

    .tree-node-title {
      color: var(--fg-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      flex: 1;
    }

    /* ============================================================
       STATUS BADGES
       ============================================================ */
    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 10px;
      color: #fff;
      white-space: nowrap;
      line-height: 1.6;
      /* background set via JS using getStatusColor() */
    }

    .status-badge-sm {
      font-size: 9px;
      padding: 1px 5px;
    }

    /* ============================================================
       PICK FOLDER SCREEN
       ============================================================ */
    #pick-folder-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
      gap: 0;
    }

    .state-pick-folder #pick-folder-screen {
      display: flex;
    }

    .pick-folder-icon {
      opacity: 0.18;
      margin-bottom: 28px;
    }

    .pick-folder-icon svg {
      width: 96px;
      height: 96px;
    }

    .pick-folder-heading {
      font-size: 28px;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .pick-folder-instruction {
      font-size: 14px;
      color: var(--fg-muted);
      margin-bottom: 28px;
      max-width: 340px;
      line-height: 1.6;
    }

    .pick-folder-btn {
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      box-shadow: 0 2px 12px rgba(77, 119, 255, 0.4);
    }

    .pick-folder-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(77, 119, 255, 0.5);
    }

    .pick-folder-btn:active {
      transform: translateY(0);
    }

    .pick-folder-note {
      font-size: 11px;
      color: var(--fg-dim);
      margin-top: 16px;
      max-width: 300px;
    }

    /* ============================================================
       DASHBOARD
       ============================================================ */
    .dashboard-section {
      margin-bottom: 32px;
    }

    .dashboard-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Status Breakdown cards */
    .breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .breakdown-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }

    .breakdown-card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 6px;
    }

    .breakdown-card-total {
      font-size: 28px;
      font-weight: 700;
      color: var(--fg);
      line-height: 1.1;
      margin-bottom: 12px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .breakdown-card-active {
      font-size: 12px;
      font-weight: 500;
      color: var(--fg-muted);
    }

    .breakdown-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    /* Feature Progress */
    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
    }

    .progress-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
      min-width: 90px;
      cursor: pointer;
    }

    .progress-key:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .progress-title {
      color: var(--fg-muted);
      font-size: 12px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-bar-wrap {
      width: 120px;
      height: 6px;
      background: var(--bg-4);
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-pct {
      font-size: 11px;
      color: var(--fg-muted);
      min-width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Activity / Transitions table */
    .activity-table {
      width: 100%;
      border-collapse: collapse;
    }

    .activity-table tr {
      border-bottom: 1px solid var(--border);
    }

    .activity-table tr:hover {
      background: var(--bg-2);
    }

    .activity-table td {
      padding: 7px 8px;
      vertical-align: middle;
      font-size: 12px;
    }

    .activity-date {
      color: var(--fg-dim);
      white-space: nowrap;
      font-size: 11px;
    }

    .activity-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .activity-key:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .activity-arrow {
      color: var(--fg-dim);
      padding: 0 4px;
    }

    .activity-note {
      color: var(--fg-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .open-btn {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), color var(--transition);
    }

    .open-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    /* Stale entities table */
    .stale-table {
      width: 100%;
      border-collapse: collapse;
    }

    .stale-table tr {
      border-bottom: 1px solid var(--border);
    }

    .stale-table tr:hover {
      background: var(--bg-2);
    }

    .stale-table td {
      padding: 7px 8px;
      vertical-align: middle;
      font-size: 12px;
    }

    .stale-age {
      color: var(--fg-dim);
      font-size: 11px;
      white-space: nowrap;
    }

    /* ============================================================
       ENTITY CHARTS (pie/donut charts)
       ============================================================ */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .chart-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 12px;
    }

    .chart-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }

    .chart-legend {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 2px;
    }

    .chart-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--fg-muted);
      line-height: 1.4;
    }

    .chart-legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chart-legend-count {
      margin-left: auto;
      color: var(--fg);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ============================================================
       ENTITY VIEW
       ============================================================ */
    .entity-view-header {
      margin-bottom: 18px;
    }

    .entity-view-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 4px;
    }

    .entity-view-key {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      color: var(--accent);
      font-size: 13px;
    }

    .toggle-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      font-size: 12px;
      padding: 5px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--fg-muted);
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }

    .toggle-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    .toggle-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Properties panel */
    .props-grid {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 6px 12px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .props-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-top: 1px;
    }

    .props-value {
      font-size: 12px;
      color: var(--fg-muted);
      word-break: break-all;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .copy-btn {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-3);
      color: var(--fg-dim);
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition);
    }

    .copy-btn:hover {
      background: var(--bg-4);
      color: var(--fg);
    }

    /* Markdown content */
    .markdown-body {
      font-size: 13px;
      line-height: 1.7;
      color: var(--fg-muted);
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      color: var(--fg);
      margin-top: 24px;
      margin-bottom: 10px;
      font-weight: 600;
      line-height: 1.3;
    }

    .markdown-body h1 { font-size: 20px; }
    .markdown-body h2 { font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .markdown-body h3 { font-size: 14px; }

    .markdown-body p {
      margin-bottom: 12px;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    .markdown-body li {
      margin-bottom: 4px;
    }

    .markdown-body code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      background: var(--bg-4);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--accent);
    }

    .markdown-body pre {
      background: var(--bg-4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      overflow-x: auto;
      margin-bottom: 14px;
    }

    .markdown-body pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--fg-muted);
      font-size: 12px;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
    }

    .markdown-body table th {
      background: var(--bg-3);
      color: var(--fg);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 7px 10px;
      text-align: left;
      border: 1px solid var(--border);
    }

    .markdown-body table td {
      padding: 7px 10px;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      font-size: 12px;
    }

    .markdown-body table tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent-dim);
      padding-left: 14px;
      color: var(--fg-dim);
      margin: 0 0 12px;
    }

    .markdown-body a {
      color: var(--accent);
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 18px 0;
    }

    .content-placeholder {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 24px;
      text-align: center;
      color: var(--fg-dim);
      font-size: 13px;
    }

    /* ============================================================
       HISTORY DRAWER (implemented in Task 6/7)
       ============================================================ */
    .history-drawer {
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 12px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .history-table tr {
      border-bottom: 1px solid var(--border);
    }

    .history-table tr:hover {
      background: var(--bg-2);
    }

    .history-table td {
      padding: 8px 10px;
      vertical-align: middle;
      font-size: 12px;
    }

    .history-date {

<script>
'use strict';

// ============================================================
// SECTION: Status Color Mapping + Utilities
// ============================================================

/**
 * Full status → hex color mapping table.
 * Covers basic statuses + all shark long-form workflow statuses.
 * Unknown statuses fall back to #666666 via getStatusColor().
 */
const STATUS_COLORS = {
  // --- Basic statuses ---
  draft:       '#8c8c8c',  // gray
  todo:        '#4d4dbb',  // blue
  in_progress: '#e7b30e',  // yellow
  open:        '#e7b30e',  // yellow (same as in_progress)
  done:        '#4d4269',  // dark green/purple
  blocked:     '#8c5700',  // dark orange
  cancelled:   '#4b4b36',  // dark gray
  triaged:     '#e7b500',  // yellow
  verified:    '#4d4269',  // dark green (same as done)
  closed:      '#4b4b26',  // dark gray
  wont_fix:    '#4b4b26',  // dark gray
  identified:  '#8c8c8c',  // gray (same as draft)
  confirmed:   '#4d4dbb',  // blue (same as todo)
  proposed:    '#4d4dbb',  // blue
  evaluating:  '#e7b500',  // yellow
  accepted:    '#4d4269',  // dark green
  promoted:    '#8c4dbb',  // purple
  rejected:    '#8c4d6c',  // dark pink
  reopened:    '#e7b500',  // yellow
  approved:    '#4d4269',  // dark green

  // --- Shark long-form workflow statuses ---
  // ready_for_* → blue range (waiting/queued)
  ready_for_development:    '#4d4dbb',
  ready_for_review:         '#4d4dbb',
  ready_for_qa:             '#4d4dbb',
  ready_for_approval:       '#4d4dbb',
  ready_for_research:       '#4d4dbb',
  ready_for_decomposition:  '#4d4dbb',
  ready_for_refinement:     '#4d4dbb',
  ready_for_test_planning:  '#4d4dbb',
  ready_for_task_generation:'#4d4dbb',
  ready_for_task_review:    '#4d4dbb',

  // in_* → yellow range (active work)
  in_development:    '#e7b30e',
  in_review:         '#e7b30e',
  in_qa:             '#e7b30e',
  in_research:       '#e7b30e',
  in_decomposition:  '#e7b30e',
  in_refinement:     '#e7b30e',
  in_test_planning:  '#e7b30e',
  in_task_generation:'#e7b30e',
  in_task_review:    '#e7b30e',

  // in_approval → purple (awaiting human decision)
  in_approval: '#8c4dbb',

  // Additional shark statuses
  on_hold:   '#8c5700',  // dark orange (same as blocked)
  active:    '#e7b30e',  // yellow (same as in_progress)
  completed: '#4d4269',  // dark green (same as done)
};

/**
 * Returns the hex color for a status string.
 * Falls back to #666666 for unknown statuses.
 * @param {string} status
 * @returns {string} hex color
 */
function getStatusColor(status) {
  return STATUS_COLORS[status] || '#666666';
}

/**
 * Returns '#000' or '#fff' for maximum contrast against the given hex background color.
 * Uses relative luminance per WCAG 2.1.
 * @param {string} hex - background color, e.g. '#e7b30e'
 * @returns {string} '#000' (dark text) or '#fff' (light text)
 */
function getContrastColor(hex) {
  // Strip leading '#'
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2), 16) / 255;
  const g = parseInt(h.substring(2,4), 16) / 255;
  const b = parseInt(h.substring(4,6), 16) / 255;
  // sRGB linearization
  const toLinear = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const L = 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
  return L > 0.179 ? '#000' : '#fff';
}

/**
 * Maps CSS named colors (as returned by the workflow service color metadata)
 * to their hex equivalents that fit the dark dashboard palette.
 * Only named strings need mapping; '#rrggbb' values pass through unchanged.
 */
const NAMED_TO_HEX = {
  yellow:  '#e7b30e',
  amber:   '#e7b500',
  blue:    '#4d4dbb',
  green:   '#22a362',
  lime:    '#65a30d',
  red:     '#c0392b',
  orange:  '#8c5700',
  purple:  '#8c4dbb',
  magenta: '#c0287a',
  pink:    '#8c4d6c',
  gray:    '#6b7280',
  grey:    '#6b7280',
  white:   '#d0d0d0',
  black:   '#444444',
  cyan:    '#0891b2',
  teal:    '#0f766e',
};

/**
 * Normalizes a color value to a hex string.
 * Named color strings (e.g. 'yellow') are mapped to their hex equivalents.
 * Hex strings (e.g. '#e7b30e') pass through unchanged.
 * @param {string} color
 * @returns {string} hex color string starting with '#'
 */
function normalizeToHex(color) {
  if (!color) return '#666666';
  const c = color.trim();
  if (c.startsWith('#')) return c;
  return NAMED_TO_HEX[c.toLowerCase()] || '#666666';
}

/**
 * Returns true if the status is a terminal/completed state
 * (excluded from stale entity detection).
 * @param {string} status
 * @returns {boolean}
 */
const TERMINAL_STATUSES = new Set([
  'done', 'cancelled', 'closed', 'wont_fix',
  'verified', 'rejected', 'promoted', 'approved', 'completed',
]);

function isTerminalStatus(status) {
  return TERMINAL_STATUSES.has(status);
}

/** Prefix for synthetic folder keys used when a clicked directory has no associated entity. */
const FOLDER_KEY_PREFIX = 'folder:';

/**
 * Formats an ISO timestamp to a short human-readable date.
 * e.g. "Apr 9" or "Apr 9, 2024" if year differs from current.
 * @param {string} isoString
 * @returns {string}
 */
function formatDate(isoString) {
  if (!isoString) return '—';
  try {
    const d = new Date(isoString);
    const now = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun',
                    'Jul','Aug','Sep','Oct','Nov','Dec'];
    const mon = months[d.getMonth()];
    const day = d.getDate();
    if (d.getFullYear() !== now.getFullYear()) {
      return `${mon} ${day}, ${d.getFullYear()}`;
    }
    return `${mon} ${day}`;
  } catch {
    return isoString;
  }
}

/**
 * Returns the number of whole days since an ISO timestamp.
 * @param {string} isoString
 * @returns {number}
 */
function daysSince(isoString) {
  if (!isoString) return 0;
  try {
    const d = new Date(isoString);
    const now = new Date();
    const ms = now.getTime() - d.getTime();
    return Math.floor(ms / (1000 * 60 * 60 * 24));
  } catch {
    return 0;
  }
}

/**
 * Creates a status badge element.
 * @param {string} status
 * @param {boolean} [small=false]
 * @returns {HTMLElement}
 */
function makeStatusBadge(status, small = false) {
  const el = document.createElement('span');
  el.className = 'status-badge' + (small ? ' status-badge-sm' : '');
  el.style.background = getStatusColor(status);
  el.textContent = status.replace(/_/g, ' ');
  return el;
}

/**
 * Creates a status dot element.
 * @param {string} status
 * @returns {HTMLElement}
 */
function makeStatusDot(status) {
  const el = document.createElement('span');
  el.className = 'status-dot';
  el.style.background = getStatusColor(status);
  el.title = status;
  return el;
}

// ============================================================
// === API CLIENT ===
// ============================================================

/**
 * Fetches workflow metadata from the server.
 * Non-blocking on failure — STATUS_COLORS acts as fallback.
 * @returns {Promise<Object|null>} parsed JSON or null on error
 */
async function apiGetWorkflowMeta() {
  try {
    const resp = await fetch('/api/v1/viewer/workflow-meta');
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches the full entity hierarchy tree.
 * Critical endpoint — failure should prevent dashboard transition.
 * @returns {Promise<Array>} parsed JSON array
 * @throws {Error} on HTTP error or network failure
 */
async function apiGetHierarchy() {
  const resp = await fetch('/api/v1/viewer/hierarchy');
  if (!resp.ok) throw new Error(`hierarchy fetch failed: HTTP ${resp.status}`);
  return await resp.json();
}

/**
 * Fetches project-wide entity summary (counts by type and status).
 * @returns {Promise<Object|null>} parsed JSON or null on error
 */
async function apiGetSummary() {
  try {
    const resp = await fetch('/api/v1/viewer/summary');
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches the most recent activity/transitions.
 * @param {number} [limit=25]
 * @returns {Promise<Array|null>} parsed JSON array or null on error
 */
async function apiGetRecentActivity(limit = 25) {
  try {
    const resp = await fetch(`/api/v1/viewer/recent-activity?limit=${limit}`);
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches the markdown file content for an entity.
 * @param {string} key - entity key (e.g. "E07-F01-001")
 * @returns {Promise<Object|null>} parsed JSON or null on error
 */
async function apiGetFile(key) {
  try {
    // For file paths (containing "/"), encode each segment separately to preserve path structure.
    // For entity keys (e.g. "E07-F01-001"), encodeURIComponent is safe.
    const encoded = key.includes('/')
      ? key.split('/').map(encodeURIComponent).join('/')
      : encodeURIComponent(key);
    const resp = await fetch(`/api/v1/viewer/file/${encoded}`);
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches the status-change history for an entity.
 * @param {string} key - entity key
 * @returns {Promise<Array|null>} parsed JSON array or null on error
 */
async function apiGetHistory(key) {
  try {
    const resp = await fetch(`/api/v1/viewer/history/${encodeURIComponent(key)}`);
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

/**
 * Fetches all tasks for a feature.
 * @param {string} key - feature key (e.g. "E07-F01")
 * @returns {Promise<Array|null>} parsed JSON array or null on error
 */
async function apiGetFeatureTasks(key) {
  try {
    const resp = await fetch(`/api/v1/viewer/features/${encodeURIComponent(key)}/tasks`);
    if (!resp.ok) return null;
    return await resp.json();
  } catch {
    return null;
  }
}

// ============================================================
// SECTION: UI Feedback Helpers
// ============================================================

/**
 * Displays a dismissible error banner at the top of the content area.
 * Also logs the message to the console for debugging.
 * @param {string} message - Human-readable error description
 */
function showError(message) {
  console.error('[viewer] Error:', message);
  // Remove any existing error banner
  const existing = document.getElementById('error-banner');
  if (existing) existing.remove();

  const banner = document.createElement('div');
  banner.id = 'error-banner';
  banner.className = 'error-banner';
  banner.innerHTML = `
    <span class="error-banner-msg">${escapeHtml(message)}</span>
    <button class="error-banner-dismiss" aria-label="Dismiss">✕</button>
  `;
  banner.querySelector('.error-banner-dismiss').addEventListener('click', () => banner.remove());

  // Insert at the top of #content (before any other children)
  const content = document.getElementById('content');
  content.insertBefore(banner, content.firstChild);
}

/**
 * Shows a loading overlay/spinner in the content area.
 * Clears content and inserts a centered loading indicator.
 */
function showLoading() {
  const content = document.getElementById('content');
  // Remove pick-folder-screen temporarily hidden by CSS; we inject a loader
  let loader = document.getElementById('loading-indicator');
  if (!loader) {
    loader = document.createElement('div');
    loader.id = 'loading-indicator';
    loader.className = 'loading-indicator';
    loader.innerHTML = '<div class="loading-spinner"></div><div class="loading-text">Loading project data…</div>';
    content.appendChild(loader);
  }
  loader.style.display = 'flex';
}

/**
 * Hides the loading overlay previously shown by showLoading().
 */
function hideLoading() {
  const loader = document.getElementById('loading-indicator');
  if (loader) loader.remove();
}

/**
 * Escapes HTML special characters to prevent XSS in dynamic content.
 * @param {string} str
 * @returns {string}
 */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ============================================================
// SECTION: Initial Data Load Sequence
// ============================================================

/**
 * Performs the full initial data load sequence when "Pick Folder" is clicked.
 *
 * Load order:
 * 1. Show loading state
 * 2. Fetch workflow-meta (non-blocking — uses STATUS_COLORS as fallback)
 * 3. Fetch hierarchy (blocking — failure stays on Pick Folder + shows error)
 * 4. Seed expandedEpics with all epic keys from hierarchy
 * 5. Fetch summary + recent-activity in parallel
 * 6. Transition to dashboard state
 *
 * Partial failure (summary/activity): proceeds to dashboard; affected
 * sections show inline "Failed to load" markers via null cache values.
 */
async function loadProjectData() {
  showLoading();

  // Step 2: workflow-meta (non-blocking)
  try {
    const meta = await apiGetWorkflowMeta();
    if (meta && meta.statuses) {
      workflowMeta = meta;
      // Supplement STATUS_COLORS: add statuses from meta not already known
      for (const [status, info] of Object.entries(meta.statuses)) {
        if (!(status in STATUS_COLORS)) {
          STATUS_COLORS[status] = (info && info.color) ? info.color : '#666666';
        }
      }
    }
  } catch {
    // workflow-meta failure is non-fatal; STATUS_COLORS is the fallback
  }

  // Step 3: hierarchy (blocking — critical)
  let hierarchy;
  try {
    hierarchy = await apiGetHierarchy();
  } catch (err) {
    hideLoading();
    showError('Failed to load project hierarchy. Please check the server and try again.');
    // Remain on Pick Folder screen — do NOT transition
    return;
  }

  // Step 4: set treeData + hierarchyData; on initial load start fully collapsed
  hierarchyData = hierarchy;
  treeData = Array.isArray(hierarchy?.epics) ? hierarchy.epics : [];
  projectName = hierarchy?.project_name || '';
  updateHeaderProjectName();
  folderFilesCache.clear();
  if (appState === 'pick_folder') {
    // First load: start fully collapsed — epics expand on first user interaction
    expandedEpics = new Set();
    expandedFeatures = new Set();
  }
  // Refresh: preserve existing expansion state (don't auto-expand new epics)

  // Step 5: summary + recent-activity in parallel (non-blocking)
  const [summary, activity] = await Promise.all([
    apiGetSummary(),
    apiGetRecentActivity(25),
  ]);

  // Step 6: update caches (null = failed to load; renders handle gracefully)
  summaryData    = summary;   // null if failed
  recentActivity = Array.isArray(activity?.records) ? activity.records : [];

  hideLoading();

  // Transition to dashboard
  appState = 'dashboard';
  history.replaceState({ appState, selectedKey: null, entityViewTab: 'info' }, '');
  render();
}

function updateHeaderProjectName() {
  const btn = document.getElementById('header-dashboard-btn');
  if (!btn) return;
  if (projectName) {
    btn.textContent = projectName;
  } else {
    btn.textContent = 'Dashboard';
  }
}

// ============================================================
// SECTION: State Machine — Variables
// ============================================================

let appState       = 'pick_folder';  // 'pick_folder' | 'dashboard' | 'entity_view' | 'doc_view'
let selectedKey    = null;           // currently selected entity/doc key
let treeData       = [];             // cached hierarchy epics array (hierarchy.epics)
let hierarchyData  = null;           // full cached /hierarchy response (includes bugs, change_cards, ideas)
let summaryData    = null;           // cached /summary response
let recentActivity = [];             // cached /recent-activity response
let workflowMeta   = null;           // cached /workflow-meta response
let showCompleted    = false;         // sidebar filter: show completed entities
let showAllFiles     = false;         // sidebar filter: show untracked folder files
let projectName      = '';            // project folder name for header
let expandedEpics    = new Set();    // epic keys currently expanded in sidebar
let expandedFeatures = new Set();    // feature keys currently expanded in sidebar

// ============================================================
// SECTION: State Machine — render() Dispatcher
// ============================================================

/**
 * Main render dispatcher. Reads appState and calls the
 * appropriate render function. Also updates body class
 * for CSS-driven show/hide of header/sidebar.
 */
function render() {
  const body = document.body;
  // Remove all state classes
  body.className = body.className.replace(/\bstate-\S+/g, '').trim();
  // Add current state class
  body.classList.add('state-' + appState);

  // Show back button when not on dashboard/pick_folder
  const backBtn = document.getElementById('header-back-btn');
  if (backBtn) {
    backBtn.style.display = (appState === 'entity_view' || appState === 'doc_view') ? '' : 'none';
  }

  switch (appState) {
    case 'pick_folder':
      renderPickFolder();
      break;
    case 'dashboard':
      renderSidebar();
      renderDashboard();
      break;
    case 'entity_view':
      renderSidebar();
      renderEntityView();
      break;
    case 'doc_view':
      renderSidebar();
      renderDocView();
      break;
    default:
      renderPickFolder();
  }
}

/**
 * Saves the current navigation state to browser history so the back button works.
 * Call after every intentional navigation (entity select, doc open, dashboard).
 */
function pushNavState() {
  const state = { appState, selectedKey, entityViewTab };
  history.pushState(state, '');
}

/**
 * Restores app state from a history entry (called on popstate).
 */
function restoreNavState(state) {
  if (!state) return;
  appState      = state.appState      || 'dashboard';
  selectedKey   = state.selectedKey   || null;
  entityViewTab = state.entityViewTab || 'info';
  render();
}

/**
 * Navigates to an entity by key: expands ancestor nodes in the sidebar tree,
 * sets selectedKey, switches to entity_view, renders, and scrolls into view.
 * No-op if key is not found in treeData (logs warning).
 * @param {string} key - entity key (e.g. "E07", "E07-F01", "E07-F01-001")
 */
function navigateToEntity(key) {
  if (!key) return;

  // Determine entity type and expand ancestors
  // Epic: E## — just expand the epic itself
  // Feature: E##-F## or F## — expand parent epic + the feature
  // Task: E##-F##-### or T-E##-F##-### — expand parent epic + parent feature
  // Bug: B### — flat list, no expansion needed
  if (Array.isArray(treeData)) {
    let found = false;
    for (const epic of treeData) {
      if (epic.key === key) {
        // It's an epic — expand it
        expandedEpics.add(epic.key);
        found = true;
        break;
      }
      const features = Array.isArray(epic.features) ? epic.features : [];
      for (const feature of features) {
        if (feature.key === key) {
          // It's a feature — expand parent epic + the feature
          expandedEpics.add(epic.key);
          expandedFeatures.add(feature.key);
          found = true;
          break;
        }
        const tasks = Array.isArray(feature.tasks) ? feature.tasks : [];
        for (const task of tasks) {
          if (task.key === key) {
            // It's a task — expand parent epic + parent feature
            expandedEpics.add(epic.key);
            expandedFeatures.add(feature.key);
            found = true;
            break;
          }
        }
        if (found) break;
      }
      if (found) break;
    }
    if (!found) {
      console.warn('[navigateToEntity] key not found in treeData:', key);
    }
  }

  selectedKey = key;
  entityViewTab = 'info';  // reset to Info tab on every navigation
  appState = 'entity_view';
  pushNavState();
  render();
  scrollSidebarToKey(key);
}

/**
 * Renders the Status Breakdown section.
 * Grid of cards — one per entity type that has items.
 * Data source: summaryData.{epics,features,tasks,bugs}.status_counts
 * @returns {string} HTML string
 */
function renderStatusBreakdown() {
  if (!summaryData) {
    return `<div class="content-placeholder">Failed to load status data</div>`;
  }

  // Entity types to display: [label, byStatus array]
  // API returns by_status as [{status, count, color, phase, progress_weight}, ...]
  const entityTypes = [
    ['EPICS',        summaryData?.epics?.by_status],
    ['FEATURES',     summaryData?.features?.by_status],
    ['TASKS',        summaryData?.tasks?.by_status],
    ['BUGS',         summaryData?.bugs?.by_status],
    ['IDEAS',        summaryData?.ideas?.by_status],
    ['CHANGE CARDS', summaryData?.change_cards?.by_status],
  ];

  let cards = '';
  for (const [label, byStatus] of entityTypes) {
    if (!Array.isArray(byStatus) || byStatus.length === 0) continue;

    const total = byStatus.reduce((sum, s) => sum + (s.count || 0), 0);
    if (total === 0) continue;

    // Active = non-terminal statuses (exclude completed, cancelled, done, etc.)
    const active = byStatus
      .filter(s => !isTerminalStatus(s.status || '') && (s.phase || '') !== 'done')
      .reduce((sum, s) => sum + (s.count || 0), 0);
    const activeHtml = (active < total)
      ? `<span class="breakdown-card-active">${active} active</span>`
      : '';

    let badges = '';
    for (const s of byStatus) {
      if (!s.count) continue;
      const color = normalizeToHex(s.color || getStatusColor(s.status));
      const label2 = escapeHtml((s.status || '').replace(/_/g, ' ')) + ' ' + s.count;
      badges += `<span class="status-badge status-badge-sm" style="background:${escapeHtml(color)};color:${getContrastColor(color)}">${label2}</span>`;
    }

    cards += `
      <div class="breakdown-card">
        <div class="breakdown-card-label">${escapeHtml(label)}</div>
        <div class="breakdown-card-total">${total}${activeHtml}</div>
        <div class="breakdown-badges">${badges}</div>
      </div>`;
  }

  if (!cards) {
    return `<div class="content-placeholder">No entity data available</div>`;
  }

  return `<div class="breakdown-grid">${cards}</div>`;
}

/**
 * Renders the Feature Progress section.
 * List of features with horizontal progress bars derived from treeData task counts.
 * @returns {string} HTML string
 */
function renderFeatureProgress() {
  if (!treeData || treeData.length === 0) {
    return `<div class="content-placeholder">No features found</div>`;
  }

  let rows = '';
  for (const epic of treeData) {
    const features = Array.isArray(epic.features) ? epic.features : [];
    for (const feature of features) {
      const featureKey = feature.key || '';
      const tasks = Array.isArray(feature.tasks) ? feature.tasks : [];
      const total = tasks.length;
      const completed = tasks.filter(t => t.status === 'completed' || t.status === 'done').length;
      const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
      const pctStr = pct + '%';

      rows += `
        <div class="progress-row">
          <span class="progress-key" data-navigate-key="${escapeHtml(featureKey)}">${escapeHtml(featureKey)}</span>
          <span class="progress-title">${escapeHtml(feature.title || '')}</span>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" style="width:${pct}%;background:var(--accent)"></div>
          </div>
          <span class="progress-pct">${pctStr}</span>
        </div>`;
    }
  }

  if (!rows) {
    return `<div class="content-placeholder">No features found</div>`;
  }

  return `<div class="progress-list">${rows}</div>`;
}

/**
 * Renders the Active Transitions section.
 * Shows the last 25 transitions from recentActivity, newest first.
 * Each row: date, key (clickable), from-badge → to-badge, note, optional Open button.
 * @returns {string} HTML string
 */
function renderActiveTransitions() {
  if (!recentActivity || recentActivity.length === 0) {
    return `<div class="content-placeholder">No recent transitions</div>`;
  }

  // recentActivity is already sorted newest-first by the API; take up to 25
  const rows = recentActivity.slice(0, 25);

  let html = '<table class="activity-table"><tbody>';
  for (const rec of rows) {
    const key         = rec.key        || '';
    const fromStatus  = rec.from_status || '';
    const toStatus    = rec.to_status   || '';
    const note        = rec.note        || '';
    const changedAt   = rec.changed_at  || '';

    const dateStr     = escapeHtml(formatDate(changedAt));
    const keyHtml     = `<span class="activity-key" data-navigate-key="${escapeHtml(key)}">${escapeHtml(key)}</span>`;

    const fromColor   = getStatusColor(fromStatus);
    const fromLabel   = escapeHtml(fromStatus.replace(/_/g, ' '));
    const fromBadge   = fromStatus
      ? `<span class="status-badge status-badge-sm" style="background:${escapeHtml(fromColor)};color:${getContrastColor(fromColor)}">${fromLabel}</span>`
      : '';

    const toColor     = getStatusColor(toStatus);
    const toLabel     = escapeHtml(toStatus.replace(/_/g, ' '));
    const toBadge     = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(toColor)};color:${getContrastColor(toColor)}">${toLabel}</span>`;

    const arrowHtml   = fromBadge
      ? `${fromBadge}<span class="activity-arrow">→</span>${toBadge}`
      : toBadge;

    const noteTd      = note
      ? `<td class="activity-note" title="${escapeHtml(note)}">${escapeHtml(note)}</td>`
      : '<td></td>';

    // Show Open button only if the record has linked_content_path or content_exists
    const hasContent  = rec.linked_content_path || rec.content_exists;
    const openBtn     = hasContent
      ? `<td><button class="open-btn" data-navigate-key="${escapeHtml(key)}">Open</button></td>`
      : '<td></td>';

    html += `
      <tr>
        <td class="activity-date">${dateStr}</td>
        <td>${keyHtml}</td>
        <td>${arrowHtml}</td>
        ${noteTd}
        ${openBtn}
      </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

/**
 * Renders the Stale Entities section.
 * Client-side filter: entities not in a terminal status whose updated_at is > 7 days ago.
 * Sorted by staleness descending (oldest first = most days since update at top).
 * @returns {string} HTML string
 */
function renderStaleEntities() {
  /** @type {Array<{key:string, status:string, title:string, updated_at:string, days:number}>} */
  const stale = [];

  // Walk treeData: epics → features. Guard with ?. on updated_at per spec.
  for (const epic of (treeData || [])) {
    if (epic?.updated_at && !isTerminalStatus(epic.status || '')) {
      const days = daysSince(epic.updated_at);
      if (days > 7) {
        stale.push({
          key:        epic.key || '',
          status:     epic.status || '',
          title:      epic.title || '',
          updated_at: epic.updated_at,
          days,
        });
      }
    }

    const features = Array.isArray(epic?.features) ? epic.features : [];
    for (const feature of features) {
      if (feature?.updated_at && !isTerminalStatus(feature.status || '')) {
        const days = daysSince(feature.updated_at);
        if (days > 7) {
          stale.push({
            key:        feature.key || '',
            status:     feature.status || '',
            title:      feature.title || '',
            updated_at: feature.updated_at,
            days,
          });
        }
      }

      const tasks = Array.isArray(feature?.tasks) ? feature.tasks : [];
      for (const task of tasks) {
        if (task?.updated_at && !isTerminalStatus(task.status || '')) {
          const days = daysSince(task.updated_at);
          if (days > 7) {
            stale.push({
              key:        task.key || '',
              status:     task.status || '',
              title:      task.title || '',
              updated_at: task.updated_at,
              days,
            });
          }
        }
      }
    }
  }

  if (stale.length === 0) {
    return `<div class="content-placeholder">No stale entities found</div>`;
  }

  // Sort descending by days (oldest first = highest daysSince at top)
  stale.sort((a, b) => b.days - a.days);

  let html = '<table class="activity-table"><tbody>';
  for (const item of stale) {
    const color    = getStatusColor(item.status);
    const label    = escapeHtml(item.status.replace(/_/g, ' '));
    const badge    = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(color)};color:${getContrastColor(color)}">${label}</span>`;
    const keyHtml  = `<span class="activity-key" data-navigate-key="${escapeHtml(item.key)}">${escapeHtml(item.key)}</span>`;
    const daysText = escapeHtml(item.days + ' days ago');

    html += `
      <tr>
        <td>${keyHtml}</td>
        <td>${badge}</td>
        <td class="activity-note">${escapeHtml(item.title)}</td>
        <td class="activity-date">${daysText}</td>
      </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

/**
 * Builds an SVG donut chart from a by_status array.
 * Uses the stroke-dasharray + rotation technique: each segment is a full circle
 * with only a portion of the circumference visible, rotated to its starting angle.
 * @param {Array<{status:string, count:number, color:string}>} byStatus
 * @param {number} size - SVG size in px (default 100)
 * @returns {string} SVG HTML string, or '' if no data
 */
function buildDonutChart(byStatus, size = 100) {
  if (!Array.isArray(byStatus)) return '';
  const total = byStatus.reduce((sum, s) => sum + (s.count || 0), 0);
  if (total === 0) return '';

  const strokeW = Math.max(12, Math.round(size * 0.14));
  const r = (size - strokeW - 2) / 2;
  const cx = size / 2;
  const cy = size / 2;
  const C = 2 * Math.PI * r;

  // Background track
  let svg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-3)" stroke-width="${strokeW}"/>`;

  let cumDeg = 0;
  for (const s of byStatus) {
    if (!s.count) continue;
    const pct = s.count / total;
    const dash = pct * C;
    const gap = C - dash;
    const hex = normalizeToHex(s.color || getStatusColor(s.status || ''));
    // Rotate so each segment starts right after the previous one.
    // stroke-dashoffset C/4 positions the first dash at 12 o'clock.
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${escapeHtml(hex)}" stroke-width="${strokeW}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(C / 4).toFixed(2)}" transform="rotate(${cumDeg} ${cx} ${cy})" stroke-linecap="butt"/>`;
    cumDeg += pct * 360;
  }

  // Center total label
  const fontSize = Math.max(10, Math.round(size * 0.18));
  svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="var(--fg)" font-size="${fontSize}px" font-weight="700" font-family="system-ui,sans-serif">${total}</text>`;

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${svg}</svg>`;
}

/**
 * Renders the Entity Charts section.
 * One donut chart per entity type (epics, features, tasks, bugs, ideas, change cards)
 * plus an overall "All Entities" chart showing type distribution.
 * @returns {string} HTML string, or '' if no data
 */
function renderEntityCharts() {
  if (!summaryData) return '';

  const typeConfigs = [
    { label: 'Epics',        data: summaryData.epics,        overallColor: '#4d4dbb' },
    { label: 'Features',     data: summaryData.features,     overallColor: '#22a362' },
    { label: 'Tasks',        data: summaryData.tasks,        overallColor: '#e7b30e' },
    { label: 'Bugs',         data: summaryData.bugs,         overallColor: '#c0392b' },
    { label: 'Ideas',        data: summaryData.ideas,        overallColor: '#60a5fa' },
    { label: 'Change Cards', data: summaryData.change_cards, overallColor: '#8c4dbb' },
  ];

  // Helper: compute active (non-terminal) count for an entity type's by_status array.
  function activeCount(byStatus) {
    if (!Array.isArray(byStatus)) return 0;
    return byStatus
      .filter(s => !isTerminalStatus(s.status || '') && (s.phase || '') !== 'done')
      .reduce((sum, s) => sum + (s.count || 0), 0);
  }

  // Build "All Entities" slice list: one slice per type (active counts only)
  const overallByStatus = [];
  for (const tc of typeConfigs) {
    if (!tc.data) continue;
    const active = activeCount(tc.data.by_status);
    if (active > 0) {
      overallByStatus.push({ status: tc.label, count: active, color: tc.overallColor });
    }
  }

  let cells = '';

  // Overall chart (active counts)
  if (overallByStatus.length > 0) {
    const chartSvg = buildDonutChart(overallByStatus, 100);
    if (chartSvg) {
      let legend = '';
      for (const s of overallByStatus) {
        const hex = normalizeToHex(s.color);
        legend += `<div class="chart-legend-item">
          <span class="chart-legend-dot" style="background:${escapeHtml(hex)}"></span>
          <span>${escapeHtml(s.status)}</span>
          <span class="chart-legend-count">${s.count}</span>
        </div>`;
      }
      cells += `<div class="chart-cell">
        <div class="chart-title">Active Entities</div>
        ${chartSvg}
        <div class="chart-legend">${legend}</div>
      </div>`;
    }
  }

  // Per-type charts
  for (const tc of typeConfigs) {
    if (!tc.data || !Array.isArray(tc.data.by_status) || tc.data.total === 0) continue;
    const chartSvg = buildDonutChart(tc.data.by_status, 100);
    if (!chartSvg) continue;
    let legend = '';
    for (const s of tc.data.by_status) {
      if (!s.count) continue;
      const hex = normalizeToHex(s.color || getStatusColor(s.status || ''));
      legend += `<div class="chart-legend-item">
        <span class="chart-legend-dot" style="background:${escapeHtml(hex)}"></span>
        <span>${escapeHtml((s.status || '').replace(/_/g, ' '))}</span>
        <span class="chart-legend-count">${s.count}</span>
      </div>`;
    }
    cells += `<div class="chart-cell">
      <div class="chart-title">${escapeHtml(tc.label)}</div>
      ${chartSvg}
      <div class="chart-legend">${legend}</div>
    </div>`;
  }

  if (!cells) return '';
  return `<div class="charts-grid">${cells}</div>`;
}

/**
 * Renders the Dashboard view (State 2).
 * Orchestrates 4 sections:
 *   1. Status Breakdown (Task 4)
 *   2. Feature Progress (Task 4)
 *   3. Active Transitions (Task 5)
 *   4. Stale Entities (Task 5)
 */
function renderDashboard() {
  const content = document.getElementById('content');

  const chartsHtml = renderEntityCharts();

  const html = `
    ${chartsHtml ? `<div class="dashboard-section">
      <div class="dashboard-section-title">Entity Charts</div>
      ${chartsHtml}
    </div>` : ''}
    <div class="dashboard-section">
      <div class="dashboard-section-title">Status Overview</div>
      ${renderStatusBreakdown()}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Feature Progress</div>
      ${renderFeatureProgress()}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Recent Activity</div>
      ${renderActiveTransitions()}
    </div>
    <div class="dashboard-section">
      <div class="dashboard-section-title">Stale Entities</div>
      ${renderStaleEntities()}
    </div>
  `;

  content.innerHTML = html;

  // Wire click handlers for feature keys → navigateToEntity
  content.querySelectorAll('[data-navigate-key]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-navigate-key');
      if (key) navigateToEntity(key);
    });
  });
}

/**

 * Values: 'info' | 'transitions'

// Edit mode state variables (T-E27-F07-004)

/** Whether the content pane is in edit mode. */
let editMode = false;
/** Raw markdown before edit — used by Cancel to restore the previous view. */
let editOriginalContent = '';
/** Relative path from FileResponse — sent to PUT /api/v1/edit/file. */
let editFilePath = '';
/** The pane element that owns the current edit UI. */
let editPaneEl = null;

/**
 * Finds an entity in treeData by key.
 * Walks epics → features → tasks recursively.
 * @param {string} key - entity key to find
 * @returns {Object|null} entity object or null if not found
 */
function findEntityByKey(key) {
  if (!key || !Array.isArray(treeData)) return null;

  for (const epic of treeData) {
    if (epic.key === key) return Object.assign({ type: 'epic' }, epic);

    const features = Array.isArray(epic.features) ? epic.features : [];
    for (const feature of features) {
      if (feature.key === key) return Object.assign({ type: 'feature', parent: epic.key }, feature);

      const tasks = Array.isArray(feature.tasks) ? feature.tasks : [];
      for (const task of tasks) {
        if (task.key === key) return Object.assign({ type: 'task', parent: feature.key }, task);
      }
    }
  }

  // Also search flat sections (bugs, change_cards, ideas) from hierarchy
  if (hierarchyData) {
    const flatLists = [
      ['bug',         hierarchyData.bugs],
      ['change_card', hierarchyData.change_cards],
      ['idea',        hierarchyData.ideas],
    ];
    for (const [type, items] of flatLists) {
      if (!Array.isArray(items)) continue;
      for (const item of items) {
        const k = item.key || String(item.id || '');
        if (k === key) return Object.assign({ type }, item);
      }
    }
  }

  return null;
}

/**
 * Renders the entity metadata properties panel.
 * 2-column CSS grid: label | value.
 * Omits fields that are null/undefined.
 * @param {Object} entity - entity object from treeData / flat list
 * @returns {string} HTML string
 */
function renderPropertiesPanel(entity) {
  if (!entity) return '';

  // Helper: copy-to-clipboard button (uses data attribute + global delegation handler)
  function copyBtn(value) {
    return `<button class="copy-btn" data-copy-value="${escapeHtml(value)}" title="Copy to clipboard">⎘</button>`;
  }

  // Field definitions: [label, renderFn]
  const fields = [
    ['Key',          () => `<span class="mono">${escapeHtml(entity.key || '')}</span>`],
    ['Status',       () => { if (!entity.status) return null; const sc = getStatusColor(entity.status); return `<span class="status-badge" style="background:${escapeHtml(sc)};color:${getContrastColor(sc)}">${escapeHtml(entity.status.replace(/_/g,' '))}</span>`; }],
    ['Type',         () => entity.type ? escapeHtml(entity.type) : null],
    ['Parent',       () => entity.parent ? `<span class="mono">${escapeHtml(entity.parent)}</span>` : null],
    ['Agent',        () => entity.agent ? escapeHtml(entity.agent) : null],
    ['Created',      () => entity.created_at ? escapeHtml(formatDate(entity.created_at)) : null],
    ['Updated',      () => entity.updated_at ? escapeHtml(formatDate(entity.updated_at)) : null],
    ['File Path',    () => entity.file_path
      ? `<span style="word-break:break-all">${escapeHtml(entity.file_path)}</span>${copyBtn(entity.file_path)}`
      : null],
    ['Content Path', () => entity.linked_content_path
      ? `<span style="word-break:break-all">${escapeHtml(entity.linked_content_path)}</span>${copyBtn(entity.linked_content_path)}`
      : null],
  ];

  let rows = '';
  for (const [label, renderFn] of fields) {
    const val = renderFn();
    if (val === null || val === undefined || val === '') continue;
    rows += `<div class="props-label">${escapeHtml(label)}</div><div class="props-value">${val}</div>`;
  }

  if (!rows) return '';
  return `<div class="props-grid">${rows}</div>`;
}

/**
 * Shows a brief toast notification.
 * @param {string} message
 * @param {'info'|'error'} [type='info']
 */
function showToast(message, type) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = 'toast' + (type === 'error' ? ' toast-error' : '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

/**
 * Renders the markdown content pane for an entity.
 * Calls apiGetFile(key), renders with Marked.js (or fallback <pre>).
 * Sets innerHTML of paneEl when done.
 * Also stores raw content and file path for the Edit flow.
 * @param {string} key - entity key
 * @param {HTMLElement} paneEl - container element to update
 */
async function renderMarkdownPane(key, paneEl) {
  if (!paneEl) return;

  // Reset edit mode state whenever we load a new pane.
  editMode = false;

  // Show spinner while fetching
  paneEl.innerHTML = `<div class="loading-indicator" style="padding:40px 0"><div class="loading-spinner"></div><div class="loading-text">Loading content\u2026</div></div>`;

  const response = await apiGetFile(key);

  if (!response) {
    paneEl.innerHTML = `<div class="content-placeholder">Failed to load content for this entity.</div>`;
    return;
  }

  if (!response.exists) {
    paneEl.innerHTML = `<div class="content-placeholder">No content available for this entity.</div>`;
    return;
  }

  const rawContent = response.content || '';

  // Store edit state for this pane.
  editOriginalContent = rawContent;
  editFilePath = response.path || '';
  editPaneEl = paneEl;

  renderMarkdownFromString(rawContent, paneEl);
}

/**
 * Renders a markdown string into paneEl and appends an Edit button toolbar.
 * Used by the initial load AND after a successful save (to re-render updated content).
 * @param {string} rawContent - raw markdown string to render
 * @param {HTMLElement} paneEl - container element to update
 */
function renderMarkdownFromString(rawContent, paneEl) {
  if (!paneEl) return;

  // Build main content area.
  const contentWrapper = document.createElement('div');
  contentWrapper.className = 'edit-content-wrapper';

  if (typeof marked !== 'undefined') {
    const rendered = marked.parse(rawContent);
    const mdDiv = document.createElement('div');
    mdDiv.className = 'markdown-body';
    mdDiv.innerHTML = rendered;
    contentWrapper.appendChild(mdDiv);
  } else {
    // Fallback: CDN blocked — show raw content as <pre> with warning banner
    contentWrapper.innerHTML = `
      <div class="error-banner" style="margin-bottom:12px">
        <span class="error-banner-msg">Markdown renderer unavailable (CDN blocked). Showing raw content.</span>
      </div>
      <pre class="markdown-body" style="white-space:pre-wrap">${escapeHtml(rawContent)}</pre>`;
  }

  // Populate pane with content.
  paneEl.innerHTML = '';
  paneEl.appendChild(contentWrapper);

  // Enable the Edit button in the toggle bar once content is ready.
  if (editFilePath) {
    const editBtn = document.getElementById('ev-edit-btn');
    if (editBtn) editBtn.disabled = false;
  }
}

// ============================================================
// EDIT MODE (T-E27-F07-004)
// ============================================================

/**
 * Enters edit mode: replaces the rendered markdown in paneEl with a textarea
 * pre-filled with the current raw content and shows Save/Cancel buttons.
 * @param {HTMLElement} paneEl - the pane container to transform
 */
function enterEditMode(paneEl) {
  if (editMode) return;  // already editing — don't clobber the textarea
  editMode = true;
  editPaneEl = paneEl;

  // Disable the toggle-bar edit button while editing.
  const editBtn = document.getElementById('ev-edit-btn');
  if (editBtn) editBtn.disabled = true;

  paneEl.innerHTML = `
    <div class="edit-toolbar" id="edit-action-toolbar">
      <button class="open-btn edit-save-btn" id="edit-save-btn">Save</button>
      <button class="open-btn" id="edit-cancel-btn" style="margin-left:6px">Cancel</button>
    </div>
    <div id="edit-error-container"></div>
    <textarea id="edit-textarea"
      style="width:100%;min-height:400px;box-sizing:border-box;background:var(--bg-2);color:var(--fg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-family:var(--font-mono,monospace);font-size:13px;resize:vertical;margin-top:8px"
      spellcheck="false">${escapeHtml(editOriginalContent)}</textarea>`;

  paneEl.querySelector('#edit-save-btn').addEventListener('click', () => saveEdit());
  paneEl.querySelector('#edit-cancel-btn').addEventListener('click', () => cancelEdit());
}

/**
 * Displays an inline error banner above the textarea during edit mode.
 * @param {string} message - error message to display
 */
function showEditError(message) {
  const container = document.getElementById('edit-error-container');
  if (!container) return;
  container.innerHTML = `
    <div class="error-banner" style="margin-bottom:8px">
      <span class="error-banner-msg">${escapeHtml(message)}</span>
      <button class="error-banner-dismiss" aria-label="Dismiss">&#x2715;</button>
    </div>`;
  container.querySelector('.error-banner-dismiss').addEventListener('click', () => {
    container.innerHTML = '';
  });
}

/**
 * Sends the textarea content to PUT /api/v1/edit/file.
 * On success, exits edit mode and re-renders the updated markdown.
 * On failure, shows an inline error and leaves the textarea open.
 */
async function saveEdit() {
  const textarea = document.getElementById('edit-textarea');
  if (!textarea) return;

  const saveBtn = document.getElementById('edit-save-btn');
  const cancelBtn = document.getElementById('edit-cancel-btn');

  // Disable buttons during in-flight request (AC-T7).
  if (saveBtn) saveBtn.disabled = true;
  if (cancelBtn) cancelBtn.disabled = true;

  const content = textarea.value;

  try {
    const resp = await fetch('/api/v1/edit/file', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: editFilePath, content: content }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ message: 'Save failed' }));
      showEditError(err.message || 'Save failed');
      if (saveBtn) saveBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
      return;
    }

    // Success: update cached raw content and re-render without an extra fetch.
    editMode = false;
    editOriginalContent = content;
    if (editPaneEl) {
      renderMarkdownFromString(content, editPaneEl);
    }
  } catch (e) {
    showEditError('Network error: ' + e.message);
    if (saveBtn) saveBtn.disabled = false;
    if (cancelBtn) cancelBtn.disabled = false;
  }
}

/**
 * Cancels edit mode and restores the previously rendered markdown view.
 * No write is issued.
 */
function cancelEdit() {
  editMode = false;
  if (editPaneEl) {
    renderMarkdownFromString(editOriginalContent, editPaneEl);
  }
}

/**
 * Renders the Entity View (State 3).
 * Shows entity properties panel, Info/Transitions toggle, and content pane.
 */
function renderEntityView() {
  const content = document.getElementById('content');

  const entity = findEntityByKey(selectedKey);

  // Build header and toggle bar
  const title = entity ? escapeHtml(entity.title || entity.key || selectedKey) : escapeHtml(selectedKey || '');
  const keyLabel = escapeHtml(selectedKey || '');

  const infoActive  = entityViewTab === 'info'        ? ' active' : '';
  const transActive = entityViewTab === 'transitions' ? ' active' : '';
  const filesActive = entityViewTab === 'files'       ? ' active' : '';

  const hasFilePath = entity && (entity.file_path || entity.linked_content_path);
  const editBtnHtml = (entityViewTab === 'info' && hasFilePath)
    ? `<button class="toggle-btn ev-edit-btn" id="ev-edit-btn" disabled title="Edit file" style="margin-left:auto">✎ Edit</button>`
    : '';

  const entityDir = entity ? (entity.file_path || entity.linked_content_path || '') : '';
  const filesDirPath = entityDir ? parentDir(entityDir) : '';
  const filesBtnHtml = filesDirPath ? `<button class="toggle-btn${filesActive}" id="ev-tab-files">Files</button>` : '';

  const html = `
    <div class="entity-view-header">
      <div class="entity-view-title">${title}</div>
      <div class="entity-view-key">${keyLabel}</div>
    </div>
    ${entity ? renderPropertiesPanel(entity) : ''}
    <div class="toggle-bar">
      <button class="toggle-btn${infoActive}"  id="ev-tab-info">Info</button>
      <button class="toggle-btn${transActive}" id="ev-tab-transitions">Transitions</button>
      ${filesBtnHtml}
      ${editBtnHtml}
    </div>
    <div id="ev-content-pane"></div>
  `;

  content.innerHTML = html;

  // Wire toggle buttons
  document.getElementById('ev-tab-info').addEventListener('click', () => {
    entityViewTab = 'info';
    renderEntityView();
  });
  document.getElementById('ev-tab-transitions').addEventListener('click', () => {
    entityViewTab = 'transitions';
    renderEntityView();
  });
  const filesTabBtn = document.getElementById('ev-tab-files');
  if (filesTabBtn) {
    filesTabBtn.addEventListener('click', () => {
      entityViewTab = 'files';
      renderEntityView();
    });
  }

  // Wire edit button (enabled after content loads in renderMarkdownFromString)
  const editToggleBtn = document.getElementById('ev-edit-btn');
  if (editToggleBtn) {
    editToggleBtn.addEventListener('click', () => {
      enterEditMode(document.getElementById('ev-content-pane'));
    });
  }

  const paneEl = document.getElementById('ev-content-pane');

  if (entityViewTab === 'info') {
    // Async: fetch and render markdown content
    renderMarkdownPane(selectedKey, paneEl);
  } else if (entityViewTab === 'files') {
    renderFolderFilesPane(filesDirPath, paneEl);
  } else {
    // Transitions view
    paneEl.innerHTML = `<div class="history-drawer"><div class="content-placeholder">Loading transition history\u2026</div></div>`;
    apiGetHistory(selectedKey).then(historyResp => {
      // API returns {entity_type, entity_key, records: [...]}
      const history = historyResp?.records;
      if (!Array.isArray(history) || history.length === 0) {
        paneEl.innerHTML = `<div class="history-drawer"><div class="content-placeholder">No transition history found.</div></div>`;
        return;
      }
      // Sort reverse-chronological (most recent first)
      // History records use 'changed_at' (EntityHistory model field)
      const sorted = [...history].sort((a, b) => {
        const ta = a.changed_at || a.created_at || a.timestamp || '';
        const tb = b.changed_at || b.created_at || b.timestamp || '';
        return tb.localeCompare(ta);
      });
      let rows = '';
      for (const entry of sorted) {
        const date     = escapeHtml(formatDate(entry.changed_at || entry.created_at || entry.timestamp || ''));
        const from     = entry.from_status || entry.from || '';
        const to       = entry.to_status   || entry.to   || '';
        const note     = escapeHtml(entry.note || entry.reason || '');
        const fromC = getStatusColor(from);
        const fromBadge = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(fromC)};color:${getContrastColor(fromC)}">${escapeHtml(from.replace(/_/g,' '))}</span>`;
        const toC   = getStatusColor(to);
        const toBadge   = `<span class="status-badge status-badge-sm" style="background:${escapeHtml(toC)};color:${getContrastColor(toC)}">${escapeHtml(to.replace(/_/g,' '))}</span>`;
        rows += `<tr>
          <td class="history-date">${date}</td>
          <td>${fromBadge}</td>
          <td style="color:var(--fg-dim);padding:0 4px">\u2192</td>
          <td>${toBadge}</td>
          <td class="activity-note">${note}</td>
        </tr>`;
      }
      paneEl.innerHTML = `
        <div class="history-drawer">
          <div class="history-drawer-toolbar">
            <button class="open-btn" id="ev-history-open-btn">Open</button>
          </div>
          <table class="history-table">
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      const openBtn = document.getElementById('ev-history-open-btn');
      if (openBtn) {
        openBtn.addEventListener('click', () => {
          entityViewTab = 'info';
          renderEntityView();
        });
      }
    });
  }
}

/**
 * Renders the Doc View (State 4).
 * Plain markdown rendering — no properties panel, no Info/Transitions toggle.
 * Reuses renderMarkdownPane() for content rendering.
 */
function renderDocView() {
  const content = document.getElementById('content');

  const docKey = selectedKey || '';

  if (docKey.startsWith(FOLDER_KEY_PREFIX)) {
    const dirPath = docKey.slice(FOLDER_KEY_PREFIX.length);
    content.innerHTML = `
      <div class="entity-view-header">
        <div class="entity-view-title ev-title">${escapeHtml(dirPath || 'Folder')}</div>
      </div>
      <div id="doc-content-pane" class="ev-content-pane" style="margin-top:8px"></div>`;
    renderFolderFilesPane(dirPath, document.getElementById('doc-content-pane'));
    return;
  }

  // Find doc metadata from treeData (docs are nested under epics/features)
  let docMeta = null;
  let parentKey = '';
  if (Array.isArray(treeData)) {
    outer:
    for (const epic of treeData) {
      const epicDocs = Array.isArray(epic.docs) ? epic.docs : [];
      for (const doc of epicDocs) {
        const k = doc.key || doc.path || doc.title || '';
        if (k === docKey) { docMeta = doc; parentKey = epic.key || ''; break outer; }
      }
      const features = Array.isArray(epic.features) ? epic.features : [];
      for (const feature of features) {
        const fDocs = Array.isArray(feature.docs) ? feature.docs : [];
        for (const doc of fDocs) {
          const k = doc.key || doc.path || doc.title || '';
          if (k === docKey) { docMeta = doc; parentKey = feature.key || epic.key || ''; break outer; }
        }
      }
    }
  }

  // Title: use docMeta title if available; otherwise just the filename (basename of path)
  const rawPath = docMeta ? (docMeta.path || docKey) : docKey;
  const baseName = rawPath.split('/').pop() || rawPath;
  const docTitle = docMeta ? escapeHtml(docMeta.title || baseName) : escapeHtml(baseName);

  // Path subtitle — always the full relative path with a copy button
  const pathCopyBtn = `<button class="copy-btn" data-copy-value="${escapeHtml(rawPath)}" title="Copy path">⎘</button>`;
  const pathSubtitle = `<span style="word-break:break-all;color:var(--fg-dim);font-size:12px;font-family:'SF Mono',monospace">${escapeHtml(rawPath)}</span>${pathCopyBtn}`;

  // Parent row — only shown when there's a real parent key
  const parentRowHtml = parentKey
    ? `<div class="props-grid" style="margin-bottom:0"><span class="props-label">Parent</span><span class="props-value"><span class="mono">${escapeHtml(parentKey)}</span></span></div>`
    : '';

  content.innerHTML = `
    <div class="entity-view-header" style="display:flex;align-items:flex-start;justify-content:space-between">
      <div>
        <div class="entity-view-title ev-title">${docTitle}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:2px">${pathSubtitle}</div>
      </div>
      <button class="toggle-btn ev-edit-btn" id="ev-edit-btn" disabled title="Edit file" style="margin-left:12px;flex-shrink:0;align-self:center">✎ Edit</button>
    </div>
    ${parentRowHtml}
    <div id="doc-content-pane" class="ev-content-pane" style="margin-top:${parentKey ? '16px' : '8px'}"></div>`;

  // Async render markdown content
  const pane = document.getElementById('doc-content-pane');

  // Wire edit button after DOM is ready
  const docEditBtn = document.getElementById('ev-edit-btn');
  if (docEditBtn) {
    docEditBtn.addEventListener('click', () => {
      enterEditMode(pane);
    });
  }

  renderMarkdownPane(docKey, pane);
}
