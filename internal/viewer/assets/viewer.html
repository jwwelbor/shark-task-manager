function closeSpecModal() {
  const modal = document.getElementById('spec-modal');
  if (modal) modal.style.display = 'none';
}

/**
 * Renders the markdown content pane for an entity.
 * Calls apiGetFile(key), renders with Marked.js (or fallback <pre>).
 * Sets innerHTML of paneEl when done.
 * Also stores raw content and file path for the Edit flow.
 * @param {string} key - entity key
 * @param {HTMLElement} paneEl - container element to update
 */
async function renderMarkdownPane(key, paneEl) {
  if (!paneEl) return;

  // Reset edit mode state whenever we load a new pane.
  editMode = false;

  // Render spec-pane-header with inline Edit toggle (AC-002.2, AC-T4).
  // The entity is resolved from the current selectedKey; canEdit depends on file_path.
  const specEntity = findEntityByKey(key || selectedKey);
  const canEdit = !!(specEntity && (specEntity.file_path || specEntity.linked_content_path));
  const editToggleHtml = canEdit
    ? `<button class="inline-edit-btn" id="ev-inline-edit">\u270e Edit</button>`
    : '';
  paneEl.innerHTML = `
    <div class="spec-pane-header">${editToggleHtml}</div>
    <div id="spec-body"><div class="loading-indicator" style="padding:40px 0"><div class="loading-spinner"></div><div class="loading-text">Loading content\u2026</div></div></div>
  `;

  // Wire the inline Edit button now that it's in the DOM (AC-002.3)
  const inlineEditBtn = paneEl.querySelector('#ev-inline-edit');
  if (inlineEditBtn) {
    inlineEditBtn.addEventListener('click', () => {
      if (editMode) {
        // Toggle back to view mode
        cancelEdit();
      } else {
        enterEditMode(paneEl.querySelector('#spec-body') || paneEl);
      }
    });
  }

  const response = await apiGetFile(key);
  const specBody = paneEl.querySelector('#spec-body') || paneEl;

  if (!response) {
    specBody.innerHTML = `<div class="content-placeholder">Failed to load content for this entity.</div>`;
    return null;
  }

  if (!response.exists) {
    specBody.innerHTML = `<div class="content-placeholder">No content available for this entity.</div>`;
    return response;
  }

  const rawContent = response.content || '';

  // Store edit state for this pane.
  editOriginalContent = rawContent;
  editFilePath = response.path || '';
  editPaneEl = specBody;

  renderMarkdownFromString(rawContent, specBody);
  return response;
}

/**
 * Renders a markdown string into paneEl and appends an Edit button toolbar.
 * Used by the initial load AND after a successful save (to re-render updated content).
 * @param {string} rawContent - raw markdown string to render
 * @param {HTMLElement} paneEl - container element to update
 */
function parseFrontmatter(rawContent) {
  // Task files have a leading newline before ---; strip leading whitespace first.
  const trimmed = rawContent.replace(/^\s*/, '');
  if (!trimmed.startsWith('---')) return { frontmatter: null, body: rawContent };
  const end = trimmed.indexOf('\n---', 3);
  if (end === -1) return { frontmatter: null, body: rawContent };
  const yamlBlock = trimmed.slice(4, end);
  const body = trimmed.slice(end + 4).replace(/^\n/, '');

  const entries = [];
  let currentKey = null;
  let listItems = [];
  let scalarVal = '';

  function flush() {
    if (!currentKey) return;
    entries.push([currentKey, listItems.length > 0 ? listItems : scalarVal]);
    currentKey = null; listItems = []; scalarVal = '';
  }

  for (const line of yamlBlock.split('\n')) {
    const stripped = line.trim();
    if (stripped === '') continue;
    if (stripped.startsWith('- ')) {
      if (currentKey) listItems.push(stripped.slice(2));
    } else {
      flush();
      const colon = stripped.indexOf(':');
      if (colon === -1) continue;
      currentKey = stripped.slice(0, colon).trim();
      scalarVal = stripped.slice(colon + 1).trim();
    }
  }
  flush();

  return { frontmatter: entries.length ? entries : null, body };
}

function renderFrontmatterTable(entries) {
  const rows = entries.map(([k, v]) => {
    let displayVal;
    if (Array.isArray(v)) {
      displayVal = v.length === 0
        ? '<em style="opacity:0.4">—</em>'
        : `<ul style="margin:0;padding-left:14px">${v.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
    } else {
      displayVal = v === '' ? '<em style="opacity:0.4">—</em>' : escapeHtml(v);
    }
    return `<tr><td style="white-space:nowrap;font-weight:500;color:var(--fg-dim);vertical-align:top;padding-right:12px">${escapeHtml(k)}</td><td>${displayVal}</td></tr>`;
  }).join('');
  return `<details class="frontmatter-block" open>
    <summary style="cursor:pointer;font-size:11px;color:var(--fg-dim);margin-bottom:6px;user-select:none">Frontmatter</summary>
    <table style="font-size:11px;margin-bottom:16px;width:100%;border-collapse:collapse">
      <tbody>${rows}</tbody>
    </table>
  </details>`;
}

// ============================================================
// E27-F12: Mermaid diagram support
// ============================================================

let __mermaidInitialized = false;
const mermaidPanZoomRegistry = new Map();
const mermaidViewerRegistry = new Map();
let activeMermaidOverlayId = '';
const resizeMermaidObserver = (typeof ResizeObserver !== 'undefined')
  ? new ResizeObserver((entries) => {
      for (const entry of entries) {
        const viewer = entry.target && entry.target.closest
          ? entry.target.closest('.mermaid-viewer')
          : null;
        if (!viewer || viewer.classList.contains('is-collapsed')) continue;
        const instance = mermaidPanZoomRegistry.get(viewer.dataset.mermaidId || '');
        if (!instance) continue;
        instance.resize();
        instance.fit();
        instance.center();
        syncMermaidZoomState(viewer);
      }
    })
  : null;

/**
 * One-time Mermaid initialization. Idempotent. Safe to call repeatedly.
 * Guards against CDN unavailability (REQ-F-004).
 */
function initMermaid() {
  if (__mermaidInitialized) return;
  if (typeof mermaid === 'undefined') return; // CDN unavailable; REQ-F-004
  mermaid.initialize({
    startOnLoad: false,      // D3: SPA mode — manual render per pane
    theme: 'dark',           // REQ-F-007
    securityLevel: 'strict', // REQ-F-008, D4
    themeVariables: {
      // Align with --bg-2 / --fg / --accent / --border (REQ-NF-006, viewer.html:12-32)
      background:         '#161920',
      primaryColor:       '#1e222b',
      primaryTextColor:   '#e8eaf0',
      primaryBorderColor: '#2a2f3d',
      lineColor:          '#8a8f9e',
      secondaryColor:     '#252a35',
      tertiaryColor:      '#0d0f12'
    }
  });
  __mermaidInitialized = true;
}

function destroyMermaidPanZoom(viewerId) {
  const instance = mermaidPanZoomRegistry.get(viewerId);
  if (instance && typeof instance.destroy === 'function') {
    instance.destroy();
  }
  mermaidPanZoomRegistry.delete(viewerId);
}

function setMermaidPanZoomControlsEnabled(viewer, enabled) {
  if (!viewer) return;
  viewer.querySelectorAll('[data-requires-panzoom="true"]').forEach((button) => {
    button.disabled = !enabled;
  });
}

function syncMermaidZoomState(viewer) {
  if (!viewer) return;
  const instance = mermaidPanZoomRegistry.get(viewer.dataset.mermaidId || '');
  if (!instance) return;
  const pan = instance.getPan ? instance.getPan() : { x: 0, y: 0 };
  const zoom = instance.getZoom ? instance.getZoom() : 0;
  viewer.dataset.zoom = String(zoom);
  viewer.dataset.panX = String(pan.x || 0);
  viewer.dataset.panY = String(pan.y || 0);
}

function scheduleMermaidZoomStateSync(viewer) {
  if (!viewer || viewer.__mermaidSyncScheduled) return;
  viewer.__mermaidSyncScheduled = true;
  window.requestAnimationFrame(() => {
    viewer.__mermaidSyncScheduled = false;
    syncMermaidZoomState(viewer);
  });
}

function resetMermaidZoom(viewerOrId) {
  const viewer = typeof viewerOrId === 'string'
    ? document.querySelector(`.mermaid-viewer[data-mermaid-id="${viewerOrId}"]`)
    : viewerOrId;
  if (!viewer) return;
  const instance = mermaidPanZoomRegistry.get(viewer.dataset.mermaidId || '');
  if (!instance) return;
  instance.resize();
  instance.fit();
  instance.center();
  syncMermaidZoomState(viewer);
}

function initMermaidPanZoom(viewer) {
  if (!viewer) return;
  const viewerId = viewer.dataset.mermaidId || '';
  const svg = viewer.querySelector('.mermaid-viewport svg');
  if (!viewerId || !svg) return;

  destroyMermaidPanZoom(viewerId);

  if (typeof svgPanZoom === 'undefined') {
    viewer.dataset.panZoomReady = 'false';
    setMermaidPanZoomControlsEnabled(viewer, false);
    return;
  }

  svg.removeAttribute('height');
  svg.removeAttribute('width');
  svg.style.width = '100%';
  svg.style.height = '100%';

  const instance = svgPanZoom(svg, {
    panEnabled: true,
    zoomEnabled: true,
    mouseWheelZoomEnabled: true,
    controlIconsEnabled: false,
    dblClickZoomEnabled: true,
    fit: true,
    center: true,
    minZoom: 0.2,
    maxZoom: 20,
    onPan: () => scheduleMermaidZoomStateSync(viewer),
    onZoom: () => scheduleMermaidZoomStateSync(viewer)
  });
  mermaidPanZoomRegistry.set(viewerId, instance);
  viewer.dataset.panZoomReady = 'true';
  setMermaidPanZoomControlsEnabled(viewer, true);
  resetMermaidZoom(viewer);

  const viewport = viewer.querySelector('.mermaid-viewport');
  if (viewport && resizeMermaidObserver) {
    resizeMermaidObserver.observe(viewport);
  }
}

function createMermaidViewer(viewerId, source, svg, options = {}) {
  const wrapper = document.createElement('div');
  wrapper.className = 'mermaid-render-container mermaid-viewer' + (options.overlay ? ' mermaid-viewer-overlay' : '');
  wrapper.dataset.mermaidId = viewerId;
  wrapper.dataset.zoom = '0';
  wrapper.dataset.panX = '0';
  wrapper.dataset.panY = '0';
  wrapper.dataset.panZoomReady = 'false';
  mermaidViewerRegistry.set(viewerId, { source, svg, overlay: !!options.overlay });

  const overlayControls = options.overlay
    ? ''
    : `
        <button class="mermaid-toolbar-btn mermaid-maximize" type="button" data-mermaid-action="maximize" aria-label="Maximize diagram" title="Maximize diagram">⛶</button>
        <button class="mermaid-toolbar-btn mermaid-collapse" type="button" data-mermaid-action="collapse" aria-label="Collapse diagram" title="Collapse diagram" aria-expanded="true">▾</button>
      `;
  wrapper.innerHTML = `
    <div class="mermaid-toolbar" role="toolbar" aria-label="Mermaid diagram controls">
      <button class="mermaid-toolbar-btn mermaid-zoom-in" type="button" data-mermaid-action="zoom-in" data-requires-panzoom="true" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="mermaid-toolbar-btn mermaid-zoom-out" type="button" data-mermaid-action="zoom-out" data-requires-panzoom="true" aria-label="Zoom out" title="Zoom out">−</button>
      <button class="mermaid-toolbar-btn mermaid-reset" type="button" data-mermaid-action="reset" data-requires-panzoom="true" aria-label="Reset zoom" title="Reset zoom">⟲</button>
      ${overlayControls}
    </div>
    <div class="mermaid-viewport" data-mermaid-viewport></div>
  `;
  const viewport = wrapper.querySelector('.mermaid-viewport');
  if (viewport) viewport.innerHTML = svg;
  wireMermaidViewerControls(wrapper);
  return wrapper;
}

function wireMermaidViewerControls(viewer) {
  if (!viewer) return;
  viewer.querySelectorAll('[data-mermaid-action]').forEach((button) => {
    button.addEventListener('click', () => {
      const action = button.getAttribute('data-mermaid-action');
      const instance = mermaidPanZoomRegistry.get(viewer.dataset.mermaidId || '');
      if (action === 'zoom-in' && instance) {
        instance.zoomIn();
        syncMermaidZoomState(viewer);
      } else if (action === 'zoom-out' && instance) {
        instance.zoomOut();
        syncMermaidZoomState(viewer);
      } else if (action === 'reset') {
        resetMermaidZoom(viewer);
      } else if (action === 'maximize') {
        openMermaidOverlay(viewer);
      } else if (action === 'collapse') {
        toggleMermaidCollapse(viewer);
      }
    });
  });
}

function toggleMermaidCollapse(viewer) {
  if (!viewer) return;
  const collapsed = !viewer.classList.contains('is-collapsed');
  viewer.classList.toggle('is-collapsed', collapsed);
  const button = viewer.querySelector('[data-mermaid-action="collapse"]');
  if (button) {
    button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    button.setAttribute('aria-label', collapsed ? 'Expand diagram' : 'Collapse diagram');
    button.setAttribute('title', collapsed ? 'Expand diagram' : 'Collapse diagram');
    button.textContent = collapsed ? '▸' : '▾';
  }
  if (!collapsed) resetMermaidZoom(viewer);
}

function openMermaidOverlay(viewerOrId) {
  const viewer = typeof viewerOrId === 'string'
    ? document.querySelector(`.mermaid-viewer[data-mermaid-id="${viewerOrId}"]`)
    : viewerOrId;
  if (!viewer) return;
  const sourceId = viewer.dataset.mermaidId || '';
  const meta = mermaidViewerRegistry.get(sourceId);
  if (!meta) return;

  closeMermaidOverlay();
  const overlayId = sourceId + '-overlay';
  activeMermaidOverlayId = overlayId;

  const overlay = document.createElement('div');
  overlay.className = 'mermaid-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `
    <div class="mermaid-overlay-shell">
      <div class="mermaid-overlay-header">
        <button class="mermaid-overlay-close" type="button" aria-label="Close maximized diagram">Close</button>
      </div>
      <div class="mermaid-overlay-body"></div>
    </div>
  `;

  const overlayBody = overlay.querySelector('.mermaid-overlay-body');
  const overlayViewer = createMermaidViewer(overlayId, meta.source, meta.svg, { overlay: true });
  if (overlayBody) overlayBody.appendChild(overlayViewer);
  document.body.appendChild(overlay);
  overlay.querySelector('.mermaid-overlay-close')?.addEventListener('click', closeMermaidOverlay);
  overlay.addEventListener('click', (event) => {
    if (event.target === overlay) closeMermaidOverlay();
  });
  initMermaidPanZoom(overlayViewer);
}

function closeMermaidOverlay() {
  const overlay = document.querySelector('.mermaid-overlay');
  if (!overlay) return;
  if (activeMermaidOverlayId) {
    destroyMermaidPanZoom(activeMermaidOverlayId);
    mermaidViewerRegistry.delete(activeMermaidOverlayId);
    activeMermaidOverlayId = '';
  }
  overlay.remove();
}

/**
 * Post-processes all <pre><code class="language-mermaid"> blocks inside rootEl,
 * replacing each with a rendered SVG in a .mermaid-render-container div.
 * Per-block try/catch ensures one bad block never breaks siblings (REQ-F-002, D6).
 * Falls through silently when Mermaid CDN is unavailable (REQ-F-004).
 * @param {HTMLElement} rootEl
 */
async function renderMermaidIn(rootEl) {
  if (!rootEl) return;
  if (typeof mermaid === 'undefined') return; // REQ-F-004: leave <pre><code> as-is
  initMermaid();

  const codeBlocks = rootEl.querySelectorAll('pre > code.language-mermaid');
  for (const codeEl of codeBlocks) {
    const preEl = codeEl.parentElement;
    const source = codeEl.textContent || '';

    try {
      const id = 'mmd-' + Math.random().toString(36).slice(2, 10);
      const { svg } = await mermaid.render(id, source);
      const wrapper = createMermaidViewer(id, source, svg);
      preEl.parentElement.replaceChild(wrapper, preEl);
      initMermaidPanZoom(wrapper);
    } catch (err) {
      // REQ-F-003: per-block fallback — show escaped raw source + error banner
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid-render-container';
      wrapper.innerHTML =
        '<div class="mermaid-error-banner">Mermaid render failed: ' +
          escapeHtml(String(err && err.message || err)) +
        '</div>' +
        '<pre style="white-space:pre-wrap">' + escapeHtml(source) + '</pre>';
      preEl.parentElement.replaceChild(wrapper, preEl);
    }
  }
}

function renderMarkdownFromString(rawContent, paneEl) {
  if (!paneEl) return;

  const { frontmatter, body } = parseFrontmatter(rawContent);

  // Build main content area.
  const contentWrapper = document.createElement('div');
  contentWrapper.className = 'edit-content-wrapper';

  if (typeof marked !== 'undefined') {
    const mdDiv = document.createElement('div');
    mdDiv.className = 'markdown-body';
    if (frontmatter) {
      mdDiv.innerHTML = renderFrontmatterTable(frontmatter) + marked.parse(body);
    } else {
      mdDiv.innerHTML = marked.parse(rawContent);
    }
    contentWrapper.appendChild(mdDiv);
    // E27-F12: post-process mermaid fences after marked has produced
    // <pre><code class="language-mermaid"> blocks. Async, fire-and-forget;
    // failures are isolated per block (REQ-F-002, REQ-F-003).
    renderMermaidIn(mdDiv);
  } else {
    // Fallback: CDN blocked — show raw content as <pre> with warning banner
    contentWrapper.innerHTML = `
      <div class="error-banner" style="margin-bottom:12px">
        <span class="error-banner-msg">Markdown renderer unavailable (CDN blocked). Showing raw content.</span>
      </div>
      <pre class="markdown-body" style="white-space:pre-wrap">${escapeHtml(rawContent)}</pre>`;
  }

  // Populate pane with content.
  paneEl.innerHTML = '';
  paneEl.appendChild(contentWrapper);

  // Update the inline Edit button label back to '✎ Edit' (view mode restored).
  // The button lives in the parent spec-pane-header, not in the toggle bar (AC-002.1).
  const inlineEditBtn = document.getElementById('ev-inline-edit');
  if (inlineEditBtn) {
    inlineEditBtn.textContent = '\u270e Edit';
    inlineEditBtn.disabled = false;
  }
}

// ============================================================
// EDIT MODE (T-E27-F07-004)
// ============================================================

/**
 * Enters edit mode: replaces the rendered markdown in paneEl with a textarea
 * pre-filled with the current raw content and shows Save/Cancel buttons.
 * @param {HTMLElement} paneEl - the pane container to transform
 */
function enterEditMode(paneEl) {
  if (editMode) return;  // already editing — don't clobber the textarea
  editMode = true;
  editPaneEl = paneEl;

  // Update the inline Edit button to show 'View' while in edit mode (AC-002.3).
  // The button is in the spec-pane-header above the spec-body, not in the toggle bar.
  const inlineEditBtn = document.getElementById('ev-inline-edit');
  if (inlineEditBtn) {
    inlineEditBtn.textContent = 'View';
    inlineEditBtn.disabled = false;
  }

  paneEl.innerHTML = `
    <div class="edit-toolbar" id="edit-action-toolbar">
      <button class="open-btn edit-save-btn" id="edit-save-btn">Save</button>
      <button class="open-btn" id="edit-cancel-btn" style="margin-left:6px">Cancel</button>
    </div>
    <div id="edit-error-container"></div>
    <textarea id="edit-textarea"
      style="width:100%;min-height:400px;box-sizing:border-box;background:var(--bg-2);color:var(--fg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-family:var(--font-mono,monospace);font-size:13px;resize:vertical;margin-top:8px"
      spellcheck="false">${escapeHtml(editOriginalContent)}</textarea>`;

  paneEl.querySelector('#edit-save-btn').addEventListener('click', () => saveEdit());
  paneEl.querySelector('#edit-cancel-btn').addEventListener('click', () => cancelEdit());
}

/**
 * Displays an inline error banner above the textarea during edit mode.
 * @param {string} message - error message to display
 */
function showEditError(message) {
  const container = document.getElementById('edit-error-container');
  if (!container) return;
  container.innerHTML = `
    <div class="error-banner" style="margin-bottom:8px">
      <span class="error-banner-msg">${escapeHtml(message)}</span>
      <button class="error-banner-dismiss" aria-label="Dismiss">&#x2715;</button>
    </div>`;
  container.querySelector('.error-banner-dismiss').addEventListener('click', () => {
    container.innerHTML = '';
  });
}

/**
 * Sends the textarea content to PUT /api/v1/edit/file.
 * On success, exits edit mode and re-renders the updated markdown.
 * On failure, shows an inline error and leaves the textarea open.
 */
async function saveEdit() {
  const textarea = document.getElementById('edit-textarea');
  if (!textarea) return;

  const saveBtn = document.getElementById('edit-save-btn');
  const cancelBtn = document.getElementById('edit-cancel-btn');

  // Disable buttons during in-flight request (AC-T7).
  if (saveBtn) saveBtn.disabled = true;
  if (cancelBtn) cancelBtn.disabled = true;

  const content = textarea.value;

  try {
    const resp = await fetch('/api/v1/edit/file', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: editFilePath, content: content }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ message: 'Save failed' }));
      showEditError(err.message || 'Save failed');
      if (saveBtn) saveBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
      return;
    }

    // Success: update cached raw content and re-render without an extra fetch.
    editMode = false;
    editOriginalContent = content;
    if (editPaneEl) {
      renderMarkdownFromString(content, editPaneEl);
    }
  } catch (e) {
    showEditError('Network error: ' + e.message);
    if (saveBtn) saveBtn.disabled = false;
    if (cancelBtn) cancelBtn.disabled = false;
  }
}

/**
 * Cancels edit mode and restores the previously rendered markdown view.
 * No write is issued.
 */
function cancelEdit() {
  editMode = false;
  if (editPaneEl) {
    renderMarkdownFromString(editOriginalContent, editPaneEl);
  }
}

// --- Session caches for notes and related-docs (REQ-NF-003, AC-010.1, AC-011.4) ---
const notesCache      = new Map(); // key → Promise<NotesResponse>
const relatedDocsCache = new Map(); // key → Promise<RelatedDocsResponse>

async function fetchNotes(key) {
  if (!notesCache.has(key)) {
    notesCache.set(key,
      fetch(`/api/v1/viewer/notes/${encodeURIComponent(key)}`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
    );
  }
  return notesCache.get(key);
}

async function fetchRelatedDocs(key) {
  if (!relatedDocsCache.has(key)) {
    relatedDocsCache.set(key,
      fetch(`/api/v1/viewer/related-docs/${encodeURIComponent(key)}`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
    );
  }
  return relatedDocsCache.get(key);
}

// --- Shared computation helpers (spec §2.3.6) ---

/**
 * Counts items by their .status field. Returns {status: count} map.
 * AC-004.3, AC-005.3 — derived from treeData, no network call.
 */
function countByStatus(items) {
  const out = {};
  for (const it of items) {
    const s = it.status || 'unknown';
    out[s] = (out[s] || 0) + 1;
  }
  return out;
}

/**
 * Collects all tasks from an epic's feature list.
 * Used for epic-level task rollup (REQ-F-005).
 */
function collectEpicTasks(epic) {
  const tasks = [];
  for (const f of (epic.features || [])) {
    for (const t of (f.tasks || [])) tasks.push(t);
  }
  return tasks;
}

/**
 * Looks up status metadata from the cached workflowMeta.
 * Returns {} if metadata is unavailable (safe degradation).
 */
function statusMeta(status) {
  const levelMeta = (workflowMeta && workflowMeta.levels && workflowMeta.levels.task) || {};
  return (levelMeta.statuses || []).find(s => s.name === status) || {};
}

/**
 * Computes weighted progress percentage from a status→count map.
 * AC-005.3: label = Σ(progress_weight × count) / total_tasks.
 */
function weightedProgress(countsByStatus, total) {
  if (!total) return 0;
  let acc = 0;
  for (const [s, n] of Object.entries(countsByStatus)) {
    const w = statusMeta(s).progress_weight || 0;
    acc += w * n;
  }
  return Math.round(acc / total);
}

/**
 * Counts tasks by responsibility (agent/human/qa_team) from workflowMeta.
 * AC-006.1 — uses responsibility field, not hardcoded status names.
 */
function workBreakdown(tasks) {
  const buckets = { agent: 0, human: 0, qa_team: 0 };
  for (const t of tasks) {
    const r = statusMeta(t.status).responsibility || 'none';
    if (buckets[r] != null) buckets[r]++;
  }
  return buckets;
}

/**
 * Returns tasks whose status has blocks_feature === true.
 * AC-007.1 — filter uses blocks_feature flag, NOT hardcoded status names.
 */
function actionItems(tasks) {
  return tasks
    .filter(t => statusMeta(t.status).blocks_feature === true)
    .sort((a, b) => {
      const pa = statusMeta(a.status).phase || '';
      const pb = statusMeta(b.status).phase || '';
      if (pa !== pb) return pa.localeCompare(pb);
      const oa = a.execution_order || 0;
      const ob = b.execution_order || 0;
      if (oa !== ob) return oa - ob;
      return (a.key || '').localeCompare(b.key || '');
    });
}

/**
 * Returns a sorted list of statuses ordered by workflow phase then alphabetically.
 * AC-004.5 — uses workflowMeta phase ordering with alphabetical fallback.
 */
function sortedStatuses(statusKeys) {
  const phaseOrder = ['planning', 'development', 'review', 'qa', 'approval', 'done', 'any'];
  return [...statusKeys].sort((a, b) => {
    const pa = statusMeta(a).phase || '';
    const pb = statusMeta(b).phase || '';
    const ia = phaseOrder.indexOf(pa);
    const ib = phaseOrder.indexOf(pb);
    const pia = ia === -1 ? 999 : ia;
    const pib = ib === -1 ? 999 : ib;
    if (pia !== pib) return pia - pib;
    return a.localeCompare(b);
  });
}

/**
 * Wraps content in an .ov-section block with a labelled header.
 * Section header pattern from feature.md.
 */
function sectionShell(label, bodyHtml) {
  return `<div class="ov-section">
    <div class="ov-section-header">${escapeHtml(label)}</div>
    ${bodyHtml}
  </div>`;
}

/**
 * Renders a status badge suitable for overview sections.
 */
function ovStatusBadge(status) {
  const c = getStatusColor(status);
  return `<span class="status-badge status-badge-sm" style="background:${escapeHtml(c)};color:${getContrastColor(c)}">${escapeHtml(status.replace(/_/g,' '))}</span>`;
}

// --- Notes placeholder and async loader (REQ-F-010) ---

/**
 * Returns placeholder HTML for the notes section. loadNotesInto() fills it.
 */
function notesPlaceholder(key) {
  return `<div class="ov-section" data-notes-for="${escapeHtml(key)}">
    <div class="ov-section-header">Notes</div>
    <div class="skeleton" style="height:20px;border-radius:4px;margin:4px 0"></div>
  </div>`;
}

/**
 * Asynchronously fetches notes for key and renders them into el.
 * AC-010.1: caches per session; AC-010.7: skeleton shown until loaded.
 */
async function loadNotesInto(el, key) {
  if (!el) return;
  try {
    const resp = await fetchNotes(key);
    const notes = resp?.notes || [];
    if (notes.length === 0) {
      // AC-010.6: omit section when no notes
      el.style.display = 'none';
      return;
    }
    const maxDefault = 5;
    const renderRows = (list) => list.map(n => {
      const noteTypeColors = {
        decision: '#8e44ad', blocker: '#c0392b', comment: 'var(--fg-dim)',
        solution: '#27ae60', implementation: '#2980b9', question: '#17a2b8',
        rejection: '#e83e8c', reference: 'var(--fg-dim)', future: 'var(--fg-dim)',
        requirement: 'var(--fg-dim)', testing: 'var(--fg-dim)'
      };
      const tc = noteTypeColors[n.note_type] || 'var(--fg-dim)';
      const ts = n.created_at ? formatDate(n.created_at) : '';
      return `<div class="note-row">
        <span class="note-ts">${escapeHtml(ts)}</span>
        <span class="note-type-pill" style="background:${tc};color:#fff">${escapeHtml(n.note_type || '')}</span>
        <span class="note-text" title="${escapeHtml(n.content || '')}">${escapeHtml(n.content || '')}</span>
      </div>`;
    }).join('');

    const shown = notes.slice(0, maxDefault);
    const remaining = notes.slice(maxDefault);
    let bodyHtml = renderRows(shown);
    if (remaining.length > 0) {
      bodyHtml += `<button class="notes-show-more" data-notes-key="${escapeHtml(key)}" data-notes-remaining='${JSON.stringify(remaining)}'>Show ${remaining.length} more</button>`;
    }
    el.innerHTML = `<div class="ov-section-header">Notes</div>${bodyHtml}`;

    // Wire "Show N more" button (AC-010.5)
    const btn = el.querySelector('.notes-show-more');
    if (btn) {
      btn.addEventListener('click', () => {
        const rest = JSON.parse(btn.dataset.notesRemaining || '[]');
        btn.insertAdjacentHTML('beforebegin', renderRows(rest));
        btn.replaceWith((() => { const b = document.createElement('button'); b.className='notes-show-more'; b.textContent='Show less'; b.addEventListener('click',()=>{ loadNotesInto(el, key); }); return b; })());
      });
    }
  } catch (_) {
    // AC-010.6: on error, omit (no broken message for notes)
    el.style.display = 'none';
  }
}

// --- Related docs placeholder and async loader (REQ-F-011) ---

/**
 * Returns placeholder HTML for the related-docs section.
 */
function relatedDocsPlaceholder(key) {

}

/**
 * Asynchronously fetches related docs for key and renders them into el.
 * AC-011.3: omit section if empty; AC-011.5: show dim error on failure.
 */
async function loadRelatedDocsInto(el, key) {
  if (!el) return;
  try {
    const resp = await fetchRelatedDocs(key);
    const docs = resp?.docs || [];
    if (docs.length === 0) {
      // AC-011.3: omit section when empty
      el.style.display = 'none';
      return;
    }
    const rows = docs.map(d => `<div class="reldoc-row">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0"><rect x="1" y="0.5" width="8" height="11" rx="1" stroke="var(--fg-dim)" stroke-width="1" fill="none"/><line x1="3" y1="3.5" x2="7" y2="3.5" stroke="var(--fg-dim)"/><line x1="3" y1="5.5" x2="7" y2="5.5" stroke="var(--fg-dim)"/><line x1="3" y1="7.5" x2="5" y2="7.5" stroke="var(--fg-dim)"/></svg>
      <span class="reldoc-path" title="${escapeHtml(d.file_path || '')}">${escapeHtml(d.file_path || '')}</span>
      <button class="reldoc-open" data-doc-path="${escapeHtml(d.file_path || '')}">open</button>
    </div>`).join('');
    el.innerHTML = `<div class="ov-section-header">Related Docs</div>${rows}`;

    // Wire open buttons
    el.querySelectorAll('.reldoc-open').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = btn.dataset.docPath;
        if (p && typeof openDocumentByPath === 'function') openDocumentByPath(p);
      });
    });
  } catch (_) {
    // AC-011.5: show dim error message on failure
    el.innerHTML = `<div class="ov-section-header">Related Docs</div><span style="color:var(--fg-dim);font-size:12px">Failed to load docs</span>`;
  }
}

/**
 * Opens a document by its file path in the doc_view, exactly as if the user
 * clicked the doc node in the sidebar tree.
 * @param {string} path - relative file path (e.g. "docs/plan/E07/design.md")
 */
function openDocumentByPath(path) {
  if (!path) return;
  selectedKey = path;
  appState = 'doc_view';
  pushNavState();
  render();
}

// --- Task Overview section renderers (REQ-F-009) ---

/**
 * Renders a single dependency row entry.
 * Resolved entities get a clickable span with data-navigate-key, tabindex, and role.
 * Unresolved keys get plain mono text with a dim "(unresolved)" suffix.
 * AC-T3: unresolved keys render as plain mono text with no click handler.
 * AC-T4: resolved clickable entries have tabindex="0" and role="button".
 * @param {{key: string, entity: Object|null}} item
 * @returns {string} HTML string
 */
function renderDepRow(item) {
  const k = escapeHtml(item.key);
  if (item.entity) {
    return `<div style="margin:3px 0;font-size:13px">` +
      `<span role="button" tabindex="0" data-navigate-key="${k}" ` +
      `style="font-family:var(--font-mono,monospace);color:var(--accent);cursor:pointer;font-size:12px">${k}</span>` +
      `</div>`;
  }
  return `<div style="margin:3px 0;font-size:13px">` +
    `<span style="font-family:var(--font-mono,monospace);font-size:12px">${k}</span>` +
    `<span style="font-size:11px;color:var(--fg-dim)"> (unresolved)</span>` +
    `</div>`;
}

/**
 * Renders the Dependencies section for the Task Overview pane.
 * Shows three groups: Depends On, Blocked By, Blocks.
 * Blocked By carries a red left-border accent even when empty (AC-T2).
 * Uses findEntityByKey to resolve keys — no network call (AC-T1).
 * REQ-F-009, AC-009.1–AC-009.5.
 * @param {Object} task - task entity object from treeData
 * @returns {string} HTML string for the section
 */
function renderDependencyBlockSection(task) {
  const resolve = keys => (Array.isArray(keys) ? keys : []).map(k => ({ key: k, entity: findEntityByKey(k) }));
  const groups = [
    { label: 'Depends On', items: resolve(task.depends_on_keys) },
    { label: 'Blocked By', items: resolve(task.blocked_by_keys), accent: true },
    { label: 'Blocks',     items: resolve(task.blocks_keys) },
  ];
  const groupHtml = g => `
    <div class="dep-group${g.accent ? ' dep-group-accent' : ''}">
      <div class="dep-label">${escapeHtml(g.label)}</div>
      ${g.items.length
        ? g.items.map(renderDepRow).join('')
        : `<div class="dep-empty">(none)</div>`}
    </div>`;
  return sectionShell('Dependencies', groups.map(groupHtml).join(''));
}

// --- Epic Overview section renderers (REQ-F-004, REQ-F-005, REQ-F-008) ---

/**
 * Renders the Feature Status Rollup section for epic Overview.
 * REQ-F-004: horizontal row of colored pills, one per distinct feature status.
 * AC-004.1: renders only on epic Overview.
 * AC-004.4: zero-count statuses are omitted.
 * AC-004.5: pill order follows workflow phase ordering.
 */
function renderFeatureRollupSection(epic) {
  const features = epic.features || [];
  const counts = countByStatus(features);
  const occupied = Object.keys(counts).filter(s => counts[s] > 0);
  if (occupied.length === 0) {
    return sectionShell('Features in Status', '<span style="color:var(--fg-dim);font-size:12px">No features</span>');
  }
  const ordered = sortedStatuses(occupied);
  const pills = ordered.map(s => {
    const c = getStatusColor(s);
    const n = counts[s];
    return `<span class="rollup-pill" style="background:${escapeHtml(c)};color:${getContrastColor(c)}" title="${escapeHtml(s)}">
      ● ${escapeHtml(s.replace(/_/g,' '))} ${n}
    </span>`;
  }).join('');
  return sectionShell('Features in Status', `<div class="rollup-row">${pills}</div>`);
}

/**
 * Renders the Task Status Rollup section with segmented progress bar.
 * REQ-F-005: row of colored pills + 100%-wide 8px bar + weighted-progress percentage.
 * AC-005.2: empty entity shows dim "No tasks" placeholder.
 * AC-005.3: label uses weightedProgress helper.
 */
function renderTaskRollupSection(tasks) {
  const counts = countByStatus(tasks);
  const total = tasks.length;

  if (total === 0) {
    return sectionShell('Tasks in Status', '<span style="color:var(--fg-dim);font-size:12px">No tasks</span>');
  }

  const occupied = Object.keys(counts).filter(s => counts[s] > 0);
  const ordered = sortedStatuses(occupied);
  const pct = weightedProgress(counts, total);

  // Rollup pills
  const pills = ordered.map(s => {
    const c = getStatusColor(s);
    const n = counts[s];
    return `<span class="rollup-pill" style="background:${escapeHtml(c)};color:${getContrastColor(c)}" title="${escapeHtml(s)}">
      ● ${escapeHtml(s.replace(/_/g,' '))} ${n}
    </span>`;
  }).join('');

  // Segmented progress bar
  const segments = ordered.map(s => {
    const c = getStatusColor(s);
    const w = ((counts[s] / total) * 100).toFixed(2);
    return `<div class="seg-bar-segment" style="width:${w}%;background:${escapeHtml(c)}" title="${escapeHtml(s)}: ${counts[s]}"></div>`;
  }).join('');

  const bodyHtml = `
    <div class="rollup-row">${pills}</div>
    <div class="seg-bar-row">
      <div class="seg-bar" style="flex:1">${segments}</div>
      <span class="seg-bar-label">${pct}%</span>
    </div>`;

  return sectionShell('Tasks in Status', bodyHtml);
}

/**
 * Renders the Features table for epic Overview.
 * REQ-F-008: KEY · TITLE · STATUS BADGE · PROGRESS BAR columns.
 * AC-008.1: KEY cells carry data-navigate-key and .clickable class.
 * AC-008.2: TITLE cells truncated via CSS; full title in title attribute.
 * AC-008.4: body scrolls inside max-height: 420px when >10 rows; header sticky.
 */
function renderFeaturesTableSection(epic) {
  const features = epic.features || [];
  if (features.length === 0) {
    return sectionShell('Features', '<span style="color:var(--fg-dim);font-size:12px">No features</span>');
  }

  const rows = features.map(f => {
    const key = escapeHtml(f.key || '');
    const title = escapeHtml(f.title || f.key || '');
    const pct = typeof f.progress_pct === 'number' ? f.progress_pct : 0;
    const badge = ovStatusBadge(f.status || 'unknown');
    const barColor = 'var(--accent)';
    // Cancelled takes priority over completed (AC-001.4): check isCancelledStatus first.
    let rowClass = '';
    if (isCancelledStatus(f.status))           rowClass = ' class="entity-cancelled"';
    else if ((f.status || '') === 'completed') rowClass = ' class="entity-completed"';
    return `<tr${rowClass}>
      <td><span class="clickable" role="button" tabindex="0" data-navigate-key="${key}">${key}</span></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${title}">${title}</td>
      <td>${badge}</td>
      <td style="min-width:80px">
        <div style="height:6px;border-radius:3px;background:var(--bg-3);overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px"></div>
        </div>
      </td>
    </tr>`;
  }).join('');

  const scrollClass = features.length > 10 ? ' ov-table-scroll' : '';
  const tableHtml = `
    <div class="${scrollClass.trim() || ''}">
      <table class="ov-table">
        <thead><tr>
          <th>KEY</th><th>TITLE</th><th>STATUS</th><th>PROGRESS</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  return sectionShell('Features', tableHtml);
}

// --- Feature Overview section renderers (REQ-F-006, REQ-F-007, REQ-F-008) ---

/**
 * Renders the Work Breakdown section for feature Overview.
 * REQ-F-006: three labelled rows — Agent / Human / QA Team — each with a mini bar.
 * AC-006.1: counts derived from responsibility field of each task's status in workflowMeta.
 * AC-006.2: bar width = count / max(1, total_for_all_three_rows) * 100%.
 * AC-006.3: hidden when all three counts are zero.
 * AC-006.4: only rendered for feature Overview.
 * @param {Array} tasks - array of task objects from treeData (feature.tasks)
 * @returns {string} HTML string or null when all counts are zero
 */
function renderWorkBreakdownSection(tasks) {
  const bd = workBreakdown(tasks);
  const maxCount = Math.max(1, bd.agent + bd.human + bd.qa_team);
  // AC-006.3: return null (omit) when all three counts are zero
  if (bd.agent === 0 && bd.human === 0 && bd.qa_team === 0) return null;

  const rows = [
    { label: 'Agent',   count: bd.agent },
    { label: 'Human',   count: bd.human },
    { label: 'QA Team', count: bd.qa_team },
  ].map(r => {
    const pct = (r.count / maxCount * 100).toFixed(2);
    return `<div class="wb-row">
      <span class="wb-label">${escapeHtml(r.label)}</span>
      <div class="wb-bar"><div class="wb-bar-fill" style="width:${pct}%"></div></div>
      <span class="wb-count">${r.count}</span>
    </div>`;
  }).join('');

  return sectionShell('Work Breakdown', rows);
}

/**
 * Renders the Action Items section for feature Overview.
 * REQ-F-007: list of tasks in statuses whose blocks_feature === true.
 * AC-007.1: filter uses blocks_feature flag — never hardcoded status names.
 * AC-007.2: each row shows a status badge, clickable key (data-navigate-key), and truncated title.
 * AC-007.3: rows ordered by status phase, then execution_order, then key.
 * AC-007.4: section omitted when no tasks match blocks_feature.
 * @param {Array} tasks - array of task objects
 * @returns {string} HTML string or null when no blocking tasks
 */
function renderActionItemsSection(tasks) {
  const items = actionItems(tasks);
  // AC-007.4: omit section entirely when no blocking tasks
  if (items.length === 0) return null;

  const rows = items.map(t => {
    const key = escapeHtml(t.key || '');
    const title = escapeHtml(t.title || t.key || '');
    const badge = ovStatusBadge(t.status || 'unknown');
    return `<div class="action-item-row">
      ${badge}
      <span class="clickable" role="button" tabindex="0" data-navigate-key="${key}"
        style="font-family:var(--font-mono,monospace);font-size:12px">${key}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px"
        title="${title}">${title}</span>
    </div>`;
  }).join('');

  return sectionShell('Action Items', rows);
}

/**
 * Renders the Tasks table for feature Overview.
 * REQ-F-008 (feature): KEY · TITLE · STATUS BADGE · ORDER columns.
 * AC-008.1: KEY cells carry data-navigate-key and .clickable class.
 * AC-008.2: TITLE cells truncated via CSS; full title in title attribute.
 * AC-008.3: uses ov-table CSS; rows have bottom-border dividers; hover bg-3.
 * AC-008.4: body scrolls inside max-height: 420px when >10 rows; header sticky.
 * AC-T4: ORDER column reflects execution_order from treeData.
 * @param {object} feature - feature entity object from treeData
 * @returns {string} HTML string
 */
function renderTasksTableSection(feature) {
  const tasks = feature.tasks || [];
  if (tasks.length === 0) {
    return sectionShell('Tasks', '<span style="color:var(--fg-dim);font-size:12px">No tasks</span>');
  }

  const rows = tasks.map(t => {
    const key = escapeHtml(t.key || '');
    const title = escapeHtml(t.title || t.key || '');
    const badge = ovStatusBadge(t.status || 'unknown');
    const order = t.execution_order != null ? t.execution_order : '';
    // Cancelled takes priority over completed (AC-001.4): check isCancelledStatus first.
    let rowClass = '';
    if (isCancelledStatus(t.status))           rowClass = ' class="entity-cancelled"';
    else if ((t.status || '') === 'completed') rowClass = ' class="entity-completed"';
    return `<tr${rowClass}>
      <td><span class="clickable" role="button" tabindex="0" data-navigate-key="${key}">${key}</span></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${title}">${title}</td>
      <td>${badge}</td>
      <td style="text-align:right;color:var(--fg-dim);font-size:12px">${escapeHtml(String(order))}</td>
    </tr>`;
  }).join('');

  const scrollClass = tasks.length > 10 ? 'ov-table-scroll' : '';
  const tableHtml = `
    <div class="${scrollClass}">
      <table class="ov-table">
        <thead><tr>
          <th>KEY</th><th>TITLE</th><th>STATUS</th><th style="text-align:right">ORDER</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  return sectionShell('Tasks', tableHtml);
}

/**
 * Dispatches to entity-type-specific overview renderers.
 * Overview is the default tab for epic/feature/task (AC-001.1).
 * Bug/change-card/idea entities are coerced to 'info' before reaching here.
 *
 * @param {object} entity - the entity object from treeData
 * @param {HTMLElement} paneEl - the content pane element to populate
 */
function renderOverviewPane(entity, paneEl) {
  if (!paneEl) return;
  if (!entity) {
    paneEl.innerHTML = `<div class="content-placeholder">Entity not found.</div>`;
    return;
  }

  const sections = [];
  switch (entity.type) {
    case 'epic':
      sections.push(notesPlaceholder(entity.key));
      sections.push(renderFeatureRollupSection(entity));
      sections.push(renderTaskRollupSection(collectEpicTasks(entity)));
      sections.push(renderFeaturesTableSection(entity));
      sections.push(relatedDocsPlaceholder(entity.key));
      break;
    case 'feature':
      sections.push(notesPlaceholder(entity.key));
      sections.push(renderTaskRollupSection(entity.tasks || []));
      sections.push(renderWorkBreakdownSection(entity.tasks || []));
      sections.push(renderActionItemsSection(entity.tasks || []));
      sections.push(renderTasksTableSection(entity));
      sections.push(relatedDocsPlaceholder(entity.key));
      break;
    case 'task':
      sections.push(notesPlaceholder(entity.key));
      sections.push(renderDependencyBlockSection(entity));
      sections.push(relatedDocsPlaceholder(entity.key));
      break;
    default:
      paneEl.innerHTML = `<div class="content-placeholder">Overview not available for this entity type.</div>`;
      return;
  }

  paneEl.innerHTML = `<div class="overview-pane overview-${escapeHtml(entity.type)}">${sections.filter(Boolean).join('')}</div>`;

  // Wire click delegation for [data-navigate-key] elements (feature rows, task rows, dep links)
  paneEl.querySelectorAll('[data-navigate-key]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.getAttribute('data-navigate-key');
      if (k) navigateToEntity(k);
    });
  });

  // Fire async notes + docs fetches into their placeholder divs (AC-010.7, AC-011.4)
  loadNotesInto(paneEl.querySelector(`[data-notes-for="${entity.key}"]`), entity.key);
  loadRelatedDocsInto(paneEl.querySelector(`[data-docs-for="${entity.key}"]`), entity.key);
}

function sprintFindBacklogItem(payload, key) {

function sprintItemLabel(item) {

function sprintKeyListToEntities(keys) {

/**
 * Formats a sprint date range from two ISO date strings (or falsy).
 * Same-year:  "May 8 → May 22"
 * Cross-year: "Dec 30, 2025 → Jan 13, 2026"
 * Missing date renders as "—".
 * @param {string|null|undefined} startISO
 * @param {string|null|undefined} endISO
 * @returns {string}
 */
function sprintFormatRange(startISO, endISO) {
  const startStr = startISO ? String(startISO).split('T')[0] : null;
  const endStr   = endISO   ? String(endISO).split('T')[0]   : null;
  const startYear = startStr ? parseInt(startStr.split('-')[0], 10) : null;
  const endYear   = endStr   ? parseInt(endStr.split('-')[0],   10) : null;
  const crossYear = startYear !== null && endYear !== null && startYear !== endYear;

  const months = ['Jan','Feb','Mar','Apr','May','Jun',
                  'Jul','Aug','Sep','Oct','Nov','Dec'];

  function fmt(dateStr, year) {
    if (!dateStr) return '—';
    const [, monStr, dayStr] = dateStr.split('-');
    const mon = parseInt(monStr, 10) - 1;
    const day = parseInt(dayStr, 10);
    if (isNaN(mon) || isNaN(day)) return '—';
    const monLabel = months[mon];
    return crossYear ? `${monLabel} ${day}, ${year}` : `${monLabel} ${day}`;
  }

  const start = fmt(startStr, startYear);
  const end   = fmt(endStr,   endYear);
  if (start === '—' && end === '—') return 'Date range unavailable';
  return `${escapeHtml(start)} → ${escapeHtml(end)}`;
}

function sprintCapacityStats(rows) {
  const list = Array.isArray(rows) ? rows : [];
  const totals = list.reduce((acc, row) => {
    acc.capacity += Number(row?.capacity_points || 0);
    acc.allocated += Number(row?.allocated_points || 0);
    acc.remaining += Number(row?.remaining || 0);
    acc.unsized += Number(row?.unsized_assigned || 0);
    return acc;
  }, { capacity: 0, allocated: 0, remaining: 0, unsized: 0 });
  const pressure = totals.capacity > 0 ? Math.round((totals.allocated / totals.capacity) * 100) : 0;
  return Object.assign({}, totals, { pressure });
}

function sprintRecentChanges(payload) {
  const itemKeys = new Set(sprintBacklogItems(payload).map(item => item.key));
  return recentActivity.filter(entry => {
    const entryKey = entry?.entity_key || entry?.key || '';
    return itemKeys.has(entryKey);

// SPRINT_BUCKET_MAP is the single source of truth mapping API status_category
// values to the four display buckets: ready, in_progress, blocked, done.
// AC-005 (spec §1.3): ready_for_development maps to the 'ready' display bucket.
// AC-006: in_development, ready_for_approval, in_progress map to 'in_progress'.
const SPRINT_BUCKET_MAP = {
  todo:                        'ready',
  draft:                       'ready',
  ready_for_development:       'ready',
  in_development:              'in_progress',
  ready_for_approval:          'in_progress',
  in_progress:                 'in_progress',
  in_review:                   'in_progress',
  in_qa:                       'in_progress',
  ready_for_refinement_tech:   'in_progress',
  ready_for_refinement_ba:     'in_progress',
  in_refinement:               'in_progress',
  blocked:                     'blocked',
  completed:                   'done',
  resolved:                    'done',
};

// Returns the sprint display bucket for a status string.
// Reads sprint_bucket directly from the workflowMeta loaded via /api/v1/viewer/workflow-meta.
// Each status in the workflow JSON declares its own sprint_bucket value ("ready",
// "in_progress", "blocked", "done", or absent to hide from the sprint board).
// Falls back to the hardcoded SPRINT_BUCKET_MAP for workflows that predate this field.
function getSprintBucketForStatus(status) {
  if (!status) return undefined;
  if (workflowMeta && workflowMeta.levels) {
    for (const level of Object.values(workflowMeta.levels)) {
      const meta = (level.statuses || []).find(s => s.name === status);
      if (meta) {
        // sprint_bucket present in workflow config — use it directly.
        if (meta.sprint_bucket) return meta.sprint_bucket;
        // sprint_bucket explicitly blank means "hide from sprint board".
        // Only fall through to the legacy map when the field is absent entirely.
        if (Object.prototype.hasOwnProperty.call(meta, 'sprint_bucket')) return undefined;
      }
    }
  }
  return SPRINT_BUCKET_MAP[status];
}

// Returns true if the status counts as "active work" in the sprint.
// Active = maps to 'ready' or 'in_progress' bucket.
function isActiveSprintStatus(status) {
  if (!status) return false;
  const bucket = getSprintBucketForStatus(status);
  if (bucket !== undefined) return bucket === 'ready' || bucket === 'in_progress';
  return ACTIVE_SPRINT_CATEGORIES.has(status);
}

// ACTIVE_SPRINT_CATEGORIES is kept as a fallback for when workflowMeta has not
// yet loaded. The isActiveSprintStatus() function above is the preferred path.
const ACTIVE_SPRINT_CATEGORIES = new Set([
  'ready_for_development',
  'in_development',
  'ready_for_approval',
  'in_progress',
  'in_review',
  'in_qa',
  'ready_for_refinement_tech',
  'ready_for_refinement_ba',
  'in_refinement',
]);

const SPRINT_BUCKET_LABELS = {
  ready:       'Ready',
  in_progress: 'In Progress',
  blocked:     'Blocked',
  done:        'Done',
};

function sprintBucketGroups(payload) {
  // Aggregate items from all status_category groups into the four display buckets.
  const bucketItems = { ready: [], in_progress: [], blocked: [], done: [] };
  for (const group of sprintBacklogGroups(payload)) {
    const category = group?.status_category;
    const bucket = getSprintBucketForStatus(category);
    if (bucket && Array.isArray(group.items)) {
      bucketItems[bucket].push(...group.items);
    }
  }
  return Object.keys(SPRINT_BUCKET_LABELS).map(key => ({
    key,
    label: SPRINT_BUCKET_LABELS[key],
    items: bucketItems[key],
  }));
}

function sprintTreeItemCount(payload) {
  return sprintBacklogItems(payload).length;
}

// renderScopeSnapshot renders the "Assigned Scope Snapshot" one-line bar.
// assignedItems must be an array of sprint backlog items (from sprintBacklogItems).
// Buckets with zero items are omitted from the rendered output (TC-018).
// Returns an HTML string for a section element, or an empty string when
// assignedItems is empty — callers must guard against rendering an empty section.
function renderScopeSnapshot(assignedItems) {
  if (!Array.isArray(assignedItems) || assignedItems.length === 0) {
    return '';
  }
  // Tally items into display buckets using workflow-aware bucket lookup.
  const tally = { ready: 0, in_progress: 0, blocked: 0, done: 0 };
  for (const item of assignedItems) {
    const category = item?.status_category || item?.status || '';
    const bucket = getSprintBucketForStatus(category);
    if (bucket && Object.prototype.hasOwnProperty.call(tally, bucket)) {
      tally[bucket]++;
    }
  }
  // Build pills for non-zero buckets only (TC-018: zero-count pills omitted).
  const bucketOrder = ['ready', 'in_progress', 'blocked', 'done'];
  const pills = bucketOrder
    .filter(key => tally[key] > 0)
    .map(key => `<span class="header-pill">${escapeHtml(SPRINT_BUCKET_LABELS[key])} ${escapeHtml(String(tally[key]))}</span>`)
    .join(' ');
  if (!pills) {
    return '';
  }
  return `<section class="ov-section">
      <div class="ov-section-header">Assigned Scope Snapshot</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;padding:6px 0;">${pills}</div>
    </section>`;
}

function sprintCatalogRows(rows, currentKey) {
  const list = Array.isArray(rows) ? rows : [];
  return list.map(row => {
    const key = escapeHtml(row?.key || '');
    const name = escapeHtml(row?.name || row?.title || row?.key || 'Unnamed Sprint');
    const status = escapeHtml(String(row?.status || '').replace(/_/g, ' '));
    const selectedClass = row?.key && row.key === currentKey ? ' selected' : '';
    const range = sprintFormatRange(row?.start_date || row?.startDate || row?.start, row?.end_date || row?.endDate || row?.end);
    return `<div class="sprint-item-row${selectedClass}" style="cursor:default">
      <span class="status-badge status-badge-sm">${status || 'sprint'}</span>
      <span class="sprint-item-key">${key}</span>
      <span class="sprint-item-title" title="${name}">${name}</span>
      <span style="margin-left:auto;color:var(--fg-dim);font-size:11px">${escapeHtml(range)}</span>
    </div>`;
  }).join('');
}

function sprintCatalogRowsExcludingCurrent(rows, currentKey) {
  const list = Array.isArray(rows) ? rows.filter(row => (row?.key || '') !== currentKey) : [];
  return sprintCatalogRows(list, currentKey);
}

function renderSprintTree(payload) {

  const bucketHtml = !payload

        const rows = bucket.items.map(item => renderSprintItemRow(item, sprintSelectedKey)).join('');

    </div>`;
      }).join('');

  const activeBody = activeExpanded
       ? `<div class="sprint-tree-active-body">
         ${activeRows ? `<div class="sprint-item-list" style="padding-left:16px;margin-bottom:6px">${activeRows}</div>` : ''}
         <div class="sprint-item-row" style="cursor:default">
           <span class="sprint-item-key">${sprintKey}</span>
           <span class="sprint-item-title" title="${sprintName}">${sprintName}</span>
         </div>
         <div style="font-size:11px;color:var(--fg-dim);padding:0 4px 6px">${escapeHtml(sprintRange)}</div>
         ${bucketHtml}

      </div>
      ${activeBody}

        <span class="tree-arrow">${upcomingExpanded ? '▼' : '▶'}</span>
        <span class="sprint-item-key">Upcoming Sprint</span>
      </div>
      ${upcomingBody}
      <div class="tree-node tree-node-flat tree-node-sprint" data-sprint-toggle-scope="archive" role="button" tabindex="0">
        <span class="tree-arrow">${archiveExpanded ? '▼' : '▶'}</span>
        <span class="sprint-item-key">Archived Sprints</span>
      </div>
      ${archiveBody}
    </div>`;
}

function sprintPlanItems(payload) {
  const backlog = payload?.backlog;
  if (Array.isArray(backlog)) return backlog;
  if (Array.isArray(backlog?.items)) return backlog.items;
  return [];
}

function sprintPlanMatchesFilters(item, filters) {
  const status = filters?.status || '';
  const agent = filters?.agent || '';
  const assignment = filters?.assignment || '';
  if (status && (item.status || '') !== status) return false;
  if (agent && (item.agent_type || item.agent || '') !== agent) return false;
  if (assignment) {
    const itemAssignment = item.sprint_key || item.assignment_sprint_key || item.assignment || 'unassigned';
    if (assignment === 'unassigned' && itemAssignment !== 'unassigned') return false;
    if (assignment !== 'unassigned' && itemAssignment !== assignment) return false;
  }
  return true;
}

function applySprintPlanFilters(filters) {
  sprintPlanFilters = Object.assign({ status: '', agent: '', assignment: '' }, filters || {});
  if (sprintViewTab === 'plan') {
    renderSprintModePanels();
  }
}

function toggleSprintPlanSelection(key) {
  if (!key) return;
  if (sprintPlanSelection.has(key)) {
    sprintPlanSelection.delete(key);
  } else {
    sprintPlanSelection.add(key);
  }
  if (sprintViewTab === 'plan') {
    renderSprintModePanels();
  }
}

function sprintPlanSelectableCount(items) {
  return items.length;
}

function renderSprintPlan(payload, filters, overviewPayload) {
  const sprint = payload?.sprint || {};
  const items = sprintPlanItems(payload);
  const activeFilters = Object.assign({ status: '', agent: '', assignment: '' }, filters || sprintPlanFilters);
  const filtered = items.filter(item => sprintPlanMatchesFilters(item, activeFilters));
  const capacity = sprintCapacityStats(payload?.capacity || []);
  const readiness = payload?.readiness || {};
  const statusOptions = ['', ...new Set(items.map(item => item.status || '').filter(Boolean))];
  const agentOptions = ['', ...new Set(items.map(item => item.agent_type || item.agent || '').filter(Boolean))];
  const assignmentOptions = ['', 'unassigned', ...new Set(items.map(item => item.sprint_key || item.assignment_sprint_key || item.assignment || '').filter(Boolean))];
  const itemRows = filtered.map(item => {
    const key = escapeHtml(item.key || '');
    const title = escapeHtml(item.title || item.key || '');
    const statusBadge = ovStatusBadge(item.status || item.status_category || 'unassigned');
    const checked = sprintPlanSelection.has(item.key) ? ' checked' : '';
    const agent = escapeHtml(item.agent_type || item.agent || '');
    const size = item.size != null ? escapeHtml(formatSizeLabel(item.size)) : '—';
    // T-E27-F14-009: use sprint-plan-item-row (5-column grid) and .sprint-item-meta for improved contrast
    return `<div class="sprint-plan-item-row" data-sprint-plan-key="${key}">
      <input type="checkbox" class="sprint-plan-checkbox" data-sprint-plan-select-key="${key}"${checked}>
      ${statusBadge}
      <span class="sprint-item-key">${key}</span>
      <span class="sprint-item-title" title="${title}">${title}</span>
      <span class="sprint-item-meta">${agent || 'unassigned'} · ${size}</span>
    </div>`;
  }).join('');

  const filtersHtml = `
    <div class="sprint-plan-filters">
      <label class="sidebar-filter-inline">Status
        <select id="sprint-plan-status-filter">
          ${statusOptions.map(option => `<option value="${escapeHtml(option)}"${option === activeFilters.status ? ' selected' : ''}>${option ? escapeHtml(option.replace(/_/g, ' ')) : 'All'}</option>`).join('')}
        </select>
      </label>
      <label class="sidebar-filter-inline">Agent
        <select id="sprint-plan-agent-filter">
          ${agentOptions.map(option => `<option value="${escapeHtml(option)}"${option === activeFilters.agent ? ' selected' : ''}>${option ? escapeHtml(option) : 'All'}</option>`).join('')}
        </select>
      </label>
      <label class="sidebar-filter-inline">Assignment
        <select id="sprint-plan-assignment-filter">
          ${assignmentOptions.map(option => `<option value="${escapeHtml(option)}"${option === activeFilters.assignment ? ' selected' : ''}>${option ? escapeHtml(option) : 'All'}</option>`).join('')}
        </select>
      </label>
      <button class="header-btn" id="sprint-plan-clear-filters">Clear</button>
    </div>`;

  const actionCount = sprintPlanSelection.size;
  const actionButtons = `
    <div class="sprint-drawer-actions" style="margin-top:0">
      <button class="header-btn header-btn-accent" id="sprint-plan-stage-btn">Stage selected</button>
      <button class="header-btn" id="sprint-plan-remove-btn">Remove selected</button>
      <button class="header-btn" id="sprint-plan-ready-btn">Mark ready</button>
      <span style="align-self:center;color:var(--fg-muted);font-size:12px">${actionCount} selected</span>
    </div>`;

  const itemsHtml = filtered.length
    ? `<div class="sprint-item-list">${itemRows}</div>`
    : '<div class="content-placeholder">No candidate items match the current filters.</div>';

  // Right column: Assigned This Sprint — items from sprintOverviewData (no new fetch).
  const assignedItems = sprintBacklogItems(overviewPayload || null);
  const assignedCount = assignedItems.length;
  const assignedRows = assignedItems.map(item => {
    const key = escapeHtml(item.key || '');
    const title = escapeHtml(item.title || item.key || '');
    const statusBadge = ovStatusBadge(item.status || item.status_category || 'unassigned');
    const agent = escapeHtml(item.agent_type || item.agent || '');
    const size = item.size != null ? escapeHtml(formatSizeLabel(item.size)) : '—';
    // T-E27-F14-009: use sprint-plan-assigned-row (4-column grid, no checkbox) and .sprint-item-meta
    return `<div class="sprint-plan-assigned-row" role="button" tabindex="0" data-sprint-item-key="${key}">

/**
 * Returns the CSS class suffix for a capacity indicator based on the
 * allocated/total ratio. Thresholds (AC-T3):
 *   >100% = OVER, 85–100% = HIGH, <85% = OK.
 * When total is 0, returns 'ok' to avoid division-by-zero.
 */
function capacityIndicatorLevel(allocated, total) {
  if (!total || total <= 0) return 'ok';
  const pct = (allocated / total) * 100;
  if (pct > 100) return 'over';
  if (pct >= 85) return 'high';
  return 'ok';
}

/**
 * Renders the two-column health zone for the Sprint Overview tab.
 * Left panel: per-agent Capacity rows with OK/HIGH/OVER indicator and
 *             failing Readiness factors.
 * Right panel: Blockers enumerated with days-blocked age and unsized-item
 *              warning count.
 *
 * All data is read from payload.capacity, payload.readiness, and
 * payload.backlog.groups — no additional fetch (AC-T1).
 * Blocked item rows call selectSprintItem(key) on click (AC-T2).
 */
function renderSprintHealthColumns(payload) {
  // --- Left panel: Capacity by Agent Type ---
  const capacityRows = Array.isArray(payload?.capacity) ? payload.capacity : [];
  const capacityRowsHtmlStr = capacityRows.length
    ? capacityRows.map(row => {
        const agent = escapeHtml(row.agent_type || 'unassigned');
        const allocated = Number(row.allocated_points || 0);
        const total = Number(row.capacity_points || 0);
        const level = capacityIndicatorLevel(allocated, total);
        const levelLabel = level.toUpperCase();
        const pct = total > 0 ? Math.round((allocated / total) * 100) : 0;
        return `<div class="sprint-item-row" style="cursor:default">
          <span class="sprint-item-key">${agent}</span>
          <span class="sprint-item-title">${escapeHtml(String(allocated))} / ${escapeHtml(String(total))} pts (${escapeHtml(String(pct))}%)</span>
          <span class="capacity-indicator capacity-indicator-${level}">${levelLabel}</span>
        </div>`;
      }).join('')
    : '<div class="content-placeholder">No capacity data available.</div>';

  // Failing readiness factors: score < max_score
  const readiness = payload?.readiness || {};
  const factors = Array.isArray(readiness.factors) ? readiness.factors : [];
  const failingFactors = factors.filter(f => (f.score || 0) < (f.max_score || 0));
  const failingHtml = failingFactors.length
    ? failingFactors.map(f => {
        return `<div class="sprint-item-row" style="cursor:default">
          <span class="sprint-item-key" style="color:var(--accent)">${escapeHtml(f.name || '')}</span>
          <span class="sprint-item-title" style="color:var(--fg-muted)">${escapeHtml(f.detail || '')} (${escapeHtml(String(f.score || 0))}/${escapeHtml(String(f.max_score || 0))})</span>
        </div>`;
      }).join('')
    : '<div class="content-placeholder" style="font-size:12px">All readiness factors passing.</div>';

  // --- Right panel: Blockers/Risks ---
  // Find blocked items from backlog groups
  const blockedItems = sprintBacklogGroups(payload)
    .filter(group => getSprintBucketForStatus(group?.status_category || '') === 'blocked')
    .flatMap(group => Array.isArray(group.items) ? group.items : []);

  const blockerRowsHtml = blockedItems.length
    ? blockedItems.map(item => {
        const key = escapeHtml(item.key || '');
        const title = escapeHtml(item.title || item.key || '');
        const daysBlocked = item.days_blocked != null
          ? ` · ${escapeHtml(String(item.days_blocked))}d blocked`
          : '';
        return `<div class="sprint-item-row" role="button" tabindex="0" data-sprint-item-key="${key}" onclick="selectSprintItem('${key}')">
          <span class="sprint-item-key">${key}</span>
          <span class="sprint-item-title" title="${title}">${title}</span>
          <span style="font-size:11px;color:var(--accent)">${escapeHtml(daysBlocked)}</span>
        </div>`;
      }).join('')
    : '<div class="content-placeholder">No blocked items.</div>';

  // Unsized item warning count from readiness data (capacity rows don't carry unsized_assigned)
  const unsizedCount = Array.isArray(payload?.readiness?.unsized_entities) ? payload.readiness.unsized_entities.length : 0;
  const unsizedWarning = unsizedCount > 0
    ? `<div style="margin-top:8px;padding:6px 8px;background:rgba(236,153,75,0.12);border-radius:4px;font-size:12px;color:#f6ad55">⚠️ ${escapeHtml(String(unsizedCount))} item${unsizedCount !== 1 ? 's' : ''} unsized</div>`
    : '';

  return `
    <div class="sprint-health-columns">
      <section class="ov-section">
        <div class="ov-section-header">Capacity by Agent Type</div>
        <div class="sprint-item-list">${capacityRowsHtmlStr}</div>
        ${failingFactors.length ? `<div class="ov-section-header" style="margin-top:12px">Readiness Factors</div><div class="sprint-item-list">${failingHtml}</div>` : ''}
      </section>
      <section class="ov-section">
        <div class="ov-section-header">Blockers / Risks</div>
        <div class="sprint-item-list">${blockerRowsHtml}</div>
        ${unsizedWarning}
      </section>
    </div>`;
}

async function loadSprintDetailDrawer(key) {
  if (!key) return;
  const historyEl = document.getElementById('sprint-history-section');
  const relatedEl = document.getElementById('sprint-related-section');

  if (historyEl) {
    historyEl.innerHTML = `<div class="ov-section-header">Status History</div><div class="content-placeholder">Loading history…</div>`;
  }
  if (relatedEl) {
    relatedEl.innerHTML = `<div class="ov-section-header">Related Work</div><div class="content-placeholder">Loading related work…</div>`;
  }

  const [historyResp, relatedResp] = await Promise.all([
    apiGetHistory(key),
    apiGetRelatedDocs(key),
  ]);

  if (historyEl) {
    const history = Array.isArray(historyResp?.records) ? historyResp.records : [];
    if (!history.length) {
      historyEl.innerHTML = `<div class="ov-section-header">Status History</div><div class="content-placeholder">No transition history found.</div>`;
    } else {
      const rows = [...history].sort((a, b) => {
        const ta = a.changed_at || a.created_at || a.timestamp || '';
        const tb = b.changed_at || b.created_at || b.timestamp || '';
        return tb.localeCompare(ta);
      }).map(entry => {
        const from = entry.from_status || entry.from || '';
        const to = entry.to_status || entry.to || '';
        const ts = escapeHtml(formatDateTime(entry.changed_at || entry.created_at || entry.timestamp || ''));
        const fromColor = getStatusColor(from);
        const toColor = getStatusColor(to);
        return `<div class="history-row">
          <span class="history-ts">${ts}</span>
          <span class="status-badge status-badge-sm" style="background:${escapeHtml(fromColor)};color:${escapeHtml(getContrastColor(fromColor))}">${escapeHtml(from.replace(/_/g, ' '))}</span>
          <span class="status-badge status-badge-sm" style="background:${escapeHtml(toColor)};color:${escapeHtml(getContrastColor(toColor))}">${escapeHtml(to.replace(/_/g, ' '))}</span>
          <span class="history-note">${escapeHtml(entry.note || entry.reason || '')}</span>
        </div>`;
      }).join('');
      historyEl.innerHTML = `<div class="ov-section-header">Status History</div>${rows}`;
    }
  }

  if (relatedEl) {
    const docs = Array.isArray(relatedResp?.docs) ? relatedResp.docs : [];
    if (!docs.length) {
      relatedEl.innerHTML = `<div class="ov-section-header">Related Work</div><div class="content-placeholder">No related work found.</div>`;
    } else {
      const rows = docs.map(doc => {
        const path = escapeHtml(doc.file_path || '');
        return `<div class="reldoc-row">
          <span class="reldoc-path" title="${path}">${path}</span>
          <button class="reldoc-open" data-doc-path="${path}">open</button>
        </div>`;
      }).join('');
      relatedEl.innerHTML = `<div class="ov-section-header">Related Work</div>${rows}`;
      relatedEl.querySelectorAll('.reldoc-open').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = btn.getAttribute('data-doc-path');
          if (p) openDocumentByPath(p);
        });
      });
    }
  }
}
