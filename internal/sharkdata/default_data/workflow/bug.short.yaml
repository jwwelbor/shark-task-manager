version: '1.0'
status_flow:
  draft:
  - ready_for_development
  - cancelled
  - on_hold
  reported:
  - ready_for_development
  - cancelled
  - on_hold
  ready_for_development:
  - in_development
  - blocked
  - on_hold
  in_development:
  - ready_for_code_review
  - blocked
  - on_hold
  ready_for_code_review:
  - in_code_review
  - on_hold
  in_code_review:
  - ready_for_qa
  - ready_for_development
  - on_hold
  ready_for_qa:
  - in_qa
  - on_hold
  in_qa:
  - completed
  - ready_for_development
  - on_hold
  completed: []
  cancelled: []
  blocked:
  - ready_for_development
  - cancelled
  on_hold:
  - ready_for_development
  - cancelled
status_metadata:
  draft:
    description: Bug reported, not yet started
    phase: planning
    color: gray
    progress_weight: 0
    is_planning: true
    responsibility: none
    orchestrator_action:
      action: advance_status
      instruction_template: bug/draft.tmpl
  reported:
    description: Bug reported, not yet started
    phase: planning
    color: gray
    progress_weight: 0
    is_planning: true
    responsibility: none
    orchestrator_action:
      action: advance_status
      instruction_template: bug/draft.tmpl
  ready_for_development:
    description: Ready for bug reproduction and fix
    phase: development
    color: yellow
    progress_weight: 0.1
    is_planning: false
    responsibility: agent
    agent_types:
    - developer
    orchestrator_action:
      action: spawn_agent
      agent_type: developer
      model: sonnet
      skills:
      - debugging
      - test-driven-development
      instruction_template: bug/ready_for_development.tmpl
  in_development:
    description: Bug fix in progress
    phase: development
    color: yellow
    progress_weight: 0.4
    is_planning: false
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: developer
      model: sonnet
      skills:
      - debugging
      - test-driven-development
      instruction_template: bug/in_development.tmpl
  ready_for_code_review:
    description: Ready for code review of bug fix
    phase: code_review
    color: magenta
    progress_weight: 0.55
    is_planning: false
    responsibility: agent
    agent_types:
    - tech-lead
    orchestrator_action:
      action: spawn_agent
      agent_type: tech-lead
      model: opus
      skills:
      - quality
      instruction_template: task_short/ready_for_code_review.tmpl
  in_code_review:
    description: Code review of bug fix in progress
    phase: code_review
    color: magenta
    progress_weight: 0.65
    is_planning: false
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: tech-lead
      model: opus
      skills:
      - quality
      instruction_template: task_short/in_code_review.tmpl
  ready_for_qa:
    description: Ready for QA verification of bug fix
    phase: qa
    color: blue
    progress_weight: 0.8
    is_planning: false
    responsibility: agent
    agent_types:
    - qa
    orchestrator_action:
      action: spawn_agent
      agent_type: qa
      model: sonnet
      skills:
      - quality
      instruction_template: task_short/ready_for_qa.tmpl
  in_qa:
    description: QA verification of bug fix in progress
    phase: qa
    color: blue
    progress_weight: 0.9
    is_planning: false
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: qa
      model: sonnet
      skills:
      - quality
      instruction_template: task_short/in_qa.tmpl
  completed:
    description: Bug fixed and verified
    phase: done
    color: green
    progress_weight: 1.0
    is_planning: false
    responsibility: none
    orchestrator_action:
      action: archive
      instruction_template: bug/completed.tmpl
  cancelled:
    description: Bug not reproducible or won't fix
    phase: done
    color: red
    progress_weight: 0
    is_planning: false
    responsibility: none
    exclude_from_progress: true
    orchestrator_action:
      action: archive
      instruction_template: bug/cancelled.tmpl
  blocked:
    description: Cannot proceed, awaiting external resolution
    phase: blocked
    color: red
    progress_weight: 0
    is_planning: false
    responsibility: human
    orchestrator_action:
      action: pause
      instruction_template: bug/blocked.tmpl
  on_hold:
    description: Intentionally deferred
    phase: paused
    color: gray
    progress_weight: 0
    is_planning: false
    responsibility: human
    orchestrator_action:
      action: pause
      instruction_template: bug/on_hold.tmpl
special_statuses:
  _start_:
  - draft
  - reported
  _complete_:
  - completed
  - cancelled
