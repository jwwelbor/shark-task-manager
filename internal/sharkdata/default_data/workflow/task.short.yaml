version: '1.0'
status_flow:
  draft:
  - ready_for_development
  - cancelled
  - on_hold
  ready_for_development:
  - in_development
  - blocked
  - on_hold
  in_development:
  - completed
  - blocked
  - on_hold
  completed:
  - ready_for_development
  cancelled:
  - draft
  blocked:
  - ready_for_development
  - cancelled
  on_hold:
  - ready_for_development
  - cancelled
status_metadata:
  draft:
    description: Task created from feature decomposition
    phase: planning
    color: gray
    progress_weight: 0
    is_planning: true
    responsibility: none
    orchestrator_action:
      action: advance_status
      instruction_template: task_short/draft.tmpl
  ready_for_development:
    description: Ready for TDD implementation
    phase: development
    color: yellow
    progress_weight: 0.1
    is_planning: false
    responsibility: agent
    agent_types:
    - developer
    orchestrator_action:
      action: spawn_agent
      agent_type: developer
      model: sonnet
      skills:
      - implementation
      - test-driven-development
      instruction_template: task_short/ready_for_development.tmpl
  in_development:
    description: TDD implementation in progress
    phase: development
    color: yellow
    progress_weight: 0.4
    is_planning: false
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: developer
      model: sonnet
      skills:
      - implementation
      - test-driven-development
      instruction_template: task_short/in_development.tmpl
  completed:
    description: Task done and verified
    phase: done
    color: green
    progress_weight: 1.0
    is_planning: false
    responsibility: none
    orchestrator_action:
      action: archive
      instruction_template: task_short/completed.tmpl
  cancelled:
    description: Task abandoned
    phase: done
    color: red
    progress_weight: 0
    is_planning: false
    responsibility: none
    exclude_from_progress: true
    orchestrator_action:
      action: archive
      instruction_template: task_short/cancelled.tmpl
  blocked:
    description: External blocker preventing progress
    phase: blocked
    color: red
    progress_weight: 0
    is_planning: false
    responsibility: human
    orchestrator_action:
      action: pause
      instruction_template: task_short/blocked.tmpl
  on_hold:
    description: Intentionally paused
    phase: paused
    color: gray
    progress_weight: 0
    is_planning: false
    responsibility: human
    orchestrator_action:
      action: pause
      instruction_template: task_short/on_hold.tmpl
special_statuses:
  _start_:
  - draft
  _complete_:
  - completed
  - cancelled
