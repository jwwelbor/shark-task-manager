version: '1.0'
status_flow:
  draft:
  - ready_for_development
  - cancelled
  - on_hold
  ready_for_development:
  - in_development
  - blocked
  - on_hold
  in_development:
  - ready_for_code_review
  - blocked
  - on_hold
  ready_for_code_review:
  - in_code_review
  - on_hold
  in_code_review:
  - ready_for_qa
  - ready_for_development
  - on_hold
  ready_for_qa:
  - in_qa
  - on_hold
  in_qa:
  - completed
  - ready_for_development
  - on_hold
  completed: []
  cancelled: []
  blocked:
  - ready_for_development
  - cancelled
  on_hold:
  - ready_for_development
  - cancelled
status_metadata:
  draft:
    description: Change card created, not yet started
    phase: planning
    color: gray
    progress_weight: 0
    is_planning: true
    responsibility: none
    orchestrator_action:
      action: advance_status
      instruction_template: change/draft.md
  ready_for_development:
    description: Ready for implementation
    phase: development
    color: yellow
    progress_weight: 0.1
    is_planning: false
    responsibility: agent
    agent_types:
    - developer
    orchestrator_action:
      action: spawn_agent
      agent_type: developer
      provider: anthropic
      model: sonnet
      skills:
      - implementation
      instruction_template: change/ready_for_development.md
  in_development:
    description: Implementation in progress
    phase: development
    color: yellow
    progress_weight: 0.4
    is_planning: false
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: developer
      provider: anthropic
      model: sonnet
      skills:
      - implementation
      instruction_template: change/in_development.md
  ready_for_code_review:
    description: Ready for code review
    phase: code_review
    color: magenta
    progress_weight: 0.55
    is_planning: false
    responsibility: agent
    agent_types:
    - tech-lead
    orchestrator_action:
      action: spawn_agent
      agent_type: tech-lead
      provider: anthropic
      model: opus
      skills:
      - quality
      instruction_template: task/ready_for_code_review.md
  in_code_review:
    description: Code review in progress
    phase: code_review
    color: magenta
    progress_weight: 0.65
    is_planning: false
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: tech-lead
      provider: anthropic
      model: opus
      skills:
      - quality
      instruction_template: task/in_code_review.md
  ready_for_qa:
    description: Ready for QA verification
    phase: qa
    color: blue
    progress_weight: 0.8
    is_planning: false
    responsibility: agent
    agent_types:
    - qa
    orchestrator_action:
      action: spawn_agent
      agent_type: qa
      provider: anthropic
      model: sonnet
      skills:
      - quality
      instruction_template: task/ready_for_qa.md
  in_qa:
    description: QA verification in progress
    phase: qa
    color: blue
    progress_weight: 0.9
    is_planning: false
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: qa
      provider: anthropic
      model: sonnet
      skills:
      - quality
      instruction_template: task/in_qa.md
  completed:
    description: Change implemented and verified
    phase: done
    color: green
    progress_weight: 1.0
    is_planning: false
    responsibility: none
    orchestrator_action:
      action: archive
      instruction_template: change/completed.md
  cancelled:
    description: Change no longer needed
    phase: done
    color: red
    progress_weight: 0
    is_planning: false
    responsibility: none
    exclude_from_progress: true
    orchestrator_action:
      action: archive
      instruction_template: change/cancelled.md
  blocked:
    description: Cannot proceed, awaiting external resolution
    phase: blocked
    color: red
    progress_weight: 0
    is_planning: false
    responsibility: human
    orchestrator_action:
      action: pause
      instruction_template: bug/blocked.md
  on_hold:
    description: Intentionally deferred
    phase: paused
    color: gray
    progress_weight: 0
    is_planning: false
    responsibility: human
    orchestrator_action:
      action: pause
      instruction_template: bug/on_hold.md
special_statuses:
  _start_:
  - draft
  _complete_:
  - completed
  - cancelled
