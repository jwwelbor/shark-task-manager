version: "1.0"
start: draft
steps:
  blocked:
    phase: blocked
    color: red
    display_token: BLK
    description: "Cannot proceed, awaiting external resolution"
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: bug/blocked.md
  cancelled:
    phase: done
    color: red
    display_token: CXL
    description: Change no longer needed
    progress_weight: 0
    responsibility: none
    exclude_from_progress: true
    action: archive
    terminal: true
    prompt: change/cancelled.md
    aliases: [declined]
  code_review:
    phase: code_review
    color: magenta
    display_token: CRV
    description: Ready for code review
    progress_weight: 0.55
    responsibility: agent
    action: spawn_agent
    agent: tech-lead
    provider: anthropic
    model: opus
    skills: [quality]
    prompt: task/code_review.md
    outcomes:
      blocked: blocked
      fail: development
      on_hold: on_hold
      pass: qa
  completed:
    phase: done
    color: green
    display_token: CMP
    description: Change implemented and verified
    progress_weight: 1.0
    responsibility: none
    action: archive
    terminal: true
    prompt: change/completed.md
  development:
    phase: development
    color: yellow
    display_token: RFD
    description: Ready for implementation
    progress_weight: 0.1
    responsibility: agent
    action: spawn_agent
    agent: developer
    provider: anthropic
    model: sonnet
    skills: [implementation]
    prompt: change/development.md
    outcomes:
      blocked: blocked
      fail: draft
      on_hold: on_hold
      pass: code_review
  draft:
    phase: planning
    color: gray
    display_token: DFT
    description: "Change card created, not yet started"
    progress_weight: 0
    responsibility: none
    is_planning: true
    action: advance_status
    prompt: change/draft.md
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: draft
      on_hold: on_hold
      pass: development
    aliases: [proposed]
  on_hold:
    phase: paused
    color: gray
    display_token: HLD
    description: Intentionally deferred
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: bug/on_hold.md
  qa:
    phase: qa
    color: blue
    display_token: QA
    description: Ready for QA verification
    progress_weight: 0.8
    responsibility: agent
    action: spawn_agent
    agent: qa
    provider: anthropic
    model: sonnet
    skills: [quality]
    prompt: task/qa.md
    outcomes:
      blocked: blocked
      fail: development
      on_hold: on_hold
      pass: completed
