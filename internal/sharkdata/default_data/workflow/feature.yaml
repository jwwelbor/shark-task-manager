version: "1.0"
start: draft
steps:
  active:
    phase: execution
    color: yellow
    display_token: ACT
    description: "Tasks in progress, progress aggregated from children"
    progress_weight: 0.65
    responsibility: agent
    aggregates_from: tasks
    action: cascade
    prompt: feature/active.md
    outcomes:
      blocked: blocked
      fail: task_review
      on_hold: on_hold
      pass: code_review
  approval:
    phase: approval
    color: cyan
    display_token: APR
    description: QA passed — ready for UAT red-team review
    progress_weight: 0.9
    responsibility: agent
    action: spawn_agent
    agent: uat-agent
    provider: openai
    model: codex
    skills: [quality, uat]
    prompt: feature/approval.md
    outcomes:
      blocked: blocked
      fail: active
      on_hold: on_hold
      pass: completed
  assessment:
    phase: triage
    color: orange
    display_token: RFA
    description: Ready for scope validation and complexity triage
    progress_weight: 0.02
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: researcher
    provider: anthropic
    model: haiku
    skills: [assessment, research]
    prompt: feature/assessment.md
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: draft
      on_hold: on_hold
      pass: research
      simple: task_generation
      standard: specification
  blocked:
    phase: blocked
    color: red
    display_token: BLK
    description: External blocker preventing progress
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: feature/blocked.md
  cancelled:
    phase: done
    color: red
    display_token: CXL
    description: Feature abandoned or converted to task
    progress_weight: 0
    responsibility: none
    exclude_from_progress: true
    action: archive
    terminal: true
    prompt: feature/cancelled.md
  code_review:
    phase: code_review
    color: magenta
    display_token: CRV
    description: "All tasks developed — feature verification gate (merged review+QA for SIMPLE/STANDARD; review-only first gate for COMPLEX)"
    progress_weight: 0.7
    responsibility: agent
    action: spawn_agent
    agent: tech-lead
    provider: anthropic
    model: sonnet
    skills: [quality]
    prompt: feature/code_review.md
    outcomes:
      blocked: blocked
      deep_verify: qa
      fail: active
      on_hold: on_hold
      pass: approval
  completed:
    phase: done
    color: green
    display_token: CMP
    description: "All tasks done, feature delivered"
    progress_weight: 1.0
    responsibility: none
    action: archive
    terminal: true
    prompt: feature/completed.md
  draft:
    phase: planning
    color: gray
    display_token: DFT
    description: Feature created from epic decomposition
    progress_weight: 0
    responsibility: none
    is_planning: true
    action: advance_status
    prompt: feature/draft.md
    outcomes:
      already_planned: active
      blocked: blocked
      cancelled: cancelled
      fail: draft
      pass: assessment
  on_hold:
    phase: paused
    color: gray
    display_token: HLD
    description: "Intentionally paused, awaiting product decision"
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: feature/on_hold.md
  qa:
    phase: qa
    color: blue
    display_token: QA
    description: "COMPLEX features only: deep second verification gate after review"
    progress_weight: 0.8
    responsibility: agent
    action: spawn_agent
    agent: qa
    provider: anthropic
    model: sonnet
    skills: [quality, test-driven-development]
    prompt: feature/qa.md
    outcomes:
      blocked: blocked
      fail: active
      on_hold: on_hold
      pass: approval
  research:
    phase: research
    color: purple
    display_token: RSR
    description: "COMPLEX features: ready for tactical codebase research"
    progress_weight: 0.1
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: researcher
    provider: anthropic
    model: sonnet
    skills: [research]
    prompt: feature/research.md
    outcomes:
      blocked: blocked
      fail: assessment
      on_hold: on_hold
      pass: specification
  specification:
    phase: specification
    color: cyan
    display_token: RFS
    description: Ready for combined requirements + architecture spec
    progress_weight: 0.2
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: architect
    provider: anthropic
    model: opus
    skills: [architecture, specification-writing]
    prompt: feature/specification.md
    outcomes:
      blocked: blocked
      fail: research
      on_hold: on_hold
      pass: test_planning
  task_generation:
    phase: decomposition
    color: blue
    display_token: RTG
    description: Ready to generate thin task specs
    progress_weight: 0.45
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: product-manager
    provider: anthropic
    model: sonnet
    skills: [specification-writing]
    prompt: feature/task_generation.md
    outcomes:
      blocked: blocked
      fail: test_planning
      on_hold: on_hold
      pass: task_review
  task_review:
    phase: review
    color: magenta
    display_token: RTR
    description: Ready for codex review of tasks against feature spec
    progress_weight: 0.55
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: uat-agent
    provider: openai
    model: codex
    skills: [quality, specification-writing]
    prompt: feature/task_review.md
    outcomes:
      blocked: blocked
      fail: task_generation
      on_hold: on_hold
      pass: active
  test_planning:
    phase: test_planning
    color: blue
    display_token: RTP
    description: Ready for feature test strategy
    progress_weight: 0.35
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: qa
    provider: anthropic
    model: sonnet
    skills: [quality, test-driven-development]
    prompt: feature/test_planning.md
    outcomes:
      blocked: blocked
      fail: specification
      on_hold: on_hold
      pass: task_generation
