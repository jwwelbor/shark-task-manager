version: "1.0"
start: draft
steps:
  blocked:
    phase: blocked
    color: red
    display_token: BLK
    description: External blocker preventing progress
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: task/blocked.md
  cancelled:
    phase: done
    color: red
    display_token: CXL
    description: Task abandoned
    progress_weight: 0
    responsibility: none
    exclude_from_progress: true
    action: archive
    terminal: true
    prompt: task/cancelled.md
  completed:
    phase: done
    color: green
    display_token: CMP
    description: Task done and verified
    progress_weight: 1.0
    responsibility: none
    action: archive
    terminal: true
    prompt: task/completed.md
  development:
    phase: development
    color: yellow
    display_token: RFD
    description: Ready for TDD implementation
    progress_weight: 0.1
    responsibility: agent
    action: spawn_agent
    agent: developer
    provider: anthropic
    model: sonnet
    effort: high
    skills: [implementation, test-driven-development]
    prompt: task/development.md
    outcomes:
      blocked: blocked
      fail: draft
      on_hold: on_hold
      pass: completed
  draft:
    phase: planning
    color: gray
    display_token: DFT
    description: Task created from feature decomposition
    progress_weight: 0
    responsibility: none
    is_planning: true
    action: advance_status
    prompt: task/draft.md
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: draft
      on_hold: on_hold
      pass: development
  on_hold:
    phase: paused
    color: gray
    display_token: HLD
    description: Intentionally paused
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: task/on_hold.md
