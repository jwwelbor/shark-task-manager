version: '1.0'
status_flow:
  draft:
  - ready_for_refinement
  - active
  - cancelled
  ready_for_refinement:
  - in_refinement
  - blocked
  - on_hold
  in_refinement:
  - ready_for_ba_check
  - ready_for_research
  - blocked
  - on_hold
  ready_for_research:
  - in_research
  - cancelled
  - on_hold
  in_research:
  - ready_for_feasibility_review_ba
  - blocked
  - on_hold
  ready_for_feasibility_review_ba:
  - in_feasibility_review_ba
  - blocked
  - on_hold
  in_feasibility_review_ba:
  - ready_for_feasibility_review_tech
  - intervention_required
  - blocked
  - on_hold
  ready_for_feasibility_review_tech:
  - in_feasibility_review_tech
  - blocked
  - on_hold
  in_feasibility_review_tech:
  - ready_for_tech_check
  - ready_for_test_planning
  - intervention_required
  - blocked
  - on_hold
  intervention_required:
  - ready_for_refinement
  - ready_for_research
  - ready_for_feasibility_review_ba
  - ready_for_feasibility_review_tech
  - ready_for_test_planning
  - cancelled
  - on_hold
  ready_for_test_planning:
  - in_test_planning
  - blocked
  - on_hold
  in_test_planning:
  - ready_for_decomposition
  - ready_for_refinement
  - blocked
  - on_hold
  ready_for_decomposition:
  - in_decomposition
  - blocked
  - on_hold
  in_decomposition:
  - active
  - blocked
  - on_hold
  active:
  - completed
  - on_hold
  completed: []
  cancelled: []
  on_hold:
  - ready_for_research
  - ready_for_refinement
  - ready_for_feasibility_review_ba
  - ready_for_feasibility_review_tech
  - ready_for_test_planning
  - ready_for_decomposition
  - active
  - cancelled
  - ready_for_ba_check
  - ready_for_tech_check
  blocked:
  - ready_for_research
  - ready_for_refinement
  - ready_for_feasibility_review_ba
  - ready_for_feasibility_review_tech
  - ready_for_test_planning
  - ready_for_decomposition
  - ready_for_ba_check
  - ready_for_tech_check
  ready_for_ba_check:
  - in_ba_check
  - blocked
  - on_hold
  in_ba_check:
  - in_research
  - in_refinement
  - blocked
  - on_hold
  ready_for_tech_check:
  - in_tech_check
  - blocked
  - on_hold
  in_tech_check:
  - in_test_planning
  - in_feasibility_review_tech
  - blocked
  - on_hold
status_metadata:
  draft:
    description: Epic captured, not yet refined
    phase: planning
    color: gray
    progress_weight: 0
    is_planning: true
    responsibility: none
    orchestrator_action:
      action: advance_status
      instruction_template: epic/draft.tmpl
  ready_for_research:
    description: Epic PRD complete, ready for targeted research against defined scope
    phase: research
    color: purple
    progress_weight: 0.2
    is_planning: true
    responsibility: agent
    agent_types:
    - researcher
    orchestrator_action:
      action: spawn_agent
      agent_type: researcher
      skills:
      - research
      - research
      instruction_template: epic/ready_for_research.tmpl
  in_research:
    description: Research in progress
    phase: research
    color: purple
    progress_weight: 0.3
    is_planning: true
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: researcher
      skills:
      - research
      - research
      instruction_template: epic/in_research.tmpl
  ready_for_feasibility_review_ba:
    description: Research complete, ready for BA feasibility review
    phase: feasibility
    color: teal
    progress_weight: 0.35
    is_planning: true
    responsibility: agent
    agent_types:
    - business-analyst
    orchestrator_action:
      action: spawn_agent
      agent_type: business-analyst
      skills:
      - specification-writing
      - research
      instruction_template: epic/ready_for_feasibility_review_ba.tmpl
  in_feasibility_review_ba:
    description: BA reviewing business feasibility
    phase: feasibility
    color: teal
    progress_weight: 0.38
    is_planning: true
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: business-analyst
      skills:
      - specification-writing
      - research
      instruction_template: epic/in_feasibility_review_ba.tmpl
  ready_for_feasibility_review_tech:
    description: BA feasibility approved, ready for technical feasibility review
    phase: feasibility
    color: teal
    progress_weight: 0.4
    is_planning: true
    responsibility: agent
    agent_types:
    - architect
    orchestrator_action:
      action: spawn_agent
      agent_type: architect
      skills:
      - architecture
      - research
      instruction_template: epic/ready_for_feasibility_review_tech.tmpl
  in_feasibility_review_tech:
    description: Architect reviewing technical feasibility
    phase: feasibility
    color: teal
    progress_weight: 0.43
    is_planning: true
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: architect
      skills:
      - architecture
      - research
      instruction_template: epic/in_feasibility_review_tech.tmpl
  intervention_required:
    description: Feasibility review raised concerns requiring human decision
    phase: intervention
    color: red
    progress_weight: 0
    is_planning: true
    responsibility: human
    orchestrator_action:
      action: pause
      instruction_template: epic/intervention_required.tmpl
  ready_for_refinement:
    description: Draft captured, ready for BA to write epic PRD
    phase: refinement
    color: orange
    progress_weight: 0.1
    is_planning: true
    responsibility: agent
    agent_types:
    - business-analyst
    orchestrator_action:
      action: spawn_agent
      agent_type: business-analyst
      skills:
      - specification-writing
      instruction_template: epic/ready_for_refinement.tmpl
  in_refinement:
    description: BA refining epic requirements
    phase: refinement
    color: orange
    progress_weight: 0.15
    is_planning: true
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: business-analyst
      skills:
      - specification-writing
      instruction_template: epic/in_refinement.tmpl
  ready_for_test_planning:
    description: Feasibility approved, ready for UAT acceptance plan
    phase: test_planning
    color: lime
    progress_weight: 0.5
    is_planning: true
    responsibility: agent
    agent_types:
    - qa
    orchestrator_action:
      action: spawn_agent
      agent_type: qa
      skills:
      - quality
      - shark
      instruction_template: epic/ready_for_test_planning.tmpl
  in_test_planning:
    description: QA creating epic UAT acceptance plan
    phase: test_planning
    color: lime
    progress_weight: 0.55
    is_planning: true
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: qa
      skills:
      - quality
      - shark
      instruction_template: epic/in_test_planning.tmpl
  ready_for_decomposition:
    description: Epic PRD, feasibility reviews, and UAT plan complete, ready to decompose
      into features
    phase: decomposition
    color: yellow
    progress_weight: 0.6
    is_planning: true
    responsibility: agent
    agent_types:
    - product-manager
    orchestrator_action:
      action: spawn_agent
      agent_type: product-manager
      skills:
      - specification-writing
      instruction_template: epic/ready_for_decomposition.tmpl
  in_decomposition:
    description: Features being generated from epic
    phase: decomposition
    color: yellow
    progress_weight: 0.7
    is_planning: true
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: product-manager
      skills:
      - specification-writing
      instruction_template: epic/in_decomposition.tmpl
  active:
    description: Features exist, progress aggregated from children
    phase: execution
    color: blue
    progress_weight: 1.0
    is_planning: false
    responsibility: none
    aggregates_from: features
    orchestrator_action:
      action: cascade
      agent_type: tech-director
      skills:
      - orchestration
      - shark
      instruction_template: epic/active.tmpl
  completed:
    description: All features complete
    phase: done
    color: green
    progress_weight: 1.0
    is_planning: false
    responsibility: none
    orchestrator_action:
      action: archive
      instruction_template: epic/completed.tmpl
  cancelled:
    description: Epic abandoned
    phase: done
    color: gray
    progress_weight: 0
    is_planning: false
    responsibility: none
    orchestrator_action:
      action: archive
      instruction_template: epic/cancelled.tmpl
  on_hold:
    description: Epic intentionally paused
    phase: paused
    color: orange
    progress_weight: 0
    is_planning: true
    responsibility: none
    orchestrator_action:
      action: pause
      instruction_template: epic/on_hold.tmpl
  blocked:
    description: Epic blocked by external dependency
    phase: blocked
    color: red
    progress_weight: 0
    is_planning: true
    responsibility: none
    orchestrator_action:
      action: pause
      instruction_template: epic/blocked.tmpl
  ready_for_ba_check:
    description: Epic BA docs complete, ready for BA quality check
    phase: refinement
    color: yellow
    progress_weight: 0.17
    is_planning: true
    responsibility: agent
    agent_types:
    - business-analyst
    orchestrator_action:
      action: spawn_agent
      agent_type: business-analyst
      skills:
      - specification-writing
      - shark
      instruction_template: epic/ready_for_ba_check.tmpl
  in_ba_check:
    description: BA validator checking epic docs for completeness and depth
    phase: refinement
    color: yellow
    progress_weight: 0.19
    is_planning: true
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: business-analyst
      skills:
      - specification-writing
      - shark
      instruction_template: epic/in_ba_check.tmpl
  ready_for_tech_check:
    description: Epic tech docs complete, ready for tech quality check
    phase: feasibility
    color: lime
    progress_weight: 0.46
    is_planning: true
    responsibility: agent
    agent_types:
    - architect
    orchestrator_action:
      action: spawn_agent
      agent_type: architect
      skills:
      - architecture
      - specification-writing
      - shark
      instruction_template: epic/ready_for_tech_check.tmpl
  in_tech_check:
    description: Architect validator checking epic tech docs for completeness and
      depth
    phase: feasibility
    color: lime
    progress_weight: 0.48
    is_planning: true
    responsibility: agent
    orchestrator_action:
      action: check_or_resume
      agent_type: architect
      skills:
      - architecture
      - specification-writing
      - shark
      instruction_template: epic/in_tech_check.tmpl
special_statuses:
  _start_:
  - draft
  _complete_:
  - completed
  - cancelled
  _aggregation_:
  - active
