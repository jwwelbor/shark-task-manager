version: "1.0"
start: draft
steps:
  active:
    phase: execution
    color: yellow
    display_token: ACT
    description: "Features in progress, progress aggregated from children"
    progress_weight: 0.75
    responsibility: agent
    aggregates_from: features
    action: cascade
    prompt: epic/active.md
    outcomes:
      blocked: blocked
      fail: feature_review
      on_hold: on_hold
      pass: completed
  assessment:
    phase: triage
    color: purple
    display_token: RAS
    description: Ready for intake triage — confirm this is genuinely an epic before the heavyweight pipeline runs
    progress_weight: 0.02
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: researcher
    provider: anthropic
    model: haiku
    effort: low
    skills: [assessment, research]
    prompt: epic/assessment.md
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: draft
      on_hold: on_hold
      pass: refinement
  blocked:
    phase: blocked
    color: red
    display_token: BLK
    description: External blocker preventing progress
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: epic/blocked.md
  cancelled:
    phase: done
    color: red
    display_token: CXL
    description: Epic abandoned or reclassified into a lighter entity
    progress_weight: 0
    responsibility: none
    exclude_from_progress: true
    action: archive
    terminal: true
    prompt: epic/cancelled.md
  completed:
    phase: done
    color: green
    display_token: CMP
    description: "All features done, epic delivered"
    progress_weight: 1.0
    responsibility: none
    action: archive
    terminal: true
    primary: true
    prompt: epic/completed.md
  decomposition:
    phase: decomposition
    color: blue
    display_token: RDC
    description: Ready to break epic into features
    progress_weight: 0.45
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: product-manager
    provider: anthropic
    model: sonnet
    skills: [specification-writing]
    prompt: epic/decomposition.md
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: design
      on_hold: on_hold
      pass: feature_review
  design:
    phase: design
    color: cyan
    display_token: RDS
    description: Ready for architecture decisions and UAT plan
    progress_weight: 0.3
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: architect
    provider: anthropic
    model: opus
    effort: high
    skills: [architecture, quality]
    prompt: epic/design.md
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: research
      needs_refinement: refinement
      on_hold: on_hold
      pass: decomposition
  draft:
    phase: planning
    color: gray
    display_token: DFT
    description: "Epic captured, not yet refined"
    progress_weight: 0
    responsibility: none
    is_planning: true
    action: advance_status
    prompt: epic/draft.md
    outcomes:
      already_planned: active
      blocked: blocked
      cancelled: cancelled
      fail: draft
      pass: assessment
  feature_review:
    phase: review
    color: magenta
    display_token: RFV
    description: Ready for codex review of features against epic requirements
    progress_weight: 0.55
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: uat-agent
    provider: openai
    model: gpt-5.2-codex
    skills: [quality, specification-writing]
    prompt: epic/feature_review.md
    outcomes:
      blocked: blocked
      fail: decomposition
      on_hold: on_hold
      pass: active
  on_hold:
    phase: paused
    color: gray
    display_token: HLD
    description: "Intentionally paused, awaiting product decision"
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: epic/on_hold.md
  refinement:
    phase: refinement
    color: orange
    display_token: RFR
    description: Ready for BA to write epic PRD
    progress_weight: 0.05
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: business-analyst
    provider: anthropic
    model: opus
    effort: high
    skills: [specification-writing]
    prompt: epic/refinement.md
    outcomes:
      blocked: blocked
      fail: draft
      on_hold: on_hold
      pass: research
  research:
    phase: research
    color: purple
    display_token: RSR
    description: Ready for brownfield codebase analysis
    progress_weight: 0.15
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: researcher
    provider: anthropic
    model: sonnet
    skills: [research]
    prompt: epic/research.md
    outcomes:
      blocked: blocked
      fail: refinement
      on_hold: on_hold
      pass: design
