# GoReleaser configuration for Shark Task Manager
# This configuration builds multi-platform binaries and creates release archives
# Documentation: https://goreleaser.com

# Configuration version
version: 2

# Project information
project_name: shark

# Build configuration
builds:
  - # Build target: cmd/shark/main.go
    main: ./cmd/shark/main.go

    # Binary name
    binary: shark

    # Inject version at build time
    # This sets the Version variable in main.go via ldflags
    ldflags:
      - -s -w # Strip debug symbols to reduce binary size
      - -X main.Version={{.Version}} # Inject version from git tag

    # Build for multiple platforms
    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    # Platform-specific configurations
    # Exclude invalid platform combinations
    ignore:
      - goos: windows
        goarch: arm64 # Windows ARM64 not commonly used yet

    # Cross-compilation settings
    overrides:
      # Linux amd64 with CGO (native build)
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1

      # Linux ARM64 with CGO and cross-compiler
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++

      # Windows: disable CGO (cross-compilation from Linux is problematic)
      - goos: windows
        env:
          - CGO_ENABLED=0

      # macOS: disable CGO (cannot cross-compile from Linux without Apple SDK)
      - goos: darwin
        env:
          - CGO_ENABLED=0

# Archive configuration
archives:
  - id: default

    # Files to include in each archive
    files:
      - LICENSE
      - README.md

    # Archive naming: shark_version_os_arch
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

    # Use .zip for Windows, .tar.gz for everything else
    format_overrides:
      - goos: windows
        formats: [zip]

# Linux package configuration (generates .deb and .rpm packages)
nfpms:
  - id: packages
    package_name: shark
    homepage: https://github.com/jwwelbor/shark-task-manager
    maintainer: John Welborn <jwwelbor@gmail.com>
    description: Task management CLI for AI-driven development workflows
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/shark/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/shark/README.md

# Checksum configuration
# Generates checksums.txt file for verifying downloads
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Snapshot configuration
# Used for local testing without git tags
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog configuration
# Auto-generates release notes from git commits
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

# Homebrew Tap configuration
brews:
  - repository:
      owner: jwwelbor
      name: homebrew-shark
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: shark
    homepage: https://github.com/jwwelbor/shark-task-manager
    description: "Task management CLI for AI-driven development workflows"
    license: "MIT"
    ids:
      - default
    install: |
      bin.install "shark"
    test: |
      system "#{bin}/shark", "--version"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

# Scoop Bucket configuration
scoops:
  - repository:
      owner: jwwelbor
      name: scoop-shark
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    name: shark
    homepage: https://github.com/jwwelbor/shark-task-manager
    description: "Task management CLI for AI-driven development workflows"
    license: MIT
    ids:
      - default
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

# Release configuration
# Creates GitHub releases as drafts for manual review
release:
  draft: true # Start as draft, manually publish after review
  prerelease: auto # Auto-detect pre-release from version tag

  # Release notes header
  header: |
    ## Shark Task Manager {{ .Tag }}

    Task management CLI for AI-driven development workflows.

  # Release notes footer
  footer: |
    **Full Changelog**: https://github.com/jwwelbor/shark-task-manager/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### Installation

    **Homebrew (macOS/Linux)**
    ```bash
    brew tap jwwelbor/shark
    brew install shark
    ```

    **Scoop (Windows)**
    ```powershell
    scoop bucket add shark https://github.com/jwwelbor/scoop-shark
    scoop install shark
    ```

    **Linux (.deb / Debian, Ubuntu)**
    ```bash
    # Download the .deb from assets below, then:
    sudo dpkg -i shark_{{ .Version }}_linux_amd64.deb
    ```

    **Linux (.rpm / Fedora, RHEL)**
    ```bash
    # Download the .rpm from assets below, then:
    sudo rpm -i shark_{{ .Version }}_linux_amd64.rpm
    ```

    **Manual install**
    Download the appropriate binary archive from the assets below, extract, and place `shark` in your PATH.

    ### Verifying Downloads

    All binaries include SHA256 checksums in `checksums.txt`. Verify your download:

    ```bash
    sha256sum -c checksums.txt --ignore-missing
    ```
