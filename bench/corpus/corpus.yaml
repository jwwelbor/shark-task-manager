# shark-bench benchmark corpus manifest (E40-F01, I-01).
#
# Schema is pinned by this file's schema_version and validated by
# tests/contracts/e40_i01_corpus_contract_test.go#TC-001 (T-E40-F01-010).
# See bench/README.md (T-E40-F01-011) for the full field reference and the
# diff-ledgers.sh method this manifest's ledgers are read against.
#
# fixture.base_sha is FROZEN as of T-E40-F01-004: this is the fixture's
# final commit for E40-F01. Every admitted item (T-E40-F01-002/003) and
# every negative item (T-E40-F01-004, below) is evaluated against this
# exact commit; no later E40-F01 task adds further fixture-repo commits
# (task spec AC-T4). T-E40-F01-008's ledgers and T-E40-F01-010's
# cross-encoding check (AC-013) are both generated/asserted against this
# SHA.
# INVARIANT: fixture.base_sha and every item's fixture_base_sha field must
# be byte-identical to each other. Update ALL occurrences together on any
# future fixture-content commit — a partial update (top-level advanced, one
# item's fixture_base_sha stale) is exactly the drift TC-001's
# cross-encoding check (AC-013) exists to catch. Before committing a
# base_sha change, grep this file for the old SHA and confirm zero
# remaining hits:
#   grep -c '<old_sha>' bench/corpus/corpus.yaml   # must be 0

schema_version: "1.0"

fixture:
  submodule_path: bench/fixture-repo
  base_sha: "4c24986844b09122e2d516f9bc1ec470b155b441"
  toolchain:
    # go.mod pins "go 1.25.0" as the module's language version, but the
    # toolchain that actually built bench/corpus/ledgers/<base_sha>/*.json
    # (T-E40-F01-008, `go env GOVERSION` inside build-ledgers.sh) is
    # go1.26.0. REQ-F-010 requires this field to carry the same value as
    # the ledgers it is compared against, so it is pinned to the toolchain
    # that produced them, not to go.mod's minimum language version.
    go_version: "go1.26.0"
    golangci_lint_version: "v2.9.0"
    goos: "linux"
    goarch: "amd64"
    golangci_config_sha256: "09ed800a017fc82f8ad89d274326168fec18d4ddeec58eccf9f624352200719c"

# p2p_sets maps a p2p_set identifier (named by each item below) to the
# package patterns and any `-run` selector/exclusions that define its
# pass-to-pass set. Per REQ-F-003, the default set is the fixture's whole
# suite; the item's own F2P test names are always subtracted from whatever
# set it names, so no set needs to list them itself.
#
# default excludes pkg/inventory::TestStock_PermanentlyFailingRegressionProbe,
# a deliberately wrong assertion committed to the fixture (T-E40-F01-004) so
# every admitted item and the cart-new-cart-zero-subtotal /
# validate-sku-uppercase-only negative items still see a green P2P set.
# full_suite_no_exclusions is the same packages with no exclusions, named
# only by the cart-add-item-rejects-negative-quantity negative item
# (rejection branch (b)) so its P2P set is red at base for a reason
# intrinsic to the set. This also exercises REQ-F-003's "every item MUST
# name exactly one set that exists" against more than one set.
p2p_sets:
  default:
    packages:
      - "./..."
    run_selector: ""
    exclude_tests:
      - "github.com/jwwelbor/shark-bench-fixture/pkg/inventory::TestStock_PermanentlyFailingRegressionProbe"
  full_suite_no_exclusions:
    packages:
      - "./..."
    run_selector: ""
    exclude_tests: []

# items are the admitted corpus (REQ-F-006: >=10 required in total). The
# first wave (T-E40-F01-002) established the item-authoring pattern with 4
# items; T-E40-F01-003 completes the set to 10 (4 bug, 6 task) here. Every
# bug item's F2P oracle is an author-written repro test (REQ-F-006); its
# `f2p.test_names` below is the "repro test set" E40-F02 names to emit
# repro_confirmed — no separate manifest field is needed since REQ-F-002's
# field inventory already carries it. inventory-reserve-boundary is the
# canonical example: its held-back test reproduces the reported defect
# exactly and is named in that item's f2p block.
items:
  - id: inventory-reserve-boundary
    type: bug
    prompt_path: items/inventory-reserve-boundary/prompt.md
    seed_path: items/inventory-reserve-boundary/seed.yaml
    f2p:
      paths:
        - items/inventory-reserve-boundary/testdata/f2p/reserve_exact_boundary_test.go
      test_names:
        - "github.com/jwwelbor/shark-bench-fixture/pkg/inventory::TestStock_ReserveExactAvailableStockSucceeds"
    p2p_set: default
    reference_patch_path: items/inventory-reserve-boundary/reference.patch
    fixture_base_sha: "4c24986844b09122e2d516f9bc1ec470b155b441"

