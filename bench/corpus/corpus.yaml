# negative_items is the committed rejection-path corpus (REQ-F-007):
# exactly three deliberately-broken candidates, one per admission-gate
# branch (a)/(b)/(d), stored apart from items[] and never emitted into any
# run list bench/scripts/admit.sh (T-E40-F01-006) or E40-F02 consumes.
# Branches (c) patch-apply-failure and (e) post-patch-P2P-failure need no
# committed fixture per REQ-F-007 — they are built transiently at test time
# by T-E40-F01-006's own tests from a copy of an admitted item's
# reference.patch: (c) truncates the copy to a malformed diff so `git
# apply` itself fails; (e) applies the copy unmodified and then makes one
# additional test-time mutation to the copy that flips one P2P test from
# pass to fail. See this task's completion note (`shark task note add`) for
# the full hand-off to T-E40-F01-006.
negative_items:
  - id: cart-new-cart-zero-subtotal
    type: bug
    # Rejection branch (a): F2P already green at base. The prompt/seed
    # describe a plausible-sounding but nonexistent defect — a fresh Cart
    # from cart.New() already reports a zero Subtotal/ItemCount at the
    # frozen base commit, so the held-back F2P oracle below passes
    # immediately, without reference.patch. admit.sh MUST reject this
    # candidate at check (a) — F2P-green-at-base — and MUST NOT admit it.
    prompt_path: negative/cart-new-cart-zero-subtotal/prompt.md
    seed_path: negative/cart-new-cart-zero-subtotal/seed.yaml
    f2p:
      paths:
        - negative/cart-new-cart-zero-subtotal/testdata/f2p/new_cart_zero_subtotal_test.go
      test_names:
        - "github.com/jwwelbor/shark-bench-fixture/pkg/cart::TestCart_NewCartHasZeroSubtotal"
    p2p_set: default
    reference_patch_path: negative/cart-new-cart-zero-subtotal/reference.patch
    fixture_base_sha: "4c24986844b09122e2d516f9bc1ec470b155b441"

  - id: cart-add-item-rejects-negative-quantity
    type: task
    # Rejection branch (b): P2P already red at base. This item's own
    # held-back F2P oracle (TestCart_AddItemRejectsNegativeQuantity) is an
    # ordinary, well-formed red-at-base test for a genuine unfixed defect —
    # AddItem does not reject a negative Quantity — so check (a) passes
    # honestly. Separately, its manifest entry below names p2p_set
    # full_suite_no_exclusions, a p2p_sets entry (unlike every other item's
    # "default") that does NOT exclude
    # pkg/inventory::TestStock_PermanentlyFailingRegressionProbe — a
    # deliberately wrong assertion committed straight into the fixture's
    # own pkg/inventory/inventory_test.go (this task's one fixture-repo
    # commit) that is already failing at the base commit, independent of
    # any candidate's F2P injection. admit.sh MUST reject this candidate at
    # check (b) — P2P-red-at-base — because its own p2p_set already
    # contains a failing test before any patch, and MUST NOT admit it.
    prompt_path: negative/cart-add-item-rejects-negative-quantity/prompt.md
    seed_path: negative/cart-add-item-rejects-negative-quantity/seed.yaml
    f2p:
      paths:
        - negative/cart-add-item-rejects-negative-quantity/testdata/f2p/add_item_negative_quantity_test.go
      test_names:
        - "github.com/jwwelbor/shark-bench-fixture/pkg/cart::TestCart_AddItemRejectsNegativeQuantity"
    p2p_set: full_suite_no_exclusions
    reference_patch_path: negative/cart-add-item-rejects-negative-quantity/reference.patch
    fixture_base_sha: "4c24986844b09122e2d516f9bc1ec470b155b441"

  - id: validate-sku-uppercase-only
    type: task
    # Rejection branch (d): reference patch leaves F2P red. The held-back
    # F2P oracle correctly fails at base (SKU has no uppercase-only rule
    # yet), but reference.patch is deliberately incomplete — it adds only a
    # TODO comment above SKU and never adds the guard clause, so SKU's
    # behavior is byte-identical before and after the patch and the F2P
    # oracle is still red once it applies. admit.sh MUST reject this
    # candidate at check (d) — F2P-still-red-post-patch — after passing
    # checks (a)-(c), and MUST NOT admit it.
    prompt_path: negative/validate-sku-uppercase-only/prompt.md
    seed_path: negative/validate-sku-uppercase-only/seed.yaml
    f2p:
      paths:
        - negative/validate-sku-uppercase-only/testdata/f2p/sku_uppercase_test.go
      test_names:
        - "github.com/jwwelbor/shark-bench-fixture/pkg/validate::TestSKU_RejectsLowercaseLetters"
    p2p_set: default
    reference_patch_path: negative/validate-sku-uppercase-only/reference.patch
    fixture_base_sha: "4c24986844b09122e2d516f9bc1ec470b155b441"
