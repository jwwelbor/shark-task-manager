type: task
title: "Reject a Stock.Adjust correction that would drive available quantity negative"
description: |
  Stock.Adjust applies a manual delta correction to a SKU's available
  quantity but does not validate the result, silently allowing available
  quantity to go negative. Add validation that returns a clear, descriptive
  error and leaves the stock level unchanged when the resulting quantity
  would be negative, leaving behavior for a non-negative result unchanged.
