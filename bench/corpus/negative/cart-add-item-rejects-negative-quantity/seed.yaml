type: task
title: "Reject negative quantities when adding a cart item"
description: |
  Cart.AddItem currently appends any item to the cart, including one with a
  negative Quantity, which lets Cart.ItemCount() go negative. Change
  AddItem so an item with a negative Quantity is silently ignored and
  never added, while items with a zero or positive Quantity continue to be
  added exactly as they are today.
