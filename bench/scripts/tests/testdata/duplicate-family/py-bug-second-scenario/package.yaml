# Synthetic seventh scenario package, test-only fixture for AC-F11-38a
# (spec.md REQ-F-012). A copy of
# bench/scenarios/packages/py-bug-due-date-boundary/package.yaml with only
# `scenario_id` changed, so it shares `entity_family: bug` with a real
# admitted package while remaining a distinct scenario.
#
# This package is NEVER added to bench/scenarios/scenarios.yaml -- it is
# reachable only through a test-owned scenario-index YAML passed to
# `e40-benchmark.sh setup --scenario-index <path>` (tc111_scenario_root_
# isolation_test.sh). It proves that two packages sharing an entity_family
# receive two distinct scenario roots under AC-F11-38's per-scenario_id
# `scenario_roots` keying -- something the pre-rework family-keyed
# `roots[family]` lookup could not do (the two would collide on one root).
#
# `setup` only reads `scenario_id` and `entity_family` from a package to
# seed a root (bench/scripts/lib/e40_benchmark.py:seed_scenario_root); the
# remaining fields are carried for shape-fidelity with a real package and
# are not exercised by this test.
