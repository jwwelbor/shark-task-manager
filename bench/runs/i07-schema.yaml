# These pointers are the fields whose JSON types are stable enough to check
# before any cross-record join is attempted.
properties:
  /identity/schema_version: string
  /identity/run_id: string
  /identity/scenario_id: string
  /identity/scenario_version: string
  /identity/fixture_id: string
  /identity/fixture_digest: digest
  /identity/adapter_id: string
  /identity/adapter_version: string
  /identity/shark_binary_digest: digest
  /identity/shark_content_digest: digest
  /identity/roots: object
  /entity_graph/root_key: string
  /entity_graph/root_type: string
  /entity_graph/resolved_via: string
  /entity_graph/fork_candidates: array
  /entity_graph/selected_keys: array
  /entity_graph/selected_types: array
  /entity_graph/ordinals: array
  /entity_graph/ineligible: array
  /dispatches: array
  /stages: array
  /workflow_policy/enabled_gates: array
  /workflow_policy/gate_order: array
  /workflow_policy/reviewer: object
  /workflow_policy/prompt_digest: digest
  /workflow_policy/review_bundle_digest: digest
  /workflow_policy/fixes_allowed_between_gates: boolean
  /review_gates: array
  /questions: array
  /limits/max_cost_usd: number
  /limits/max_wall_clock_seconds: number
  /limits/max_generated_tasks: integer
  /limits/observed_cost_usd: number
  /limits/observed_wall_clock_seconds: number
  /limits/observed_generated_tasks: integer
  /limits/first_exceeded: nullable_string
  /outcome/terminal: string
  /outcome/reason: string
  /outcome/partial_evidence: boolean
  /outcome/publication_eligible: boolean
  /dispatches[]/ordinal: integer
  /dispatches[]/response/prompt_sha256: digest
  /dispatches[]/response/prompt_bytes: integer
  /dispatches[]/evidence_refs/prompt_sha256: digest
  /dispatches[]/evidence_refs/prompt_bytes: integer
  /dispatches[]/evidence_refs/candidate_snapshot_digest: digest
  /stages[]/dispatch_ordinal: integer
  /stages[]/snapshot_digest: digest
  /stages[]/prompt_digest: digest
  /stages[]/cost_usd: number
  /stages[]/elapsed_seconds: number
  /stages[]/rework: boolean
  /stages[]/candidate/tree_digest: digest
  /stages[]/candidate/binary_diff_digest: digest
  /stages[]/candidate/changed_path_digest: digest
  /stages[]/candidate/test_suite_digest: digest
  /stages[]/candidate/identity_digest: digest
  /stages[]/candidate/snapshot_digest: digest
  /stages[]/artifacts[]/digest: digest
  /stages[]/artifacts[]/size_bytes: integer

terminal_outcome:
  - complete
  - resource_limit
  - lease_loss
  - missing_outcome
  - unresolved_gate
  - pause
  - archive
  - error
  - cancellation
  - worker_failure
  - timeout

stop_outcome:
  - resource_limit
  - lease_loss
  - missing_outcome
  - unresolved_gate
  - pause
  - archive
  - error
  - cancellation
  - worker_failure
  - timeout

dispatch_outcome:
  - pass
  - fail
  - resource_limit
  - lease_loss
  - missing_outcome
  - unresolved_gate
  - pause
  - archive
  - error
  - cancellation
  - worker_failure
  - timeout

gate_state:
  - findings
  - zero_findings
  - collection_failure
  - not_reached

resolved_via:
  - keyed_dispatch
  - fork_response
  - scenario_root

stage_category:
  - discovery
  - specification
  - planning
  - code
  - review
  - qa
  - uat
  - shipping

digest_rules:
  algorithm: sha256
  encoding: lowercase_hex
  canonicalization: compact_json_sorted_keys_utf8
  file_encoding: sha256_raw_bytes

# Values used by the validator when it reports a durable invalidity reason.
error_kind:
  - malformed_field
  - unsupported_outcome
  - duplicate_dispatch_ordinal
  - non_monotonic_dispatch_ordinal
  - missing_stop_reason
  - publication_eligible_conflict
  - identity_mismatch
  - missing_usage_or_model
  - prompt_digest_mismatch
  - candidate_snapshot_mismatch
  - artifact_consumption_record_missing
  - unsupported_schema_version
