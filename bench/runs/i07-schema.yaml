# I-07 lifecycle run record contract.
#
# This file is the single machine-readable owner of the schema version,
# required JSON pointers, closed vocabularies, and digest rules. The offline
# validator and downstream E40 consumers must read these values here rather
# than maintaining private copies.
schema_version: "1.0"

top_level_fields:
  - identity
  - entity_graph
  - dispatches
  - stages
  - workflow_policy
  - review_gates
  - questions
  - limits
  - outcome

required_fields:
  - /identity/schema_version
  - /identity/run_id
  - /identity/scenario_id
  - /identity/scenario_version
  - /identity/fixture_id
