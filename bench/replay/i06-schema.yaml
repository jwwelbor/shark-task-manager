# bench/replay/i06-schema.yaml
#
# Single machine-readable owner (REQ-F-018) of I-06's schema_version and
# every closed vocabulary the product-design replay contract depends on:
# document_kinds, stage, request_kind, artifact_type, edge_kind, the
# replayed_interaction_proxies field set, terminal_outcome, error_kind, and
# entry_digest's canonical-serialization rule.
# The Go contract validator
# (tests/contracts/e40_i06_product_design_replay_contract_test.go, TC-052)
# and every bench guard script under bench/scripts/ (T-E40-F07-004 onward)
# MUST read these vocabularies from this file rather than embedding a
# private copy -- a vocabulary change cannot land in one consumer and not
# the other.
#
# Plays for I-06 the role bench/evidence/i05-schema.yaml plays for I-05
# (REQ-F-018, spec.md "Component changes"), without inheriting any of its
# fields, roots, or vocabularies: I-06 is two documents (a replay bundle
# input and a replay result output), not a bundle-of-stage-snapshots
# (REQ-F-001, ADR-F07-08). In particular edge_kind and artifact_type below
# are deliberately smaller than I-05's own sets -- I-06 has no
# evaluator_access event and D01-D05 produce planning documents only.
#
# REQ-F-003's entry_digest canonical-serialization rule is defined below
# (entry_digest: block, T-E40-F07-002); document_kinds.bundle
# .entry_required_fields only fixes that entry_digest is a required field.
#
# The live-egress denial set (REQ-F-004) is owned by a separate file,
# bench/replay/live-egress-tools.yaml (T-E40-F07-004) -- not duplicated
# here, per REQ-F-018's single-owner rule applied per vocabulary.

schema_version: "1.0"

# REQ-F-001/REQ-F-002: I-06 is exactly two document kinds, named
# unambiguously so no consumer opens the wrong file. required_fields is
# each kind's top-level field inventory -- read by TC-052 both to validate
# a document's own shape (AC-T2) and, as a decision table, to reject one
# kind supplied where the other is expected (AC-T3: "recognised as
# distinct document kinds").
document_kinds:
  bundle:
    description: >-
      The committed, versioned replay bundle -- the input file I-04's
      package.yaml replay_reference points at.
    required_fields:
      - schema_version
      - bundle_version
      - scenario_binding
      - entries
    # REQ-F-002: every entries[] element's required field inventory.
    entry_required_fields:
      - entry_id
      - stage
      - ordinal
      - request_kind
      - topic_key
      - required
      - response
      - response_digest
      - entry_digest
  result:
    description: >-
      The per-run replay result E40-F08 consumes -- the output document,
      distinct from the bundle (REQ-F-001, ADR-F07-08).
    required_fields:
      - schema_version
      - scenario
      - run_id
      - replay_bundle
      - preamble_digest
      - artifact_root
      - stages
      - replayed_interaction_proxies
      - artifact_consumption_edges
      - terminal_outcome
      - publication_eligible
      - ineligibility_reasons
    # REQ-F-017: i07_stop_mapping is required only on a *stop*
    # terminal_outcome (every value other than complete/not_applicable),
    # not on every result -- a conditional rule T-E40-F07-009 (AC-013)
    # enforces, not a flat required_fields entry.

# REQ-F-002: entries[].stage is one of D01-D05.
stage:
  - D01
  - D02
  - D03
  - D04
  - D05

# REQ-F-002: entries[].request_kind.
request_kind:
  - human_question
  - research_query

# REQ-F-003: entry_digest's canonical-serialization rule -- the single
# join key to I-05 (ADR-F07-08, T-E40-F07-002). Any consumer (this file's
# own Go validator, and every later bench/scripts/ guard, per REQ-F-018's
# single-owner rule) computes entry_digest as follows:
#   1. Take one entries[] element (a decoded JSON object) and remove the
#      entry_digest field itself -- every other
#      document_kinds.bundle.entry_required_fields member is included
#      using its own stored value exactly as-is; a {path, digest} response
#      is included verbatim, never re-resolved through the referenced
#      file. Duplicate keys and byte-level key ordering in the *source*
#      file are irrelevant -- the rule operates on the decoded object, not
#      the file's raw bytes.
#   2. Serialize the remaining object per `canonicalization` below:
#      object keys sorted lexicographically (byte-wise) at every nesting
#      level, no inserted whitespace between tokens, non-ASCII characters
#      left as raw UTF-8 (never \uXXXX-escaped), forward slashes and HTML
#      metacharacters left unescaped. Every numeric field (e.g. `ordinal`)
#      MUST be an integer serialized with no fractional part, no exponent,
#      and no leading `+`/zero -- required so a JSON decoder that reads
#      numbers as float64 (Go) and one that reads them as int (Python)
#      serialize identically. Equivalent to Go's encoding/json map
#      encoding with html-escaping disabled, Python's
#      json.dumps(obj, sort_keys=True, separators=(",", ":"),
#      ensure_ascii=False), or `jq -cS`.
#   3. Hash the UTF-8 bytes with `algorithm` and hex-encode with
#      `encoding`, prefixed with `digest_prefix` (empty here -- matching
#      this document's own response_digest convention, unlike
#      bench/scripts/verify-stage-evidence.sh's "sha256:"-prefixed
#      candidate_identity_digest, a different file's different
#      convention).
# A result whose recorded consumed_entries[].entry_digest is not present
# in the bundle's own freshly recomputed digest set (this same rule,
# applied to the bundle's own stored entries) MUST be rejected as
# replay_bundle_mutated naming the offending digest (REQ-F-003) -- whether
# because the cited bundle entry was edited after the digest was recorded,
# or because the result cites a digest no bundle entry produces (a
# join-key spoof).
entry_digest:
  algorithm: sha256
  encoding: hex
  digest_prefix: ""
  canonicalization: compact_json_sorted_keys

# REQ-F-010: stages[].artifacts[].artifact_type. D01-D05 produce planning
# documents only (REQ-F-016 Output Standards, D0X-*.md); this feature has
# no code_diff, test_report, patch, or log artifact, so the set is
# deliberately smaller than I-05's seven-value set -- not inherited from
# it (Brownfield Context, T-E40-F07-001).
artifact_type:
  - document
  - other

# REQ-F-010: stages[].artifacts[].consumers[].edge_kind. Three values,
# unlike I-05's four -- I-06 records no evaluator_access event of its own.
edge_kind:
  - read
  - modified
  - referenced

# REQ-F-011: replayed_interaction_proxies' closed field set, including its
# required measurement_kind discriminator field. A field outside this set,
# or a measurement_kind value other than replayed_interaction_proxies_
# discriminator below, MUST be rejected naming the offending field
# (T-E40-F07-008, AC-008).
replayed_interaction_proxies_discriminator: "replayed_interaction_proxy"
replayed_interaction_proxies_fields:
  - measurement_kind
  - authorized_request_count
  - authorized_response_count
  - request_bytes_total
  - response_bytes_total
  - revision_or_replacement_count
  - replay_wait_ns
  - replay_wait_category
  - unresolved_gate_count

# REQ-F-011/REQ-NF-007: replay_wait_category MUST be I-05's own
# replay_or_human_gate_wait interval-category value -- referenced by name
# here, not redefined; I-06 owns no interval-category vocabulary of its
# own.
replay_wait_category: "replay_or_human_gate_wait"

# REQ-F-011/AC-008(e), T-E40-F07-008: the plausibility ceiling
# replayed_interaction_proxies.replay_wait_ns MUST NOT exceed. A local file
# read is the intended cost (REQ-NF-007); a value strictly greater than
# this ceiling is rejected as proxy_wait_implausible (a synthesized,
# human-like delay). REQ-F-018's single-owner rule applies here exactly as
# it does to entry_digest's parameters above: no consumer may hardcode its
# own copy of this number. The numeric value itself is a non-material
# tuning constant (spec.md "Durable unresolved decisions" item 3) -- only
# its existence and single ownership are load-bearing; any value that keeps
# AC-008's synthesized-delay case discriminating satisfies the criterion.
replay_wait_ns_plausibility_ceiling: 2000000000

# REQ-F-017: the closed, twelve-value terminal_outcome set. The four
# I-06-local diagnostics that I-07's own stop vocabulary does not contain
# are called out so a future reader does not mistake them for values I-07
# accepts directly; each carries a required i07_stop_mapping value
# (T-E40-F07-009 enforces the mapping).
terminal_outcome:
  - complete
  - not_applicable
  - unresolved_gate
  - replay_desync # I-06-local; i07_stop_mapping: unresolved_gate
  - live_interaction_reached # I-06-local; i07_stop_mapping: error
  - unattributed_artifact # I-06-local; i07_stop_mapping: error
  - bundle_bulk_disclosure # I-06-local; i07_stop_mapping: error
  - resource_limit
  - error
  - cancellation
  - worker_failure
  - timeout

# error_kind -- every named failure kind a validator or guard in this
# feature can report (REQ-F-001, REQ-F-002, REQ-F-003, REQ-F-007,
# REQ-F-009, REQ-F-010, REQ-F-011, REQ-F-013, REQ-F-017, REQ-F-019). This
# task (T-E40-F07-001) exercises only document_kind_mismatch,
# schema_version_unsupported, field_missing, field_malformed, and
# duplicate_ordinal; the remaining entries are declared here (single-owner,
# REQ-F-018) for later tasks to exercise without a schema-file edit.
#
# Unlike I-05's error_kind, none of these tokens is a value ever stored
# *inside* a bundle or result document -- I-06 has no errors[]-shaped
# field (Document A and Document B, spec.md "API / interface contracts").
# error_kind is exclusively the closed set of prefixes the Go validator
# (this file's TC-052 reader) and every bench guard script MUST choose
# their own emitted verdict message from (REQ-F-019: "the failing field
# named"), so REQ-F-019/AC-014's "unknown error kind" malformed case is
# proven by sweeping the validator's/guard's own emitted messages against
# this list, not by a fixture document containing an out-of-vocabulary
# error_kind field.
error_kind:
  - document_kind_mismatch
  - schema_version_unsupported
  - field_missing
  - field_malformed
  - duplicate_ordinal
  - replay_bundle_mutated
  - replay_desync
  - unresolved_gate
  - unattributed_artifact
  - bundle_bulk_disclosure
  - orphan
  - consumption_evidence_missing
  - response_reference_unresolved
  - proxy_field_unknown
  - proxy_measurement_kind_invalid
  - proxy_wait_implausible
  - stop_outcome_eligibility_conflict
  - not_applicable_reason_missing
  - i07_stop_mapping_missing
  - i07_stop_mapping_out_of_vocabulary
  - vocabulary_value_unknown
  # T-E40-F07-008/AC-T4, REQ-F-008: terminal_outcome: unresolved_gate paired
  # with replayed_interaction_proxies.unresolved_gate_count: 0 is a named
  # contradiction, distinct from proxy_field_unknown/proxy_wait_implausible
  # -- the proxy block's field *inventory* can be fully valid while the
  # gate-count value itself contradicts the terminal outcome it is meant to
  # explain.
  - unresolved_gate_count_inconsistent
