body: >-
  Keep B089 focused on verifying the size repair already delivered by B082, and
  preserve regression evidence for the adjacent tag behavior changed by that
  commit. F1 is covered by TestChangeCreate_TagFlag_PassesTagsToService and
  TestUnifiedChangeCreate_TagsReachService; cite those caller-level assertions
  in the revised plan. F2 remains a coverage gap because shared renderer tests
  do not prove that each creation caller preserves and renders typed service
  errors. Add focused caller-level regression assertions for the unified and
  entity-first paths. Do not change runtime behavior unless those assertions
  expose a defect; any such defect remains in scope because the delivered B082
  patch changed this creation path.
