version: "1.0"
start: draft
steps:
  blocked:
    phase: blocked
    color: red
    description: External blocker preventing progress
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: task_short/blocked.tmpl
  cancelled:
    phase: done
    color: red
    description: Task abandoned
    progress_weight: 0
    responsibility: none
    exclude_from_progress: true
    action: archive
    terminal: true
    prompt: task_short/cancelled.tmpl
  completed:
    phase: done
    color: green
    description: Task done and verified
    progress_weight: 1.0
    responsibility: none
    action: archive
    terminal: true
    prompt: task_short/completed.tmpl
  development:
    phase: development
    color: yellow
    description: Ready for TDD implementation
    progress_weight: 0.1
    responsibility: agent
    action: spawn_agent
    agent: developer
    model: sonnet
    skills: [codex-exec]
    prompt: task_codex/ready_for_development.tmpl
    outcomes:
      blocked: blocked
      fail: draft
      on_hold: on_hold
      pass: completed
    aliases: [in_approval, in_development, in_progress, in_qa, ready_for_approval, ready_for_code_review, ready_for_development, ready_for_qa]
  draft:
    phase: planning
    color: gray
    description: Task created from feature decomposition
    progress_weight: 0
    responsibility: none
    is_planning: true
    action: advance_status
    prompt: task_short/draft.tmpl
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: draft
      on_hold: on_hold
      pass: development
    aliases: [ready_for_refinement_ba, todo]
  on_hold:
    phase: paused
    color: gray
    description: Intentionally paused
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: task_short/on_hold.tmpl
