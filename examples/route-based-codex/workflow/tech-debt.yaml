version: "1.0"
start: identified
steps:
  blocked:
    phase: blocked
    color: red
    description: "Cannot proceed, awaiting external resolution"
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: tech_debt/blocked.tmpl
  cancelled:
    phase: done
    color: red
    description: "Tech debt abandoned (e.g. obsoleted, promoted to feature)"
    progress_weight: 0
    responsibility: none
    exclude_from_progress: true
    action: archive
    terminal: true
    prompt: tech_debt/cancelled.tmpl
  code_review:
    phase: code_review
    color: magenta
    description: Ready for code review (regression focus)
    progress_weight: 0.75
    responsibility: agent
    action: spawn_agent
    agent: tech-lead
    model: opus
    skills: [quality, refactoring]
    prompt: tech_debt/ready_for_code_review.tmpl
    outcomes:
      blocked: blocked
      fail: resolution
      on_hold: on_hold
      pass: resolved
    aliases: [in_code_review, ready_for_code_review]
  identified:
    phase: planning
    color: gray
    description: "Tech debt captured, awaiting triage"
    progress_weight: 0
    responsibility: none
    is_planning: true
    action: spawn_agent
    agent: researcher
    model: sonnet
    skills: [triage, assessment]
    prompt: tech_debt/identified.tmpl
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: identified
      on_hold: on_hold
      pass: triaged
      wont_fix: wont_fix
  investigation:
    phase: investigation
    color: purple
    description: "Ready to investigate blast radius, affected code, and resolution approach"
    progress_weight: 0.2
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: researcher
    model: sonnet
    skills: [research, brownfield-analysis]
    prompt: tech_debt/ready_for_investigation.tmpl
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: triaged
      on_hold: on_hold
      pass: resolution
      wont_fix: wont_fix
    aliases: [in_investigation, ready_for_investigation]
  on_hold:
    phase: paused
    color: gray
    description: Intentionally deferred
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: tech_debt/on_hold.tmpl
  progress:
    phase: development
    color: yellow
    description: Refactor/cleanup in progress
    progress_weight: 0.55
    responsibility: agent
    action: check_or_resume
    agent: developer
    model: sonnet
    skills: [implementation, refactoring, test-driven-development]
    prompt: tech_debt/in_progress.tmpl
    outcomes:
      blocked: blocked
      fail: identified
      on_hold: on_hold
      pass: code_review
    aliases: [in_progress]
  resolution:
    phase: development
    color: yellow
    description: Ready for refactor/cleanup implementation
    progress_weight: 0.4
    responsibility: agent
    action: spawn_agent
    agent: developer
    model: sonnet
    skills: [implementation, refactoring, test-driven-development]
    prompt: tech_debt/ready_for_resolution.tmpl
    outcomes:
      blocked: blocked
      fail: identified
      on_hold: on_hold
      pass: resolution
      progress: progress
    aliases: [ready_for_resolution]
  resolved:
    phase: done
    color: green
    description: Tech debt resolved and verified
    progress_weight: 1.0
    responsibility: none
    action: archive
    terminal: true
    prompt: tech_debt/resolved.tmpl
  triaged:
    phase: triage
    color: orange
    description: "Severity, category, and effort assessed"
    progress_weight: 0.1
    responsibility: agent
    is_planning: true
    action: advance_status
    prompt: tech_debt/triaged.tmpl
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: identified
      on_hold: on_hold
      pass: investigation
      resolution: resolution
      wont_fix: wont_fix
  wont_fix:
    phase: done
    color: gray
    description: Triaged as not worth fixing
    progress_weight: 0
    responsibility: none
    exclude_from_progress: true
    action: archive
    terminal: true
    prompt: tech_debt/wont_fix.tmpl
