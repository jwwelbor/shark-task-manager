version: "1.0"
start: draft
steps:
  active:
    phase: execution
    color: yellow
    description: "Features in progress, progress aggregated from children"
    progress_weight: 0.75
    responsibility: agent
    aggregates_from: features
    action: cascade
    prompt: epic_short/active.tmpl
    outcomes:
      blocked: blocked
      fail: draft
      on_hold: on_hold
      pass: completed
  blocked:
    phase: blocked
    color: red
    description: External blocker preventing progress
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: epic_short/blocked.tmpl
  cancelled:
    phase: done
    color: red
    description: Epic abandoned
    progress_weight: 0
    responsibility: none
    exclude_from_progress: true
    action: archive
    terminal: true
    prompt: epic_short/cancelled.tmpl
  completed:
    phase: done
    color: green
    description: "All features done, epic delivered"
    progress_weight: 1.0
    responsibility: none
    action: archive
    terminal: true
    prompt: epic_short/completed.tmpl
  decomposition:
    phase: decomposition
    color: blue
    description: Ready to break epic into features
    progress_weight: 0.45
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: product-manager
    model: sonnet
    skills: [specification-writing, feature]
    prompt: epic_short/ready_for_decomposition.tmpl
    outcomes:
      blocked: blocked
      fail: draft
      on_hold: on_hold
      pass: feature_review
    aliases: [in_decomposition, ready_for_decomposition]
  design:
    phase: design
    color: cyan
    description: Ready for architecture decisions and UAT plan
    progress_weight: 0.3
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: architect
    model: opus
    skills: [architecture, quality]
    prompt: epic_short/ready_for_design.tmpl
    outcomes:
      blocked: blocked
      cancelled: cancelled
      fail: refinement
      on_hold: on_hold
      pass: decomposition
      research: research
    aliases: [in_design, ready_for_design]
  draft:
    phase: planning
    color: gray
    description: "Epic captured, not yet refined"
    progress_weight: 0
    responsibility: none
    is_planning: true
    action: advance_status
    prompt: epic_short/draft.tmpl
    outcomes:
      active: active
      blocked: blocked
      cancelled: cancelled
      fail: draft
      pass: refinement
  feature_review:
    phase: review
    color: magenta
    description: Ready for codex review of features against epic requirements
    progress_weight: 0.55
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: uat-agent
    model: codex
    skills: [quality, specification-writing]
    prompt: epic_short/ready_for_feature_review.tmpl
    outcomes:
      blocked: blocked
      fail: decomposition
      on_hold: on_hold
      pass: active
    aliases: [in_feature_review, ready_for_feature_review]
  on_hold:
    phase: paused
    color: gray
    description: "Intentionally paused, awaiting product decision"
    progress_weight: 0
    responsibility: human
    action: pause
    parking: true
    prompt: epic_short/on_hold.tmpl
  refinement:
    phase: refinement
    color: orange
    description: Ready for BA to write epic PRD
    progress_weight: 0.05
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: business-analyst
    model: opus
    skills: [specification-writing, epic]
    prompt: epic_short/ready_for_refinement.tmpl
    outcomes:
      blocked: blocked
      fail: draft
      on_hold: on_hold
      pass: research
    aliases: [in_refinement, ready_for_refinement]
  research:
    phase: research
    color: purple
    description: Ready for brownfield codebase analysis
    progress_weight: 0.15
    responsibility: agent
    is_planning: true
    action: spawn_agent
    agent: researcher
    model: sonnet
    skills: [research, brownfield-analysis]
    prompt: epic_short/ready_for_research.tmpl
    outcomes:
      blocked: blocked
      fail: refinement
      on_hold: on_hold
      pass: design
    aliases: [in_research, ready_for_research]
